schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_table
  name: CREATE TABLE
  category: ddl
  domain: table
  source_reference: references/statements/ddl/table/create_table.md
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: false
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: false
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required coverage cannot be replaced by inferred combinations.
coverage_scope:
  target_object_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - column_definition
      - create_like
      - create_select
      coverage_requirement: all_values
    table_kind:
      tier: T1
      coverage_role: main_axis
      required_values:
      - permanent
      - temporary
      coverage_requirement: all_values
    if_not_exists:
      tier: T1
      coverage_role: main_axis
      required_values:
      - omitted
      - present
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    constraint_shape:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - primary_key
      - unique_key
      - foreign_key
      - check_enforced
      - check_not_enforced
      coverage_requirement: all_values
    generated_column_shape:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - omitted
      - virtual
      - stored
      coverage_requirement: all_values
    table_option_shape:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - engine_innodb
      - engine_memory
      - charset_collate
      - encryption
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - unquoted_lower
      - quoted_reserved
      coverage_requirement: all_values
    data_type_family:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - numeric
      - string
      - temporal
      - json
      - spatial
      coverage_requirement: all_values
    duplicate_table_state:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - no_conflict
      - name_already_exists
      coverage_requirement: all_values
dynamic_inputs: {}
combination_groups:
- id: required__statement_branch_column_definition__table_kind_permanent__if_not_exists_omitted__expected_status_success
  title: CREATE TABLE required combination
  lifecycle_role: target_statement
  expected_status_policy: fixed
  default_expected_status: success
  expected_failure_reasons: []
  derived_extension: false
  factors:
    statement_branch: column_definition
    table_kind: permanent
    if_not_exists: omitted
    expected_status: success
    constraint_shape: primary_key
    generated_column_shape: omitted
    table_option_shape: engine_innodb
    table_name_shape: unquoted_lower
    data_type_family: numeric
    duplicate_table_state: no_conflict
  expansion:
    mode: complete_cartesian
    axes:
    - statement_branch
    - table_kind
    - if_not_exists
    - expected_status
  compatibility:
    resolver: declared_matrix
    success_when:
    - declared reference combination
    failure_when: []
