schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_table
  name: ALTER TABLE
  category: ddl
  domain: table
  source_reference: references/statements/ddl/table/alter_table.md
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: false
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: false
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required coverage cannot be replaced by inferred combinations.
coverage_scope:
  target_object_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    alter_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - add_column
      - modify_column
      - change_column
      - drop_column
      - rename_column
      - add_index
      - drop_index
      - rename_index
      - alter_index_visibility
      - add_primary_key
      - drop_primary_key
      - add_foreign_key
      - drop_foreign_key
      - add_check
      - drop_check
      - table_options
      - partition_options
      - rename_table
      coverage_requirement: all_values
    table_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - missing
      - wrong_object_type
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    algorithm_option:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - omitted
      - default
      - instant
      - inplace
      - copy
      coverage_requirement: all_values
    lock_option:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - omitted
      - default
      - none
      - shared
      - exclusive
      coverage_requirement: all_values
    validation_option:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - omitted
      - with_validation
      - without_validation
      coverage_requirement: all_values
    column_position_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - omitted
      - first
      - after_column
      coverage_requirement: all_values
    index_visibility_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - omitted
      - visible
      - invisible
      coverage_requirement: all_values
    invalid_combination:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - invisible_column_8_0_23_excluded
      - autoextend_size_8_0_23_excluded
      coverage_requirement: all_values
dynamic_inputs: {}
combination_groups:
