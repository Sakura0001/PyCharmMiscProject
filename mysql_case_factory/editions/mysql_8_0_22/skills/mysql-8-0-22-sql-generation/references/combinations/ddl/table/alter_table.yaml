    expected_status: success
    algorithm_option: omitted
    lock_option: omitted
    validation_option: omitted
    column_position_shape: omitted
    index_visibility_shape: omitted
    invalid_combination: none
  expansion:
    mode: complete_cartesian
    axes:
    - alter_branch
    - table_state
    - expected_status
  compatibility:
    resolver: declared_matrix
    success_when:
    - declared reference combination
    failure_when: []
