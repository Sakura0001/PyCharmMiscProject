    expected_status: success
    index_type: omitted
    visibility: omitted
    algorithm_lock: omitted
    index_name_shape: explicit
    prefix_length: omitted
    parser_clause: omitted
    invalid_combination: none
  expansion:
    mode: complete_cartesian
    axes:
    - index_kind
    - key_part_shape
    - expected_status
  compatibility:
    resolver: declared_matrix
    success_when:
    - declared reference combination
    failure_when: []
    default_failure_reason: ''
  sql_shape:
    template: CREATE {index_kind_sql}INDEX {index_name} ON {table_name} ({key_part_sql}){index_type_sql}{visibility_sql}
