    view_state: exists
    algorithm: omitted
    security_type: omitted
    expected_status: success
    check_option: omitted
  expansion:
    mode: complete_cartesian
    axes:
    - view_state
    - algorithm
    - security_type
    - expected_status
  compatibility:
    resolver: declared_matrix
    success_when:
    - declared reference combination
    failure_when: []
