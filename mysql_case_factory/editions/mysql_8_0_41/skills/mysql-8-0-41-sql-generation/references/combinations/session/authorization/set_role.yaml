schema_version: 1
kind: statement_combination_matrix
statement:
  key: set_role
  name: SET ROLE
  category: session
  domain: authorization
  source_reference: references/statements/session/authorization/set_role.md
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: false
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: false
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required coverage cannot be replaced by inferred combinations.
coverage_scope:
  target_object_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: Statement matrices cover syntax factors; feature coverage plans own object inventories.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    role_selection:
      tier: T1
      coverage_role: main_axis
      required_values:
      - default_roles
      - none
      - all_roles
      - all_except
      - explicit_list
      coverage_requirement: all_values
    role_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - granted
      - not_granted
      - missing
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
dynamic_inputs: {}
combination_groups:
- id: required__role_selection_default_roles__role_state_granted__expected_status_success
  title: SET ROLE required combination
  lifecycle_role: target_statement
  expected_status_policy: fixed
  default_expected_status: success
  expected_failure_reasons: []
  derived_extension: false
  factors:
    role_selection: default_roles
    role_state: granted
    expected_status: success
  expansion:
    mode: complete_cartesian
    axes:
    - role_selection
    - role_state
    - expected_status
  compatibility:
    resolver: declared_matrix
    success_when:
    - declared reference combination
    failure_when: []
    default_failure_reason: ''
  sql_shape:
    template: SET ROLE DEFAULT
  verification:
