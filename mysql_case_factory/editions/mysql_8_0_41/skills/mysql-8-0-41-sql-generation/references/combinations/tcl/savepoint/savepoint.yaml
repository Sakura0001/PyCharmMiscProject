  default_expected_status: success
  expected_failure_reasons: []
  derived_extension: false
  factors:
    transaction_state: active_transaction
    name_shape: simple_identifier
    duplicate_name_behavior: new_name
    expected_status: success
  expansion:
    mode: complete_cartesian
    axes:
    - transaction_state
    - name_shape
    - duplicate_name_behavior
    - expected_status
  compatibility:
    resolver: declared_matrix
    success_when:
