  lifecycle_role: target_statement
  expected_status_policy: fixed
  default_expected_status: success
  expected_failure_reasons: []
  derived_extension: false
  factors:
    statement_branch: single_table
    condition_shape: omitted
    expected_status: success
    priority_modifier: omitted
    ignore_modifier: omitted
    order_limit_shape: omitted
    partition_clause: omitted
  expansion:
    mode: complete_cartesian
    axes:
    - statement_branch
    - condition_shape
    - expected_status
  compatibility:
    resolver: declared_matrix
    success_when:
    - declared reference combination
