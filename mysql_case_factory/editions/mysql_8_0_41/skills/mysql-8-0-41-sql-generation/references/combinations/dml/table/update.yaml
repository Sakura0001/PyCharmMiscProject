    partition_clause: named_partition
  expansion:
    mode: one_factor_at_a_time
    axes:
    - partition_clause
  compatibility:
    resolver: declared_matrix
    success_when:
    - declared reference combination
    failure_when: []
    default_failure_reason: ''
  sql_shape:
    template: UPDATE {ignore_sql}{table_name} SET varchar_col = 'updated' WHERE id_col = 1
  verification:
    required: false
    mode: statement_reference
    sql: null
  cleanup:
    required: true
    steps:
    - sql: -- cleanup is defined by the lifecycle plan
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
