schema_version: 1
kind: execution_profile
compatibility_target: mysql-community-8.0.41
reference:
  login_path: mysql8041_reference
  database: regression
  expected_server_uuid: 11111111-1111-1111-1111-111111111111
  expected_current_user: regression_user@%
dut:
  login_path: mysql8041_dut
  database: regression
  expected_server_uuid: 22222222-2222-2222-2222-222222222222
  expected_current_user: regression_user@%
runner:
  executable: mysql
  timeout_seconds: 300
  stop_on_error: true
comparison:
  mode: exact_text
  normalization:
    drop_line_patterns: []
    replacements: []
    strip_trailing_whitespace: false
security:
  credential_source: external-mysql-login-path
  persist_credentials: false
