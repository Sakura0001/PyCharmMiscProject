services:
  mysql8022-reference:
    image: mysql:8.0.22
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: mysql_case_factory_smoke
      MYSQL_DATABASE: regression
    ports:
      - "33022:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  mysql8022-candidate:
    image: mysql:8.0.22
    platform: linux/amd64
