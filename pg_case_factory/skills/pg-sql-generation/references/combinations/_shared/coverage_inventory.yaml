# Deprecated selector alias required by existing statement matrices.  It points
# to test_target_contexts and MUST NOT be used as PostgreSQL object completeness
# evidence.
object_kinds:
  canonical: false
  compatibility_status: deprecated_matrix_selector_alias
  replacement_selector: sql_object_types.all_sql_object_types
  all_object_kinds: *legacy_test_target_contexts

# Exact PostgreSQL relkind inventory.  Values are lowercase RELKIND_* suffixes;
# persistence, partition role and inheritance are deliberately separate axes.
relation_kinds:
  canonical: true
  canonical_selector: relation_kinds.all_pg18_relkinds
  source_member: pg_class_h
  derivation: lowercase RELKIND_ macro suffix in declaration order
  count: 10
  inventory_sha256: 06cae15bce0029a913db85e3e8a76fec1ba50604018c532584bfd461fe20a8fa
  all_pg18_relkinds:
    - relation
    - index
    - sequence
    - toastvalue
    - view
    - matview
    - composite_type
    - foreign_table
    - partitioned_table
    - partitioned_index
  codes:
    relation: r
    index: i
    sequence: S
    toastvalue: t
    view: v
    matview: m
    composite_type: c
    foreign_table: f
    partitioned_table: p
    partitioned_index: I
  # Deprecated compatibility selector for the 183 existing matrices.  These
  # are relation test shapes, not PostgreSQL relkind values.
  all_relation_kinds: &legacy_relation_test_shapes
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    - foreign_table
    - plain_view
    - materialized_view
    - sequence
    - index
    - partitioned_index
    - statistics_object
  legacy_selector_status: deprecated_matrix_selector

legacy_relation_test_shapes:
  canonical: false
  completeness_scope: legacy_statement_matrix_relation_shapes
  values: *legacy_relation_test_shapes

