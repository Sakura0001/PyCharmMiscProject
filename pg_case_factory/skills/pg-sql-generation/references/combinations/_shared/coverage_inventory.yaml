      sha256: 9450d06624158bee5f495333c519342d5e13d7536c62989c982ad6069a08a73d
    pg_type_dat:
      path: src/include/catalog/pg_type.dat
      sha256: 5f5887b75677cba2d4a1a0cfeb355df5ed91f85d385fac88bd8d7c605b3578f9
    pg_am_dat:
      path: src/include/catalog/pg_am.dat
