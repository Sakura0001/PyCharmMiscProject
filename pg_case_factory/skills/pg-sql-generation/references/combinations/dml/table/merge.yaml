schema_version: 1
kind: statement_combination_matrix
statement:
  key: merge
  name: MERGE
  category: dml
  domain: table
  source_reference: references/statements/dml/table/merge.md
  official_source: https://www.postgresql.org/docs/16/sql-merge.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, performance, concurrency, or cross-factor combinations.
  - Derived extensions must not be counted as satisfying required factor, table, interaction, or column-type coverage.
  - Derived extensions must use declared factors, declared factor values, and recorded dynamic inputs.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - foreign_table
    - plain_view
    decision_reason: MERGE targets writable table-like relations and combines INSERT, UPDATE, DELETE, and DO NOTHING
      branches. Target object coverage must include writable relation forms and wrong-object failures.
  target_relation_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - foreign_table
    - plain_view
    negative_relation_kinds:
    - sequence
    - materialized_view
    - missing_relation
    decision_reason: MERGE depends on writable target relation kind and source relation or query shape. Unsupported
      target relation kinds and missing relations must be explicit failures.
  table_coverage:
    required: true
    coverage_mode: exhaustive
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: MERGE mutates table rows through matched and not-matched branches. Table kind coverage must
      include partition and inheritance behavior because routing and row movement affect validity.
  column_type_coverage:
    required: true
    coverage_mode: exhaustive
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: expand_every_type
    require_each_type_success_or_failure: true
    decision_reason: MERGE join conditions, source values, INSERT values, UPDATE assignments, constraints, and trigger
      payloads are type-sensitive. Each PG16 column type must be covered by success or declared failure.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_1
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: success_and_failure
    target_relation_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - missing
      - wrong_object_type
      coverage_requirement: all_values
    data_or_query_shape:
      tier: T1
      coverage_role: main_axis
      required_values:
      - minimal
      - explicit_values
      - query_source
      - cte_source
      coverage_requirement: all_values
    condition_shape:
      tier: T2
      coverage_role: secondary_axis
      required_values:
      - none
      - simple_predicate
      - join_or_match_condition
      - cursor_or_conflict_target
      coverage_requirement: all_values_by_representative_expansion
    result_shape:
      tier: T2
      coverage_role: secondary_axis
      required_values:
      - none
      - returning_star
      - returning_expression
      - rowset_projection
      coverage_requirement: all_values_by_representative_expansion
    with_clause:
      tier: T2
      coverage_role: secondary_axis
      required_values:
      - absent
      - non_recursive
      - recursive
      coverage_requirement: all_values_by_representative_expansion
    name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - alias_used
      coverage_requirement: all_values_by_rotation
    expression_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - literal
      - column_reference
      - function_call
      - subquery_expression
      coverage_requirement: all_values_by_rotation
    dependency_state:
      tier: T4
      coverage_role: dependency_axis
      required_values:
      - ready
      - missing_dependency
      coverage_requirement: success_and_missing_dependency
    privilege_context:
      tier: T4
      coverage_role: dependency_axis
      required_values:
      - owner
      - granted_role
      - insufficient_privilege
      coverage_requirement: owner_granted_and_insufficient
    invalid_combination:
      tier: T5
      coverage_role: negative_axis
      required_values:
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: none_and_all_failure_classes
    constraint_boundary:
      tier: T5
      coverage_role: negative_axis
      required_values:
      - none
      - constraint_satisfied
      - constraint_violation
      - empty_input
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - catalog_query
      - effect_query
      - returned_rows
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - rollback
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  index_interaction_coverage:
    required: true
    source: 'Decision: MERGE join matching and uniqueness-sensitive branches require indexed and non-indexed fixture
      variants, while exact plan choices remain non-required.'
    required_fields:
    - index_presence
    - join_condition_shape
    - plan_assertion_policy
  constraint_interaction_coverage:
    required: true
    source: 'Decision: MERGE may INSERT, UPDATE, or DELETE and therefore must exercise representative constraints
      for each mutating action branch.'
    required_fields:
    - constraint_kind
    - merge_action_branch
    - expected_status
  trigger_interaction_coverage:
    required: true
    source: 'Decision: MERGE can fire statement triggers plus action-specific row triggers for INSERT, UPDATE, and
      DELETE branches. Trigger coverage is required by branch.'
    required_fields:
    - trigger_timing
    - trigger_level
    - merge_action_branch
  transaction_interaction_coverage:
    required: true
    source: 'Decision: MERGE performs conditional writes and must declare rollback, visibility, and concurrent match/update
      expectations.'
    required_fields:
    - transaction_state
    - visibility_expectation
    - cleanup_policy
combination_groups:
- id: merge_required_success_surface
  title: MERGE baseline success surface and rotating optional factors
  lifecycle_role: target_statement
  expected_status_policy: fixed
  factors:
    statement_branch: branch_1
    expected_status: success
    target_relation_state: exists
    data_or_query_shape: minimal
    condition_shape: none
    result_shape: none
    with_clause: absent
    name_shape: plain_identifier
    expression_shape: literal
    dependency_state: ready
    privilege_context: owner
    invalid_combination: none
    constraint_boundary: none
    verification_mode: effect_query
    cleanup_mode: rollback
  expansion:
    data_or_query_shape:
      mode: explicit
      values:
      - minimal
      - explicit_values
      - query_source
      - cte_source
    condition_shape:
      mode: explicit
      values:
      - none
      - simple_predicate
      - join_or_match_condition
      - cursor_or_conflict_target
    result_shape:
      mode: explicit
      values:
      - none
      - returning_star
      - returning_expression
      - rowset_projection
    with_clause:
      mode: explicit
      values:
      - absent
      - non_recursive
      - recursive
    name_shape:
      mode: explicit
      values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - alias_used
    expression_shape:
      mode: explicit
      values:
      - literal
      - column_reference
      - function_call
      - subquery_expression
    privilege_context:
      mode: explicit
      values:
      - owner
      - granted_role
    constraint_boundary:
      mode: explicit
      values:
      - none
      - constraint_satisfied
      - empty_input
    verification_mode:
      mode: explicit
      values:
      - catalog_query
      - effect_query
      - returned_rows
    cleanup_mode:
      mode: explicit
      values:
      - rollback
      - drop_objects
      - reset_state
  compatibility:
    resolver: statement_ref_factor_bindings_with_dml_dynamic_inputs
    success_when:
    - target_relation_state=exists
    - dependency_state=ready
    - privilege_context in [owner, granted_role]
    - invalid_combination=none
    - constraint_boundary in [none, constraint_satisfied, empty_input]
    failure_when:
    - condition: any generated fixture violates declared target, privilege, dependency, or constraint preconditions
      reason: unexpected_fixture_incompatibility
    default_failure_reason: unexpected_fixture_incompatibility
  sql_shape:
    template: '{with_clause_sql}MERGE INTO {target_table_sql} USING {source_relation_or_query_sql} ON {join_condition_sql}
      {when_clauses_sql};'
  verification:
    required: true
    mode: factor_selected_verification_mode
    sql: '{verification_sql}'
  cleanup:
    required: true
    steps:
    - sql: '{cleanup_sql_selected_by_cleanup_mode}'
- id: merge_required_target_failures
  title: MERGE missing or wrong target failures
  lifecycle_role: negative_control
  expected_status_policy: fixed
  expected_failure_reasons:
  - missing_target_relation_or_dependency
  - wrong_object_type
  factors:
    statement_branch: branch_1
    expected_status: failure
    target_relation_state: missing
    data_or_query_shape: minimal
    condition_shape: none
    result_shape: none
    with_clause: absent
    name_shape: plain_identifier
    expression_shape: literal
    dependency_state: missing_dependency
    privilege_context: owner
    invalid_combination: syntax_valid_semantic_error
    constraint_boundary: none
    verification_mode: error_assertion
    cleanup_mode: rollback
  expansion:
    target_relation_state:
      mode: explicit
      values:
      - missing
      - wrong_object_type
    invalid_combination:
      mode: explicit
      values:
      - syntax_valid_semantic_error
      - object_type_mismatch
    verification_mode:
      mode: explicit
      values:
      - error_assertion
  compatibility:
    resolver: statement_ref_factor_bindings_with_negative_target_fixture
    success_when: []
    failure_when:
    - condition: target_relation_state=missing
      reason: missing_target_relation_or_dependency
    - condition: target_relation_state=wrong_object_type
      reason: wrong_object_type
    default_failure_reason: missing_target_relation_or_dependency
  sql_shape:
    template: MERGE INTO {missing_or_wrong_relation_sql} USING {source_relation_or_query_sql} ON {join_condition_sql}
      WHEN MATCHED THEN DO NOTHING;
  verification:
    required: true
    mode: error_assertion
    sql: '{expected_error_assertion_sql}'
  cleanup:
    required: true
    steps:
    - sql: ROLLBACK;
- id: merge_required_privilege_failure
  title: MERGE insufficient privilege failure
  lifecycle_role: negative_control
  expected_status_policy: fixed
  expected_failure_reasons:
  - insufficient_privilege
  factors:
    statement_branch: branch_1
    expected_status: failure
    target_relation_state: exists
    data_or_query_shape: query_source
    condition_shape: simple_predicate
    result_shape: none
    with_clause: absent
    name_shape: schema_qualified
    expression_shape: column_reference
    dependency_state: ready
    privilege_context: insufficient_privilege
    invalid_combination: none
    constraint_boundary: none
    verification_mode: error_assertion
    cleanup_mode: reset_state
  expansion:
    privilege_context:
      mode: explicit
      values:
      - insufficient_privilege
  compatibility:
    resolver: statement_ref_factor_bindings_with_privilege_fixture
    success_when: []
    failure_when:
    - condition: privilege_context=insufficient_privilege
      reason: insufficient_privilege
    default_failure_reason: insufficient_privilege
  sql_shape:
    template: SET ROLE {insufficient_role}; MERGE INTO {target_table_sql} USING {source_relation_or_query_sql} ON
      {join_condition_sql} WHEN MATCHED THEN UPDATE SET {assignment_sql};
  verification:
    required: true
    mode: error_assertion
    sql: '{expected_privilege_error_assertion_sql}'
  cleanup:
    required: true
    steps:
    - sql: RESET ROLE;
    - sql: '{cleanup_sql_selected_by_cleanup_mode}'
- id: merge_required_constraint_or_boundary_failure
  title: MERGE constraint or boundary failure
  lifecycle_role: negative_control
  expected_status_policy: fixed
  expected_failure_reasons:
  - constraint_violation_or_boundary_error
  factors:
    statement_branch: branch_1
    expected_status: failure
    target_relation_state: exists
    data_or_query_shape: explicit_values
    condition_shape: simple_predicate
    result_shape: returning_expression
    with_clause: non_recursive
    name_shape: quoted_identifier
    expression_shape: subquery_expression
    dependency_state: ready
    privilege_context: owner
    invalid_combination: syntax_valid_semantic_error
    constraint_boundary: constraint_violation
    verification_mode: error_assertion
    cleanup_mode: rollback
  expansion:
    constraint_boundary:
      mode: explicit
      values:
      - constraint_violation
  compatibility:
    resolver: statement_ref_factor_bindings_with_boundary_fixture
    success_when: []
    failure_when:
    - condition: constraint_boundary=constraint_violation
      reason: constraint_violation_or_boundary_error
    - condition: invalid_combination=syntax_valid_semantic_error
      reason: syntax_valid_semantic_error
    default_failure_reason: constraint_violation_or_boundary_error
  sql_shape:
    template: MERGE INTO {target_table_sql} USING {source_relation_or_query_sql} ON {join_condition_sql} WHEN NOT
      MATCHED THEN INSERT ({column_list_sql}) VALUES ({constraint_violating_values_sql});
  verification:
    required: true
    mode: error_assertion
    sql: '{expected_boundary_error_assertion_sql}'
  cleanup:
    required: true
    steps:
    - sql: ROLLBACK;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
