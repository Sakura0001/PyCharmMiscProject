schema_version: 1
kind: statement_combination_matrix
statement:
  key: call
  name: CALL
  category: dml
  domain: routine
  source_reference: references/statements/dml/routine/call.md
  official_source: https://www.postgresql.org/docs/16/sql-call.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, performance, concurrency, or cross-factor combinations.
  - Derived extensions must not be counted as satisfying required factor, table, interaction, or column-type coverage.
  - Derived extensions must use declared factors, declared factor values, and recorded dynamic inputs.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - procedure
    decision_reason: CALL targets a procedure object. Baseline coverage must distinguish existing procedure, missing
      procedure, wrong routine kind, argument mismatch, and privilege failure cases.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CALL does not directly target a relation. Relation effects are properties of the procedure
      body and must be declared as dynamic side-effect inputs when used.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CALL itself invokes a procedure and has no direct table target. Procedure body table effects
      are extension inputs, not required baseline coverage for CALL syntax.
  column_type_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: representative_by_type_category
    require_each_type_success_or_failure: false
    decision_reason: Procedure argument and OUT parameter binding is type-sensitive, but CALL does not declare table
      columns. Representative coverage by PG16 type category is required; exhaustive per-column storage coverage
      belongs to table statements.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_1
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: success_and_failure
    target_relation_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - missing
      - wrong_object_type
      coverage_requirement: all_values
    data_or_query_shape:
      tier: T1
      coverage_role: main_axis
      required_values:
      - minimal
      - explicit_values
      - query_source
      - cte_source
      coverage_requirement: all_values
    condition_shape:
      tier: T2
      coverage_role: secondary_axis
      required_values:
      - none
      - simple_predicate
      - join_or_match_condition
      - cursor_or_conflict_target
      coverage_requirement: all_values_by_representative_expansion
    result_shape:
      tier: T2
      coverage_role: secondary_axis
      required_values:
      - none
      - returning_star
      - returning_expression
      - rowset_projection
      coverage_requirement: all_values_by_representative_expansion
    with_clause:
      tier: T2
      coverage_role: secondary_axis
      required_values:
      - absent
      - non_recursive
      - recursive
      coverage_requirement: all_values_by_representative_expansion
    name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - alias_used
      coverage_requirement: all_values_by_rotation
    expression_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - literal
      - column_reference
      - function_call
      - subquery_expression
      coverage_requirement: all_values_by_rotation
    dependency_state:
      tier: T4
      coverage_role: dependency_axis
      required_values:
      - ready
      - missing_dependency
      coverage_requirement: success_and_missing_dependency
    privilege_context:
      tier: T4
      coverage_role: dependency_axis
      required_values:
      - owner
      - granted_role
      - insufficient_privilege
      coverage_requirement: owner_granted_and_insufficient
    invalid_combination:
      tier: T5
      coverage_role: negative_axis
      required_values:
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: none_and_all_failure_classes
    constraint_boundary:
      tier: T5
      coverage_role: negative_axis
      required_values:
      - none
      - constraint_satisfied
      - constraint_violation
      - empty_input
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - catalog_query
      - effect_query
      - returned_rows
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - rollback
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  index_interaction_coverage:
    required: false
    source: 'Decision: CALL has no direct index interaction. If a procedure body performs indexed table DML, that
      side effect must be recorded in derived extension combinations.'
    required_fields:
    - decision_reason
  constraint_interaction_coverage:
    required: false
    source: 'Decision: CALL does not enforce table constraints directly. Procedure-body constraint effects are outside
      required baseline CALL coverage.'
    required_fields:
    - decision_reason
  trigger_interaction_coverage:
    required: false
    source: 'Decision: CALL does not fire table triggers directly. Trigger effects caused by procedure-body DML
      are extension inputs.'
    required_fields:
    - decision_reason
  transaction_interaction_coverage:
    required: true
    source: 'Decision: CALL requires explicit transaction-context coverage because procedures may include transaction
      control only in allowed invocation contexts.'
    required_fields:
    - transaction_context
    - procedure_transaction_control
    - expected_status
combination_groups:
- id: call_required_success_surface
  title: CALL baseline success surface and rotating optional factors
  lifecycle_role: target_statement
  expected_status_policy: fixed
  factors:
    statement_branch: branch_1
    expected_status: success
    target_relation_state: exists
    data_or_query_shape: minimal
    condition_shape: none
    result_shape: none
    with_clause: absent
    name_shape: plain_identifier
    expression_shape: literal
    dependency_state: ready
    privilege_context: owner
    invalid_combination: none
    constraint_boundary: none
    verification_mode: effect_query
    cleanup_mode: rollback
  expansion:
    data_or_query_shape:
      mode: explicit
      values:
      - minimal
      - explicit_values
      - query_source
      - cte_source
    condition_shape:
      mode: explicit
      values:
      - none
      - simple_predicate
      - join_or_match_condition
      - cursor_or_conflict_target
    result_shape:
      mode: explicit
      values:
      - none
      - returning_star
      - returning_expression
      - rowset_projection
    with_clause:
      mode: explicit
      values:
      - absent
      - non_recursive
      - recursive
    name_shape:
      mode: explicit
      values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - alias_used
    expression_shape:
      mode: explicit
      values:
      - literal
      - column_reference
      - function_call
      - subquery_expression
    privilege_context:
      mode: explicit
      values:
      - owner
      - granted_role
    constraint_boundary:
      mode: explicit
      values:
      - none
      - constraint_satisfied
      - empty_input
    verification_mode:
      mode: explicit
      values:
      - catalog_query
      - effect_query
      - returned_rows
    cleanup_mode:
      mode: explicit
      values:
      - rollback
      - drop_objects
      - reset_state
  compatibility:
    resolver: statement_ref_factor_bindings_with_dml_dynamic_inputs
    success_when:
    - target_relation_state=exists
    - dependency_state=ready
    - privilege_context in [owner, granted_role]
    - invalid_combination=none
    - constraint_boundary in [none, constraint_satisfied, empty_input]
    failure_when:
    - condition: any generated fixture violates declared target, privilege, dependency, or constraint preconditions
      reason: unexpected_fixture_incompatibility
    default_failure_reason: unexpected_fixture_incompatibility
  sql_shape:
    template: CALL {procedure_name}({argument_sql});
  verification:
    required: true
    mode: factor_selected_verification_mode
    sql: '{verification_sql}'
  cleanup:
    required: true
    steps:
    - sql: '{cleanup_sql_selected_by_cleanup_mode}'
- id: call_required_target_failures
  title: CALL missing or wrong target failures
  lifecycle_role: negative_control
  expected_status_policy: fixed
  expected_failure_reasons:
  - missing_target_relation_or_dependency
  - wrong_object_type
  factors:
    statement_branch: branch_1
    expected_status: failure
    target_relation_state: missing
    data_or_query_shape: minimal
    condition_shape: none
    result_shape: none
    with_clause: absent
    name_shape: plain_identifier
    expression_shape: literal
    dependency_state: missing_dependency
    privilege_context: owner
    invalid_combination: syntax_valid_semantic_error
    constraint_boundary: none
    verification_mode: error_assertion
    cleanup_mode: rollback
  expansion:
    target_relation_state:
      mode: explicit
      values:
      - missing
      - wrong_object_type
    invalid_combination:
      mode: explicit
      values:
      - syntax_valid_semantic_error
      - object_type_mismatch
    verification_mode:
      mode: explicit
      values:
      - error_assertion
  compatibility:
    resolver: statement_ref_factor_bindings_with_negative_target_fixture
    success_when: []
    failure_when:
    - condition: target_relation_state=missing
      reason: missing_target_relation_or_dependency
    - condition: target_relation_state=wrong_object_type
      reason: wrong_object_type
    default_failure_reason: missing_target_relation_or_dependency
  sql_shape:
    template: CALL {missing_or_wrong_procedure_name}({argument_sql});
  verification:
    required: true
    mode: error_assertion
    sql: '{expected_error_assertion_sql}'
  cleanup:
    required: true
    steps:
    - sql: ROLLBACK;
- id: call_required_privilege_failure
  title: CALL insufficient privilege failure
  lifecycle_role: negative_control
  expected_status_policy: fixed
  expected_failure_reasons:
  - insufficient_privilege
  factors:
    statement_branch: branch_1
    expected_status: failure
    target_relation_state: exists
    data_or_query_shape: query_source
    condition_shape: simple_predicate
    result_shape: none
    with_clause: absent
    name_shape: schema_qualified
    expression_shape: column_reference
    dependency_state: ready
    privilege_context: insufficient_privilege
    invalid_combination: none
    constraint_boundary: none
    verification_mode: error_assertion
    cleanup_mode: reset_state
  expansion:
    privilege_context:
      mode: explicit
      values:
      - insufficient_privilege
  compatibility:
    resolver: statement_ref_factor_bindings_with_privilege_fixture
    success_when: []
    failure_when:
    - condition: privilege_context=insufficient_privilege
      reason: insufficient_privilege
    default_failure_reason: insufficient_privilege
  sql_shape:
    template: SET ROLE {insufficient_role}; CALL {procedure_name}({argument_sql});
  verification:
    required: true
    mode: error_assertion
    sql: '{expected_privilege_error_assertion_sql}'
  cleanup:
    required: true
    steps:
    - sql: RESET ROLE;
    - sql: '{cleanup_sql_selected_by_cleanup_mode}'
- id: call_required_constraint_or_boundary_failure
  title: CALL constraint or boundary failure
  lifecycle_role: negative_control
  expected_status_policy: fixed
  expected_failure_reasons:
  - constraint_violation_or_boundary_error
  factors:
    statement_branch: branch_1
    expected_status: failure
    target_relation_state: exists
    data_or_query_shape: explicit_values
    condition_shape: simple_predicate
    result_shape: returning_expression
    with_clause: non_recursive
    name_shape: quoted_identifier
    expression_shape: subquery_expression
    dependency_state: ready
    privilege_context: owner
    invalid_combination: syntax_valid_semantic_error
    constraint_boundary: constraint_violation
    verification_mode: error_assertion
    cleanup_mode: rollback
  expansion:
    constraint_boundary:
      mode: explicit
      values:
      - constraint_violation
  compatibility:
    resolver: statement_ref_factor_bindings_with_boundary_fixture
    success_when: []
    failure_when:
    - condition: constraint_boundary=constraint_violation
      reason: constraint_violation_or_boundary_error
    - condition: invalid_combination=syntax_valid_semantic_error
      reason: syntax_valid_semantic_error
    default_failure_reason: constraint_violation_or_boundary_error
  sql_shape:
    template: CALL {procedure_name}({invalid_argument_sql});
  verification:
    required: true
    mode: error_assertion
    sql: '{expected_boundary_error_assertion_sql}'
  cleanup:
    required: true
    steps:
    - sql: ROLLBACK;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
