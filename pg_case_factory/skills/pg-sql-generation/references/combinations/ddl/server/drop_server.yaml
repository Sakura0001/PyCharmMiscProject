schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_server
  name: DROP SERVER
  category: ddl
  domain: server
  source_reference: references/statements/ddl/server/drop_server.md
  official_source: https://www.postgresql.org/docs/16/sql-dropserver.html
  aliases:
  - drop_server
  - DROP SERVER
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, no-op, or notice attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - server
    decision_reason: DROP_SERVER directly targets foreign server objects and their pg_foreign_server metadata, FDW dependency,
      options, owner, and user-mapping dependency behavior.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: DROP_SERVER names a foreign server descriptor, not a table, index, view, sequence, or other pg_class
      relation. FDW and user-mapping dependencies are represented by declared server factors.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_SERVER operates on server metadata and FDW/user-mapping dependencies. It does not directly create,
      alter, scan, or drop table definitions, including foreign table definitions.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_SERVER has no SQL validity, cleanup, or verification behavior dependent on table column data types;
      options and validators belong to the FDW/server layer.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_server
      - branch_drop_server_if_exists
      - branch_drop_server_cascade
      - branch_drop_server_restrict
      coverage_requirement: all_declared_values
    server_existence:
      tier: T1
      coverage_role: main_axis
      required_values:
      - server_exists
      - server_not_exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - without_if_exists
      - with_if_exists
      coverage_requirement: all_declared_values
    cascade_restrict_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - no_clause_default_restrict
      - cascade
      - restrict
      coverage_requirement: all_declared_values
    privilege_context:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - superuser
      - owner_of_server
      - non_owner_no_privilege
      coverage_requirement: all_declared_values
    multi_target:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - single_target
      - multi_target_all_exist
      - multi_target_some_not_exist
      coverage_requirement: all_declared_values
    server_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_name
      - quoted_name
      - reserved_word_name
      - non_existing_name
      coverage_requirement: all_declared_values
    executor_privilege:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - superuser
      - owner
      - non_owner_no_privilege
      coverage_requirement: all_declared_values
    user_mapping_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_user_mapping_dependency
      - has_user_mapping_dependency
      coverage_requirement: all_declared_values
    nonexistent_server:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - server_does_not_exist
      coverage_requirement: all_declared_values
    privilege_insufficient:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - non_owner_dropping_server
      coverage_requirement: all_declared_values
    dependent_user_mapping:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - restrict_with_user_mapping_fails
      - cascade_with_user_mapping_succeeds
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - pg_foreign_server_catalog
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - drop_server_cascade
      - drop_user_mapping_then_drop_server
      coverage_requirement: all_declared_values
dynamic_inputs:
  server_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/server_manifest.json
    required_fields:
    - server_name
    - object_state
    - owner
    - fdw_name
  fdw_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/fdw_manifest.json
    required_fields:
    - fdw_name
    - fdw_exists
    - validator_behavior
  user_mapping_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/user_mapping_manifest.json
    required_fields:
    - server_name
    - mapping_exists
    - dependency_behavior
combination_groups:
- id: drop_server_required_factor_value_matrix
  title: DROP SERVER required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - nonexistent_server
  - privilege_insufficient
  - dependent_user_mapping
  factors:
    statement_branch: branch_drop_server
    server_existence: server_exists
    expected_status: success
    if_exists_clause: without_if_exists
    cascade_restrict_clause: no_clause_default_restrict
    privilege_context: superuser
    multi_target: single_target
    server_name_shape: simple_name
    executor_privilege: superuser
    user_mapping_dependency: no_user_mapping_dependency
    nonexistent_server: server_does_not_exist
    privilege_insufficient: non_owner_dropping_server
    dependent_user_mapping: restrict_with_user_mapping_fails
    verification_mode: pg_foreign_server_catalog
    cleanup_mode: drop_server_cascade
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_server
      - branch_drop_server_if_exists
      - branch_drop_server_cascade
      - branch_drop_server_restrict
    server_existence:
      mode: explicit
      values:
      - server_exists
      - server_not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - without_if_exists
      - with_if_exists
    cascade_restrict_clause:
      mode: explicit
      values:
      - no_clause_default_restrict
      - cascade
      - restrict
    privilege_context:
      mode: explicit
      values:
      - superuser
      - owner_of_server
      - non_owner_no_privilege
    multi_target:
      mode: explicit
      values:
      - single_target
      - multi_target_all_exist
      - multi_target_some_not_exist
    server_name_shape:
      mode: explicit
      values:
      - simple_name
      - quoted_name
      - reserved_word_name
      - non_existing_name
    executor_privilege:
      mode: explicit
      values:
      - superuser
      - owner
      - non_owner_no_privilege
    user_mapping_dependency:
      mode: explicit
      values:
      - no_user_mapping_dependency
      - has_user_mapping_dependency
    nonexistent_server:
      mode: explicit
      values:
      - server_does_not_exist
    privilege_insufficient:
      mode: explicit
      values:
      - non_owner_dropping_server
    dependent_user_mapping:
      mode: explicit
      values:
      - restrict_with_user_mapping_fails
      - cascade_with_user_mapping_succeeds
    verification_mode:
      mode: explicit
      values:
      - pg_foreign_server_catalog
      - error_assertion
    cleanup_mode:
      mode: explicit
      values:
      - drop_server_cascade
      - drop_user_mapping_then_drop_server
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and the selected object, privilege, dependency, and syntax factors describe a legal statement
      execution path
    - notice or no-op paths are attributed by their declared factors and do not replace required success/failure coverage
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: declared object state, privilege, dependency, name-shape, validator, or numeric boundary factor selects an
        invalid prerequisite
      reason: declared_factor_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP SERVER [ IF EXISTS ] {name} [, ...] [ CASCADE | RESTRICT ]
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT srvname FROM pg_foreign_server WHERE srvname = '{name}'
  cleanup:
    required: true
    steps:
    - sql: DROP SERVER IF EXISTS {server_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
