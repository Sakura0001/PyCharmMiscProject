schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_publication
  name: ALTER PUBLICATION
  category: ddl
  domain: publication
  source_reference: references/statements/ddl/publication/alter_publication.md
  official_source: https://www.postgresql.org/docs/16/sql-alterpublication.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - publication
    decision_reason: publication statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - partitioned_table_parent
    decision_reason: Publication statements can target table relations, so representative relation coverage is required.
  table_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - partitioned_table_parent
    decision_reason: Publication table membership depends on table object form.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: publication_column_list_or_predicate
    require_each_type_success_or_failure: true
    decision_reason: Publication column lists and row filters can reference table columns; type coverage is conditional on
      those branches.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_add
      - branch_set_object
      - branch_drop
      - branch_set_parameter
      - branch_owner_to
      - branch_rename
      coverage_requirement: all_values
    publication_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - non_existent
      - exists_as_for_all_tables
      - exists_with_tables
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    add_set_drop_operation:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - add_table
      - add_tables_in_schema
      - set_table
      - set_tables_in_schema
      - drop_table
      - drop_tables_in_schema
      coverage_requirement: all_values
    publication_parameter:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - publish_insert_only
      - publish_all_operations
      - publish_via_partition_root
      - multiple_parameters
      coverage_requirement: all_values
    owner_to_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - explicit_role_name
      - current_role_keyword
      - current_user_keyword
      - session_user_keyword
      coverage_requirement: all_values
    column_filter:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - no_column_filter
      - single_column_filter
      - multiple_column_filter
      coverage_requirement: all_values
    where_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id008
      - no_where
      - simple_where_condition
      coverage_requirement: all_values
    publication_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id009
      - simple_name
      - quoted_name
      - non_existent_name
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id010
      - simple_name
      - schema_qualified_name
      - quoted_name
      - nonexistent_table
      coverage_requirement: all_values
    schema_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id011
      - simple_name
      - current_schema_keyword
      - quoted_name
      - nonexistent_schema
      coverage_requirement: all_values
    new_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id012
      - simple_name
      - quoted_name
      - existing_name_conflict
      coverage_requirement: all_values
    new_owner_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id013
      - existing_role
      - nonexistent_role
      coverage_requirement: all_values
    executor_privilege:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id014
      - superuser
      - owner_of_publication
      - non_owner_no_privilege
      coverage_requirement: all_values
    table_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id015
      - table_exists
      - table_not_exists
      coverage_requirement: all_values
    schema_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id016
      - schema_exists
      - schema_not_exists
      coverage_requirement: all_values
    nonexistent_publication:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id017
      - publication_does_not_exist
      coverage_requirement: all_values
    privilege_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id018
      - non_owner_altering_publication
      - non_superuser_altering_other_publication
      coverage_requirement: all_values
    nonexistent_table:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id019
      - add_nonexistent_table_failure
      coverage_requirement: all_values
    nonexistent_schema:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id020
      - add_nonexistent_schema_failure
      coverage_requirement: all_values
    drop_from_for_all_tables:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id021
      - cannot_drop_from_for_all_tables
      coverage_requirement: all_values
    conflicting_add_existing_table:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id022
      - table_already_in_publication
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id023
      - pg_publication_catalog
      - pg_publication_tables_catalog
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id024
      - drop_publication
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: alter_publication_declared_factor_baseline
  title: ALTER PUBLICATION declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - alter_publication_declared_failure
  factors:
    statement_branch: branch_add
    publication_state: exists
    expected_status: success
    add_set_drop_operation: add_table
    publication_parameter: publish_insert_only
    owner_to_clause: explicit_role_name
    column_filter: no_column_filter
    where_clause: no_where
    publication_name_shape: simple_name
    table_name_shape: simple_name
    schema_name_shape: simple_name
    new_name_shape: simple_name
    new_owner_shape: existing_role
    executor_privilege: superuser
    table_dependency: table_exists
    schema_dependency: schema_exists
    nonexistent_publication: publication_does_not_exist
    privilege_insufficient: non_owner_altering_publication
    nonexistent_table: add_nonexistent_table_failure
    nonexistent_schema: add_nonexistent_schema_failure
    drop_from_for_all_tables: cannot_drop_from_for_all_tables
    conflicting_add_existing_table: table_already_in_publication
    verification_mode: pg_publication_catalog
    cleanup_mode: drop_publication
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    publication_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    add_set_drop_operation:
      mode: explicit
      values: *id004
    publication_parameter:
      mode: explicit
      values: *id005
    owner_to_clause:
      mode: explicit
      values: *id006
    column_filter:
      mode: explicit
      values: *id007
    where_clause:
      mode: explicit
      values: *id008
    publication_name_shape:
      mode: explicit
      values: *id009
    table_name_shape:
      mode: explicit
      values: *id010
    schema_name_shape:
      mode: explicit
      values: *id011
    new_name_shape:
      mode: explicit
      values: *id012
    new_owner_shape:
      mode: explicit
      values: *id013
    executor_privilege:
      mode: explicit
      values: *id014
    table_dependency:
      mode: explicit
      values: *id015
    schema_dependency:
      mode: explicit
      values: *id016
    nonexistent_publication:
      mode: explicit
      values: *id017
    privilege_insufficient:
      mode: explicit
      values: *id018
    nonexistent_table:
      mode: explicit
      values: *id019
    nonexistent_schema:
      mode: explicit
      values: *id020
    drop_from_for_all_tables:
      mode: explicit
      values: *id021
    conflicting_add_existing_table:
      mode: explicit
      values: *id022
    verification_mode:
      mode: explicit
      values: *id023
    cleanup_mode:
      mode: explicit
      values: *id024
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: alter_publication_declared_failure
    default_failure_reason: alter_publication_declared_failure
  sql_shape:
    template: ALTER PUBLICATION {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for alter_publication
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
