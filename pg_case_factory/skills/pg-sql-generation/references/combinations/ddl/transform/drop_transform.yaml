schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_transform
  name: DROP TRANSFORM
  category: ddl
  domain: transform
  source_reference: references/statements/ddl/transform/drop_transform.md
  official_source: https://www.postgresql.org/docs/16/sql-droptransform.html
  aliases:
  - drop_transform
  - DROP TRANSFORM
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before derived extension combinations are emitted.
  - Extensions may add dependency, privilege, IF EXISTS, or cascade permutations after audit passes.
  - Extensions must not satisfy required factor, object, relation, table, or column-type coverage.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - transform
    - type
    - language
    decision_reason: DROP TRANSFORM removes a transform object identified by type and language, and validates ownership on
      both bound objects plus dependency behavior.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: DROP TRANSFORM does not target pg_class relation kinds; dependency behavior is represented by
      dependency_context and dependent_object_exists.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP TRANSFORM does not create, alter, scan, or validate table variants.
  column_type_coverage:
    required: false
    coverage_mode: representative
    inventory_source: references/common/pg16_type_catalog.md
    decision_reason: Exhaustive table-column type coverage is not applicable because DROP TRANSFORM uses a type plus
      language identity for a transform object, not table column storage. Type coverage is represented by type_existence,
      nonexistent_type, and the transform_type_language_manifest.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: [branch_drop_transform, branch_drop_transform_if_exists]
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: object_state_axis
      required_values: [exists, absent]
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: status_axis
      required_values: [success, failure]
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: existence_clause_axis
      required_values: [present, absent]
      coverage_requirement: all_declared_values
    cascade_restrict:
      tier: T2
      coverage_role: dependency_action_axis
      required_values: [default_restrict, explicit_restrict, explicit_cascade]
      coverage_requirement: all_declared_values
    privilege_requirement:
      tier: T2
      coverage_role: privilege_axis
      required_values: [own_type_and_language, missing_type_ownership, missing_language_ownership]
      coverage_requirement: all_declared_values
    type_existence:
      tier: T2
      coverage_role: type_dependency_axis
      required_values: [type_exists, type_not_exists]
      coverage_requirement: all_declared_values
    language_existence:
      tier: T2
      coverage_role: language_dependency_axis
      required_values: [language_exists, language_not_exists]
      coverage_requirement: all_declared_values
    type_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [simple_id, schema_qualified_id, nonexistent_name]
      coverage_requirement: all_declared_values
    language_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [simple_id, nonexistent_name]
      coverage_requirement: all_declared_values
    privilege_on_type:
      tier: T4
      coverage_role: type_privilege_axis
      required_values: [owns_type, not_owns_type]
      coverage_requirement: all_declared_values
    privilege_on_language:
      tier: T4
      coverage_role: language_privilege_axis
      required_values: [owns_language, not_owns_language]
      coverage_requirement: all_declared_values
    dependency_context:
      tier: T4
      coverage_role: dependency_axis
      required_values: [no_dependencies, has_dependent_objects]
      coverage_requirement: all_declared_values
    nonexistent_transform:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [transform_exists, transform_missing_without_if_exists]
      coverage_requirement: all_declared_values
    nonexistent_type:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [type_exists, type_missing]
      coverage_requirement: all_declared_values
    nonexistent_language:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [language_exists, language_missing]
      coverage_requirement: all_declared_values
    insufficient_privilege:
      tier: T5
      coverage_role: privilege_boundary_axis
      required_values: [owns_both, missing_type_ownership, missing_language_ownership]
      coverage_requirement: all_declared_values
    dependent_object_exists:
      tier: T5
      coverage_role: dependency_boundary_axis
      required_values: [no_dependencies, has_dependencies]
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values: [catalog_query, error_assertion, notice_assertion]
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values: [drop_transform, cascade_cleanup]
      coverage_requirement: all_declared_values
dynamic_inputs:
  transform_type_language_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/transform_type_language_manifest.json
    required_fields: [type_name, type_oid, language_name, language_oid, object_state, privilege_requirement]
  transform_dependency_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/transform_dependency_manifest.json
    required_fields: [dependent_object_name, dependent_object_kind, dependency_context, cascade_restrict]
  transform_privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/transform_privilege_manifest.json
    required_fields: [execution_role, privilege_on_type, privilege_on_language, insufficient_privilege]
combination_groups:
- id: drop_transform_required_factor_value_matrix
  title: DROP TRANSFORM required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - transform_does_not_exist
  - transform_type_missing
  - transform_language_missing
  - insufficient_transform_privilege
  - dependent_objects_block_drop_transform
  factors:
    statement_branch: branch_drop_transform
    object_state: exists
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: default_restrict
    privilege_requirement: own_type_and_language
    type_existence: type_exists
    language_existence: language_exists
    type_name_shape: simple_id
    language_name_shape: simple_id
    privilege_on_type: owns_type
    privilege_on_language: owns_language
    dependency_context: no_dependencies
    nonexistent_transform: transform_exists
    nonexistent_type: type_exists
    nonexistent_language: language_exists
    insufficient_privilege: owns_both
    dependent_object_exists: no_dependencies
    verification_mode: catalog_query
    cleanup_mode: drop_transform
  expansion:
    statement_branch:
      mode: explicit
      values: [branch_drop_transform, branch_drop_transform_if_exists]
    object_state:
      mode: explicit
      values: [exists, absent]
    expected_status:
      mode: explicit
      values: [success, failure]
    if_exists_clause:
      mode: explicit
      values: [present, absent]
    cascade_restrict:
      mode: explicit
      values: [default_restrict, explicit_restrict, explicit_cascade]
    privilege_requirement:
      mode: explicit
      values: [own_type_and_language, missing_type_ownership, missing_language_ownership]
    type_existence:
      mode: explicit
      values: [type_exists, type_not_exists]
    language_existence:
      mode: explicit
      values: [language_exists, language_not_exists]
    type_name_shape:
      mode: explicit
      values: [simple_id, schema_qualified_id, nonexistent_name]
    language_name_shape:
      mode: explicit
      values: [simple_id, nonexistent_name]
    privilege_on_type:
      mode: explicit
      values: [owns_type, not_owns_type]
    privilege_on_language:
      mode: explicit
      values: [owns_language, not_owns_language]
    dependency_context:
      mode: explicit
      values: [no_dependencies, has_dependent_objects]
    nonexistent_transform:
      mode: explicit
      values: [transform_exists, transform_missing_without_if_exists]
    nonexistent_type:
      mode: explicit
      values: [type_exists, type_missing]
    nonexistent_language:
      mode: explicit
      values: [language_exists, language_missing]
    insufficient_privilege:
      mode: explicit
      values: [owns_both, missing_type_ownership, missing_language_ownership]
    dependent_object_exists:
      mode: explicit
      values: [no_dependencies, has_dependencies]
    verification_mode:
      mode: explicit
      values: [catalog_query, error_assertion, notice_assertion]
    cleanup_mode:
      mode: explicit
      values: [drop_transform, cascade_cleanup]
  compatibility:
    resolver: declared_matrix
    success_when:
    - object_state == exists and privilege_requirement == own_type_and_language and dependency_context == no_dependencies
    - object_state == absent and if_exists_clause == present
    - dependency_context == has_dependent_objects and cascade_restrict == explicit_cascade
    failure_when:
    - condition: object_state == absent and if_exists_clause == absent
      reason: transform_does_not_exist
    - condition: type_existence == type_not_exists or nonexistent_type == type_missing
      reason: transform_type_missing
    - condition: language_existence == language_not_exists or nonexistent_language == language_missing
      reason: transform_language_missing
    - condition: privilege_requirement in [missing_type_ownership, missing_language_ownership] or privilege_on_type ==
        not_owns_type or privilege_on_language == not_owns_language or insufficient_privilege in [missing_type_ownership,
        missing_language_ownership]
      reason: insufficient_transform_privilege
    - condition: dependent_object_exists == has_dependencies and cascade_restrict in [default_restrict, explicit_restrict]
      reason: dependent_objects_block_drop_transform
    default_failure_reason: drop_transform_binding_invalid
  sql_shape:
    template: DROP TRANSFORM {if_exists} FOR {type_name} LANGUAGE {language_name} {cascade_restrict};
  verification:
    required: true
    mode: pg_transform_catalog_or_notice_or_error_assertion
    sql: SELECT count(*) FROM pg_transform WHERE trftype = '{type_name}'::regtype AND trflang = (SELECT oid FROM pg_language WHERE lanname = '{language_name}');
  cleanup:
    required: true
    steps:
    - sql: DROP TRANSFORM IF EXISTS FOR {type_name} LANGUAGE {language_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
