schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_text_search_configuration
  name: CREATE TEXT SEARCH CONFIGURATION
  category: ddl
  domain: text_search_configuration
  source_reference: references/statements/ddl/text_search_configuration/create_text_search_configuration.md
  official_source: https://www.postgresql.org/docs/16/sql-createtsconfiguration.html
  aliases:
  - create_text_search_configuration
  - CREATE TEXT SEARCH CONFIGURATION
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, dependency, privilege, naming, or cross-factor combinations after the baseline
    audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, no-op, or notice attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - text_search_configuration
    - text_search_parser
    decision_reason: CREATE TEXT SEARCH CONFIGURATION directly targets a text search configuration catalog object. Required
      baseline coverage is scoped to parser and source-configuration dependencies declared by the statement reference.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: CREATE TEXT SEARCH CONFIGURATION names text search catalog objects, not pg_class relations. Tables, indexes,
      views, sequences, materialized views, and foreign tables are outside this statement target surface.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE TEXT SEARCH CONFIGURATION does not directly create, alter, scan, validate, or drop table definitions.
      Any setup objects are text search catalog dependencies rather than table-kind coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: The statement changes text search configuration metadata and token-to-dictionary mappings, not table
      columns. SQL validity and verification do not vary by PG16 table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_parser
      - branch_copy
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - not_exists
      - exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_declared_values
    config_source_type:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id004
      - parser
      - copy
      coverage_requirement: all_declared_values
    parser_existence:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id005
      - parser_exists
      - parser_not_exists
      coverage_requirement: all_declared_values
    copy_source_existence:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id006
      - source_exists
      - source_not_exists
      coverage_requirement: all_declared_values
    parser_copy_conflict:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id007
      - only_parser
      - only_copy
      - both_specified
      coverage_requirement: all_declared_values
    config_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id008
      - simple_id
      - schema_qualified_id
      - quoted_id
      - reserved_word_as_name
      - duplicate_name
      - invalid_name
      coverage_requirement: all_declared_values
    parser_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id009
      - simple_id
      - schema_qualified_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_declared_values
    copy_source_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id010
      - simple_id
      - schema_qualified_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id011
      - schema_owner
      - non_owner
      - superuser
      coverage_requirement: all_declared_values
    schema_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id012
      - schema_exists
      - schema_not_exists
      coverage_requirement: all_declared_values
    parser_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id013
      - parser_exists_and_valid
      - parser_missing
      coverage_requirement: all_declared_values
    duplicate_config_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id014
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_declared_values
    nonexistent_parser:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id015
      - parser_exists
      - parser_missing
      coverage_requirement: all_declared_values
    nonexistent_copy_source:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id016
      - source_exists
      - source_missing
      coverage_requirement: all_declared_values
    parser_copy_both_specified:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id017
      - one_specified
      - both_specified
      coverage_requirement: all_declared_values
    missing_parser_or_copy:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id018
      - one_specified
      - none_specified
      coverage_requirement: all_declared_values
    schema_permission_denied:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id019
      - has_create_privilege
      - lacks_create_privilege
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id020
      - catalog_query_pg_ts_config
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id021
      - drop_text_search_configuration
      - drop_parser
      coverage_requirement: all_declared_values
dynamic_inputs:
  ts_configuration_object_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/create_text_search_configuration_object_manifest.json
    required_fields:
    - object_name
    - schema_name
    - object_state
    - owner_role
  ts_configuration_dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/create_text_search_configuration_dependency_manifest.json
    required_fields:
    - dependency_objects
    - dependency_state
    - statement_branch
  ts_configuration_privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/create_text_search_configuration_privilege_manifest.json
    required_fields:
    - execution_role
    - privilege_context
    - is_superuser
combination_groups:
- id: create_text_search_configuration_required_factor_value_matrix
  title: CREATE TEXT SEARCH CONFIGURATION required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - statement_specific_failure
  - declared_factor_failure
  - duplicate_config_name
  - nonexistent_parser
  - nonexistent_copy_source
  - parser_copy_both_specified
  - missing_parser_or_copy
  - schema_permission_denied
  factors:
    statement_branch: branch_parser
    object_state: not_exists
    expected_status: success
    config_source_type: parser
    parser_existence: parser_exists
    copy_source_existence: source_exists
    parser_copy_conflict: only_parser
    config_name_shape: simple_id
    parser_name_shape: simple_id
    copy_source_name_shape: simple_id
    privilege_level: schema_owner
    schema_existence: schema_exists
    parser_dependency: parser_exists_and_valid
    duplicate_config_name: no_conflict
    nonexistent_parser: parser_exists
    nonexistent_copy_source: source_exists
    parser_copy_both_specified: one_specified
    missing_parser_or_copy: one_specified
    schema_permission_denied: has_create_privilege
    verification_mode: catalog_query_pg_ts_config
    cleanup_mode: drop_text_search_configuration
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    config_source_type:
      mode: explicit
      values: *id004
    parser_existence:
      mode: explicit
      values: *id005
    copy_source_existence:
      mode: explicit
      values: *id006
    parser_copy_conflict:
      mode: explicit
      values: *id007
    config_name_shape:
      mode: explicit
      values: *id008
    parser_name_shape:
      mode: explicit
      values: *id009
    copy_source_name_shape:
      mode: explicit
      values: *id010
    privilege_level:
      mode: explicit
      values: *id011
    schema_existence:
      mode: explicit
      values: *id012
    parser_dependency:
      mode: explicit
      values: *id013
    duplicate_config_name:
      mode: explicit
      values: *id014
    nonexistent_parser:
      mode: explicit
      values: *id015
    nonexistent_copy_source:
      mode: explicit
      values: *id016
    parser_copy_both_specified:
      mode: explicit
      values: *id017
    missing_parser_or_copy:
      mode: explicit
      values: *id018
    schema_permission_denied:
      mode: explicit
      values: *id019
    verification_mode:
      mode: explicit
      values: *id020
    cleanup_mode:
      mode: explicit
      values: *id021
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and selected text_search_configuration object, dependency, privilege, and syntax factors
      describe a legal CREATE TEXT SEARCH CONFIGURATION path
    - notice and no-op paths are represented by declared IF EXISTS or branch factors and do not replace required success/failure
      coverage
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: declared object state, dependency, privilege, name-shape, duplicate, missing-object, or schema boundary factor
        selects an invalid prerequisite
      reason: declared_factor_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: CREATE TEXT SEARCH CONFIGURATION {config_name} ( {config_source_type} = {source_name} )
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT cfgname FROM pg_ts_config WHERE cfgname = '{config_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TEXT SEARCH CONFIGURATION IF EXISTS {config_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
