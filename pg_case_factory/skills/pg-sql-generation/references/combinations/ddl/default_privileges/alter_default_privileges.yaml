schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_default_privileges
  name: ALTER DEFAULT PRIVILEGES
  category: ddl
  domain: default_privileges
  source_reference: references/statements/ddl/default_privileges/alter_default_privileges.md
  official_source: https://www.postgresql.org/docs/16/sql-alterdefaultprivileges.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - default_privileges
    decision_reason: default_privileges statements operate on PostgreSQL default privileges objects; object coverage is explicit
      for create, alter, and drop paths.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: default_privileges statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: default_privileges statements define catalog objects and do not directly operate on table instances.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: default_privileges statement syntax and validation do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    operation_type:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - grant
      - revoke
      coverage_requirement: all_values
    object_class:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - TABLES
      - SEQUENCES
      - FUNCTIONS
      - ROUTINES
      - TYPES
      - SCHEMAS
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    for_role_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - omitted_current_role
      - single_target_role
      - multiple_target_roles
      - nonexistent_target_role
      - for_user_keyword
      coverage_requirement: all_values
    in_schema_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - omitted_global
      - single_schema
      - multiple_schemas
      - nonexistent_schema
      - not_allowed_for_schemas_class
      coverage_requirement: all_values
    privilege_set:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - single_privilege
      - multiple_privileges
      - all_privileges
      - public
      coverage_requirement: all_values
    grant_option:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - omitted
      - with_grant_option
      coverage_requirement: all_values
    revoke_grant_option_for:
      tier: T2
      coverage_role: main_axis
      required_values: &id008
      - omitted
      - grant_option_for
      coverage_requirement: all_values
    revoke_cascade_restrict:
      tier: T2
      coverage_role: main_axis
      required_values: &id009
      - omitted_default_restrict
      - cascade
      - restrict
      coverage_requirement: all_values
    target_role_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id010
      - simple_id
      - quoted_id
      - nonexistent_role_name
      coverage_requirement: all_values
    schema_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id011
      - simple_id
      - nonexistent_schema_name
      coverage_requirement: all_values
    recipient_role_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id012
      - simple_id
      - quoted_id
      - public
      - group_role_name
      coverage_requirement: all_values
    group_keyword:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id013
      - omitted
      - specified_group
      coverage_requirement: all_values
    routines_vs_functions:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id014
      - functions_keyword
      - routines_keyword
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id015
      - superuser
      - target_role_owner
      - role_member
      - non_member
      coverage_requirement: all_values
    schema_existence:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id016
      - schema_exists
      - schema_not_exists
      coverage_requirement: all_values
    role_existence:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id017
      - role_exists
      - role_not_exists
      coverage_requirement: all_values
    additive_vs_overriding:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id018
      - global_only
      - per_schema_additive
      - per_schema_cannot_revoke_global
      coverage_requirement: all_values
    in_schema_on_schemas:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id019
      - no_conflict
      - in_schema_with_schemas_class
      coverage_requirement: all_values
    nonexistent_target_role:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id020
      - role_exists
      - role_not_exists
      coverage_requirement: all_values
    nonexistent_schema:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id021
      - schema_exists
      - schema_not_exists
      coverage_requirement: all_values
    cannot_revoke_global_from_per_schema:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id022
      - valid_revoke
      - invalid_per_schema_revoke_of_global
      coverage_requirement: all_values
    privilege_denied:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id023
      - authorized_success
      - unauthorized_failure
      coverage_requirement: all_values
    role_not_member_of_target_role:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id024
      - is_member
      - is_not_member
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id025
      - catalog_query_pg_default_acl
      - psql_ddp_command
      - create_object_and_verify_privileges
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id026
      - revoke_default_privileges
      - drop_role_owned_by
      - drop_schema
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - schema_name
    - expected_status
  dependency_manifest:
    required: false
    source: statement_reference_dependencies
    required_fields:
    - dependency_name
    - dependency_kind
    - setup_sql
combination_groups:
- id: alter_default_privileges_declared_factor_baseline
  title: ALTER DEFAULT PRIVILEGES declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - alter_default_privileges_declared_failure
  factors:
    operation_type: grant
    object_class: TABLES
    expected_status: success
    for_role_clause: omitted_current_role
    in_schema_clause: omitted_global
    privilege_set: single_privilege
    grant_option: omitted
    revoke_grant_option_for: omitted
    revoke_cascade_restrict: omitted_default_restrict
    target_role_name_shape: simple_id
    schema_name_shape: simple_id
    recipient_role_name_shape: simple_id
    group_keyword: omitted
    routines_vs_functions: functions_keyword
    privilege_level: superuser
    schema_existence: schema_exists
    role_existence: role_exists
    additive_vs_overriding: global_only
    in_schema_on_schemas: no_conflict
    nonexistent_target_role: role_exists
    nonexistent_schema: schema_exists
    cannot_revoke_global_from_per_schema: valid_revoke
    privilege_denied: authorized_success
    role_not_member_of_target_role: is_member
    verification_mode: catalog_query_pg_default_acl
    cleanup_mode: revoke_default_privileges
  expansion:
    operation_type:
      mode: explicit
      values: *id001
    object_class:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    for_role_clause:
      mode: explicit
      values: *id004
    in_schema_clause:
      mode: explicit
      values: *id005
    privilege_set:
      mode: explicit
      values: *id006
    grant_option:
      mode: explicit
      values: *id007
    revoke_grant_option_for:
      mode: explicit
      values: *id008
    revoke_cascade_restrict:
      mode: explicit
      values: *id009
    target_role_name_shape:
      mode: explicit
      values: *id010
    schema_name_shape:
      mode: explicit
      values: *id011
    recipient_role_name_shape:
      mode: explicit
      values: *id012
    group_keyword:
      mode: explicit
      values: *id013
    routines_vs_functions:
      mode: explicit
      values: *id014
    privilege_level:
      mode: explicit
      values: *id015
    schema_existence:
      mode: explicit
      values: *id016
    role_existence:
      mode: explicit
      values: *id017
    additive_vs_overriding:
      mode: explicit
      values: *id018
    in_schema_on_schemas:
      mode: explicit
      values: *id019
    nonexistent_target_role:
      mode: explicit
      values: *id020
    nonexistent_schema:
      mode: explicit
      values: *id021
    cannot_revoke_global_from_per_schema:
      mode: explicit
      values: *id022
    privilege_denied:
      mode: explicit
      values: *id023
    role_not_member_of_target_role:
      mode: explicit
      values: *id024
    verification_mode:
      mode: explicit
      values: *id025
    cleanup_mode:
      mode: explicit
      values: *id026
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: alter_default_privileges_declared_failure
    default_failure_reason: alter_default_privileges_declared_failure
  sql_shape:
    template: ALTER DEFAULT PRIVILEGES {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for alter_default_privileges
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
