schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_policy
  name: DROP POLICY
  category: ddl
  domain: policy
  source_reference: references/statements/ddl/policy/drop_policy.md
  official_source: https://www.postgresql.org/docs/16/sql-droppolicy.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - policy
    decision_reason: policy statements operate on PostgreSQL policy objects; object coverage is explicit for create, alter,
      and drop paths.
  target_relation_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - partitioned_table_parent
    decision_reason: policy statements are validated against table-backed relations rather than arbitrary relation kinds.
  table_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - partitioned_table_parent
    decision_reason: policy statements attach behavior to table objects, so representative table forms are required.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: predicate_or_expression_columns
    require_each_type_success_or_failure: true
    decision_reason: policy behavior can reference table columns in predicates or expressions; coverage is conditional on
      expression-bearing branches.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_drop_policy
      - branch_drop_policy_if_exists
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - absent
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - present
      - absent
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - cascade
      - restrict
      - omitted
      coverage_requirement: all_values
    last_policy_effect:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - not_last_policy
      - last_policy_remaining
      - table_has_multiple_policies
      coverage_requirement: all_values
    policy_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - simple_id
      - quoted_id
      - nonexistent_name
      - existing_name
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id008
      - simple_id
      - quoted_id
      - schema_qualified
      - nonexistent_table
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - superuser
      - table_owner
      - non_owner
      coverage_requirement: all_values
    rls_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id010
      - rls_enabled
      - rls_disabled
      coverage_requirement: all_values
    table_existence:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id011
      - table_exists
      - table_not_exists
      coverage_requirement: all_values
    nonexistent_policy:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - policy_exists
      - policy_missing_without_if_exists
      coverage_requirement: all_values
    nonexistent_table:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id013
      - table_exists
      - table_missing
      coverage_requirement: all_values
    privilege_denied:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id014
      - owner_execution
      - non_owner_denied
      - superuser_execution
      coverage_requirement: all_values
    last_policy_default_deny:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id015
      - other_policies_remain
      - default_deny_after_drop
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id016
      - catalog_query_pg_policy
      - error_assertion
      - notice_assertion
      - rls_behavior_test
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id017
      - disable_rls_drop_policy
      - drop_table
      - role_cleanup
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - schema_name
    - expected_status
  dependency_manifest:
    required: true
    source: statement_reference_dependencies
    required_fields:
    - dependency_name
    - dependency_kind
    - setup_sql
combination_groups:
- id: drop_policy_declared_factor_baseline
  title: DROP POLICY declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - drop_policy_declared_failure
  factors:
    statement_branch: branch_drop_policy
    object_state: exists
    expected_status: success
    if_exists_clause: present
    cascade_restrict: cascade
    last_policy_effect: not_last_policy
    policy_name_shape: simple_id
    table_name_shape: simple_id
    privilege_level: superuser
    rls_state: rls_enabled
    table_existence: table_exists
    nonexistent_policy: policy_exists
    nonexistent_table: table_exists
    privilege_denied: owner_execution
    last_policy_default_deny: other_policies_remain
    verification_mode: catalog_query_pg_policy
    cleanup_mode: disable_rls_drop_policy
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    if_exists_clause:
      mode: explicit
      values: *id004
    cascade_restrict:
      mode: explicit
      values: *id005
    last_policy_effect:
      mode: explicit
      values: *id006
    policy_name_shape:
      mode: explicit
      values: *id007
    table_name_shape:
      mode: explicit
      values: *id008
    privilege_level:
      mode: explicit
      values: *id009
    rls_state:
      mode: explicit
      values: *id010
    table_existence:
      mode: explicit
      values: *id011
    nonexistent_policy:
      mode: explicit
      values: *id012
    nonexistent_table:
      mode: explicit
      values: *id013
    privilege_denied:
      mode: explicit
      values: *id014
    last_policy_default_deny:
      mode: explicit
      values: *id015
    verification_mode:
      mode: explicit
      values: *id016
    cleanup_mode:
      mode: explicit
      values: *id017
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: drop_policy_declared_failure
    default_failure_reason: drop_policy_declared_failure
  sql_shape:
    template: DROP POLICY {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for drop_policy
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
