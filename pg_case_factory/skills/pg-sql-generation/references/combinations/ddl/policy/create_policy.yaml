schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_policy
  name: CREATE POLICY
  category: ddl
  domain: policy
  source_reference: references/statements/ddl/policy/create_policy.md
  official_source: https://www.postgresql.org/docs/16/sql-createpolicy.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - policy
    decision_reason: policy statements operate on PostgreSQL policy objects; object coverage is explicit for create, alter,
      and drop paths.
  target_relation_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - partitioned_table_parent
    decision_reason: policy statements are validated against table-backed relations rather than arbitrary relation kinds.
  table_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - partitioned_table_parent
    decision_reason: policy statements attach behavior to table objects, so representative table forms are required.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: predicate_or_expression_columns
    require_each_type_success_or_failure: true
    decision_reason: policy behavior can reference table columns in predicates or expressions; coverage is conditional on
      expression-bearing branches.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_create_policy
      coverage_requirement: all_values
    policy_type:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - permissive
      - restrictive
      coverage_requirement: all_values
    command_type:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - ALL
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id004
      - not_exists
      - exists_same_table
      - exists_different_table
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id005
      - success
      - failure
      coverage_requirement: all_values
    role_target:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - PUBLIC
      - single_role
      - multiple_roles
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
      coverage_requirement: all_values
    using_expression:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - omitted
      - simple_boolean_expr
      - column_reference_expr
      - complex_expr
      coverage_requirement: all_values
    with_check_expression:
      tier: T2
      coverage_role: main_axis
      required_values: &id008
      - omitted
      - simple_boolean_expr
      - column_reference_expr
      - complex_expr
      coverage_requirement: all_values
    expression_compatibility:
      tier: T2
      coverage_role: main_axis
      required_values: &id009
      - compatible_pairing
      - select_with_check_incompatible
      - insert_with_using_incompatible
      - delete_with_check_incompatible
      coverage_requirement: all_values
    policy_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id010
      - simple_id
      - quoted_id
      - reserved_word_as_name
      - duplicate_name_same_table
      - duplicate_name_different_table
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id011
      - simple_id
      - quoted_id
      - schema_qualified
      - nonexistent_table
      coverage_requirement: all_values
    role_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id012
      - simple_id
      - quoted_id
      - PUBLIC_keyword
      - nonexistent_role
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id013
      - superuser
      - table_owner
      - non_owner
      coverage_requirement: all_values
    rls_enabled:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id014
      - rls_enabled
      - rls_not_enabled
      coverage_requirement: all_values
    table_existence:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id015
      - table_exists
      - table_not_exists
      coverage_requirement: all_values
    role_existence:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id016
      - role_exists
      - role_not_exists
      coverage_requirement: all_values
    duplicate_policy_name:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id017
      - no_conflict
      - same_table_same_name
      coverage_requirement: all_values
    nonexistent_table:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id018
      - table_exists
      - table_missing
      coverage_requirement: all_values
    rls_not_enabled:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id019
      - rls_enabled
      - rls_not_enabled
      coverage_requirement: all_values
    privilege_denied:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id020
      - owner_execution
      - non_owner_denied
      - superuser_execution
      coverage_requirement: all_values
    select_with_check_conflict:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id021
      - compatible_no_with_check
      - incompatible_with_check
      coverage_requirement: all_values
    insert_with_using_conflict:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id022
      - compatible_no_using
      - incompatible_using
      coverage_requirement: all_values
    only_restrictive_policy:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id023
      - has_permissive_policy
      - only_restrictive_no_permissive
      coverage_requirement: all_values
    invalid_expression:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id024
      - valid_expression
      - aggregate_in_expression
      - window_function_in_expression
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id025
      - catalog_query_pg_policy
      - rls_behavior_test
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id026
      - drop_policy
      - disable_rls_and_drop_policy
      - drop_table
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - schema_name
    - expected_status
  dependency_manifest:
    required: true
    source: statement_reference_dependencies
    required_fields:
    - dependency_name
    - dependency_kind
    - setup_sql
combination_groups:
- id: create_policy_declared_factor_baseline
  title: CREATE POLICY declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - create_policy_declared_failure
  factors:
    statement_branch: branch_create_policy
    policy_type: permissive
    command_type: ALL
    object_state: not_exists
    expected_status: success
    role_target: PUBLIC
    using_expression: omitted
    with_check_expression: omitted
    expression_compatibility: compatible_pairing
    policy_name_shape: simple_id
    table_name_shape: simple_id
    role_name_shape: simple_id
    privilege_level: superuser
    rls_enabled: rls_enabled
    table_existence: table_exists
    role_existence: role_exists
    duplicate_policy_name: no_conflict
    nonexistent_table: table_exists
    rls_not_enabled: rls_enabled
    privilege_denied: owner_execution
    select_with_check_conflict: compatible_no_with_check
    insert_with_using_conflict: compatible_no_using
    only_restrictive_policy: has_permissive_policy
    invalid_expression: valid_expression
    verification_mode: catalog_query_pg_policy
    cleanup_mode: drop_policy
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    policy_type:
      mode: explicit
      values: *id002
    command_type:
      mode: explicit
      values: *id003
    object_state:
      mode: explicit
      values: *id004
    expected_status:
      mode: explicit
      values: *id005
    role_target:
      mode: explicit
      values: *id006
    using_expression:
      mode: explicit
      values: *id007
    with_check_expression:
      mode: explicit
      values: *id008
    expression_compatibility:
      mode: explicit
      values: *id009
    policy_name_shape:
      mode: explicit
      values: *id010
    table_name_shape:
      mode: explicit
      values: *id011
    role_name_shape:
      mode: explicit
      values: *id012
    privilege_level:
      mode: explicit
      values: *id013
    rls_enabled:
      mode: explicit
      values: *id014
    table_existence:
      mode: explicit
      values: *id015
    role_existence:
      mode: explicit
      values: *id016
    duplicate_policy_name:
      mode: explicit
      values: *id017
    nonexistent_table:
      mode: explicit
      values: *id018
    rls_not_enabled:
      mode: explicit
      values: *id019
    privilege_denied:
      mode: explicit
      values: *id020
    select_with_check_conflict:
      mode: explicit
      values: *id021
    insert_with_using_conflict:
      mode: explicit
      values: *id022
    only_restrictive_policy:
      mode: explicit
      values: *id023
    invalid_expression:
      mode: explicit
      values: *id024
    verification_mode:
      mode: explicit
      values: *id025
    cleanup_mode:
      mode: explicit
      values: *id026
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: create_policy_declared_failure
    default_failure_reason: create_policy_declared_failure
  sql_shape:
    template: CREATE POLICY {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for create_policy
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
