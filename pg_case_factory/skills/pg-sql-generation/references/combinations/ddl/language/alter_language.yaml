schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_language
  name: ALTER LANGUAGE
  category: ddl
  domain: language
  source_reference: references/statements/ddl/language/alter_language.md
  official_source: https://www.postgresql.org/docs/16/sql-alterlanguage.html
  aliases:
  - ALTER LANGUAGE
  - alter language
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not satisfy required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds: [language]
    decision_reason: >
      ALTER LANGUAGE directly changes a procedural language object through rename or owner change. Required coverage is
      scoped to language existence, branch action, owner target, privilege, and rename-conflict state.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: >
      ALTER LANGUAGE does not target pg_class relations. Procedural language metadata and owner changes are independent of
      relation-kind coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: >
      ALTER LANGUAGE does not operate on tables or table-backed dependencies. Function definitions that use a language are
      not table-kind coverage for this object-level DDL statement.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: >
      ALTER LANGUAGE changes language metadata and ownership. It does not depend on table column data types or type-specific
      SQL validity.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: [branch_rename, branch_owner]
      coverage_requirement: all_declared_values
    target_object_state:
      tier: T1
      coverage_role: main_axis
      required_values: [exists, missing]
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: status_axis
      required_values: [success, failure]
      coverage_requirement: all_declared_values
    alter_action:
      tier: T2
      coverage_role: behavior_axis
      required_values: [rename, owner_change]
      coverage_requirement: all_declared_values
    new_owner_shape:
      tier: T2
      coverage_role: owner_target_axis
      required_values: [plain_role, current_role, current_user, session_user, missing_role]
      coverage_requirement: all_declared_values
    privilege_context:
      tier: T2
      coverage_role: privilege_axis
      required_values: [superuser, owner, non_owner, insufficient_privilege]
      coverage_requirement: all_declared_values
    name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [plain_identifier, quoted_identifier, missing_object]
      coverage_requirement: all_declared_values
    new_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [plain_identifier, quoted_identifier, existing_name_conflict]
      coverage_requirement: all_declared_values
    dependency_state:
      tier: T4
      coverage_role: dependency_axis
      required_values: [ready, missing_dependency]
      coverage_requirement: all_declared_values
    rename_conflict:
      tier: T4
      coverage_role: negative_boundary_axis
      required_values: [new_name_available, new_name_conflict]
      coverage_requirement: all_declared_values
    invalid_combination:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [none, syntax_valid_semantic_error, object_type_mismatch]
      coverage_requirement: all_declared_values
    ownership_boundary:
      tier: T5
      coverage_role: ownership_axis
      required_values: [superuser, owner, non_owner]
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values: [catalog_query, effect_query, error_assertion]
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values: [drop_objects, reset_state]
      coverage_requirement: all_declared_values
dynamic_inputs: {}
combination_groups:
- id: alter_language_required_factor_value_matrix
  title: ALTER LANGUAGE required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - missing_language
  - rename_target_conflict
  - invalid_owner_target
  - insufficient_language_privilege
  - invalid_language_alter_combination
  factors:
    statement_branch: branch_rename
    target_object_state: exists
    expected_status: success
    alter_action: rename
    new_owner_shape: plain_role
    privilege_context: owner
    name_shape: plain_identifier
    new_name_shape: plain_identifier
    dependency_state: ready
    rename_conflict: new_name_available
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: catalog_query
    cleanup_mode: drop_objects
  expansion:
    statement_branch:
      mode: explicit
      values: [branch_rename, branch_owner]
    target_object_state:
      mode: explicit
      values: [exists, missing]
    expected_status:
      mode: explicit
      values: [success, failure]
    alter_action:
      mode: explicit
      values: [rename, owner_change]
    new_owner_shape:
      mode: explicit
      values: [plain_role, current_role, current_user, session_user, missing_role]
    privilege_context:
      mode: explicit
      values: [superuser, owner, non_owner, insufficient_privilege]
    name_shape:
      mode: explicit
      values: [plain_identifier, quoted_identifier, missing_object]
    new_name_shape:
      mode: explicit
      values: [plain_identifier, quoted_identifier, existing_name_conflict]
    dependency_state:
      mode: explicit
      values: [ready, missing_dependency]
    rename_conflict:
      mode: explicit
      values: [new_name_available, new_name_conflict]
    invalid_combination:
      mode: explicit
      values: [none, syntax_valid_semantic_error, object_type_mismatch]
    ownership_boundary:
      mode: explicit
      values: [superuser, owner, non_owner]
    verification_mode:
      mode: explicit
      values: [catalog_query, effect_query, error_assertion]
    cleanup_mode:
      mode: explicit
      values: [drop_objects, reset_state]
  compatibility:
    resolver: alter_language_factor_binding
    success_when:
    - Existing language can be renamed or assigned a new owner when the actor is superuser or owner and branch targets are valid.
    - Dependency state ready is sufficient because ALTER LANGUAGE does not redefine handler functions.
    failure_when:
    - condition: target_object_state missing or name_shape missing_object
      reason: missing_language
    - condition: statement_branch branch_rename with rename_conflict new_name_conflict or new_name_shape existing_name_conflict
      reason: rename_target_conflict
    - condition: statement_branch branch_owner with new_owner_shape missing_role
      reason: invalid_owner_target
    - condition: privilege_context non_owner or insufficient_privilege or ownership_boundary non_owner
      reason: insufficient_language_privilege
    - condition: invalid_combination not none
      reason: invalid_language_alter_combination
    default_failure_reason: alter_language_invalid_state
  sql_shape:
    template: "ALTER PROCEDURAL LANGUAGE {name} {alter_action} {alter_target}"
  verification:
    required: true
    mode: pg_language_catalog_or_effect_check
    sql: "SELECT count(*) FROM pg_language WHERE lanname = '{name}'"
  cleanup:
    required: true
    steps:
    - sql: "DROP LANGUAGE IF EXISTS {name} CASCADE"
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
