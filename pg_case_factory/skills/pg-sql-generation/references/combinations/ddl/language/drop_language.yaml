schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_language
  name: DROP LANGUAGE
  category: ddl
  domain: language
  source_reference: references/statements/ddl/language/drop_language.md
  official_source: https://www.postgresql.org/docs/16/sql-droplanguage.html
  aliases:
  - DROP LANGUAGE
  - drop language
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, dependency, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not satisfy required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and preserve success, failure, notice, or no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds: [language]
    decision_reason: >
      DROP LANGUAGE directly removes a procedural language object. Required coverage is scoped to language existence,
      IF EXISTS, CASCADE/RESTRICT, ownership, privilege, and dependent-object state.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: >
      DROP LANGUAGE does not directly target pg_class relations. Objects depending on the language are dependency fixtures
      represented by dependency_state and cascade_behavior rather than relation-kind coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: >
      DROP LANGUAGE may affect dependent functions through CASCADE, but it does not directly operate on table definitions,
      table predicates, or table rows. Table-kind coverage is not a baseline axis.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: >
      DROP LANGUAGE success or failure is independent of table column types. Dependency behavior is captured by language
      dependents and cascade/restrict factors, not PG16 column-type coverage.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: [branch_1]
      coverage_requirement: all_declared_values
    target_object_state:
      tier: T1
      coverage_role: main_axis
      required_values: [exists, missing, exists_with_dependents]
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: status_axis
      required_values: [success, failure]
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: [absent, present]
      coverage_requirement: all_declared_values
    cascade_clause:
      tier: T2
      coverage_role: dependency_behavior_axis
      required_values: [restrict_default, restrict_explicit, cascade]
      coverage_requirement: all_declared_values
    privilege_context:
      tier: T2
      coverage_role: privilege_axis
      required_values: [superuser, owner, non_owner, insufficient_privilege]
      coverage_requirement: all_declared_values
    name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [plain_identifier, quoted_identifier, missing_object]
      coverage_requirement: all_declared_values
    dependency_state:
      tier: T4
      coverage_role: dependency_axis
      required_values: [no_dependents, has_dependents]
      coverage_requirement: all_declared_values
    cascade_behavior:
      tier: T4
      coverage_role: dependency_behavior_axis
      required_values: [restrict_blocks, cascade_succeeds]
      coverage_requirement: all_declared_values
    invalid_combination:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [none, syntax_valid_semantic_error]
      coverage_requirement: all_declared_values
    ownership_boundary:
      tier: T5
      coverage_role: ownership_axis
      required_values: [superuser, owner, non_owner]
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values: [catalog_query, effect_query, error_assertion]
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values: [drop_objects, reset_state]
      coverage_requirement: all_declared_values
dynamic_inputs: {}
combination_groups:
- id: drop_language_required_factor_value_matrix
  title: DROP LANGUAGE required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - missing_language_without_if_exists
  - dependent_objects_restricted
  - insufficient_language_privilege
  - invalid_language_drop_combination
  factors:
    statement_branch: branch_1
    target_object_state: exists
    expected_status: success
    if_exists_clause: absent
    cascade_clause: restrict_default
    privilege_context: owner
    name_shape: plain_identifier
    dependency_state: no_dependents
    cascade_behavior: restrict_blocks
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: catalog_query
    cleanup_mode: drop_objects
  expansion:
    statement_branch:
      mode: explicit
      values: [branch_1]
    target_object_state:
      mode: explicit
      values: [exists, missing, exists_with_dependents]
    expected_status:
      mode: explicit
      values: [success, failure]
    if_exists_clause:
      mode: explicit
      values: [absent, present]
    cascade_clause:
      mode: explicit
      values: [restrict_default, restrict_explicit, cascade]
    privilege_context:
      mode: explicit
      values: [superuser, owner, non_owner, insufficient_privilege]
    name_shape:
      mode: explicit
      values: [plain_identifier, quoted_identifier, missing_object]
    dependency_state:
      mode: explicit
      values: [no_dependents, has_dependents]
    cascade_behavior:
      mode: explicit
      values: [restrict_blocks, cascade_succeeds]
    invalid_combination:
      mode: explicit
      values: [none, syntax_valid_semantic_error]
    ownership_boundary:
      mode: explicit
      values: [superuser, owner, non_owner]
    verification_mode:
      mode: explicit
      values: [catalog_query, effect_query, error_assertion]
    cleanup_mode:
      mode: explicit
      values: [drop_objects, reset_state]
  compatibility:
    resolver: drop_language_factor_binding
    success_when:
    - Existing language without dependents can be dropped by owner or superuser with default or explicit RESTRICT.
    - Missing language with IF EXISTS is a notice/no-op success.
    - Existing language with dependents succeeds when CASCADE is selected and privileges are sufficient.
    failure_when:
    - condition: target_object_state missing or name_shape missing_object with if_exists_clause absent
      reason: missing_language_without_if_exists
    - condition: target_object_state exists_with_dependents or dependency_state has_dependents with cascade_clause not cascade
      reason: dependent_objects_restricted
    - condition: privilege_context non_owner or insufficient_privilege or ownership_boundary non_owner
      reason: insufficient_language_privilege
    - condition: invalid_combination not none
      reason: invalid_language_drop_combination
    default_failure_reason: drop_language_invalid_state
  sql_shape:
    template: "DROP PROCEDURAL LANGUAGE {if_exists} {name} {cascade_clause}"
  verification:
    required: true
    mode: pg_language_removed_or_notice_check
    sql: "SELECT count(*) FROM pg_language WHERE lanname = '{name}'"
  cleanup:
    required: true
    steps:
    - sql: "DROP LANGUAGE IF EXISTS {name} CASCADE"
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
