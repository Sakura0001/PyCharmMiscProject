schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_domain
  name: ALTER DOMAIN
  category: ddl
  domain: domain
  source_reference: references/statements/ddl/domain/alter_domain.md
  official_source: https://www.postgresql.org/docs/16/sql-alterdomain.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - domain
    decision_reason: domain statements operate on PostgreSQL domain objects; object coverage is explicit for create, alter,
      and drop paths.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: domain statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: domain statements define catalog objects and do not directly operate on table instances.
  column_type_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: representative_type_families
    require_each_type_success_or_failure: true
    decision_reason: domain validity depends on PostgreSQL data type bindings, so representative PG16 type coverage is required.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_set_default
      - branch_drop_default
      - branch_set_not_null
      - branch_drop_not_null
      - branch_add_constraint
      - branch_drop_constraint
      - branch_rename_constraint
      - branch_validate_constraint
      - branch_owner_to
      - branch_rename_to
      - branch_set_schema
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    alter_action:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - set_default
      - drop_default
      - set_not_null
      - drop_not_null
      - add_constraint
      - drop_constraint
      - rename_constraint
      - validate_constraint
      - owner_to
      - rename_to
      - set_schema
      coverage_requirement: all_values
    constraint_type:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - not_null
      - check
      - not_null_with_name
      - check_with_name
      coverage_requirement: all_values
    if_exists:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - present
      - absent
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - restrict
      - cascade
      - omitted_default_restrict
      coverage_requirement: all_values
    not_valid:
      tier: T2
      coverage_role: main_axis
      required_values: &id008
      - not_valid
      - full_valid
      coverage_requirement: all_values
    owner_target:
      tier: T2
      coverage_role: main_axis
      required_values: &id009
      - specified_new_owner
      - specified_current_role
      - specified_current_user
      - specified_session_user
      coverage_requirement: all_values
    domain_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id010
      - simple_id
      - quoted_id
      - schema_qualified
      - reserved_word_as_name
      - nonexistent_name
      coverage_requirement: all_values
    constraint_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id011
      - simple_id
      - quoted_id
      - nonexistent_constraint
      - existing_constraint
      coverage_requirement: all_values
    new_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id012
      - simple_id
      - quoted_id
      - duplicate_name
      - invalid_name
      coverage_requirement: all_values
    new_constraint_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id013
      - simple_id
      - quoted_id
      - duplicate_constraint_name
      coverage_requirement: all_values
    schema_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id014
      - simple_id
      - nonexistent_schema
      - existing_schema
      coverage_requirement: all_values
    owner_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id015
      - simple_id
      - quoted_id
      - nonexistent_role
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id016
      - superuser
      - domain_owner
      - non_owner
      coverage_requirement: all_values
    constraint_existence:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id017
      - constraint_exists
      - constraint_not_exists
      coverage_requirement: all_values
    schema_existence:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id018
      - schema_exists
      - schema_not_exists
      coverage_requirement: all_values
    role_existence:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id019
      - role_exists
      - role_not_exists
      coverage_requirement: all_values
    set_role_capability:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id020
      - can_set_role
      - cannot_set_role
      coverage_requirement: all_values
    container_column_usage:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id021
      - not_used_in_container
      - used_in_composite_column
      - used_in_array_column
      - used_in_range_column
      coverage_requirement: all_values
    nonexistent_domain:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id022
      - domain_exists
      - domain_missing
      coverage_requirement: all_values
    nonexistent_constraint:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id023
      - constraint_exists
      - constraint_missing
      coverage_requirement: all_values
    duplicate_constraint:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id024
      - no_conflict
      - same_name_constraint
      coverage_requirement: all_values
    container_column_block:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id025
      - no_container_block
      - composite_column_block
      - array_column_block
      - range_column_block
      coverage_requirement: all_values
    non_owner_attempt:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id026
      - owner_execution
      - non_owner_execution
      - superuser_execution
      coverage_requirement: all_values
    cannot_set_role:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id027
      - can_set_role
      - cannot_set_role_to_target
      coverage_requirement: all_values
    nonexistent_role:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id028
      - role_exists
      - role_missing
      coverage_requirement: all_values
    nonexistent_schema:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id029
      - schema_exists
      - schema_missing
      coverage_requirement: all_values
    null_value_block:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id030
      - no_null_values
      - has_null_values_in_column
      coverage_requirement: all_values
    concurrent_data_hazard:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id031
      - safe_serial_execution
      - concurrent_insert_possible
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id032
      - catalog_query_pg_type
      - catalog_query_pg_constraint
      - effect_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id033
      - revert_alter
      - drop_domain
      - role_cleanup
      - schema_cleanup
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - schema_name
    - expected_status
  dependency_manifest:
    required: true
    source: statement_reference_dependencies
    required_fields:
    - dependency_name
    - dependency_kind
    - setup_sql
combination_groups:
- id: alter_domain_declared_factor_baseline
  title: ALTER DOMAIN declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - alter_domain_declared_failure
  factors:
    statement_branch: branch_set_default
    object_state: exists
    expected_status: success
    alter_action: set_default
    constraint_type: not_null
    if_exists: present
    cascade_restrict: restrict
    not_valid: not_valid
    owner_target: specified_new_owner
    domain_name_shape: simple_id
    constraint_name_shape: simple_id
    new_name_shape: simple_id
    new_constraint_name_shape: simple_id
    schema_name_shape: simple_id
    owner_name_shape: simple_id
    privilege_level: superuser
    constraint_existence: constraint_exists
    schema_existence: schema_exists
    role_existence: role_exists
    set_role_capability: can_set_role
    container_column_usage: not_used_in_container
    nonexistent_domain: domain_exists
    nonexistent_constraint: constraint_exists
    duplicate_constraint: no_conflict
    container_column_block: no_container_block
    non_owner_attempt: owner_execution
    cannot_set_role: can_set_role
    nonexistent_role: role_exists
    nonexistent_schema: schema_exists
    null_value_block: no_null_values
    concurrent_data_hazard: safe_serial_execution
    verification_mode: catalog_query_pg_type
    cleanup_mode: revert_alter
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    alter_action:
      mode: explicit
      values: *id004
    constraint_type:
      mode: explicit
      values: *id005
    if_exists:
      mode: explicit
      values: *id006
    cascade_restrict:
      mode: explicit
      values: *id007
    not_valid:
      mode: explicit
      values: *id008
    owner_target:
      mode: explicit
      values: *id009
    domain_name_shape:
      mode: explicit
      values: *id010
    constraint_name_shape:
      mode: explicit
      values: *id011
    new_name_shape:
      mode: explicit
      values: *id012
    new_constraint_name_shape:
      mode: explicit
      values: *id013
    schema_name_shape:
      mode: explicit
      values: *id014
    owner_name_shape:
      mode: explicit
      values: *id015
    privilege_level:
      mode: explicit
      values: *id016
    constraint_existence:
      mode: explicit
      values: *id017
    schema_existence:
      mode: explicit
      values: *id018
    role_existence:
      mode: explicit
      values: *id019
    set_role_capability:
      mode: explicit
      values: *id020
    container_column_usage:
      mode: explicit
      values: *id021
    nonexistent_domain:
      mode: explicit
      values: *id022
    nonexistent_constraint:
      mode: explicit
      values: *id023
    duplicate_constraint:
      mode: explicit
      values: *id024
    container_column_block:
      mode: explicit
      values: *id025
    non_owner_attempt:
      mode: explicit
      values: *id026
    cannot_set_role:
      mode: explicit
      values: *id027
    nonexistent_role:
      mode: explicit
      values: *id028
    nonexistent_schema:
      mode: explicit
      values: *id029
    null_value_block:
      mode: explicit
      values: *id030
    concurrent_data_hazard:
      mode: explicit
      values: *id031
    verification_mode:
      mode: explicit
      values: *id032
    cleanup_mode:
      mode: explicit
      values: *id033
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: alter_domain_declared_failure
    default_failure_reason: alter_domain_declared_failure
  sql_shape:
    template: ALTER DOMAIN {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for alter_domain
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
