schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_operator
  name: ALTER OPERATOR
  category: ddl
  domain: operator
  source_reference: references/statements/ddl/operator/alter_operator.md
  official_source: https://www.postgresql.org/docs/16/sql-alteroperator.html
  aliases:
  - alter operator
  - ALTER OPERATOR
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before derived extension combinations are emitted.
  - Extensions may add extra owner, schema, estimator, or dependency permutations after the baseline audit passes.
  - Extensions must not satisfy required factor, object, relation, table, or column-type coverage.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - operator
    - function
    - type
    - schema
    decision_reason: ALTER OPERATOR targets an existing operator identified by left/right operand types. SET estimator
      branches also bind optional routine dependencies, and SET SCHEMA binds schema migration state.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: ALTER OPERATOR names an operator signature rather than a relation, so pg_class relation-kind coverage
      is outside this statement baseline.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER OPERATOR changes operator metadata and optional estimator routines; it does not operate on table
      variants.
  column_type_coverage:
    required: false
    coverage_mode: representative
    inventory_source: references/common/pg16_type_catalog.md
    decision_reason: Exhaustive table-column type coverage is not applicable because ALTER OPERATOR uses operand data types
      only to identify the target operator. Representative operand_data_type values and the type_binding_manifest cover
      the required type-signature surface.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: [branch_owner, branch_set_schema, branch_set_estimator]
      coverage_requirement: all_declared_values
    target_object_state:
      tier: T1
      coverage_role: object_state_axis
      required_values: [exists, missing]
      coverage_requirement: all_declared_values
    operand_type_shape:
      tier: T1
      coverage_role: signature_axis
      required_values: [binary_operator, prefix_operator]
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: status_axis
      required_values: [success, failure]
      coverage_requirement: all_declared_values
    alter_action_type:
      tier: T2
      coverage_role: branch_binding_axis
      required_values: [owner_change, set_schema, set_estimator]
      coverage_requirement: all_declared_values
    new_owner_shape:
      tier: T2
      coverage_role: owner_axis
      required_values: [plain_role, current_role, current_user, session_user, missing_role]
      coverage_requirement: all_declared_values
    restrict_estimator:
      tier: T2
      coverage_role: estimator_binding_axis
      required_values: [none_value, res_proc_name, missing_proc]
      coverage_requirement: all_declared_values
    join_estimator:
      tier: T2
      coverage_role: estimator_binding_axis
      required_values: [none_value, join_proc_name, missing_proc]
      coverage_requirement: all_declared_values
    privilege_context:
      tier: T2
      coverage_role: privilege_axis
      required_values: [superuser, owner, non_owner, insufficient_privilege]
      coverage_requirement: all_declared_values
    name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [plain_identifier, schema_qualified, quoted_identifier]
      coverage_requirement: all_declared_values
    operand_data_type:
      tier: T3
      coverage_role: type_binding_axis
      required_values: [integer, text, boolean, custom_type]
      coverage_requirement: representative_declared_values
    dependency_state:
      tier: T4
      coverage_role: dependency_axis
      required_values: [ready, missing_dependency]
      coverage_requirement: all_declared_values
    schema_migration_state:
      tier: T4
      coverage_role: schema_axis
      required_values: [target_schema_exists, target_schema_missing, target_schema_conflict]
      coverage_requirement: all_declared_values
    invalid_combination:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [none, syntax_valid_semantic_error, object_type_mismatch]
      coverage_requirement: all_declared_values
    ownership_boundary:
      tier: T5
      coverage_role: ownership_axis
      required_values: [superuser, owner, non_owner]
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values: [catalog_query, effect_query, error_assertion]
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values: [drop_objects, reset_state]
      coverage_requirement: all_declared_values
dynamic_inputs:
  operator_signature_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/operator_signature_manifest.json
    required_fields: [operator_name, schema_name, operand_type_shape, left_type, right_type, target_object_state]
  routine_binding_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/routine_binding_manifest.json
    required_fields: [routine_name, routine_kind, estimator_role, existence_state, argument_types, return_type]
  type_binding_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/type_binding_manifest.json
    required_fields: [type_name, type_kind, operand_role, operand_data_type, declaration_sql]
  schema_binding_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/schema_binding_manifest.json
    required_fields: [source_schema, target_schema, schema_migration_state, owner_role]
combination_groups:
- id: alter_operator_required_factor_value_matrix
  title: ALTER OPERATOR required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - operator_does_not_exist
  - missing_estimator_function
  - missing_owner_role
  - missing_target_schema
  - target_schema_operator_conflict
  - invalid_operator_alter_combination
  - insufficient_operator_privilege
  factors:
    statement_branch: branch_owner
    target_object_state: exists
    operand_type_shape: binary_operator
    expected_status: success
    alter_action_type: owner_change
    new_owner_shape: plain_role
    restrict_estimator: none_value
    join_estimator: none_value
    privilege_context: owner
    name_shape: plain_identifier
    operand_data_type: integer
    dependency_state: ready
    schema_migration_state: target_schema_exists
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: catalog_query
    cleanup_mode: reset_state
  expansion:
    statement_branch:
      mode: explicit
      values: [branch_owner, branch_set_schema, branch_set_estimator]
    target_object_state:
      mode: explicit
      values: [exists, missing]
    operand_type_shape:
      mode: explicit
      values: [binary_operator, prefix_operator]
    expected_status:
      mode: explicit
      values: [success, failure]
    alter_action_type:
      mode: explicit
      values: [owner_change, set_schema, set_estimator]
    new_owner_shape:
      mode: explicit
      values: [plain_role, current_role, current_user, session_user, missing_role]
    restrict_estimator:
      mode: explicit
      values: [none_value, res_proc_name, missing_proc]
    join_estimator:
      mode: explicit
      values: [none_value, join_proc_name, missing_proc]
    privilege_context:
      mode: explicit
      values: [superuser, owner, non_owner, insufficient_privilege]
    name_shape:
      mode: explicit
      values: [plain_identifier, schema_qualified, quoted_identifier]
    operand_data_type:
      mode: explicit
      values: [integer, text, boolean, custom_type]
    dependency_state:
      mode: explicit
      values: [ready, missing_dependency]
    schema_migration_state:
      mode: explicit
      values: [target_schema_exists, target_schema_missing, target_schema_conflict]
    invalid_combination:
      mode: explicit
      values: [none, syntax_valid_semantic_error, object_type_mismatch]
    ownership_boundary:
      mode: explicit
      values: [superuser, owner, non_owner]
    verification_mode:
      mode: explicit
      values: [catalog_query, effect_query, error_assertion]
    cleanup_mode:
      mode: explicit
      values: [drop_objects, reset_state]
  compatibility:
    resolver: declared_matrix
    success_when:
    - target_object_state == exists and dependency_state == ready and privilege_context in [superuser, owner]
    - statement_branch == branch_set_schema and schema_migration_state == target_schema_exists
    failure_when:
    - condition: target_object_state == missing
      reason: operator_does_not_exist
    - condition: restrict_estimator == missing_proc or join_estimator == missing_proc or dependency_state == missing_dependency
      reason: missing_estimator_function
    - condition: new_owner_shape == missing_role
      reason: missing_owner_role
    - condition: schema_migration_state == target_schema_missing
      reason: missing_target_schema
    - condition: schema_migration_state == target_schema_conflict
      reason: target_schema_operator_conflict
    - condition: invalid_combination != none
      reason: invalid_operator_alter_combination
    - condition: privilege_context in [non_owner, insufficient_privilege] or ownership_boundary == non_owner
      reason: insufficient_operator_privilege
    default_failure_reason: alter_operator_binding_invalid
  sql_shape:
    template: ALTER OPERATOR {operator_name} ({left_type}, {right_type}) {alter_clause};
  verification:
    required: true
    mode: catalog_or_effect_or_error_assertion
    sql: SELECT oid, oprnamespace, oprowner FROM pg_operator WHERE oprname = '{operator_name}' AND oprleft = '{left_type}'::regtype AND oprright = '{right_type}'::regtype;
  cleanup:
    required: true
    steps:
    - sql: DROP OPERATOR IF EXISTS {operator_name} ({left_type}, {right_type}) CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
