schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_operator
  name: CREATE OPERATOR
  category: ddl
  domain: operator
  source_reference: references/statements/ddl/operator/create_operator.md
  official_source: https://www.postgresql.org/docs/16/sql-createoperator.html
  aliases:
  - create operator
  - CREATE OPERATOR
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before derived extension combinations are emitted.
  - Extensions may add stress, boundary, or cross-factor combinations after the baseline audit passes.
  - Extensions must not satisfy required factor, object, relation, table, or column-type coverage.
  - Extensions must use declared statement factors and preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - operator
    - function
    - type
    decision_reason: CREATE OPERATOR defines an operator object whose identity depends on operator name plus left/right operand
      types, and whose implementation depends on routine bindings for the operator function and optional estimator functions.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: CREATE OPERATOR does not target pg_class relations. Relation use of the operator belongs to later query
      or index statements, not to operator definition coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE OPERATOR defines a schema-level operator and routine/type dependencies; it does not create,
      alter, scan, or validate table variants.
  column_type_coverage:
    required: false
    coverage_mode: representative
    inventory_source: references/common/pg16_type_catalog.md
    decision_reason: Exhaustive table-column type coverage is not applicable because CREATE OPERATOR validates operand
      type bindings in the operator signature, not table column storage. Representative operand_data_type values and the
      type_binding_manifest cover the relevant PG type dependency surface.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: [branch_1]
      coverage_requirement: all_declared_values
    target_object_state:
      tier: T1
      coverage_role: main_axis
      required_values: [absent, exists, exists_conflict]
      coverage_requirement: all_declared_values
    operand_type_shape:
      tier: T1
      coverage_role: signature_axis
      required_values: [binary_operator, prefix_operator]
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: status_axis
      required_values: [success, failure]
      coverage_requirement: all_declared_values
    function_clause:
      tier: T2
      coverage_role: routine_binding_axis
      required_values: [function_keyword, procedure_keyword]
      coverage_requirement: all_declared_values
    leftarg_clause:
      tier: T2
      coverage_role: signature_axis
      required_values: [present, absent_prefix_operator]
      coverage_requirement: all_declared_values
    rightarg_clause:
      tier: T2
      coverage_role: signature_axis
      required_values: [present]
      coverage_requirement: all_declared_values
    commutator_clause:
      tier: T2
      coverage_role: optional_operator_binding_axis
      required_values: [absent, present]
      coverage_requirement: all_declared_values
    negator_clause:
      tier: T2
      coverage_role: optional_operator_binding_axis
      required_values: [absent, present]
      coverage_requirement: all_declared_values
    restrict_clause:
      tier: T2
      coverage_role: estimator_binding_axis
      required_values: [absent, present]
      coverage_requirement: all_declared_values
    join_clause:
      tier: T2
      coverage_role: estimator_binding_axis
      required_values: [absent, present]
      coverage_requirement: all_declared_values
    hashes_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: [absent, present]
      coverage_requirement: all_declared_values
    merges_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: [absent, present]
      coverage_requirement: all_declared_values
    privilege_context:
      tier: T2
      coverage_role: privilege_axis
      required_values: [superuser, schema_create_privilege, insufficient_privilege]
      coverage_requirement: all_declared_values
    name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [plain_identifier, schema_qualified, quoted_identifier]
      coverage_requirement: all_declared_values
    function_name_shape:
      tier: T3
      coverage_role: routine_name_axis
      required_values: [plain_function, schema_qualified_function, missing_function]
      coverage_requirement: all_declared_values
    operand_data_type:
      tier: T3
      coverage_role: type_binding_axis
      required_values: [integer, text, boolean, numeric, custom_type]
      coverage_requirement: representative_declared_values
    dependency_state:
      tier: T4
      coverage_role: routine_dependency_axis
      required_values: [ready, missing_function, wrong_signature]
      coverage_requirement: all_declared_values
    operator_type_compatibility:
      tier: T4
      coverage_role: type_compatibility_axis
      required_values: [compatible, incompatible]
      coverage_requirement: all_declared_values
    invalid_combination:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [none, syntax_valid_semantic_error, object_type_mismatch]
      coverage_requirement: all_declared_values
    ownership_boundary:
      tier: T5
      coverage_role: ownership_axis
      required_values: [superuser, schema_owner, non_privileged]
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values: [catalog_query, effect_query, error_assertion]
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values: [drop_objects, reset_state]
      coverage_requirement: all_declared_values
dynamic_inputs:
  operator_signature_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/operator_signature_manifest.json
    required_fields: [operator_name, schema_name, operand_type_shape, left_type, right_type, operand_data_type]
  routine_binding_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/routine_binding_manifest.json
    required_fields: [routine_name, routine_kind, argument_types, return_type, dependency_state, function_clause]
  type_binding_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/type_binding_manifest.json
    required_fields: [type_name, type_kind, declaration_sql, operand_role, compatibility_state]
combination_groups:
- id: create_operator_required_factor_value_matrix
  title: CREATE OPERATOR required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - duplicate_operator_signature
  - missing_operator_function
  - wrong_operator_function_signature
  - incompatible_operand_types
  - invalid_operator_definition
  - insufficient_operator_privilege
  factors:
    statement_branch: branch_1
    target_object_state: absent
    operand_type_shape: binary_operator
    expected_status: success
    function_clause: function_keyword
    leftarg_clause: present
    rightarg_clause: present
    commutator_clause: absent
    negator_clause: absent
    restrict_clause: absent
    join_clause: absent
    hashes_clause: absent
    merges_clause: absent
    privilege_context: schema_create_privilege
    name_shape: plain_identifier
    function_name_shape: plain_function
    operand_data_type: integer
    dependency_state: ready
    operator_type_compatibility: compatible
    invalid_combination: none
    ownership_boundary: schema_owner
    verification_mode: catalog_query
    cleanup_mode: drop_objects
  expansion:
    statement_branch:
      mode: explicit
      values: [branch_1]
    target_object_state:
      mode: explicit
      values: [absent, exists, exists_conflict]
    operand_type_shape:
      mode: explicit
      values: [binary_operator, prefix_operator]
    expected_status:
      mode: explicit
      values: [success, failure]
    function_clause:
      mode: explicit
      values: [function_keyword, procedure_keyword]
    leftarg_clause:
      mode: explicit
      values: [present, absent_prefix_operator]
    rightarg_clause:
      mode: explicit
      values: [present]
    commutator_clause:
      mode: explicit
      values: [absent, present]
    negator_clause:
      mode: explicit
      values: [absent, present]
    restrict_clause:
      mode: explicit
      values: [absent, present]
    join_clause:
      mode: explicit
      values: [absent, present]
    hashes_clause:
      mode: explicit
      values: [absent, present]
    merges_clause:
      mode: explicit
      values: [absent, present]
    privilege_context:
      mode: explicit
      values: [superuser, schema_create_privilege, insufficient_privilege]
    name_shape:
      mode: explicit
      values: [plain_identifier, schema_qualified, quoted_identifier]
    function_name_shape:
      mode: explicit
      values: [plain_function, schema_qualified_function, missing_function]
    operand_data_type:
      mode: explicit
      values: [integer, text, boolean, numeric, custom_type]
    dependency_state:
      mode: explicit
      values: [ready, missing_function, wrong_signature]
    operator_type_compatibility:
      mode: explicit
      values: [compatible, incompatible]
    invalid_combination:
      mode: explicit
      values: [none, syntax_valid_semantic_error, object_type_mismatch]
    ownership_boundary:
      mode: explicit
      values: [superuser, schema_owner, non_privileged]
    verification_mode:
      mode: explicit
      values: [catalog_query, effect_query, error_assertion]
    cleanup_mode:
      mode: explicit
      values: [drop_objects, reset_state]
  compatibility:
    resolver: declared_matrix
    success_when:
    - target_object_state == absent and dependency_state == ready and operator_type_compatibility == compatible and
      privilege_context in [superuser, schema_create_privilege]
    failure_when:
    - condition: target_object_state in [exists, exists_conflict]
      reason: duplicate_operator_signature
    - condition: dependency_state == missing_function
      reason: missing_operator_function
    - condition: dependency_state == wrong_signature
      reason: wrong_operator_function_signature
    - condition: operator_type_compatibility == incompatible
      reason: incompatible_operand_types
    - condition: invalid_combination != none
      reason: invalid_operator_definition
    - condition: privilege_context == insufficient_privilege or ownership_boundary == non_privileged
      reason: insufficient_operator_privilege
    default_failure_reason: create_operator_binding_invalid
  sql_shape:
    template: CREATE OPERATOR {operator_name} ({operator_definition});
  verification:
    required: true
    mode: catalog_or_effect_or_error_assertion
    sql: SELECT oid FROM pg_operator WHERE oprname = '{operator_name}' AND oprleft = '{left_type}'::regtype AND oprright = '{right_type}'::regtype;
  cleanup:
    required: true
    steps:
    - sql: DROP OPERATOR IF EXISTS {operator_name} ({left_type}, {right_type}) CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
