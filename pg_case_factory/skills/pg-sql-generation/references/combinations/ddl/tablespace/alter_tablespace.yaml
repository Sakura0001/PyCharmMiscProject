schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_tablespace
  name: ALTER TABLESPACE
  category: ddl
  domain: tablespace
  source_reference: references/statements/ddl/tablespace/alter_tablespace.md
  official_source: https://www.postgresql.org/docs/16/sql-altertablespace.html
  aliases:
  - alter_tablespace
  - ALTER TABLESPACE
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, or no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - tablespace
    decision_reason: ALTER_TABLESPACE targets tablespace storage objects. Required coverage is the tablespace object state,
      ownership, filesystem/environment, occupancy, and option behavior declared by the statement reference.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: ALTER_TABLESPACE names a tablespace, not an individual relation. Occupied-object or temp-file behavior
      is represented by tablespace occupancy/dependency factors rather than exhaustive relation-kind coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER_TABLESPACE operates on the tablespace object and environment constraints. Tables may occupy a tablespace
      in boundary fixtures, but the statement does not directly depend on table kind or table definition semantics.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER_TABLESPACE has no required SQL-validity or verification dependency on column data types. Tablespace
      behavior is governed by ownership, filesystem or occupancy state, options, and transaction/environment boundaries.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_rename
      - branch_owner
      - branch_set
      - branch_reset
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    alter_action:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - rename
      - owner
      - set
      - reset
      coverage_requirement: all_values
    owner_target:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - specified_new_owner
      - specified_current_role
      - specified_current_user
      - specified_session_user
      coverage_requirement: all_values
    tablespace_option:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - seq_page_cost
      - random_page_cost
      - effective_io_concurrency
      - maintenance_io_concurrency
      - multiple_options
      coverage_requirement: all_values
    tablespace_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - reserved_word_as_name
      - nonexistent_name
      - invalid_name
      coverage_requirement: all_values
    new_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - pg_prefix_reserved
      - duplicate_name
      - invalid_name
      coverage_requirement: all_values
    owner_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_role
      coverage_requirement: all_values
    option_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - valid_option
      - invalid_option_name
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - superuser
      - owner
      - non_owner
      coverage_requirement: all_values
    role_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - role_exists
      - role_not_exists
      coverage_requirement: all_values
    set_role_capability:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - can_set_role
      - cannot_set_role
      coverage_requirement: all_values
    nonexistent_tablespace:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - tablespace_exists
      - tablespace_missing
      coverage_requirement: all_values
    pg_reserved_new_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - normal_name
      - pg_prefix_name
      coverage_requirement: all_values
    duplicate_new_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_values
    non_owner_attempt:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - owner_execution
      - non_owner_execution
      - superuser_execution
      coverage_requirement: all_values
    cannot_set_role:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - can_set_role
      - cannot_set_role_to_target
      coverage_requirement: all_values
    nonexistent_owner_role:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - role_exists
      - role_missing
      coverage_requirement: all_values
    invalid_option_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - valid_option
      - unrecognized_option
      coverage_requirement: all_values
    invalid_option_value:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - valid_value
      - invalid_value
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - catalog_query_pg_tablespace
      - effect_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - revert_rename
      - revert_owner
      - reset_option
      - drop_tablespace
      - role_cleanup
      coverage_requirement: all_values
dynamic_inputs:
  tablespace_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/tablespace_manifest.json
    required_fields:
    - tablespace_name
    - object_state
    - owner
    - exists_before_statement
  role_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - role_name
    - privilege_context
    - can_set_role
  tablespace_environment_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/tablespace_environment_manifest.json
    required_fields:
    - filesystem_state
    - transaction_context
    - occupancy_state
    - temp_tablespaces_state
