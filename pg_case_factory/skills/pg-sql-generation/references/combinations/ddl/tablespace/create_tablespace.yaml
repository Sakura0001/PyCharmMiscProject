      mode: explicit
      values:
      - drop_tablespace
      - filesystem_cleanup
      - role_cleanup
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and object_state not in [not_exists, absent, already_exists, reserved_name_conflict]
    - statement-specific dependencies, privileges, names, and environment factors are compatible with the selected branch
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: object_state in [not_exists, absent] without IF EXISTS-style tolerance
      reason: target_object_missing
    - condition: privilege or role ability factor selects an insufficient-permission value
      reason: privilege_denied
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: CREATE TABLESPACE {tablespace_name} {owner_clause} LOCATION '{directory}' {with_clause};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT spcname FROM pg_tablespace WHERE spcname = '{tablespace_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TABLESPACE IF EXISTS {tablespace_name};
