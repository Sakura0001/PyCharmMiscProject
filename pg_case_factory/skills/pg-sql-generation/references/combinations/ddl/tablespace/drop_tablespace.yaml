    - all branch-local prerequisites select compatible values
    failure_when:
    - condition: statement_branch == branch_drop_tablespace_if_exists and expected_status == failure
      reason: statement_specific_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP TABLESPACE {if_exists_clause} {tablespace_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT spcname FROM pg_tablespace WHERE spcname = '{tablespace_name}';
  cleanup:
