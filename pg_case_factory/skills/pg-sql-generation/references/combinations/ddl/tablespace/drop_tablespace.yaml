schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_tablespace
  name: DROP TABLESPACE
  category: ddl
  domain: tablespace
  source_reference: references/statements/ddl/tablespace/drop_tablespace.md
  official_source: https://www.postgresql.org/docs/16/sql-droptablespace.html
  aliases:
  - drop_tablespace
  - DROP TABLESPACE
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, or no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - tablespace
    decision_reason: DROP_TABLESPACE targets tablespace storage objects. Required coverage is the tablespace object state,
      ownership, filesystem/environment, occupancy, and option behavior declared by the statement reference.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: DROP_TABLESPACE names a tablespace, not an individual relation. Occupied-object or temp-file behavior
      is represented by tablespace occupancy/dependency factors rather than exhaustive relation-kind coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_TABLESPACE operates on the tablespace object and environment constraints. Tables may occupy a tablespace
      in boundary fixtures, but the statement does not directly depend on table kind or table definition semantics.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_TABLESPACE has no required SQL-validity or verification dependency on column data types. Tablespace
      behavior is governed by ownership, filesystem or occupancy state, options, and transaction/environment boundaries.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_tablespace
      - branch_drop_tablespace_if_exists
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - absent
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - present
      - absent
      coverage_requirement: all_values
    authorization_path:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - superuser
      - owner
      - non_owner_non_superuser
      coverage_requirement: all_values
    object_occupancy:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - empty
      - has_objects_in_current_db
      - has_objects_in_other_db
      - has_temp_files
      coverage_requirement: all_values
    tablespace_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - reserved_word_id
      - non_existent_name
      - existing_name
      coverage_requirement: all_values
    privilege_context:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - superuser_session
      - owner_session
      - non_owner_session
      coverage_requirement: all_values
    dependency_context:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_dependencies
      - objects_in_current_db
      - objects_in_other_db
      - temp_tablespace_active
      coverage_requirement: all_values
    environment_context:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - outside_transaction_block
      - inside_transaction_block
      - active_temp_tablespaces
      coverage_requirement: all_values
    error_type:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - none
      - non_existent_without_if_exists
      - occupied_tablespace
      - insufficient_privilege
      - inside_transaction_block
      - temp_tablespace_in_use
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - catalog_query
      - error_assertion
      - notice_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - remove_objects_first
      - drop_tablespace
      - reset_temp_tablespaces
      coverage_requirement: all_values
dynamic_inputs:
  tablespace_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/tablespace_manifest.json
    required_fields:
    - tablespace_name
    - object_state
    - owner
    - exists_before_statement
  role_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - role_name
    - privilege_context
    - can_set_role
  tablespace_environment_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/tablespace_environment_manifest.json
    required_fields:
    - filesystem_state
    - transaction_context
    - occupancy_state
    - temp_tablespaces_state
combination_groups:
- id: drop_tablespace_required_factor_value_matrix
  title: DROP TABLESPACE required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - non_existent_without_if_exists
  - occupied_tablespace
  - insufficient_privilege
  - inside_transaction_block
  - temp_tablespace_in_use
  factors:
    statement_branch: branch_drop_tablespace
    object_state: exists
    expected_status: success
    if_exists_clause: present
    authorization_path: superuser
    object_occupancy: empty
    tablespace_name_shape: simple_id
    privilege_context: superuser_session
    dependency_context: no_dependencies
    environment_context: outside_transaction_block
    error_type: none
    verification_mode: catalog_query
    cleanup_mode: remove_objects_first
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_tablespace
      - branch_drop_tablespace_if_exists
    object_state:
      mode: explicit
      values:
      - exists
      - absent
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - present
      - absent
    authorization_path:
      mode: explicit
      values:
      - superuser
      - owner
      - non_owner_non_superuser
    object_occupancy:
      mode: explicit
      values:
      - empty
      - has_objects_in_current_db
      - has_objects_in_other_db
      - has_temp_files
    tablespace_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - reserved_word_id
      - non_existent_name
      - existing_name
    privilege_context:
      mode: explicit
      values:
      - superuser_session
      - owner_session
      - non_owner_session
    dependency_context:
      mode: explicit
      values:
      - no_dependencies
      - objects_in_current_db
      - objects_in_other_db
      - temp_tablespace_active
    environment_context:
      mode: explicit
      values:
      - outside_transaction_block
      - inside_transaction_block
      - active_temp_tablespaces
    error_type:
      mode: explicit
      values:
      - none
      - non_existent_without_if_exists
      - occupied_tablespace
      - insufficient_privilege
      - inside_transaction_block
      - temp_tablespace_in_use
    verification_mode:
      mode: explicit
      values:
      - catalog_query
      - error_assertion
      - notice_assertion
    cleanup_mode:
      mode: explicit
      values:
      - remove_objects_first
      - drop_tablespace
      - reset_temp_tablespaces
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and object_state not in [not_exists, absent, already_exists, reserved_name_conflict]
    - statement-specific dependencies, privileges, names, and environment factors are compatible with the selected branch
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: object_state in [not_exists, absent] without IF EXISTS-style tolerance
      reason: target_object_missing
    - condition: privilege or role ability factor selects an insufficient-permission value
      reason: privilege_denied
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP TABLESPACE {if_exists_clause} {tablespace_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT spcname FROM pg_tablespace WHERE spcname = '{tablespace_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TABLESPACE IF EXISTS {tablespace_name};
- id: drop_tablespace_branch_01_branch_drop_tablespace
  title: 'DROP TABLESPACE branch baseline: branch_drop_tablespace'
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - non_existent_without_if_exists
  - occupied_tablespace
  - insufficient_privilege
  - inside_transaction_block
  - temp_tablespace_in_use
  factors:
    statement_branch: branch_drop_tablespace
    object_state: exists
    expected_status: success
    if_exists_clause: present
    authorization_path: superuser
    object_occupancy: empty
