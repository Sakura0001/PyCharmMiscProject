      values:
      - branch_drop_tablespace
    object_state:
      mode: explicit
      values:
      - exists
      - absent
    expected_status:
      mode: explicit
      values:
      - success
      - failure
  compatibility:
    resolver: declared_matrix
    success_when:
    - statement_branch == branch_drop_tablespace and expected_status == success
    - all branch-local prerequisites select compatible values
    failure_when:
    - condition: statement_branch == branch_drop_tablespace and expected_status == failure
      reason: statement_specific_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP TABLESPACE {if_exists_clause} {tablespace_name};
  verification:
