schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_group
  name: DROP GROUP
  category: ddl
  domain: group
  source_reference: references/statements/ddl/group/drop_group.md
  aliases:
  - DROP GROUP
  - drop group
  - drop_group
  - DROP ROLE (canonical)
  - drop_role (canonical)
  official_source: https://www.postgresql.org/docs/16/sql-dropgroup.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before any extension is emitted.
  - Extensions may add stress, boundary, dependency, privilege, or cross-factor combinations.
  - Extensions must not satisfy required role/user/group factor coverage.
  - Extensions must use declared statement factors and declared factor values.
  - Extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - group
    - role
    decision_reason: DROP GROUP removes group catalog objects; group DDL is a deprecated role alias and operates on role catalog
      entries or role membership, so the baseline explicitly covers the group and backing role object kinds rather than relation
      or table objects.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP GROUP targets PostgreSQL role catalog entries and role membership/settings, not pg_class relations.
      Relation dependencies, when relevant to failure behavior, are modeled as dependency factors rather than required relation-kind
      coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP GROUP does not directly create, alter, read, or drop table definitions. Any owned-object or membership
      dependency is a role lifecycle precondition and does not require expansion across table kinds.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP GROUP does not declare table columns or validate expressions whose SQL validity depends on column
      data types; role/user/group DDL is independent of PG16 column-type coverage.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_group
      - branch_drop_group_if_exists
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - absent
      - present
      coverage_requirement: all_declared_values
    multi_group:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - single_group
      - multiple_groups
      coverage_requirement: all_declared_values
    role_session_state:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - no_active_session
      - active_session
      coverage_requirement: all_declared_values
    role_dependency:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - no_dependencies
      - has_dependencies
      coverage_requirement: all_declared_values
    group_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - superuser
      - createrole_privilege
      - non_privilege
      coverage_requirement: all_declared_values
    role_dependency_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_references
      - has_references
      coverage_requirement: all_declared_values
    session_dependency_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_active_session
      - has_active_session
      coverage_requirement: all_declared_values
    nonexistent_group:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - group_exists
      - group_missing_no_if_exists
      coverage_requirement: all_declared_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - sufficient_privilege
      - lacks_privilege
      coverage_requirement: all_declared_values
    role_still_referenced:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_references
      - has_references
      coverage_requirement: all_declared_values
    session_role_in_use:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_active_session
      - active_session
      coverage_requirement: all_declared_values
    if_exists_notice:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_notice
      - notice_no_op
      coverage_requirement: all_declared_values
    deprecated_alias_behavior:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - deprecated_alias
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - pg_authid_catalog_query
      - error_assertion
      - notice_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - recreate_role
      - cleanup_referenced_objects
      - terminate_session
      coverage_requirement: all_declared_values
dynamic_inputs:
  group_role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/group_role_manifest.json
    required_fields:
    - target_role_name
    - object_state
    - executor_role
    - setup_sql
    - cleanup_sql
  privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/privilege_manifest.json
    required_fields:
    - executor_role
    - createrole_available
    - superuser_available
    - expected_privilege_path
  membership_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/membership_manifest.json
    required_fields:
    - member_role_name
    - group_role_name
    - membership_exists_before_statement
    - admin_option_available
  dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/role_dependency_manifest.json
    required_fields:
    - owned_objects_present
    - active_session_present
    - dependency_cleanup_sql
combination_groups:
- id: drop_group_core_syntax_and_state_baseline
  title: DROP GROUP core syntax, target state, and primary option coverage
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_drop_group
    object_state: not_exists
    expected_status: success
    if_exists_clause: absent
    multi_group: single_group
    role_session_state: no_active_session
    role_dependency: no_dependencies
    group_name_shape: simple_id
    privilege_level: superuser
    role_dependency_state: no_references
    session_dependency_state: no_active_session
    nonexistent_group: group_exists
    insufficient_privilege: sufficient_privilege
    role_still_referenced: no_references
    session_role_in_use: no_active_session
    if_exists_notice: no_notice
    deprecated_alias_behavior: deprecated_alias
    verification_mode: pg_authid_catalog_query
    cleanup_mode: recreate_role
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_group
      - branch_drop_group_if_exists
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    multi_group:
      mode: explicit
      values:
      - single_group
      - multiple_groups
    role_session_state:
      mode: explicit
      values:
      - no_active_session
      - active_session
    role_dependency:
      mode: explicit
      values:
      - no_dependencies
      - has_dependencies
  compatibility:
    resolver: declared_matrix
    success_when:
    - selected binding represents a documented success path for the role catalog object
    - executor privilege and referenced role prerequisites are satisfied
    failure_when:
    - condition: expected_status == failure
      reason: target_role_missing
    - condition: privilege or dependency factor selects an invalid prerequisite
      reason: declared_role_ddl_prerequisite_failure
    default_failure_reason: target_role_missing
  sql_shape:
    template: DROP GROUP [ IF EXISTS ] {group_name} [, ...]
  verification:
    required: true
    mode: pg_authid_catalog_query
    sql: SELECT rolname FROM pg_roles WHERE rolname = '{group_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP ROLE IF EXISTS {target_role_name};
