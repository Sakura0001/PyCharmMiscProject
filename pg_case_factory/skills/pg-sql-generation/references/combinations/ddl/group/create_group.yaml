schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_group
  name: CREATE GROUP
  category: ddl
  domain: group
  source_reference: references/statements/ddl/group/create_group.md
  aliases:
  - CREATE GROUP
  - create group
  - create_group
  - CREATE ROLE (canonical)
  - create_role (canonical)
  official_source: https://www.postgresql.org/docs/16/sql-creategroup.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before any extension is emitted.
  - Extensions may add stress, boundary, dependency, privilege, or cross-factor combinations.
  - Extensions must not satisfy required role/user/group factor coverage.
  - Extensions must use declared statement factors and declared factor values.
  - Extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - group
    - role
    decision_reason: CREATE GROUP defines group catalog objects; group DDL is a deprecated role alias and operates on role
      catalog entries or role membership, so the baseline explicitly covers the group and backing role object kinds rather
      than relation or table objects.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE GROUP targets PostgreSQL role catalog entries and role membership/settings, not pg_class relations.
      Relation dependencies, when relevant to failure behavior, are modeled as dependency factors rather than required relation-kind
      coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE GROUP does not directly create, alter, read, or drop table definitions. Any owned-object or membership
      dependency is a role lifecycle precondition and does not require expansion across table kinds.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE GROUP does not declare table columns or validate expressions whose SQL validity depends on column
      data types; role/user/group DDL is independent of PG16 column-type coverage.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_create_group_simple
      - branch_create_group_with_options
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - not_exists
      - already_exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_declared_values
    with_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - omitted
      - specified
      coverage_requirement: all_declared_values
    superuser_option:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - nosuperuser_default
      - superuser
      coverage_requirement: all_declared_values
    login_option:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - nologin_default
      - login
      coverage_requirement: all_declared_values
    createdb_option:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - nocreatedb_default
      - createdb
      coverage_requirement: all_declared_values
    createrole_option:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - nocreaterole_default
      - createrole
      coverage_requirement: all_declared_values
    password_option:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - omitted
      - password_value
      - password_null
      - encrypted_password
      coverage_requirement: all_declared_values
    membership_option:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - omitted
      - in_role
      - in_group
      - role_clause
      - user_clause
      - admin_clause
      coverage_requirement: all_declared_values
    deprecated_aliases:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - no_deprecated_syntax
      - in_group_alias
      - user_alias
      - sysid_ignored
      - encrypted_ignored
      coverage_requirement: all_declared_values
    group_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - reserved_word_name
      - duplicate_name
      coverage_requirement: all_declared_values
    referenced_role_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - nonexistent_role
      coverage_requirement: all_declared_values
    password_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - valid_password
      - null_password
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - createrole_privilege
      - non_createrole
      - superuser
      coverage_requirement: all_declared_values
    referenced_role_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - role_exists
      - role_not_exists
      coverage_requirement: all_declared_values
    duplicate_group_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_declared_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - has_createrole
      - lacks_createrole
      coverage_requirement: all_declared_values
    nonexistent_referenced_role:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - role_exists
      - role_missing
      coverage_requirement: all_declared_values
    sysid_ignored:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_sysid
      - sysid_ignored
      coverage_requirement: all_declared_values
    in_group_deprecated_alias:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - use_in_role
      - use_in_group
      coverage_requirement: all_declared_values
    user_deprecated_alias:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - use_role
      - use_user
      coverage_requirement: all_declared_values
    encrypted_keyword_ignored:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_encrypted
      - encrypted_ignored
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - pg_authid_catalog_query
      - pg_roles_view_query
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - drop_group
      - drop_role
      - referenced_role_cleanup
      coverage_requirement: all_declared_values
dynamic_inputs:
  group_role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/group_role_manifest.json
    required_fields:
    - target_role_name
    - object_state
    - executor_role
    - setup_sql
    - cleanup_sql
  privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/privilege_manifest.json
    required_fields:
    - executor_role
    - createrole_available
    - superuser_available
    - expected_privilege_path
  referenced_role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/referenced_role_manifest.json
    required_fields:
    - referenced_role_name
    - referenced_role_exists
    - membership_setup_sql
  membership_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/membership_manifest.json
    required_fields:
    - member_role_name
    - group_role_name
    - membership_exists_before_statement
    - admin_option_available
