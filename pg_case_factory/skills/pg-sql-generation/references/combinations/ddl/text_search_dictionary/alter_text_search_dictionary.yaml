schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_text_search_dictionary
  name: ALTER TEXT SEARCH DICTIONARY
  category: ddl
  domain: text_search_dictionary
  source_reference: references/statements/ddl/text_search_dictionary/alter_text_search_dictionary.md
  official_source: https://www.postgresql.org/docs/16/sql-altertsdictionary.html
  aliases:
  - alter_text_search_dictionary
  - ALTER TEXT SEARCH DICTIONARY
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, dependency, privilege, naming, or cross-factor combinations after the baseline
    audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, no-op, or notice attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - text_search_dictionary
    decision_reason: ALTER TEXT SEARCH DICTIONARY directly targets a text search dictionary catalog object. Required baseline
      coverage is scoped to option, owner, rename, SET ROLE, and schema-move behavior declared by the statement reference.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: ALTER TEXT SEARCH DICTIONARY names text search catalog objects, not pg_class relations. Tables, indexes,
      views, sequences, materialized views, and foreign tables are outside this statement target surface.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER TEXT SEARCH DICTIONARY does not directly create, alter, scan, validate, or drop table definitions.
      Any setup objects are text search catalog dependencies rather than table-kind coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: The statement changes text search dictionary metadata, template bindings, and dictionary options. It
      does not create, alter, scan, or validate table columns, so PG16 table column types are not an applicability axis.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_option
      - branch_rename
      - branch_owner
      - branch_set_schema
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - not_exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_declared_values
    alter_action:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id004
      - option_modify
      - rename
      - owner
      - set_schema
      coverage_requirement: all_declared_values
    option_action:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id005
      - set_new_value
      - remove_option_restore_default
      - dummy_refresh
      coverage_requirement: all_declared_values
    owner_target:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id006
      - specified_new_owner
      - specified_current_role
      - specified_current_user
      - specified_session_user
      coverage_requirement: all_declared_values
    dict_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id007
      - simple_id
      - schema_qualified_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_declared_values
    new_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id008
      - simple_id
      - quoted_id
      - duplicate_name
      coverage_requirement: all_declared_values
    owner_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id009
      - simple_id
      - quoted_id
      - nonexistent_role
      coverage_requirement: all_declared_values
    schema_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id010
      - simple_id
      - nonexistent_schema
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id011
      - owner
      - non_owner
      - superuser
      coverage_requirement: all_declared_values
    role_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id012
      - role_exists
      - role_not_exists
      coverage_requirement: all_declared_values
    set_role_capability:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id013
      - can_set_role
      - cannot_set_role
      coverage_requirement: all_declared_values
    schema_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id014
      - schema_exists
      - schema_not_exists
      coverage_requirement: all_declared_values
    nonexistent_dict:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id015
      - dict_exists
      - dict_missing
      coverage_requirement: all_declared_values
    duplicate_new_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id016
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_declared_values
    nonexistent_owner_role:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id017
      - role_exists
      - role_missing
      coverage_requirement: all_declared_values
    nonexistent_target_schema:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id018
      - schema_exists
      - schema_missing
      coverage_requirement: all_declared_values
    non_owner_attempt:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id019
      - owner_execution
      - non_owner_execution
      coverage_requirement: all_declared_values
    cannot_set_role:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id020
      - can_set_role
      - cannot_set_role_to_target
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id021
      - catalog_query_pg_ts_dict
      - option_query
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id022
      - revert_option
      - revert_rename
      - revert_owner
      - drop_text_search_dictionary
      - role_cleanup
      coverage_requirement: all_declared_values
dynamic_inputs:
  ts_dictionary_object_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/alter_text_search_dictionary_object_manifest.json
    required_fields:
    - object_name
    - schema_name
    - object_state
    - owner_role
  ts_dictionary_dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/alter_text_search_dictionary_dependency_manifest.json
    required_fields:
    - dependency_objects
    - dependency_state
    - statement_branch
  ts_dictionary_privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/alter_text_search_dictionary_privilege_manifest.json
    required_fields:
    - execution_role
    - privilege_context
    - is_superuser
combination_groups:
- id: alter_text_search_dictionary_required_factor_value_matrix
  title: ALTER TEXT SEARCH DICTIONARY required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - statement_specific_failure
  - declared_factor_failure
  - nonexistent_dict
  - duplicate_new_name
  - nonexistent_owner_role
  - nonexistent_target_schema
  - non_owner_attempt
  - cannot_set_role
  factors:
    statement_branch: branch_option
    object_state: exists
    expected_status: success
    alter_action: option_modify
    option_action: set_new_value
    owner_target: specified_new_owner
    dict_name_shape: simple_id
    new_name_shape: simple_id
    owner_name_shape: simple_id
    schema_name_shape: simple_id
    privilege_level: owner
    role_existence: role_exists
    set_role_capability: can_set_role
    schema_existence: schema_exists
    nonexistent_dict: dict_exists
    duplicate_new_name: no_conflict
    nonexistent_owner_role: role_exists
    nonexistent_target_schema: schema_exists
    non_owner_attempt: owner_execution
    cannot_set_role: can_set_role
    verification_mode: catalog_query_pg_ts_dict
    cleanup_mode: revert_option
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    alter_action:
      mode: explicit
      values: *id004
    option_action:
      mode: explicit
      values: *id005
    owner_target:
      mode: explicit
      values: *id006
    dict_name_shape:
      mode: explicit
      values: *id007
    new_name_shape:
      mode: explicit
      values: *id008
    owner_name_shape:
      mode: explicit
      values: *id009
    schema_name_shape:
      mode: explicit
      values: *id010
    privilege_level:
      mode: explicit
      values: *id011
    role_existence:
      mode: explicit
      values: *id012
    set_role_capability:
      mode: explicit
      values: *id013
    schema_existence:
      mode: explicit
      values: *id014
    nonexistent_dict:
      mode: explicit
      values: *id015
    duplicate_new_name:
      mode: explicit
      values: *id016
    nonexistent_owner_role:
      mode: explicit
      values: *id017
    nonexistent_target_schema:
      mode: explicit
      values: *id018
    non_owner_attempt:
      mode: explicit
      values: *id019
    cannot_set_role:
      mode: explicit
      values: *id020
    verification_mode:
      mode: explicit
      values: *id021
    cleanup_mode:
      mode: explicit
      values: *id022
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and selected text_search_dictionary object, dependency, privilege, and syntax factors describe
      a legal ALTER TEXT SEARCH DICTIONARY path
    - notice and no-op paths are represented by declared IF EXISTS or branch factors and do not replace required success/failure
      coverage
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: declared object state, dependency, privilege, name-shape, duplicate, missing-object, or schema boundary factor
        selects an invalid prerequisite
      reason: declared_factor_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: ALTER TEXT SEARCH DICTIONARY {dict_name} {alter_action_clause}
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT dictname FROM pg_ts_dict WHERE dictname = '{dict_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TEXT SEARCH DICTIONARY IF EXISTS {dict_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
