schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_text_search_dictionary
  name: DROP TEXT SEARCH DICTIONARY
  category: ddl
  domain: text_search_dictionary
  source_reference: references/statements/ddl/text_search_dictionary/drop_text_search_dictionary.md
  official_source: https://www.postgresql.org/docs/16/sql-droptsdictionary.html
  aliases:
  - drop_text_search_dictionary
  - DROP TEXT SEARCH DICTIONARY
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, dependency, privilege, naming, or cross-factor combinations after the baseline
    audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, no-op, or notice attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - text_search_dictionary
    - text_search_configuration
    decision_reason: DROP TEXT SEARCH DICTIONARY directly targets a text search dictionary catalog object. Required baseline
      coverage is scoped to dictionary usage by configurations, ownership, IF EXISTS, CASCADE, and RESTRICT behavior declared
      by the statement reference.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: DROP TEXT SEARCH DICTIONARY names text search catalog objects, not pg_class relations. Tables, indexes,
      views, sequences, materialized views, and foreign tables are outside this statement target surface.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP TEXT SEARCH DICTIONARY does not directly create, alter, scan, validate, or drop table definitions.
      Any setup objects are text search catalog dependencies rather than table-kind coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: The statement changes text search dictionary metadata, template bindings, and dictionary options. It
      does not create, alter, scan, or validate table columns, so PG16 table column types are not an applicability axis.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_drop_ts_dict
      - branch_drop_ts_dict_if_exists
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - absent
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id004
      - present
      - absent
      coverage_requirement: all_declared_values
    cascade_restrict:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id005
      - default_restrict
      - explicit_restrict
      - explicit_cascade
      coverage_requirement: all_declared_values
    authorization_path:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id006
      - owner
      - non_owner
      - superuser
      coverage_requirement: all_declared_values
    dependency_status:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id007
      - no_dependencies
      - has_config_dependencies
      coverage_requirement: all_declared_values
    dict_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id008
      - simple_id
      - schema_qualified_id
      - quoted_id
      - reserved_word_id
      - non_existent_name
      coverage_requirement: all_declared_values
    privilege_context:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id009
      - owner_session
      - non_owner_session
      - superuser_session
      coverage_requirement: all_declared_values
    dependency_context:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id010
      - no_dependencies
      - config_using_dict
      coverage_requirement: all_declared_values
    error_type:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id011
      - none
      - non_existent_without_if_exists
      - dependent_object_exists
      - insufficient_privilege
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id012
      - catalog_query
      - error_assertion
      - notice_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id013
      - cascade_cleanup
      - manual_dependency_cleanup
      coverage_requirement: all_declared_values
dynamic_inputs:
  ts_dictionary_object_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/drop_text_search_dictionary_object_manifest.json
    required_fields:
    - object_name
    - schema_name
    - object_state
    - owner_role
  ts_dictionary_dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/drop_text_search_dictionary_dependency_manifest.json
    required_fields:
    - dependency_objects
    - dependency_state
    - statement_branch
  ts_dictionary_privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/drop_text_search_dictionary_privilege_manifest.json
    required_fields:
    - execution_role
    - privilege_context
    - is_superuser
  ts_dictionary_drop_dependency_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/drop_text_search_dictionary_drop_dependency_manifest.json
    required_fields:
    - cascade_restrict
    - dependent_objects
    - if_exists_clause
combination_groups:
- id: drop_text_search_dictionary_required_factor_value_matrix
  title: DROP TEXT SEARCH DICTIONARY required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - statement_specific_failure
  - declared_factor_failure
  - error_type
  factors:
    statement_branch: branch_drop_ts_dict
    object_state: exists
    expected_status: success
    if_exists_clause: present
    cascade_restrict: default_restrict
    authorization_path: owner
    dependency_status: no_dependencies
    dict_name_shape: simple_id
    privilege_context: owner_session
    dependency_context: no_dependencies
    error_type: none
    verification_mode: catalog_query
    cleanup_mode: cascade_cleanup
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    if_exists_clause:
      mode: explicit
      values: *id004
    cascade_restrict:
      mode: explicit
      values: *id005
    authorization_path:
      mode: explicit
      values: *id006
    dependency_status:
      mode: explicit
      values: *id007
    dict_name_shape:
      mode: explicit
      values: *id008
    privilege_context:
      mode: explicit
      values: *id009
    dependency_context:
      mode: explicit
      values: *id010
    error_type:
      mode: explicit
      values: *id011
    verification_mode:
      mode: explicit
      values: *id012
    cleanup_mode:
      mode: explicit
      values: *id013
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and selected text_search_dictionary object, dependency, privilege, and syntax factors describe
      a legal DROP TEXT SEARCH DICTIONARY path
    - notice and no-op paths are represented by declared IF EXISTS or branch factors and do not replace required success/failure
      coverage
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: declared object state, dependency, privilege, name-shape, duplicate, missing-object, or schema boundary factor
        selects an invalid prerequisite
      reason: declared_factor_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP TEXT SEARCH DICTIONARY [ IF EXISTS ] {dict_name} [ CASCADE | RESTRICT ]
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT dictname FROM pg_ts_dict WHERE dictname = '{dict_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TEXT SEARCH DICTIONARY IF EXISTS {dict_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
