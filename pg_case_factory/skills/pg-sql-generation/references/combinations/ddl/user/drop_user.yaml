schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_user
  name: DROP USER
  category: ddl
  domain: user
  source_reference: references/statements/ddl/user/drop_user.md
  aliases:
  - drop_user
  - DROP USER
  - drop_role
  - DROP ROLE
  official_source: https://www.postgresql.org/docs/16/sql-dropuser.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before any extension is emitted.
  - Extensions may add stress, boundary, dependency, privilege, or cross-factor combinations.
  - Extensions must not satisfy required role/user/group factor coverage.
  - Extensions must use declared statement factors and declared factor values.
  - Extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - user
    - role
    decision_reason: DROP USER removes user catalog objects; user DDL is a PostgreSQL role alias with LOGIN-oriented defaults
      and operates on role catalog entries, so the baseline explicitly covers the user and backing role object kinds rather
      than relation or table objects.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP USER targets PostgreSQL role catalog entries and role membership/settings, not pg_class relations.
      Relation dependencies, when relevant to failure behavior, are modeled as dependency factors rather than required relation-kind
      coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP USER does not directly create, alter, read, or drop table definitions. Any owned-object or membership
      dependency is a role lifecycle precondition and does not require expansion across table kinds.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP USER does not declare table columns or validate expressions whose SQL validity depends on column
      data types; role/user/group DDL is independent of PG16 column-type coverage.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_user
      - branch_drop_user_if_exists
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - absent
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - present
      - absent
      coverage_requirement: all_declared_values
    multi_user_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - single_role
      - multiple_roles
      coverage_requirement: all_declared_values
    authorization_path:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - createrole
      - superuser
      - non_createrole
      coverage_requirement: all_declared_values
    role_dependency:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - no_dependencies
      - owns_objects
      - has_active_connections
      coverage_requirement: all_declared_values
    role_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - reserved_word_id
      - non_existent_name
      coverage_requirement: all_declared_values
    privilege_context:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - createrole_session
      - superuser_session
      - non_createrole_session
      coverage_requirement: all_declared_values
    dependency_context:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_dependencies
      - role_owns_objects
      - role_has_active_sessions
      coverage_requirement: all_declared_values
    error_type:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - none
      - non_existent_without_if_exists
      - role_owns_objects
      - insufficient_privilege
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - catalog_query
      - error_assertion
      - notice_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - reassign_objects_then_drop
      - drop_role
      - terminate_sessions
      coverage_requirement: all_declared_values
dynamic_inputs:
  user_role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/user_role_manifest.json
    required_fields:
    - target_role_name
    - object_state
    - executor_role
    - setup_sql
    - cleanup_sql
  privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/privilege_manifest.json
    required_fields:
    - executor_role
    - createrole_available
    - superuser_available
    - expected_privilege_path
  membership_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/membership_manifest.json
    required_fields:
    - member_role_name
    - group_role_name
    - membership_exists_before_statement
    - admin_option_available
  dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/role_dependency_manifest.json
    required_fields:
    - owned_objects_present
    - active_session_present
    - dependency_cleanup_sql
combination_groups:
- id: drop_user_core_syntax_and_state_baseline
  title: DROP USER core syntax, target state, and primary option coverage
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_drop_user
    object_state: exists
    expected_status: success
    if_exists_clause: absent
    multi_user_clause: single_role
    authorization_path: createrole
    role_dependency: no_dependencies
    role_name_shape: simple_id
    privilege_context: createrole_session
    dependency_context: no_dependencies
    error_type: none
    verification_mode: catalog_query
    cleanup_mode: reassign_objects_then_drop
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_user
      - branch_drop_user_if_exists
    object_state:
      mode: explicit
      values:
      - exists
      - absent
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - present
      - absent
    multi_user_clause:
      mode: explicit
      values:
      - single_role
      - multiple_roles
    authorization_path:
      mode: explicit
      values:
      - createrole
      - superuser
      - non_createrole
    role_dependency:
      mode: explicit
      values:
      - no_dependencies
      - owns_objects
      - has_active_connections
  compatibility:
    resolver: declared_matrix
    success_when:
    - selected binding represents a documented success path for the role catalog object
    - executor privilege and referenced role prerequisites are satisfied
    failure_when:
    - condition: expected_status == failure
      reason: target_role_missing
    - condition: privilege or dependency factor selects an invalid prerequisite
      reason: declared_role_ddl_prerequisite_failure
    default_failure_reason: target_role_missing
  sql_shape:
    template: DROP USER [ IF EXISTS ] {role_name} [, ...]
  verification:
    required: true
    mode: catalog_query
    sql: SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname = '{role_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP ROLE IF EXISTS {target_role_name};
