schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_user
  name: CREATE USER
  category: ddl
  domain: user
  source_reference: references/statements/ddl/user/create_user.md
  aliases:
  - create_user
  - CREATE USER
  - create_role
  - CREATE ROLE
  official_source: https://www.postgresql.org/docs/16/sql-createuser.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before any extension is emitted.
  - Extensions may add stress, boundary, dependency, privilege, or cross-factor combinations.
  - Extensions must not satisfy required role/user/group factor coverage.
  - Extensions must use declared statement factors and declared factor values.
  - Extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - user
    - role
    decision_reason: CREATE USER defines user catalog objects; user DDL is a PostgreSQL role alias with LOGIN-oriented defaults
      and operates on role catalog entries, so the baseline explicitly covers the user and backing role object kinds rather
      than relation or table objects.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE USER targets PostgreSQL role catalog entries and role membership/settings, not pg_class relations.
      Relation dependencies, when relevant to failure behavior, are modeled as dependency factors rather than required relation-kind
      coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE USER does not directly create, alter, read, or drop table definitions. Any owned-object or membership
      dependency is a role lifecycle precondition and does not require expansion across table kinds.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE USER does not declare table columns or validate expressions whose SQL validity depends on column
      data types; role/user/group DDL is independent of PG16 column-type coverage.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_1
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - not_exists
      - exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_declared_values
    login_default:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - default_login
      - explicit_nologin
      - explicit_login
      coverage_requirement: all_declared_values
    role_options:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - no_options
      - single_option_superuser
      - single_option_createdb
      - single_option_createrole
      - multiple_options
      coverage_requirement: all_declared_values
    password_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - omitted
      - password_value
      - encrypted_password_value
      - password_null
      coverage_requirement: all_declared_values
    valid_until_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - omitted
      - specified
      coverage_requirement: all_declared_values
    membership_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - omitted
      - in_role
      - in_group_legacy
      - role_clause
      - admin_clause
      coverage_requirement: all_declared_values
    role_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - reserved_word_as_name
      - duplicate_name
      - invalid_name
      coverage_requirement: all_declared_values
    password_value_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - valid_password
      - empty_password
      - null_password
      coverage_requirement: all_declared_values
    referenced_role_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - existing_role
      - nonexistent_role
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - createrole
      - superuser
      - non_createrole
      coverage_requirement: all_declared_values
    referenced_role_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - role_exists
      - role_not_exists
      coverage_requirement: all_declared_values
    duplicate_role_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_declared_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - has_createrole
      - lacks_createrole
      coverage_requirement: all_declared_values
    nonexistent_referenced_role:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - role_exists
      - role_missing
      coverage_requirement: all_declared_values
    reserved_role_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - normal_name
      - reserved_name
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - catalog_query_pg_roles
      - login_test
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - drop_user
      - drop_role
      - revoke_membership
      coverage_requirement: all_declared_values
dynamic_inputs:
  user_role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/user_role_manifest.json
    required_fields:
    - target_role_name
    - object_state
    - executor_role
    - setup_sql
    - cleanup_sql
  privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/privilege_manifest.json
    required_fields:
    - executor_role
    - createrole_available
    - superuser_available
    - expected_privilege_path
  referenced_role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/referenced_role_manifest.json
    required_fields:
    - referenced_role_name
    - referenced_role_exists
    - membership_setup_sql
combination_groups:
- id: create_user_core_syntax_and_state_baseline
  title: CREATE USER core syntax, target state, and primary option coverage
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_1
    object_state: not_exists
    expected_status: success
    login_default: default_login
    role_options: no_options
    password_clause: omitted
    valid_until_clause: omitted
    membership_clause: omitted
    role_name_shape: simple_id
    password_value_shape: valid_password
    referenced_role_name_shape: existing_role
    privilege_level: createrole
    referenced_role_existence: role_exists
    duplicate_role_name: no_conflict
    insufficient_privilege: has_createrole
    nonexistent_referenced_role: role_exists
    reserved_role_name: normal_name
    verification_mode: catalog_query_pg_roles
    cleanup_mode: drop_user
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_1
    object_state:
      mode: explicit
      values:
      - not_exists
      - exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    login_default:
      mode: explicit
      values:
      - default_login
      - explicit_nologin
      - explicit_login
    role_options:
      mode: explicit
      values:
      - no_options
      - single_option_superuser
      - single_option_createdb
      - single_option_createrole
      - multiple_options
    password_clause:
      mode: explicit
      values:
      - omitted
      - password_value
      - encrypted_password_value
      - password_null
    valid_until_clause:
      mode: explicit
      values:
      - omitted
      - specified
    membership_clause:
      mode: explicit
      values:
      - omitted
      - in_role
      - in_group_legacy
      - role_clause
      - admin_clause
  compatibility:
    resolver: declared_matrix
    success_when:
    - selected binding represents a documented success path for the role catalog object
    - executor privilege and referenced role prerequisites are satisfied
    failure_when:
    - condition: expected_status == failure
      reason: duplicate_object_name
    - condition: privilege or dependency factor selects an invalid prerequisite
      reason: declared_role_ddl_prerequisite_failure
    default_failure_reason: duplicate_object_name
  sql_shape:
    template: CREATE USER {role_name} [ [ WITH ] {option_clause} ]
  verification:
    required: true
    mode: catalog_query_pg_roles
    sql: SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname = '{role_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP ROLE IF EXISTS {target_role_name};
- id: create_user_name_privilege_dependency_baseline
