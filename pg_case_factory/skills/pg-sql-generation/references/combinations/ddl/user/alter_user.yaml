schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_user
  name: ALTER USER
  category: ddl
  domain: user
  source_reference: references/statements/ddl/user/alter_user.md
  aliases:
  - alter_user
  - ALTER USER
  - alter_role
  - ALTER ROLE
  official_source: https://www.postgresql.org/docs/16/sql-alteruser.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before any extension is emitted.
  - Extensions may add stress, boundary, dependency, privilege, or cross-factor combinations.
  - Extensions must not satisfy required role/user/group factor coverage.
  - Extensions must use declared statement factors and declared factor values.
  - Extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - user
    - role
    decision_reason: ALTER USER changes user catalog objects; user DDL is a PostgreSQL role alias with LOGIN-oriented defaults
      and operates on role catalog entries, so the baseline explicitly covers the user and backing role object kinds rather
      than relation or table objects.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER USER targets PostgreSQL role catalog entries and role membership/settings, not pg_class relations.
      Relation dependencies, when relevant to failure behavior, are modeled as dependency factors rather than required relation-kind
      coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER USER does not directly create, alter, read, or drop table definitions. Any owned-object or membership
      dependency is a role lifecycle precondition and does not require expansion across table kinds.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER USER does not declare table columns or validate expressions whose SQL validity depends on column
      data types; role/user/group DDL is independent of PG16 column-type coverage.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_option
      - branch_rename
      - branch_set_config
      - branch_set_from_current
      - branch_reset_config
      - branch_reset_all
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_declared_values
    alter_action:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - option_modify
      - rename
      - set_config
      - set_from_current
      - reset_config
      - reset_all
      coverage_requirement: all_declared_values
    role_specification:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - named_role
      - current_role
      - current_user
      - session_user
      - all
      coverage_requirement: all_declared_values
    in_database_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - omitted
      - specified
      coverage_requirement: all_declared_values
    option_type:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - superuser_toggle
      - createdb_toggle
      - createrole_toggle
      - inherit_toggle
      - login_toggle
      - replication_toggle
      - bypassrls_toggle
      - connection_limit
      - password
      - password_null
      - valid_until
      coverage_requirement: all_declared_values
    role_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_declared_values
    new_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - duplicate_name
      coverage_requirement: all_declared_values
    database_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - nonexistent_name
      coverage_requirement: all_declared_values
    config_param_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - valid_param
      - invalid_param
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - createrole
      - superuser
      - role_owner
      - non_owner
      - non_createrole
      coverage_requirement: all_declared_values
    database_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - database_exists
      - database_not_exists
      coverage_requirement: all_declared_values
    nonexistent_role:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - role_exists
      - role_missing
      coverage_requirement: all_declared_values
    duplicate_new_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_declared_values
    nonexistent_database:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - database_exists
      - database_missing
      coverage_requirement: all_declared_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - has_privilege
      - lacks_createrole
      - lacks_role_ownership
      coverage_requirement: all_declared_values
    superuser_modification_by_non_superuser:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - superuser_execution
      - non_superuser_attempting_superuser_toggle
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - catalog_query_pg_roles
      - config_parameter_query
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - revert_option
      - revert_rename
      - reset_config
      - drop_role
      coverage_requirement: all_declared_values
dynamic_inputs:
  user_role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/user_role_manifest.json
    required_fields:
    - target_role_name
    - object_state
    - executor_role
    - setup_sql
    - cleanup_sql
  privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/privilege_manifest.json
    required_fields:
    - executor_role
    - createrole_available
    - superuser_available
    - expected_privilege_path
  referenced_role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/referenced_role_manifest.json
    required_fields:
    - referenced_role_name
    - referenced_role_exists
    - membership_setup_sql
  membership_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/membership_manifest.json
    required_fields:
    - member_role_name
    - group_role_name
    - membership_exists_before_statement
    - admin_option_available
combination_groups:
- id: alter_user_core_syntax_and_state_baseline
  title: ALTER USER core syntax, target state, and primary option coverage
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_option
    object_state: exists
    expected_status: success
    alter_action: option_modify
    role_specification: named_role
    in_database_clause: omitted
    option_type: superuser_toggle
    role_name_shape: simple_id
    new_name_shape: simple_id
    database_name_shape: simple_id
    config_param_shape: valid_param
    privilege_level: createrole
    database_existence: database_exists
    nonexistent_role: role_exists
    duplicate_new_name: no_conflict
    nonexistent_database: database_exists
    insufficient_privilege: has_privilege
    superuser_modification_by_non_superuser: superuser_execution
    verification_mode: catalog_query_pg_roles
    cleanup_mode: revert_option
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_option
      - branch_rename
      - branch_set_config
      - branch_set_from_current
      - branch_reset_config
      - branch_reset_all
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    alter_action:
      mode: explicit
      values:
      - option_modify
      - rename
      - set_config
      - set_from_current
      - reset_config
      - reset_all
    role_specification:
      mode: explicit
      values:
      - named_role
      - current_role
      - current_user
      - session_user
      - all
    in_database_clause:
      mode: explicit
      values:
      - omitted
      - specified
    option_type:
      mode: explicit
      values:
      - superuser_toggle
      - createdb_toggle
      - createrole_toggle
      - inherit_toggle
      - login_toggle
      - replication_toggle
      - bypassrls_toggle
      - connection_limit
      - password
      - password_null
      - valid_until
  compatibility:
    resolver: declared_matrix
    success_when:
    - selected binding represents a documented success path for the role catalog object
    - executor privilege and referenced role prerequisites are satisfied
    failure_when:
    - condition: expected_status == failure
      reason: target_role_missing
    - condition: privilege or dependency factor selects an invalid prerequisite
      reason: declared_role_ddl_prerequisite_failure
    default_failure_reason: target_role_missing
  sql_shape:
    template: ALTER USER {role_spec} {alter_clause}
  verification:
    required: true
    mode: catalog_query_pg_roles
    sql: SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname = '{role_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP ROLE IF EXISTS {target_role_name};
    - sql: DROP ROLE IF EXISTS {new_role_name};
