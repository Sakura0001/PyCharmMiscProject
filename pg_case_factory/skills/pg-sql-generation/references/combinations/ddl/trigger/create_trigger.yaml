schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_trigger
  name: CREATE TRIGGER
  category: ddl
  domain: trigger
  source_reference: references/statements/ddl/trigger/create_trigger.md
  official_source: https://www.postgresql.org/docs/16/sql-createtrigger.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - trigger
    decision_reason: trigger statements operate on PostgreSQL trigger objects; object coverage is explicit for create, alter,
      and drop paths.
  target_relation_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - partitioned_table_parent
    decision_reason: trigger statements are validated against table-backed relations rather than arbitrary relation kinds.
  table_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - partitioned_table_parent
    decision_reason: trigger statements attach behavior to table objects, so representative table forms are required.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: predicate_or_expression_columns
    require_each_type_success_or_failure: true
    decision_reason: trigger behavior can reference table columns in predicates or expressions; coverage is conditional on
      expression-bearing branches.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_1
      - branch_2
      - branch_3
      coverage_requirement: all_values
    trigger_timing:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - BEFORE
      - AFTER
      - INSTEAD_OF
      coverage_requirement: all_values
    trigger_event:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - INSERT
      - UPDATE
      - DELETE
      - TRUNCATE
      - INSERT_OR_UPDATE
      - UPDATE_OR_DELETE
      - INSERT_OR_UPDATE_OR_DELETE
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id004
      - not_exists
      - already_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id005
      - success
      - failure
      coverage_requirement: all_values
    or_replace_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - present
      - absent
      coverage_requirement: all_values
    constraint_trigger:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - present
      - absent
      coverage_requirement: all_values
    for_each_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id008
      - ROW
      - STATEMENT
      - absent
      coverage_requirement: all_values
    deferrable_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id009
      - NOT_DEFERRABLE
      - DEFERRABLE_INITIALLY_IMMEDIATE
      - DEFERRABLE_INITIALLY_DEFERRED
      - absent
      coverage_requirement: all_values
    when_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id010
      - with_WHEN_condition
      - without_WHEN
      coverage_requirement: all_values
    referencing_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id011
      - with_OLD_TABLE
      - with_NEW_TABLE
      - with_BOTH
      - absent
      coverage_requirement: all_values
    from_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id012
      - present
      - absent
      coverage_requirement: all_values
    update_of_columns:
      tier: T2
      coverage_role: main_axis
      required_values: &id013
      - with_column_list
      - without_column_list
      coverage_requirement: all_values
    execute_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id014
      - FUNCTION
      - PROCEDURE
      coverage_requirement: all_values
    trigger_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id015
      - simple
      - quoted
      - reserved_word
      - duplicate
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id016
      - simple
      - quoted
      - schema_qualified
      coverage_requirement: all_values
    function_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id017
      - simple
      - quoted
      - schema_qualified
      coverage_requirement: all_values
    event_column_list:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id018
      - single_column
      - multiple_columns
      - nonexistent_column
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id019
      - superuser
      - table_owner
      - non_owner_with_create_trigger
      - non_owner_no_privilege
      coverage_requirement: all_values
    table_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id020
      - table_exists
      - table_not_exists
      - view_exists_for_INSTEAD_OF
      - partitioned_table
      coverage_requirement: all_values
    function_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id021
      - trigger_function_exists
      - trigger_function_not_exists
      - function_returns_trigger
      - function_returns_wrong_type
      coverage_requirement: all_values
    referenced_table_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id022
      - referenced_table_exists
      - referenced_table_not_exists
      coverage_requirement: all_values
    schema_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id023
      - schema_exists
      - schema_not_exists
      coverage_requirement: all_values
    duplicate_trigger:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id024
      - with_OR_REPLACE_replace
      - without_OR_REPLACE_error
      coverage_requirement: all_values
    INSTEAD_OF_on_table:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id025
      - INSTEAD_OF_INSERT_on_regular_table
      coverage_requirement: all_values
    BEFORE_INSTEAD_OF_on_view:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id026
      - BEFORE_INSERT_on_view
      - AFTER_INSERT_on_view
      coverage_requirement: all_values
    TRUNCATE_with_FOR_EACH_ROW:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id027
      - TRUNCATE_FOR_EACH_ROW
      coverage_requirement: all_values
    UPDATE_OF_nonexistent_column:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id028
      - UPDATE_OF_missing_column
      coverage_requirement: all_values
    constraint_trigger_on_non_constraint_event:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id029
      - CONSTRAINT_with_INSTEAD_OF
      coverage_requirement: all_values
    permission_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id030
      - no_create_trigger_privilege
      - not_table_owner_for_CONSTRAINT
      coverage_requirement: all_values
    referenced_table_not_exists:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id031
      - FROM_table_not_found
      coverage_requirement: all_values
    identifier_length_exceeded:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id032
      - over_63_chars
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id033
      - pg_trigger_catalog_query
      - information_schema_triggers
      - SELECT_trigger_test
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id034
      - DROP_TRIGGER
      - DROP_TRIGGER_IF_EXISTS
      - DROP_TRIGGER_ON_TABLE
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - schema_name
    - expected_status
  dependency_manifest:
    required: true
    source: statement_reference_dependencies
    required_fields:
    - dependency_name
    - dependency_kind
    - setup_sql
combination_groups:
- id: create_trigger_declared_factor_baseline
  title: CREATE TRIGGER declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - create_trigger_declared_failure
  factors:
    statement_branch: branch_1
    trigger_timing: BEFORE
    trigger_event: INSERT
    object_state: not_exists
    expected_status: success
    or_replace_clause: present
    constraint_trigger: present
    for_each_clause: ROW
    deferrable_clause: NOT_DEFERRABLE
    when_clause: with_WHEN_condition
    referencing_clause: with_OLD_TABLE
    from_clause: present
    update_of_columns: with_column_list
    execute_clause: FUNCTION
    trigger_name_shape: simple
    table_name_shape: simple
    function_name_shape: simple
    event_column_list: single_column
    privilege_level: superuser
    table_dependency: table_exists
    function_dependency: trigger_function_exists
    referenced_table_dependency: referenced_table_exists
    schema_dependency: schema_exists
    duplicate_trigger: with_OR_REPLACE_replace
    INSTEAD_OF_on_table: INSTEAD_OF_INSERT_on_regular_table
    BEFORE_INSTEAD_OF_on_view: BEFORE_INSERT_on_view
    TRUNCATE_with_FOR_EACH_ROW: TRUNCATE_FOR_EACH_ROW
    UPDATE_OF_nonexistent_column: UPDATE_OF_missing_column
    constraint_trigger_on_non_constraint_event: CONSTRAINT_with_INSTEAD_OF
    permission_insufficient: no_create_trigger_privilege
    referenced_table_not_exists: FROM_table_not_found
    identifier_length_exceeded: over_63_chars
    verification_mode: pg_trigger_catalog_query
    cleanup_mode: DROP_TRIGGER
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    trigger_timing:
      mode: explicit
      values: *id002
    trigger_event:
      mode: explicit
      values: *id003
    object_state:
      mode: explicit
      values: *id004
    expected_status:
      mode: explicit
      values: *id005
    or_replace_clause:
      mode: explicit
      values: *id006
    constraint_trigger:
      mode: explicit
      values: *id007
    for_each_clause:
      mode: explicit
      values: *id008
    deferrable_clause:
      mode: explicit
      values: *id009
    when_clause:
      mode: explicit
      values: *id010
    referencing_clause:
      mode: explicit
      values: *id011
    from_clause:
      mode: explicit
      values: *id012
    update_of_columns:
      mode: explicit
      values: *id013
    execute_clause:
      mode: explicit
      values: *id014
    trigger_name_shape:
      mode: explicit
      values: *id015
    table_name_shape:
      mode: explicit
      values: *id016
    function_name_shape:
      mode: explicit
      values: *id017
    event_column_list:
      mode: explicit
      values: *id018
    privilege_level:
      mode: explicit
      values: *id019
    table_dependency:
      mode: explicit
      values: *id020
    function_dependency:
      mode: explicit
      values: *id021
    referenced_table_dependency:
      mode: explicit
      values: *id022
    schema_dependency:
      mode: explicit
      values: *id023
    duplicate_trigger:
      mode: explicit
      values: *id024
    INSTEAD_OF_on_table:
      mode: explicit
      values: *id025
    BEFORE_INSTEAD_OF_on_view:
      mode: explicit
      values: *id026
    TRUNCATE_with_FOR_EACH_ROW:
      mode: explicit
      values: *id027
    UPDATE_OF_nonexistent_column:
      mode: explicit
      values: *id028
    constraint_trigger_on_non_constraint_event:
      mode: explicit
      values: *id029
    permission_insufficient:
      mode: explicit
      values: *id030
    referenced_table_not_exists:
      mode: explicit
      values: *id031
    identifier_length_exceeded:
      mode: explicit
      values: *id032
    verification_mode:
      mode: explicit
      values: *id033
    cleanup_mode:
      mode: explicit
      values: *id034
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: create_trigger_declared_failure
    default_failure_reason: create_trigger_declared_failure
  sql_shape:
    template: CREATE TRIGGER {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for create_trigger
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
