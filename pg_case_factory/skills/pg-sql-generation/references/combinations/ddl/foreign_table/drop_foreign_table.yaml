schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_foreign_table
  name: DROP FOREIGN TABLE
  category: ddl
  domain: foreign_table
  source_reference: references/statements/ddl/foreign_table/drop_foreign_table.md
  official_source: https://www.postgresql.org/docs/16/sql-dropforeigntable.html
  aliases:
  - DROP FOREIGN TABLE
  - drop foreign table
  - drop_foreign_table
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use only declared factors and declared factor values.
  - Derived extensions must preserve success, failure, notice, and no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - foreign_table
    decision_reason: DROP FOREIGN TABLE directly targets foreign-table relation objects and must cover existence, IF EXISTS,
      dependency, and privilege states.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - foreign_table
    decision_reason: The only direct relation target is foreign_table. View dependencies are represented by dependency factors
      rather than target relation coverage.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - foreign_table
    decision_reason: DROP FOREIGN TABLE removes foreign-table objects and branches on multi-table, dependency, cascade/restrict,
      and ownership factors for that table kind.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP FOREIGN TABLE removes the relation metadata without checking or transforming column definitions;
      success, failure, verification, and cleanup depend on object existence, dependencies, IF EXISTS, CASCADE/RESTRICT, and
      privileges.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_foreign_table
      - branch_drop_foreign_table_if_exists
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - absent
      - present
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - restrict_default
      - cascade
      coverage_requirement: all_values
    multi_table:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - single_table
      - multiple_tables
      coverage_requirement: all_values
    dependent_objects:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - no_dependencies
      - view_dependencies
      - other_dependencies
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - schema_qualified
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - table_owner
      - non_owner
      - superuser
      coverage_requirement: all_values
    dependency_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_dependencies
      - has_view_dependency
      coverage_requirement: all_values
    nonexistent_table:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - table_exists
      - table_missing_no_if_exists
      coverage_requirement: all_values
    dependent_with_restrict:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_deps_restrict
      - has_deps_restrict
      - has_deps_cascade
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - owner_execution
      - non_owner_execution
      - superuser_execution
      coverage_requirement: all_values
    if_exists_notice:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_notice
      - notice_no_op
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - pg_class_catalog_query
      - error_assertion
      - notice_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - recreate_foreign_table
      - recreate_server
      - recreate_fdw
      - drop_dependent_views
      coverage_requirement: all_values
dynamic_inputs:
  foreign_table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/foreign_table_manifest.json
    required_fields:
    - table_name
    - object_state
    - owner_role
  dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/foreign_table_dependency_manifest.json
    required_fields:
    - dependency_state
    - dependent_objects
    - cascade_restrict
combination_groups:
- id: drop_foreign_table_required_factor_value_matrix
  title: DROP FOREIGN TABLE required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - nonexistent_table
  - dependent_with_restrict
  - insufficient_privilege
  - if_exists_notice
  factors:
    statement_branch: branch_drop_foreign_table
    object_state: exists
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: restrict_default
    multi_table: single_table
    dependent_objects: no_dependencies
    table_name_shape: simple_id
    privilege_level: table_owner
    dependency_state: no_dependencies
    nonexistent_table: table_exists
    dependent_with_restrict: no_deps_restrict
    insufficient_privilege: owner_execution
    if_exists_notice: no_notice
    verification_mode: pg_class_catalog_query
    cleanup_mode: recreate_foreign_table
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_foreign_table
      - branch_drop_foreign_table_if_exists
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    cascade_restrict:
      mode: explicit
      values:
      - restrict_default
      - cascade
    multi_table:
      mode: explicit
      values:
      - single_table
      - multiple_tables
    dependent_objects:
      mode: explicit
      values:
      - no_dependencies
      - view_dependencies
      - other_dependencies
    table_name_shape:
      mode: explicit
      values:
      - simple_id
      - schema_qualified
      - quoted_id
      - nonexistent_name
    privilege_level:
      mode: explicit
      values:
      - table_owner
      - non_owner
      - superuser
    dependency_state:
      mode: explicit
      values:
      - no_dependencies
      - has_view_dependency
    nonexistent_table:
      mode: explicit
      values:
      - table_exists
      - table_missing_no_if_exists
    dependent_with_restrict:
      mode: explicit
      values:
      - no_deps_restrict
      - has_deps_restrict
      - has_deps_cascade
    insufficient_privilege:
      mode: explicit
      values:
      - owner_execution
      - non_owner_execution
      - superuser_execution
    if_exists_notice:
      mode: explicit
      values:
      - no_notice
      - notice_no_op
    verification_mode:
      mode: explicit
      values:
      - pg_class_catalog_query
      - error_assertion
      - notice_assertion
    cleanup_mode:
      mode: explicit
      values:
      - recreate_foreign_table
      - recreate_server
      - recreate_fdw
      - drop_dependent_views
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and all selected dependency, privilege, object-state, name-shape, and option factors are
      compatible
    - statement branch requirements match the selected clause and lifecycle setup manifests
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: target object, dependency, privilege, option, or name factor selects an invalid binding
      reason: statement_specific_failure
    - condition: nonexistent_table selects an error, notice, no-op, or boundary value
      reason: nonexistent_table
    - condition: dependent_with_restrict selects an error, notice, no-op, or boundary value
      reason: dependent_with_restrict
    - condition: insufficient_privilege selects an error, notice, no-op, or boundary value
      reason: insufficient_privilege
    - condition: if_exists_notice selects an error, notice, no-op, or boundary value
      reason: if_exists_notice
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP FOREIGN TABLE {if_exists_clause} {table_name_list} {cascade_restrict};
  verification:
    required: true
    mode: catalog_error_or_notice_assertion
    sql: SELECT relname FROM pg_class WHERE relname = '{table_name}' AND relkind = 'f';
  cleanup:
    required: true
    steps:
    - sql: DROP VIEW IF EXISTS {dependent_view_name} CASCADE;
    - sql: DROP FOREIGN TABLE IF EXISTS {table_name} CASCADE;
    - sql: DROP SERVER IF EXISTS {server_name} CASCADE;
    - sql: DROP FOREIGN DATA WRAPPER IF EXISTS {fdw_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
