schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_foreign_table
  name: CREATE FOREIGN TABLE
  category: ddl
  domain: foreign_table
  source_reference: references/statements/ddl/foreign_table/create_foreign_table.md
  official_source: https://www.postgresql.org/docs/16/sql-createforeigntable.html
  aliases:
  - CREATE FOREIGN TABLE
  - create foreign table
  - create_foreign_table
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use only declared factors and declared factor values.
  - Derived extensions must preserve success, failure, notice, and no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - foreign_table
    - server
    decision_reason: CREATE FOREIGN TABLE creates a foreign-table relation and requires an existing foreign server; both object
      roles are part of the baseline.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - foreign_table
    decision_reason: The target relation kind is specifically foreign_table. Regular and partitioned forms are covered by
      statement factors rather than by generic table relation kinds.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - foreign_table
    decision_reason: CREATE FOREIGN TABLE directly defines foreign-table objects, including regular foreign tables and partition-of
      foreign tables, so table coverage is explicit for foreign_table.
  column_type_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: representative
    require_each_type_success_or_failure: false
    decision_reason: CREATE FOREIGN TABLE declares local column definitions and requires USAGE on each column type, but the
      statement reference defines a representative column_data_type set rather than the full PG16 type catalog. Baseline coverage
      expands those declared representative types and leaves full catalog stress to post-audit extensions.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_regular
      - branch_partition
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - not_exists
      - already_exists
      - type_name_conflict
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    table_form:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - regular
      - partition_of
      coverage_requirement: all_values
    if_not_exists_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - specified
      coverage_requirement: all_values
    column_count:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - zero_columns
      - single_column
      - multiple_columns
      coverage_requirement: all_values
    column_data_type:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - integer
      - bigint
      - text
      - varchar
      - numeric
      - boolean
      - date
      - timestamp
      - jsonb
      - uuid
      - float8
      coverage_requirement: all_values
    inherits_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - single_parent
      - multiple_parents
      coverage_requirement: all_values
    partition_bound_spec:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - for_values_in
      - for_values_from_to
      - for_values_with
      - default_partition
      coverage_requirement: all_values
    server_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - valid_server
      - nonexistent_server
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - schema_qualified
      - quoted_id
      - reserved_word_name
      - duplicate_name
      coverage_requirement: all_values
    column_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - reserved_word_name
      coverage_requirement: all_values
    server_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - nonexistent_server
      coverage_requirement: all_values
    constraint_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - omitted
      coverage_requirement: all_values
    collation_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - omitted
      - specified
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - usage_on_server_and_types
      - no_server_usage
      - no_type_usage
      coverage_requirement: all_values
    server_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - server_exists
      - server_not_exists
      coverage_requirement: all_values
    parent_table_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - parent_exists
      - parent_not_exists
      coverage_requirement: all_values
    schema_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - schema_exists
      - schema_not_exists
      coverage_requirement: all_values
    type_name_conflict:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_conflict
      - same_as_existing_type
      coverage_requirement: all_values
    duplicate_table_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_values
    nonexistent_server:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - server_exists
      - server_missing
      coverage_requirement: all_values
    nonexistent_parent_table:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - parent_exists
      - parent_missing
      coverage_requirement: all_values
    no_server_usage_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - has_usage
      - lacks_usage
      coverage_requirement: all_values
    no_type_usage_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - has_usage
      - lacks_usage
      coverage_requirement: all_values
    if_not_exists_no_op:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - new_create
      - no_op_notice
      coverage_requirement: all_values
    zero_column_table:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - has_columns
      - zero_columns
      coverage_requirement: all_values
    constraint_not_enforced:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - with_not_null
      - with_check
      - no_constraints
      coverage_requirement: all_values
    type_name_conflict_error:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - conflict_with_existing_type
      coverage_requirement: all_values
    parent_has_unique_index:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - parent_no_unique
      - parent_has_unique
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - pg_class_catalog_query
      - error_assertion
      - notice_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - drop_foreign_table
      - drop_foreign_table_cascade
      - drop_server
      - drop_fdw
      - drop_parent_table
      coverage_requirement: all_values
dynamic_inputs:
  foreign_table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/foreign_table_manifest.json
    required_fields:
    - table_name
    - table_form
    - columns
    - object_state
  foreign_server_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/foreign_server_manifest.json
    required_fields:
    - server_name
    - server_existence
    - usage_privilege
    - fdw_name
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  parent_table_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/parent_table_manifest.json
    required_fields:
    - parent_table_name
    - parent_table_existence
    - partition_bound_spec
combination_groups:
- id: create_foreign_table_required_factor_value_matrix
  title: CREATE FOREIGN TABLE required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - duplicate_table_name
  - nonexistent_server
  - nonexistent_parent_table
  - no_server_usage_privilege
  - no_type_usage_privilege
  - if_not_exists_no_op
  - zero_column_table
  - constraint_not_enforced
  - type_name_conflict_error
  - parent_has_unique_index
  factors:
    statement_branch: branch_regular
    object_state: not_exists
    expected_status: success
    table_form: regular
    if_not_exists_clause: omitted
    column_count: zero_columns
    column_data_type: integer
    inherits_clause: omitted
    partition_bound_spec: for_values_in
    server_clause: valid_server
    table_name_shape: simple_id
    column_name_shape: simple_id
    server_name_shape: simple_id
    constraint_name_shape: simple_id
    collation_name_shape: omitted
    privilege_level: usage_on_server_and_types
    server_existence: server_exists
    parent_table_existence: parent_exists
    schema_existence: schema_exists
    type_name_conflict: no_conflict
    duplicate_table_name: no_conflict
    nonexistent_server: server_exists
    nonexistent_parent_table: parent_exists
    no_server_usage_privilege: has_usage
    no_type_usage_privilege: has_usage
    if_not_exists_no_op: new_create
    zero_column_table: has_columns
    constraint_not_enforced: with_not_null
    type_name_conflict_error: no_conflict
    parent_has_unique_index: parent_no_unique
    verification_mode: pg_class_catalog_query
    cleanup_mode: drop_foreign_table
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_regular
      - branch_partition
    object_state:
      mode: explicit
      values:
      - not_exists
      - already_exists
      - type_name_conflict
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    table_form:
      mode: explicit
      values:
      - regular
      - partition_of
    if_not_exists_clause:
      mode: explicit
      values:
      - omitted
      - specified
    column_count:
      mode: explicit
      values:
      - zero_columns
      - single_column
      - multiple_columns
    column_data_type:
      mode: explicit
      values:
      - integer
      - bigint
      - text
      - varchar
      - numeric
      - boolean
      - date
      - timestamp
      - jsonb
      - uuid
      - float8
    inherits_clause:
      mode: explicit
      values:
      - omitted
      - single_parent
      - multiple_parents
    partition_bound_spec:
      mode: explicit
      values:
      - for_values_in
      - for_values_from_to
      - for_values_with
      - default_partition
    server_clause:
      mode: explicit
      values:
      - valid_server
      - nonexistent_server
    table_name_shape:
      mode: explicit
      values:
      - simple_id
      - schema_qualified
      - quoted_id
      - reserved_word_name
      - duplicate_name
    column_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - reserved_word_name
    server_name_shape:
      mode: explicit
      values:
      - simple_id
      - nonexistent_server
    constraint_name_shape:
      mode: explicit
      values:
      - simple_id
      - omitted
    collation_name_shape:
      mode: explicit
      values:
      - omitted
      - specified
    privilege_level:
      mode: explicit
      values:
      - usage_on_server_and_types
      - no_server_usage
      - no_type_usage
    server_existence:
      mode: explicit
      values:
      - server_exists
      - server_not_exists
    parent_table_existence:
      mode: explicit
      values:
      - parent_exists
      - parent_not_exists
    schema_existence:
      mode: explicit
      values:
      - schema_exists
      - schema_not_exists
    type_name_conflict:
      mode: explicit
      values:
      - no_conflict
      - same_as_existing_type
    duplicate_table_name:
      mode: explicit
      values:
      - no_conflict
      - same_name_conflict
    nonexistent_server:
      mode: explicit
      values:
      - server_exists
      - server_missing
    nonexistent_parent_table:
      mode: explicit
      values:
      - parent_exists
      - parent_missing
    no_server_usage_privilege:
      mode: explicit
      values:
      - has_usage
      - lacks_usage
    no_type_usage_privilege:
      mode: explicit
      values:
      - has_usage
      - lacks_usage
    if_not_exists_no_op:
      mode: explicit
      values:
      - new_create
      - no_op_notice
    zero_column_table:
      mode: explicit
      values:
      - has_columns
      - zero_columns
    constraint_not_enforced:
      mode: explicit
      values:
      - with_not_null
      - with_check
      - no_constraints
    type_name_conflict_error:
      mode: explicit
      values:
      - no_conflict
      - conflict_with_existing_type
    parent_has_unique_index:
      mode: explicit
      values:
      - parent_no_unique
      - parent_has_unique
    verification_mode:
      mode: explicit
      values:
      - pg_class_catalog_query
      - error_assertion
      - notice_assertion
    cleanup_mode:
      mode: explicit
      values:
      - drop_foreign_table
      - drop_foreign_table_cascade
      - drop_server
      - drop_fdw
      - drop_parent_table
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and all selected dependency, privilege, object-state, name-shape, and option factors are
      compatible
    - statement branch requirements match the selected clause and lifecycle setup manifests
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: target object, dependency, privilege, option, or name factor selects an invalid binding
      reason: statement_specific_failure
    - condition: duplicate_table_name selects an error, notice, no-op, or boundary value
      reason: duplicate_table_name
    - condition: nonexistent_server selects an error, notice, no-op, or boundary value
      reason: nonexistent_server
    - condition: nonexistent_parent_table selects an error, notice, no-op, or boundary value
      reason: nonexistent_parent_table
    - condition: no_server_usage_privilege selects an error, notice, no-op, or boundary value
      reason: no_server_usage_privilege
    - condition: no_type_usage_privilege selects an error, notice, no-op, or boundary value
      reason: no_type_usage_privilege
    - condition: if_not_exists_no_op selects an error, notice, no-op, or boundary value
      reason: if_not_exists_no_op
    - condition: zero_column_table selects an error, notice, no-op, or boundary value
      reason: zero_column_table
    - condition: constraint_not_enforced selects an error, notice, no-op, or boundary value
      reason: constraint_not_enforced
    - condition: type_name_conflict_error selects an error, notice, no-op, or boundary value
      reason: type_name_conflict_error
    - condition: parent_has_unique_index selects an error, notice, no-op, or boundary value
      reason: parent_has_unique_index
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: CREATE FOREIGN TABLE {if_not_exists_clause} {table_name} ({column_definitions}) {inherits_or_partition_clause}
      SERVER {server_name} {options_clause};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT relname FROM pg_class WHERE relname = '{table_name}' AND relkind = 'f';
  cleanup:
    required: true
    steps:
    - sql: DROP FOREIGN TABLE IF EXISTS {table_name} CASCADE;
    - sql: DROP TABLE IF EXISTS {parent_table_name} CASCADE;
    - sql: DROP SERVER IF EXISTS {server_name} CASCADE;
    - sql: DROP FOREIGN DATA WRAPPER IF EXISTS {fdw_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
