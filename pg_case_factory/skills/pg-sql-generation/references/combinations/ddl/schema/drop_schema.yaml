schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_schema
  name: DROP SCHEMA
  category: ddl
  domain: schema
  source_reference: references/statements/ddl/schema/drop_schema.md
  official_source: https://www.postgresql.org/docs/16/sql-dropschema.html
  aliases:
  - DROP SCHEMA
  - drop schema
  - drop_schema
  - dropschema
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, or no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - schema
    decision_reason: DROP_SCHEMA targets schema namespace objects. Required coverage is the schema object state, naming, owner,
      dependency, and cascade/restrict behavior declared by the statement reference.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: DROP_SCHEMA names a schema namespace, not a pg_class relation. Contained tables, views, or functions
      are dependency/boundary fixtures only and are represented by declared schema dependency factors.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_SCHEMA operates on the schema namespace object. Any table-like schema elements or contained tables
      are setup/dependency fixtures for namespace behavior, not direct table targets requiring table-kind coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_SCHEMA has no required SQL-validity or verification dependency on column data types. Namespace creation,
      alteration, and removal are governed by schema names, owners, permissions, and dependency boundaries.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_schema
      - branch_drop_schema_if_exists
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists_empty
      - exists_with_objects
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - absent
      - present
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - none
      - cascade
      - restrict
      coverage_requirement: all_values
    multi_schema_drop:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - single_schema
      - multi_schema
      coverage_requirement: all_values
    schema_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple
      - quoted
      - schema_qualified
      - reserved_word
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - owner
      - superuser
      - non_owner
      coverage_requirement: all_values
    contained_objects_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - empty_schema
      - has_tables
      - has_views
      - has_functions
      - has_multiple_object_types
      coverage_requirement: all_values
    cross_schema_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_cross_dependency
      - has_cross_schema_fk
      - has_cross_schema_view
      coverage_requirement: all_values
    error_boundary:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - none
      - non_existent_without_if_exists
      - contains_objects_without_cascade
      - insufficient_privilege
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - pg_namespace_query
      - information_schema_schemata
      - error_assertion
      - notice_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - no_cleanup_needed
      - manual_cleanup
      - rollback
      coverage_requirement: all_values
dynamic_inputs:
  schema_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/schema_manifest.json
    required_fields:
    - schema_name
    - object_state
    - owner
    - exists_before_statement
  role_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - role_name
    - privilege_context
    - can_set_role
  schema_dependency_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/schema_dependency_manifest.json
    required_fields:
    - contained_objects_state
    - cross_schema_dependency
    - schema_element_dependency
combination_groups:
- id: drop_schema_required_factor_value_matrix
  title: DROP SCHEMA required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - non_existent_without_if_exists
  - contains_objects_without_cascade
  - insufficient_privilege
  factors:
    statement_branch: branch_drop_schema
    object_state: exists_empty
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: none
    multi_schema_drop: single_schema
    schema_name_shape: simple
    privilege_level: owner
    contained_objects_state: empty_schema
    cross_schema_dependency: no_cross_dependency
    error_boundary: none
    verification_mode: pg_namespace_query
    cleanup_mode: no_cleanup_needed
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_schema
      - branch_drop_schema_if_exists
    object_state:
      mode: explicit
      values:
      - exists_empty
      - exists_with_objects
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    cascade_restrict:
      mode: explicit
      values:
      - none
      - cascade
      - restrict
    multi_schema_drop:
      mode: explicit
      values:
      - single_schema
      - multi_schema
    schema_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - schema_qualified
      - reserved_word
    privilege_level:
      mode: explicit
      values:
      - owner
      - superuser
      - non_owner
    contained_objects_state:
      mode: explicit
      values:
      - empty_schema
      - has_tables
      - has_views
      - has_functions
      - has_multiple_object_types
    cross_schema_dependency:
      mode: explicit
      values:
      - no_cross_dependency
      - has_cross_schema_fk
      - has_cross_schema_view
    error_boundary:
      mode: explicit
      values:
      - none
      - non_existent_without_if_exists
      - contains_objects_without_cascade
      - insufficient_privilege
    verification_mode:
      mode: explicit
      values:
      - pg_namespace_query
      - information_schema_schemata
      - error_assertion
      - notice_assertion
    cleanup_mode:
      mode: explicit
      values:
      - no_cleanup_needed
      - manual_cleanup
      - rollback
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and object_state not in [not_exists, absent, already_exists, reserved_name_conflict]
    - statement-specific dependencies, privileges, names, and environment factors are compatible with the selected branch
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: object_state in [not_exists, absent] without IF EXISTS-style tolerance
      reason: target_object_missing
    - condition: privilege or role ability factor selects an insufficient-permission value
      reason: privilege_denied
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP SCHEMA {if_exists_clause} {schema_name_list} {cascade_restrict};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT nspname FROM pg_namespace WHERE nspname = '{schema_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP SCHEMA IF EXISTS {schema_name} CASCADE;
- id: drop_schema_branch_01_branch_drop_schema
  title: 'DROP SCHEMA branch baseline: branch_drop_schema'
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - non_existent_without_if_exists
  - contains_objects_without_cascade
  - insufficient_privilege
  factors:
    statement_branch: branch_drop_schema
    object_state: exists_empty
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: none
    multi_schema_drop: single_schema
    schema_name_shape: simple
    privilege_level: owner
    contained_objects_state: empty_schema
    cross_schema_dependency: no_cross_dependency
    error_boundary: none
    verification_mode: pg_namespace_query
    cleanup_mode: no_cleanup_needed
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_schema
    object_state:
      mode: explicit
      values:
      - exists_empty
      - exists_with_objects
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
  compatibility:
    resolver: declared_matrix
    success_when:
    - statement_branch == branch_drop_schema and expected_status == success
    - all branch-local prerequisites select compatible values
    failure_when:
    - condition: statement_branch == branch_drop_schema and expected_status == failure
      reason: statement_specific_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP SCHEMA {if_exists_clause} {schema_name_list} {cascade_restrict};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT nspname FROM pg_namespace WHERE nspname = '{schema_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP SCHEMA IF EXISTS {schema_name} CASCADE;
- id: drop_schema_branch_02_branch_drop_schema_if_exists
  title: 'DROP SCHEMA branch baseline: branch_drop_schema_if_exists'
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - non_existent_without_if_exists
  - contains_objects_without_cascade
  - insufficient_privilege
  factors:
    statement_branch: branch_drop_schema_if_exists
    object_state: exists_empty
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: none
    multi_schema_drop: single_schema
    schema_name_shape: simple
    privilege_level: owner
    contained_objects_state: empty_schema
    cross_schema_dependency: no_cross_dependency
    error_boundary: none
    verification_mode: pg_namespace_query
    cleanup_mode: no_cleanup_needed
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_schema_if_exists
    object_state:
      mode: explicit
      values:
      - exists_empty
      - exists_with_objects
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
  compatibility:
    resolver: declared_matrix
    success_when:
    - statement_branch == branch_drop_schema_if_exists and expected_status == success
    - all branch-local prerequisites select compatible values
    failure_when:
    - condition: statement_branch == branch_drop_schema_if_exists and expected_status == failure
      reason: statement_specific_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP SCHEMA {if_exists_clause} {schema_name_list} {cascade_restrict};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT nspname FROM pg_namespace WHERE nspname = '{schema_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP SCHEMA IF EXISTS {schema_name} CASCADE;
- id: drop_schema_representative_failure_boundaries
  title: DROP SCHEMA representative failure boundaries
  lifecycle_role: negative_control
  expected_status_policy: per_factor_binding
  default_expected_status: failure
  expected_failure_reasons:
  - non_existent_without_if_exists
  - contains_objects_without_cascade
  - insufficient_privilege
  factors:
    statement_branch: branch_drop_schema
    object_state: not_exists
    expected_status: failure
    if_exists_clause: absent
    cascade_restrict: none
    multi_schema_drop: single_schema
    schema_name_shape: simple
    privilege_level: owner
    contained_objects_state: empty_schema
    cross_schema_dependency: no_cross_dependency
    error_boundary: insufficient_privilege
    verification_mode: pg_namespace_query
    cleanup_mode: no_cleanup_needed
  expansion:
    object_state:
      mode: explicit
      values:
      - exists_empty
      - exists_with_objects
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    privilege_level:
      mode: explicit
      values:
      - owner
      - superuser
      - non_owner
    contained_objects_state:
      mode: explicit
      values:
      - empty_schema
      - has_tables
      - has_views
      - has_functions
      - has_multiple_object_types
    cross_schema_dependency:
      mode: explicit
      values:
      - no_cross_dependency
      - has_cross_schema_fk
      - has_cross_schema_view
    error_boundary:
      mode: explicit
      values:
      - none
      - non_existent_without_if_exists
      - contains_objects_without_cascade
      - insufficient_privilege
  compatibility:
    resolver: declared_matrix
    success_when:
    - failure boundary values are disabled and expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: target object, role, privilege, dependency, or environment boundary is invalid
      reason: statement_specific_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP SCHEMA {if_exists_clause} {schema_name_list} {cascade_restrict};
  verification:
    required: true
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP SCHEMA IF EXISTS {schema_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
