schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_schema
  name: CREATE SCHEMA
  category: ddl
  domain: schema
  source_reference: references/statements/ddl/schema/create_schema.md
  official_source: https://www.postgresql.org/docs/16/sql-createschema.html
  aliases:
  - CREATE SCHEMA
  - create schema
  - create_schema
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, or no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - schema
    decision_reason: CREATE_SCHEMA targets schema namespace objects. Required coverage is the schema object state, naming,
      owner, dependency, and cascade/restrict behavior declared by the statement reference.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: CREATE_SCHEMA names a schema namespace, not a pg_class relation. Contained tables, views, or functions
      are dependency/boundary fixtures only and are represented by declared schema dependency factors.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE_SCHEMA operates on the schema namespace object. Any table-like schema elements or contained tables
      are setup/dependency fixtures for namespace behavior, not direct table targets requiring table-kind coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE_SCHEMA has no required SQL-validity or verification dependency on column data types. Namespace
      creation, alteration, and removal are governed by schema names, owners, permissions, and dependency boundaries.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_named_schema
      - branch_auth_schema
      - branch_if_not_exists_named
      - branch_if_not_exists_auth
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - not_exists
      - already_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    if_not_exists_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - present
      - absent
      coverage_requirement: all_values
    authorization_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - absent
      - explicit_user
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
      coverage_requirement: all_values
    schema_element_inclusion:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - without_elements
      - with_create_table
      - with_create_view
      - with_multiple_elements
      coverage_requirement: all_values
    role_specification_form:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - user_name
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
      coverage_requirement: all_values
    schema_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple
      - quoted
      - reserved_word
      - pg_prefix_reserved
      - non_existent
      coverage_requirement: all_values
    owner_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - existing_role
      - non_existing_role
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - superuser
      - schema_creator
      - non_creator_no_privilege
      coverage_requirement: all_values
    database_privilege:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - has_CREATE_privilege
      - no_CREATE_privilege
      coverage_requirement: all_values
    role_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - role_exists
      - role_not_exists
      - can_SET_ROLE
      - cannot_SET_ROLE
      coverage_requirement: all_values
    schema_element_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - element_table_exists
      - element_table_not_exists
      - element_view_dependency
      coverage_requirement: all_values
    duplicate_schema_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - with_IF_NOT_EXISTS_noop
      - without_IF_NOT_EXISTS_error
      coverage_requirement: all_values
    pg_prefix_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - pg_prefix_schema_name
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_CREATE_on_database
      - cannot_SET_ROLE_to_owner
      coverage_requirement: all_values
    if_not_exists_with_elements:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - if_not_exists_with_schema_elements
      coverage_requirement: all_values
    forward_reference_in_elements:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - forward_reference_failure
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - pg_namespace_catalog_query
      - information_schema_schemata
      - current_schema_query
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - DROP_SCHEMA
      - DROP_SCHEMA_IF_EXISTS
      - DROP_SCHEMA_CASCADE
      coverage_requirement: all_values
dynamic_inputs:
  schema_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/schema_manifest.json
    required_fields:
    - schema_name
    - object_state
    - owner
    - exists_before_statement
  role_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - role_name
    - privilege_context
    - can_set_role
  schema_dependency_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/schema_dependency_manifest.json
    required_fields:
    - contained_objects_state
    - cross_schema_dependency
    - schema_element_dependency
combination_groups:
- id: create_schema_required_factor_value_matrix
  title: CREATE SCHEMA required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - duplicate_schema_name
  - pg_prefix_name
  - insufficient_privilege
  - if_not_exists_with_elements
  - forward_reference_in_elements
  factors:
    statement_branch: branch_named_schema
    object_state: not_exists
    expected_status: success
    if_not_exists_clause: absent
    authorization_clause: absent
    schema_element_inclusion: without_elements
    role_specification_form: user_name
    schema_name_shape: simple
    owner_name_shape: existing_role
    privilege_level: superuser
    database_privilege: has_CREATE_privilege
    role_dependency: role_exists
    schema_element_dependency: element_table_exists
    duplicate_schema_name: with_IF_NOT_EXISTS_noop
    pg_prefix_name: pg_prefix_schema_name
    insufficient_privilege: no_CREATE_on_database
    if_not_exists_with_elements: if_not_exists_with_schema_elements
    forward_reference_in_elements: forward_reference_failure
    verification_mode: pg_namespace_catalog_query
    cleanup_mode: DROP_SCHEMA
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_named_schema
      - branch_auth_schema
      - branch_if_not_exists_named
      - branch_if_not_exists_auth
    object_state:
      mode: explicit
      values:
      - not_exists
      - already_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_not_exists_clause:
      mode: explicit
      values:
      - present
      - absent
    authorization_clause:
      mode: explicit
      values:
      - absent
      - explicit_user
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
    schema_element_inclusion:
      mode: explicit
      values:
      - without_elements
      - with_create_table
      - with_create_view
      - with_multiple_elements
    role_specification_form:
      mode: explicit
      values:
      - user_name
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
    schema_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - reserved_word
      - pg_prefix_reserved
      - non_existent
    owner_name_shape:
      mode: explicit
      values:
      - existing_role
      - non_existing_role
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
    privilege_level:
      mode: explicit
      values:
      - superuser
      - schema_creator
      - non_creator_no_privilege
    database_privilege:
      mode: explicit
      values:
      - has_CREATE_privilege
      - no_CREATE_privilege
    role_dependency:
      mode: explicit
      values:
      - role_exists
      - role_not_exists
      - can_SET_ROLE
      - cannot_SET_ROLE
    schema_element_dependency:
      mode: explicit
      values:
      - element_table_exists
      - element_table_not_exists
      - element_view_dependency
    duplicate_schema_name:
      mode: explicit
      values:
      - with_IF_NOT_EXISTS_noop
      - without_IF_NOT_EXISTS_error
    pg_prefix_name:
      mode: explicit
      values:
      - pg_prefix_schema_name
    insufficient_privilege:
      mode: explicit
      values:
      - no_CREATE_on_database
      - cannot_SET_ROLE_to_owner
    if_not_exists_with_elements:
      mode: explicit
      values:
      - if_not_exists_with_schema_elements
    forward_reference_in_elements:
      mode: explicit
      values:
      - forward_reference_failure
    verification_mode:
      mode: explicit
      values:
      - pg_namespace_catalog_query
      - information_schema_schemata
      - current_schema_query
    cleanup_mode:
      mode: explicit
      values:
      - DROP_SCHEMA
      - DROP_SCHEMA_IF_EXISTS
      - DROP_SCHEMA_CASCADE
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and object_state not in [not_exists, absent, already_exists, reserved_name_conflict]
    - statement-specific dependencies, privileges, names, and environment factors are compatible with the selected branch
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: object_state in [not_exists, absent] without IF EXISTS-style tolerance
      reason: target_object_missing
    - condition: privilege or role ability factor selects an insufficient-permission value
      reason: privilege_denied
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: CREATE SCHEMA {if_not_exists_clause} {schema_name} {authorization_clause} {schema_elements};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT nspname FROM pg_namespace WHERE nspname = '{schema_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP SCHEMA IF EXISTS {schema_name} CASCADE;
