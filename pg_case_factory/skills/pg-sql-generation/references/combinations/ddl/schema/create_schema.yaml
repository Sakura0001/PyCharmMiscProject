      values:
      - if_not_exists_with_schema_elements
    forward_reference_in_elements:
      mode: explicit
      values:
      - forward_reference_failure
  compatibility:
    resolver: declared_matrix
    success_when:
    - failure boundary values are disabled and expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: target object, role, privilege, dependency, or environment boundary is invalid
      reason: statement_specific_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: CREATE SCHEMA {if_not_exists_clause} {schema_name} {authorization_clause} {schema_elements};
  verification:
    required: true
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP SCHEMA IF EXISTS {schema_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
