schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_materialized_view
  name: ALTER MATERIALIZED VIEW
  category: ddl
  domain: materialized_view
  source_reference: references/statements/ddl/materialized_view/alter_materialized_view.md
  aliases:
  - alter materialized view
  - ALTER MATERIALIZED VIEW
  official_source: https://www.postgresql.org/docs/16/sql-altermaterializedview.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before derived extension combinations are emitted.
  - Derived extensions may add stress, boundary, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not count toward required factor, table, relation, object, or column-type coverage.
  - Derived extensions must use declared factors and values from the statement reference.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - materialized_view
    decision_reason: >
      ALTER MATERIALIZED VIEW operates on an existing materialized_view object and must distinguish existing,
      missing, and wrong-object-type targets.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - materialized_view
    negative_relation_kinds:
    - regular_table
    - plain_view
    - foreign_table
    - sequence
    decision_reason: >
      The valid target relation kind is materialized_view. Regular tables, plain views, foreign tables, and
      sequences are negative controls for wrong-object-type failures.
  table_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - partitioned_table_parent
    decision_reason: >
      ALTER MATERIALIZED VIEW changes a table-like relation but does not execute a new source-table query.
      Representative table-backed setup is enough for storage, ownership, schema, and dependency branch coverage.
  column_type_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: representative_column_metadata_types
    require_each_type_success_or_failure: false
    decision_reason: >
      Column-level ALTER actions target metadata such as statistics, storage, compression, and column rename.
      Exhaustive PG16 type coverage is not required because the branch behavior is not an operator-class matrix.
      Representative materialized-view columns must include scalar, collatable text, datetime, jsonb, array, and
      user-defined enum/domain/composite columns so query-derived column metadata is exercised.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_action
      - branch_depends_extension
      - branch_rename_column
      - branch_rename
      - branch_set_schema
      - branch_set_tablespace_all
      coverage_requirement: all_values
    target_object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - missing
      - wrong_object_type
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: success_failure_pair
    alter_action_type:
      tier: T2
      coverage_role: main_axis
      required_values:
      - set_statistics
      - set_attribute_option
      - reset_attribute_option
      - set_storage
      - set_compression
      - cluster_on
      - set_without_cluster
      - set_access_method
      - set_tablespace
      - set_storage_parameter
      - reset_storage_parameter
      - owner_to
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - absent
      - present
      coverage_requirement: all_values
    new_owner_shape:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - plain_role
      - current_role
      - current_user
      - session_user
      - missing_role
      coverage_requirement: all_values
    privilege_context:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - owner
      - granted_role
      - insufficient_privilege
      coverage_requirement: success_failure_pair
    name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      coverage_requirement: all_values
    column_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - plain_identifier
      - quoted_identifier
      coverage_requirement: all_values
    dependency_state:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - ready
      - missing_dependency
      coverage_requirement: success_failure_pair
    extension_state:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - extension_exists
      - extension_missing
      coverage_requirement: success_failure_pair
    invalid_combination:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: all_values
    ownership_boundary:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - owner
      - member_role
      - non_owner
      coverage_requirement: success_failure_pair
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - catalog_query
      - effect_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  materialized_view_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/materialized_view_manifest.json
    required_fields:
    - materialized_view_name
    - schema_name
    - columns
    - is_populated
    - owner_role
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - owner_role
    - member_role
    - non_owner_role
  environment_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/ddl_environment_manifest.json
    required_fields:
    - extension_name
    - source_tablespace
    - target_tablespace
    - target_schema
combination_groups:
- id: action_branch_success_all_action_types
  title: Successful action branch coverage for column and storage operations
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_action
    target_object_state: exists
    expected_status: success
    alter_action_type: set_statistics
    if_exists_clause: absent
    new_owner_shape: plain_role
    privilege_context: owner
    name_shape: plain_identifier
    column_name_shape: plain_identifier
    dependency_state: ready
    extension_state: extension_exists
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: catalog_query
    cleanup_mode: drop_objects
  expansion:
    alter_action_type:
      mode: explicit
      values:
      - set_statistics
      - set_attribute_option
      - reset_attribute_option
      - set_storage
      - set_compression
      - cluster_on
      - set_without_cluster
      - set_access_method
      - set_tablespace
      - set_storage_parameter
      - reset_storage_parameter
      - owner_to
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    privilege_context:
      mode: explicit
      values:
      - owner
      - granted_role
    name_shape:
      mode: explicit
      values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
    column_name_shape:
      mode: explicit
      values:
      - plain_identifier
      - quoted_identifier
    ownership_boundary:
      mode: explicit
      values:
      - owner
      - member_role
    verification_mode:
      mode: explicit
      values:
      - catalog_query
      - effect_query
    cleanup_mode:
      mode: explicit
      values:
      - drop_objects
      - reset_state
  compatibility:
    resolver: declared_matrix
    success_when:
    - target_object_state == exists and privilege_context in [owner, granted_role] and dependency_state == ready
    failure_when: []
    default_failure_reason: not_applicable
  sql_shape:
    template: ALTER MATERIALIZED VIEW {if_exists_sql} {qualified_materialized_view_name} {alter_action_sql};
  verification:
    required: true
    mode: catalog_query
    sql: SELECT relname FROM pg_class WHERE oid = '{qualified_materialized_view_name}'::regclass AND relkind = 'm';
  cleanup:
    required: true
    steps:
    - sql: DROP MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name};
- id: top_level_branch_successes
  title: Successful non-action ALTER MATERIALIZED VIEW branches
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_rename
    target_object_state: exists
    expected_status: success
    alter_action_type: set_storage_parameter
    if_exists_clause: absent
    new_owner_shape: plain_role
    privilege_context: owner
    name_shape: schema_qualified
    column_name_shape: quoted_identifier
    dependency_state: ready
    extension_state: extension_exists
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: effect_query
    cleanup_mode: reset_state
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_depends_extension
      - branch_rename_column
      - branch_rename
      - branch_set_schema
      - branch_set_tablespace_all
  compatibility:
    resolver: declared_matrix
    success_when:
    - target_object_state == exists and extension_state == extension_exists and privilege_context == owner
    failure_when: []
    default_failure_reason: not_applicable
  sql_shape:
    template: ALTER MATERIALIZED VIEW {qualified_materialized_view_name} {branch_specific_clause};
  verification:
    required: true
    mode: effect_query
    sql: SELECT relname, relnamespace::regnamespace::text, reltablespace FROM pg_class WHERE relname = '{materialized_view_name}';
  cleanup:
    required: true
    steps:
    - sql: ALTER MATERIALIZED VIEW IF EXISTS {renamed_materialized_view_name} RENAME TO {materialized_view_name};
    - sql: DROP MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name};
- id: owner_to_role_shapes
  title: OWNER TO role-shape variants
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - role_does_not_exist
  factors:
    statement_branch: branch_action
    target_object_state: exists
    expected_status: success
    alter_action_type: owner_to
    if_exists_clause: absent
    new_owner_shape: plain_role
    privilege_context: owner
    name_shape: plain_identifier
    column_name_shape: plain_identifier
    dependency_state: ready
    extension_state: extension_exists
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: catalog_query
    cleanup_mode: reset_state
  expansion:
    new_owner_shape:
      mode: explicit
      values:
      - plain_role
      - current_role
      - current_user
      - session_user
      - missing_role
  compatibility:
    resolver: declared_matrix
    success_when:
    - new_owner_shape in [plain_role, current_role, current_user, session_user]
    failure_when:
    - condition: new_owner_shape == missing_role
      reason: role_does_not_exist
    default_failure_reason: role_does_not_exist
  sql_shape:
    template: ALTER MATERIALIZED VIEW {qualified_materialized_view_name} OWNER TO {new_owner_sql};
  verification:
    required: true
    mode: catalog_query
    sql: SELECT relowner::regrole::text FROM pg_class WHERE oid = '{qualified_materialized_view_name}'::regclass;
  cleanup:
    required: true
    steps:
    - sql: ALTER MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name} OWNER TO {owner_role};
- id: missing_and_wrong_target_failures
  title: Missing target, IF EXISTS no-op, and wrong-object-type failures
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: failure
  expected_failure_reasons:
  - materialized_view_does_not_exist
  - wrong_object_type
  factors:
    statement_branch: branch_action
    target_object_state: missing
    expected_status: failure
    alter_action_type: set_statistics
    if_exists_clause: absent
    new_owner_shape: plain_role
    privilege_context: owner
    name_shape: plain_identifier
    column_name_shape: plain_identifier
    dependency_state: ready
    extension_state: extension_exists
    invalid_combination: object_type_mismatch
    ownership_boundary: owner
    verification_mode: error_assertion
    cleanup_mode: drop_objects
  expansion:
    target_object_state:
      mode: explicit
      values:
      - missing
      - wrong_object_type
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    invalid_combination:
      mode: explicit
      values:
      - object_type_mismatch
  compatibility:
    resolver: declared_matrix
    success_when:
    - target_object_state == missing and if_exists_clause == present
    failure_when:
    - condition: target_object_state == missing and if_exists_clause == absent
      reason: materialized_view_does_not_exist
    - condition: target_object_state == wrong_object_type
      reason: wrong_object_type
    default_failure_reason: alter_materialized_view_target_invalid
  sql_shape:
    template: ALTER MATERIALIZED VIEW {if_exists_sql} {qualified_materialized_view_name} ALTER COLUMN {column_name} SET STATISTICS {statistics_target};
  verification:
    required: false
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name};
    - sql: DROP TABLE IF EXISTS {wrong_type_relation_name};
- id: dependency_and_extension_failures
  title: Missing dependency and missing extension dependency failures
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: failure
  expected_failure_reasons:
  - dependency_not_ready
  - extension_does_not_exist
  factors:
    statement_branch: branch_depends_extension
    target_object_state: exists
    expected_status: failure
    alter_action_type: set_storage_parameter
    if_exists_clause: absent
    new_owner_shape: plain_role
    privilege_context: owner
    name_shape: schema_qualified
    column_name_shape: plain_identifier
    dependency_state: missing_dependency
    extension_state: extension_missing
    invalid_combination: syntax_valid_semantic_error
    ownership_boundary: owner
    verification_mode: error_assertion
    cleanup_mode: reset_state
  expansion:
    dependency_state:
      mode: explicit
      values:
      - missing_dependency
    extension_state:
      mode: explicit
      values:
      - extension_missing
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: dependency_state == missing_dependency
      reason: dependency_not_ready
    - condition: extension_state == extension_missing
      reason: extension_does_not_exist
    default_failure_reason: alter_materialized_view_dependency_invalid
  sql_shape:
    template: ALTER MATERIALIZED VIEW {qualified_materialized_view_name} DEPENDS ON EXTENSION {extension_name};
  verification:
    required: false
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: ALTER MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name} NO DEPENDS ON EXTENSION {extension_name};
    - sql: DROP MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name};
- id: privilege_and_ownership_failures
  title: Privilege and ownership boundary failures
  lifecycle_role: target_statement
  expected_status_policy: per_lifecycle_context
  default_expected_status: failure
  expected_failure_reasons:
  - must_be_owner_of_materialized_view
  - permission_denied_for_schema_or_tablespace
  factors:
    statement_branch: branch_set_schema
    target_object_state: exists
    expected_status: failure
    alter_action_type: set_tablespace
    if_exists_clause: absent
    new_owner_shape: current_role
    privilege_context: insufficient_privilege
    name_shape: quoted_identifier
    column_name_shape: quoted_identifier
    dependency_state: ready
    extension_state: extension_exists
    invalid_combination: syntax_valid_semantic_error
    ownership_boundary: non_owner
    verification_mode: error_assertion
    cleanup_mode: reset_state
  expansion:
    privilege_context:
      mode: explicit
      values:
      - insufficient_privilege
    invalid_combination:
      mode: explicit
      values:
      - syntax_valid_semantic_error
    ownership_boundary:
      mode: explicit
      values:
      - non_owner
    verification_mode:
      mode: explicit
      values:
      - error_assertion
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: ownership_boundary == non_owner
      reason: must_be_owner_of_materialized_view
    - condition: privilege_context == insufficient_privilege
      reason: permission_denied_for_schema_or_tablespace
    default_failure_reason: alter_materialized_view_privilege_failure
  sql_shape:
    template: ALTER MATERIALIZED VIEW {qualified_materialized_view_name} SET SCHEMA {target_schema};
  verification:
    required: false
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: ALTER MATERIALIZED VIEW IF EXISTS {target_schema}.{materialized_view_name} SET SCHEMA {schema_name};
    - sql: DROP MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name};
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
