schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_materialized_view
  name: DROP MATERIALIZED VIEW
  category: ddl
  domain: materialized_view
  source_reference: references/statements/ddl/materialized_view/drop_materialized_view.md
  aliases:
  - drop materialized view
  - DROP MATERIALIZED VIEW
  official_source: https://www.postgresql.org/docs/16/sql-dropmaterializedview.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before derived extension combinations are emitted.
  - Derived extensions may add stress, boundary, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not count toward required factor, table, relation, object, or column-type coverage.
  - Derived extensions must use declared factors and values from the statement reference.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - materialized_view
    decision_reason: >
      DROP MATERIALIZED VIEW removes materialized_view objects and must cover existing, missing,
      dependent, and wrong-object-type targets.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - materialized_view
    negative_relation_kinds:
    - regular_table
    - plain_view
    - foreign_table
    - sequence
    decision_reason: >
      The valid target relation kind is materialized_view. Other relation kinds are negative controls for
      object-type mismatch and name-conflict behavior.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: >
      DROP MATERIALIZED VIEW is object-level DDL. It does not create, read, transform, index, store, or validate
      table columns, so table-kind coverage is not part of the required baseline.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: >
      DROP MATERIALIZED VIEW does not inspect query result columns or materialized-view column types. Column-type
      coverage is therefore not applicable; dependency and CASCADE/RESTRICT behavior are covered through object
      and relation state factors instead.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_1
      coverage_requirement: all_values
    target_object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - missing
      - exists_with_dependents
      - wrong_object_type
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: success_failure_pair
    if_exists_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - absent
      - present
      coverage_requirement: all_values
    cascade_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - restrict_default
      - restrict_explicit
      - cascade
      coverage_requirement: all_values
    privilege_context:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - owner
      - granted_role
      - insufficient_privilege
      coverage_requirement: success_failure_pair
    name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - missing_object
      coverage_requirement: all_values
    dependency_state:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - no_dependents
      - has_dependents
      coverage_requirement: all_values
    cascade_behavior:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - restrict_blocks
      - cascade_succeeds
      coverage_requirement: all_values
    invalid_combination:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: all_values
    ownership_boundary:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - owner
      - member_role
      - non_owner
      coverage_requirement: success_failure_pair
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - catalog_query
      - effect_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  materialized_view_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/materialized_view_manifest.json
    required_fields:
    - materialized_view_name
    - schema_name
    - has_dependents
    - owner_role
  dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/dependency_manifest.json
    required_fields:
    - dependent_object_name
    - dependent_object_kind
    - dependency_sql
  role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - owner_role
    - member_role
    - non_owner_role
combination_groups:
- id: drop_existing_without_dependents_success
  title: Successful drop of existing materialized views without dependents
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_1
    target_object_state: exists
    expected_status: success
    if_exists_clause: absent
    cascade_clause: restrict_default
    privilege_context: owner
    name_shape: plain_identifier
    dependency_state: no_dependents
    cascade_behavior: cascade_succeeds
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: catalog_query
    cleanup_mode: drop_objects
  expansion:
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    cascade_clause:
      mode: explicit
      values:
      - restrict_default
      - restrict_explicit
    privilege_context:
      mode: explicit
      values:
      - owner
      - granted_role
    name_shape:
      mode: explicit
      values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
    ownership_boundary:
      mode: explicit
      values:
      - owner
      - member_role
    verification_mode:
      mode: explicit
      values:
      - catalog_query
      - effect_query
    cleanup_mode:
      mode: explicit
      values:
      - drop_objects
      - reset_state
  compatibility:
    resolver: declared_matrix
    success_when:
    - target_object_state == exists and dependency_state == no_dependents and privilege_context in [owner, granted_role]
    failure_when: []
    default_failure_reason: not_applicable
  sql_shape:
    template: DROP MATERIALIZED VIEW {if_exists_sql} {qualified_materialized_view_name} {cascade_sql};
  verification:
    required: true
    mode: catalog_query
    sql: SELECT to_regclass('{qualified_materialized_view_name}') IS NULL AS dropped;
  cleanup:
    required: true
    steps:
    - sql: DROP MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name} CASCADE;
- id: dependent_restrict_and_cascade_paths
  title: Dependent object behavior for RESTRICT and CASCADE
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: failure
  expected_failure_reasons:
  - dependent_objects_still_exist
  factors:
    statement_branch: branch_1
    target_object_state: exists_with_dependents
    expected_status: failure
    if_exists_clause: absent
    cascade_clause: restrict_default
    privilege_context: owner
    name_shape: schema_qualified
    dependency_state: has_dependents
    cascade_behavior: restrict_blocks
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: error_assertion
    cleanup_mode: drop_objects
  expansion:
    cascade_clause:
      mode: explicit
      values:
      - restrict_default
      - restrict_explicit
      - cascade
    dependency_state:
      mode: explicit
      values:
      - has_dependents
    cascade_behavior:
      mode: explicit
      values:
      - restrict_blocks
      - cascade_succeeds
  compatibility:
    resolver: declared_matrix
    success_when:
    - cascade_clause == cascade and cascade_behavior == cascade_succeeds
    failure_when:
    - condition: cascade_clause in [restrict_default, restrict_explicit] and dependency_state == has_dependents
      reason: dependent_objects_still_exist
    default_failure_reason: dependent_objects_still_exist
  sql_shape:
    template: DROP MATERIALIZED VIEW {qualified_materialized_view_name} {cascade_sql};
  verification:
    required: false
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP MATERIALIZED VIEW IF EXISTS {qualified_materialized_view_name} CASCADE;
- id: missing_target_and_if_exists_noop
  title: Missing target failure and IF EXISTS no-op
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: failure
  expected_failure_reasons:
  - materialized_view_does_not_exist
  factors:
    statement_branch: branch_1
    target_object_state: missing
    expected_status: failure
    if_exists_clause: absent
    cascade_clause: restrict_default
    privilege_context: owner
    name_shape: missing_object
    dependency_state: no_dependents
    cascade_behavior: cascade_succeeds
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: error_assertion
    cleanup_mode: drop_objects
  expansion:
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    name_shape:
      mode: explicit
      values:
      - missing_object
  compatibility:
    resolver: declared_matrix
    success_when:
    - target_object_state == missing and if_exists_clause == present
    failure_when:
    - condition: target_object_state == missing and if_exists_clause == absent
      reason: materialized_view_does_not_exist
    default_failure_reason: materialized_view_does_not_exist
  sql_shape:
    template: DROP MATERIALIZED VIEW {if_exists_sql} {missing_materialized_view_name};
  verification:
    required: false
    mode: error_assertion
    sql: null
  cleanup:
    required: false
- id: wrong_type_and_privilege_failures
  title: Wrong-object-type and privilege failures
  lifecycle_role: target_statement
  expected_status_policy: per_lifecycle_context
  default_expected_status: failure
  expected_failure_reasons:
  - wrong_object_type
  - must_be_owner_of_materialized_view
  factors:
    statement_branch: branch_1
    target_object_state: wrong_object_type
    expected_status: failure
    if_exists_clause: absent
    cascade_clause: restrict_explicit
    privilege_context: insufficient_privilege
    name_shape: quoted_identifier
    dependency_state: no_dependents
    cascade_behavior: restrict_blocks
    invalid_combination: object_type_mismatch
    ownership_boundary: non_owner
    verification_mode: error_assertion
    cleanup_mode: reset_state
  expansion:
    privilege_context:
      mode: explicit
      values:
      - insufficient_privilege
    invalid_combination:
      mode: explicit
      values:
      - syntax_valid_semantic_error
      - object_type_mismatch
    ownership_boundary:
      mode: explicit
      values:
      - non_owner
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: target_object_state == wrong_object_type
      reason: wrong_object_type
    - condition: ownership_boundary == non_owner or privilege_context == insufficient_privilege
      reason: must_be_owner_of_materialized_view
    default_failure_reason: drop_materialized_view_invalid_target_or_privilege
  sql_shape:
    template: DROP MATERIALIZED VIEW {qualified_wrong_type_relation_name} RESTRICT;
  verification:
    required: false
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {qualified_wrong_type_relation_name};
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
