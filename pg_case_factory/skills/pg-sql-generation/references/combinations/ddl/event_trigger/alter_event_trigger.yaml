schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_event_trigger
  name: ALTER EVENT TRIGGER
  category: ddl
  domain: event_trigger
  source_reference: references/statements/ddl/event_trigger/alter_event_trigger.md
  official_source: https://www.postgresql.org/docs/16/sql-altereventtrigger.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - event_trigger
    decision_reason: event_trigger statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: event_trigger statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: event_trigger statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: event_trigger statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_disable
      - branch_enable
      - branch_enable_replica
      - branch_enable_always
      - branch_owner
      - branch_rename
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    enable_mode:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - ENABLE
      - ENABLE REPLICA
      - ENABLE ALWAYS
      coverage_requirement: all_values
    new_owner_target:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - existing_role
      - nonexistent_role
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
      coverage_requirement: all_values
    rename_conflict:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - new_name_unique
      - new_name_exists
      coverage_requirement: all_values
    privilege_level:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - superuser
      - non_superuser
      coverage_requirement: all_values
    trigger_current_state:
      tier: T2
      coverage_role: main_axis
      required_values: &id008
      - enabled
      - disabled
      - enabled_replica
      - enabled_always
      coverage_requirement: all_values
    trigger_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id009
      - simple_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_values
    new_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id010
      - simple_id
      - quoted_id
      - reserved_word_as_name
      coverage_requirement: all_values
    new_owner_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id011
      - simple_id
      - quoted_id
      - special_token
      coverage_requirement: all_values
    session_replication_role:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id012
      - origin
      - replica
      - local
      coverage_requirement: all_values
    trigger_function_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id013
      - function_exists
      - function_not_exists
      coverage_requirement: all_values
    trigger_not_exist:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id014
      - trigger_exists
      - trigger_not_exists
      coverage_requirement: all_values
    privilege_denied_non_superuser:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id015
      - superuser_success
      - non_superuser_failure
      coverage_requirement: all_values
    rename_target_conflict:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id016
      - no_conflict
      - name_already_exists
      coverage_requirement: all_values
    owner_not_exist:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id017
      - role_exists
      - role_not_exists
      coverage_requirement: all_values
    alter_nonexistent_trigger:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id018
      - trigger_exists
      - trigger_not_exists
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id019
      - catalog_query_pg_event_trigger
      - catalog_query_evtenabled_field
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id020
      - drop_event_trigger
      - drop_function
      - cascade_cleanup
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: alter_event_trigger_declared_factor_baseline
  title: ALTER EVENT TRIGGER declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - alter_event_trigger_declared_failure
  factors:
    statement_branch: branch_disable
    object_state: exists
    expected_status: success
    enable_mode: ENABLE
    new_owner_target: existing_role
    rename_conflict: new_name_unique
    privilege_level: superuser
    trigger_current_state: enabled
    trigger_name_shape: simple_id
    new_name_shape: simple_id
    new_owner_shape: simple_id
    session_replication_role: origin
    trigger_function_state: function_exists
    trigger_not_exist: trigger_exists
    privilege_denied_non_superuser: superuser_success
    rename_target_conflict: no_conflict
    owner_not_exist: role_exists
    alter_nonexistent_trigger: trigger_exists
    verification_mode: catalog_query_pg_event_trigger
    cleanup_mode: drop_event_trigger
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    enable_mode:
      mode: explicit
      values: *id004
    new_owner_target:
      mode: explicit
      values: *id005
    rename_conflict:
      mode: explicit
      values: *id006
    privilege_level:
      mode: explicit
      values: *id007
    trigger_current_state:
      mode: explicit
      values: *id008
    trigger_name_shape:
      mode: explicit
      values: *id009
    new_name_shape:
      mode: explicit
      values: *id010
    new_owner_shape:
      mode: explicit
      values: *id011
    session_replication_role:
      mode: explicit
      values: *id012
    trigger_function_state:
      mode: explicit
      values: *id013
    trigger_not_exist:
      mode: explicit
      values: *id014
    privilege_denied_non_superuser:
      mode: explicit
      values: *id015
    rename_target_conflict:
      mode: explicit
      values: *id016
    owner_not_exist:
      mode: explicit
      values: *id017
    alter_nonexistent_trigger:
      mode: explicit
      values: *id018
    verification_mode:
      mode: explicit
      values: *id019
    cleanup_mode:
      mode: explicit
      values: *id020
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: alter_event_trigger_declared_failure
    default_failure_reason: alter_event_trigger_declared_failure
  sql_shape:
    template: ALTER EVENT TRIGGER {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for alter_event_trigger
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
