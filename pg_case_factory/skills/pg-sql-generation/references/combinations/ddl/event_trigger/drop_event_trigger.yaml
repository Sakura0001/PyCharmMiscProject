schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_event_trigger
  name: DROP EVENT TRIGGER
  category: ddl
  domain: event_trigger
  source_reference: references/statements/ddl/event_trigger/drop_event_trigger.md
  official_source: https://www.postgresql.org/docs/16/sql-dropeventtrigger.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - event_trigger
    decision_reason: event_trigger statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: event_trigger statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: event_trigger statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: event_trigger statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_drop_event_trigger
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - omitted
      - specified_if_exists
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - omitted_default_restrict
      - cascade
      - restrict
      coverage_requirement: all_values
    privilege_level:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - superuser
      - trigger_owner
      - non_owner
      coverage_requirement: all_values
    trigger_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - simple_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_values
    trigger_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id008
      - no_dependencies
      - has_dependencies
      coverage_requirement: all_values
    trigger_function_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - function_exists
      - function_dropped_after_trigger
      coverage_requirement: all_values
    trigger_not_exist_no_if_exists:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id010
      - trigger_exists
      - trigger_not_exists_no_if_exists
      coverage_requirement: all_values
    privilege_denied:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - owner_success
      - non_owner_failure
      - superuser_success
      coverage_requirement: all_values
    cascade_with_dependencies:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - cascade_success_with_dependencies
      - no_dependencies_cascade
      coverage_requirement: all_values
    restrict_with_dependencies:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id013
      - restrict_failure_with_dependencies
      - no_dependencies_restrict_success
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id014
      - catalog_query_pg_event_trigger_absence
      - error_assertion
      - notice_assertion_if_exists
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id015
      - drop_event_trigger
      - drop_function
      - cascade_cleanup
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: drop_event_trigger_declared_factor_baseline
  title: DROP EVENT TRIGGER declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - drop_event_trigger_declared_failure
  factors:
    statement_branch: branch_drop_event_trigger
    object_state: exists
    expected_status: success
    if_exists_clause: omitted
    cascade_restrict: omitted_default_restrict
    privilege_level: superuser
    trigger_name_shape: simple_id
    trigger_dependency: no_dependencies
    trigger_function_state: function_exists
    trigger_not_exist_no_if_exists: trigger_exists
    privilege_denied: owner_success
    cascade_with_dependencies: cascade_success_with_dependencies
    restrict_with_dependencies: restrict_failure_with_dependencies
    verification_mode: catalog_query_pg_event_trigger_absence
    cleanup_mode: drop_event_trigger
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    if_exists_clause:
      mode: explicit
      values: *id004
    cascade_restrict:
      mode: explicit
      values: *id005
    privilege_level:
      mode: explicit
      values: *id006
    trigger_name_shape:
      mode: explicit
      values: *id007
    trigger_dependency:
      mode: explicit
      values: *id008
    trigger_function_state:
      mode: explicit
      values: *id009
    trigger_not_exist_no_if_exists:
      mode: explicit
      values: *id010
    privilege_denied:
      mode: explicit
      values: *id011
    cascade_with_dependencies:
      mode: explicit
      values: *id012
    restrict_with_dependencies:
      mode: explicit
      values: *id013
    verification_mode:
      mode: explicit
      values: *id014
    cleanup_mode:
      mode: explicit
      values: *id015
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: drop_event_trigger_declared_failure
    default_failure_reason: drop_event_trigger_declared_failure
  sql_shape:
    template: DROP EVENT TRIGGER {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for drop_event_trigger
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
