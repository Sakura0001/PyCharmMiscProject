schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_type
  name: ALTER TYPE
  category: ddl
  domain: type
  source_reference: references/statements/ddl/type/alter_type.md
  official_source: https://www.postgresql.org/docs/16/sql-altertype.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline groups must pass audit before any extension is emitted.
  - Extensions may add additional branch permutations, dependency chains, or privilege cases.
  - Extensions must not satisfy required factor or conditional column-type coverage.
  - Extensions must use declared statement factors and declared factor values.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - type
    - composite_type
    - enum_type
    decision_reason: ALTER TYPE changes type-system objects. Composite, enum, base, and shell type categories are covered by factor axes; range-like user-defined types are represented by the generic type object kind when altered by shared forms such as rename, owner, or schema.
  target_relation_coverage:
    required: false
    coverage_mode: conditional
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: ALTER TYPE does not target relations directly. Relation behavior is conditional through typed_table_dependency for composite-type CASCADE and RESTRICT propagation.
  table_coverage:
    required: false
    coverage_mode: conditional
    decision_reason: Table coverage is only relevant when composite type changes propagate to typed tables; typed_table_dependency covers that boundary without requiring every table kind.
  column_type_coverage:
    required: false
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    decision_reason: ALTER TYPE is a type-definition change statement, not a table-column cross-type statement. The composite ALTER ATTRIBUTE TYPE branch conditionally covers declared new_attribute_type values; exhaustive all-PG16 column coverage is not required.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_owner
      - branch_rename
      - branch_set_schema
      - branch_rename_attribute
      - branch_add_attribute
      - branch_drop_attribute
      - branch_alter_attribute_type
      - branch_add_value
      - branch_rename_value
      - branch_set_property
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    type_category:
      tier: T2
      coverage_role: branch_binding
      required_values:
      - composite
      - enum
      - base
      - shell
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: conditional_composite_axis
      required_values:
      - none
      - cascade
      - restrict
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: conditional_drop_attribute_axis
      required_values:
      - absent
      - present
      coverage_requirement: all_values
    if_not_exists_clause:
      tier: T2
      coverage_role: conditional_add_value_axis
      required_values:
      - absent
      - present
      coverage_requirement: all_values
    enum_position_clause:
      tier: T2
      coverage_role: conditional_add_value_axis
      required_values:
      - absent
      - BEFORE
      - AFTER
      coverage_requirement: all_values
    role_specification:
      tier: T2
      coverage_role: conditional_owner_axis
      required_values:
      - new_owner_role
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
      coverage_requirement: all_values
    type_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - reserved_word
      - schema_qualified
      coverage_requirement: all_values
    attribute_name_shape:
      tier: T3
      coverage_role: conditional_composite_axis
      required_values:
      - simple
      - quoted
      - reserved_word
      coverage_requirement: all_values
    new_attribute_type:
      tier: T3
      coverage_role: conditional_composite_axis
      required_values:
      - integer
      - text
      - varchar
      - numeric
      - boolean
      - date
      - timestamp
      - jsonb
      coverage_requirement: representative_declared_values
    new_enum_value_shape:
      tier: T3
      coverage_role: conditional_enum_axis
      required_values:
      - simple_value
      - quoted_value
      - long_value
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_axis
      required_values:
      - superuser
      - type_owner
      - non_owner
      coverage_requirement: all_values
    typed_table_dependency:
      tier: T4
      coverage_role: conditional_composite_axis
      required_values:
      - no_typed_tables
      - has_typed_tables
      coverage_requirement: all_values
    attribute_usage_privilege:
      tier: T4
      coverage_role: conditional_composite_axis
      required_values:
      - has_USAGE
      - no_USAGE
      coverage_requirement: all_values
    owner_change_privilege:
      tier: T4
      coverage_role: conditional_owner_axis
      required_values:
      - can_SET_ROLE
      - cannot_SET_ROLE
      coverage_requirement: all_values
    schema_privilege:
      tier: T4
      coverage_role: conditional_schema_axis
      required_values:
      - has_CREATE
      - no_CREATE
      coverage_requirement: all_values
    new_owner_schema_privilege:
      tier: T4
      coverage_role: conditional_owner_axis
      required_values:
      - has_CREATE
      - no_CREATE
      coverage_requirement: all_values
    enum_transaction_state:
      tier: T4
      coverage_role: conditional_add_value_axis
      required_values:
      - inside_transaction
      - outside_transaction
      coverage_requirement: all_values
    non_existent_type:
      tier: T5
      coverage_role: negative_boundary
      required_values:
      - target_not_exists
      coverage_requirement: explicit_failure
    non_existent_attribute:
      tier: T5
      coverage_role: conditional_composite_boundary
      required_values:
      - attribute_not_exists_no_if_exists
      - attribute_not_exists_with_if_exists
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary
      required_values:
      - non_owner
      - non_superuser_set_property
      - no_USAGE_on_attribute_type
      coverage_requirement: all_values
    cascade_with_typed_tables:
      tier: T5
      coverage_role: conditional_composite_boundary
      required_values:
      - cascade_propagates_to_typed_tables
      coverage_requirement: explicit_boundary
    restrict_with_typed_tables:
      tier: T5
      coverage_role: conditional_composite_boundary
      required_values:
      - restrict_refuses_typed_tables
      coverage_requirement: explicit_failure
    enum_value_conflict:
      tier: T5
      coverage_role: conditional_enum_boundary
      required_values:
      - value_exists_no_if_not_exists
      - value_exists_with_if_not_exists
      coverage_requirement: all_values
    storage_plain_to_other_requires_superuser:
      tier: T5
      coverage_role: conditional_set_property_boundary
      required_values:
      - plain_to_extended_requires_superuser
      coverage_requirement: explicit_boundary
    storage_other_to_plain_never_allowed:
      tier: T5
      coverage_role: conditional_set_property_boundary
      required_values:
      - other_to_plain_never_allowed
      coverage_requirement: explicit_failure
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - pg_type_catalog_query
      - pg_attribute_query
      - information_schema_user_defined_types
      - enum_value_query
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - DROP_TYPE
      - DROP_TYPE_IF_EXISTS
      - DROP_TYPE_CASCADE
      coverage_requirement: all_values
dynamic_inputs:
  existing_type_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/existing_type_manifest.json
    required_fields:
    - type_name
    - type_category
    - owner_name
    - schema_name
    - setup_sql
    - cleanup_sql
combination_groups:
- id: alter_type_core_branch_baseline
  title: Core ALTER TYPE branches over existing type categories
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_rename
    object_state: exists
    expected_status: success
    type_category: composite
    type_name_shape: simple
    privilege_level: type_owner
    verification_mode: pg_type_catalog_query
    cleanup_mode: DROP_TYPE_IF_EXISTS
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_owner
      - branch_rename
      - branch_set_schema
      - branch_rename_attribute
      - branch_add_attribute
      - branch_drop_attribute
      - branch_alter_attribute_type
      - branch_add_value
      - branch_rename_value
      - branch_set_property
    type_category:
      mode: explicit
      values:
      - composite
      - enum
      - base
      - shell
  compatibility:
    resolver: declared_matrix
    success_when:
    - object_state == exists and privilege_level in [type_owner, superuser] and branch is valid for type_category
    failure_when:
    - condition: branch is not valid for type_category
      reason: alter_type_branch_not_valid_for_type_category
    default_failure_reason: alter_type_branch_binding_invalid
  sql_shape:
    template: ALTER TYPE {type_name} {alter_action};
  verification:
    required: true
    mode: pg_type_catalog_query
    sql: SELECT typname, typnamespace::regnamespace FROM pg_type WHERE typname = '{type_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TYPE IF EXISTS {type_name} CASCADE;
- id: owner_schema_and_name_baseline
  title: Owner, schema, and type-name form coverage
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_owner
    object_state: exists
    expected_status: success
    type_category: composite
    role_specification: new_owner_role
    owner_change_privilege: can_SET_ROLE
    schema_privilege: has_CREATE
    new_owner_schema_privilege: has_CREATE
    type_name_shape: schema_qualified
    verification_mode: information_schema_user_defined_types
    cleanup_mode: DROP_TYPE
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_owner
      - branch_rename
      - branch_set_schema
    role_specification:
      mode: explicit
      values:
      - new_owner_role
      - CURRENT_ROLE
      - CURRENT_USER
      - SESSION_USER
    owner_change_privilege:
      mode: explicit
      values:
      - can_SET_ROLE
      - cannot_SET_ROLE
    schema_privilege:
      mode: explicit
      values:
      - has_CREATE
      - no_CREATE
    new_owner_schema_privilege:
      mode: explicit
      values:
      - has_CREATE
      - no_CREATE
    type_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - reserved_word
      - schema_qualified
  compatibility:
    resolver: declared_matrix
    success_when:
    - owner and schema privileges are available
    failure_when:
    - condition: owner_change_privilege == cannot_SET_ROLE
      reason: owner_change_cannot_set_role
    - condition: schema_privilege == no_CREATE
      reason: target_schema_create_privilege_missing
    - condition: new_owner_schema_privilege == no_CREATE
      reason: new_owner_schema_create_privilege_missing
    default_failure_reason: owner_or_schema_privilege_invalid
  sql_shape:
    template: ALTER TYPE {type_name} {owner_rename_or_schema_action};
  verification:
    required: true
    mode: information_schema_user_defined_types
    sql: SELECT user_defined_type_schema, user_defined_type_name FROM information_schema.user_defined_types WHERE user_defined_type_name = '{type_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TYPE IF EXISTS {type_name} CASCADE;
- id: composite_attribute_action_baseline
  title: Composite attribute ALTER TYPE actions and typed-table boundaries
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_add_attribute
    object_state: exists
    expected_status: success
    type_category: composite
    cascade_restrict: none
    if_exists_clause: absent
    attribute_name_shape: simple
    new_attribute_type: integer
    typed_table_dependency: no_typed_tables
    attribute_usage_privilege: has_USAGE
    non_existent_attribute: attribute_not_exists_no_if_exists
    cascade_with_typed_tables: cascade_propagates_to_typed_tables
    restrict_with_typed_tables: restrict_refuses_typed_tables
    verification_mode: pg_attribute_query
    cleanup_mode: DROP_TYPE_CASCADE
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_rename_attribute
      - branch_add_attribute
      - branch_drop_attribute
      - branch_alter_attribute_type
    cascade_restrict:
      mode: explicit
      values:
      - none
      - cascade
      - restrict
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    attribute_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - reserved_word
    new_attribute_type:
      mode: explicit
      values:
      - integer
      - text
      - varchar
      - numeric
      - boolean
      - date
      - timestamp
      - jsonb
    typed_table_dependency:
      mode: explicit
      values:
      - no_typed_tables
      - has_typed_tables
    attribute_usage_privilege:
      mode: explicit
      values:
      - has_USAGE
      - no_USAGE
    non_existent_attribute:
      mode: explicit
      values:
      - attribute_not_exists_no_if_exists
      - attribute_not_exists_with_if_exists
  compatibility:
    resolver: declared_matrix
    success_when:
    - composite attribute exists or IF EXISTS suppresses the missing attribute and required USAGE exists
    failure_when:
    - condition: non_existent_attribute == attribute_not_exists_no_if_exists
      reason: composite_attribute_does_not_exist
    - condition: attribute_usage_privilege == no_USAGE
      reason: attribute_type_usage_privilege_missing
    - condition: typed_table_dependency == has_typed_tables and cascade_restrict == restrict
      reason: restrict_refuses_typed_table_dependency
    default_failure_reason: composite_attribute_alter_invalid
  sql_shape:
    template: ALTER TYPE {type_name} {composite_attribute_action};
  verification:
    required: true
    mode: pg_attribute_query
    sql: SELECT a.attname, a.atttypid::regtype FROM pg_attribute a JOIN pg_type t ON t.typrelid = a.attrelid WHERE t.typname = '{type_name}' AND a.attnum > 0;
  cleanup:
    required: true
    steps:
    - sql: DROP TYPE IF EXISTS {type_name} CASCADE;
- id: enum_value_action_baseline
  title: Enum ADD VALUE and RENAME VALUE coverage
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_add_value
    object_state: exists
    expected_status: success
    type_category: enum
    if_not_exists_clause: absent
    enum_position_clause: absent
    new_enum_value_shape: simple_value
    enum_transaction_state: outside_transaction
    enum_value_conflict: value_exists_no_if_not_exists
    verification_mode: enum_value_query
    cleanup_mode: DROP_TYPE_IF_EXISTS
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_add_value
      - branch_rename_value
    if_not_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    enum_position_clause:
      mode: explicit
      values:
      - absent
      - BEFORE
      - AFTER
    new_enum_value_shape:
      mode: explicit
      values:
      - simple_value
      - quoted_value
      - long_value
    enum_transaction_state:
      mode: explicit
      values:
      - inside_transaction
      - outside_transaction
    enum_value_conflict:
      mode: explicit
      values:
      - value_exists_no_if_not_exists
      - value_exists_with_if_not_exists
  compatibility:
    resolver: declared_matrix
    success_when:
    - enum value is new, or IF NOT EXISTS suppresses an existing value conflict
    failure_when:
    - condition: enum_value_conflict == value_exists_no_if_not_exists
      reason: enum_value_already_exists
    - condition: enum_transaction_state == inside_transaction and new value is used before commit
      reason: enum_value_not_usable_until_commit
    default_failure_reason: enum_value_action_invalid
  sql_shape:
    template: ALTER TYPE {type_name} {enum_value_action};
  verification:
    required: true
    mode: enum_value_query
    sql: SELECT enumlabel FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid WHERE t.typname = '{type_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TYPE IF EXISTS {type_name} CASCADE;
- id: set_property_privilege_and_storage_baseline
  title: Base type SET property privilege and storage boundaries
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: failure
  factors:
    statement_branch: branch_set_property
    object_state: exists
    expected_status: failure
    type_category: base
    privilege_level: non_owner
    insufficient_privilege: non_superuser_set_property
    storage_plain_to_other_requires_superuser: plain_to_extended_requires_superuser
    storage_other_to_plain_never_allowed: other_to_plain_never_allowed
    verification_mode: pg_type_catalog_query
    cleanup_mode: DROP_TYPE_CASCADE
  expansion:
    privilege_level:
      mode: explicit
      values:
      - superuser
      - type_owner
      - non_owner
    insufficient_privilege:
      mode: explicit
      values:
      - non_owner
      - non_superuser_set_property
      - no_USAGE_on_attribute_type
  compatibility:
    resolver: declared_matrix
    success_when:
    - privilege_level == superuser and storage target is allowed
    failure_when:
    - condition: insufficient_privilege == non_owner
      reason: alter_type_requires_type_owner
    - condition: insufficient_privilege == non_superuser_set_property
      reason: alter_type_set_property_requires_superuser
    - condition: storage_other_to_plain_never_allowed == other_to_plain_never_allowed
      reason: storage_cannot_be_changed_back_to_plain
    default_failure_reason: alter_type_set_property_invalid
  sql_shape:
    template: ALTER TYPE {type_name} SET ({type_property_assignment});
  verification:
    required: false
    mode: expected_error
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP TYPE IF EXISTS {type_name} CASCADE;
- id: missing_type_and_verification_cleanup_baseline
  title: Missing target type failure plus verification and cleanup rotation
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: failure
  factors:
    statement_branch: branch_rename
    object_state: not_exists
    expected_status: failure
    type_category: composite
    non_existent_type: target_not_exists
    verification_mode: pg_type_catalog_query
    cleanup_mode: DROP_TYPE_IF_EXISTS
  expansion:
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    verification_mode:
      mode: explicit
      values:
      - pg_type_catalog_query
      - pg_attribute_query
      - information_schema_user_defined_types
      - enum_value_query
    cleanup_mode:
      mode: explicit
      values:
      - DROP_TYPE
      - DROP_TYPE_IF_EXISTS
      - DROP_TYPE_CASCADE
  compatibility:
    resolver: declared_matrix
    success_when:
    - object_state == exists
    failure_when:
    - condition: object_state == not_exists
      reason: target_type_does_not_exist
    - condition: non_existent_type == target_not_exists
      reason: target_type_does_not_exist
    default_failure_reason: target_type_does_not_exist
  sql_shape:
    template: ALTER TYPE {missing_type_name} RENAME TO {new_type_name};
  verification:
    required: false
    mode: expected_error
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP TYPE IF EXISTS {missing_type_name} CASCADE;
    - sql: DROP TYPE IF EXISTS {new_type_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
