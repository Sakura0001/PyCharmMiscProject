schema_version: 1
kind: statement_combination_matrix
statement:
  key: truncate
  name: TRUNCATE
  category: ddl
  domain: table
  source_reference: references/statements/ddl/table/truncate.md
  aliases:
  - TRUNCATE
  - TRUNCATE TABLE
  official_source: https://www.postgresql.org/docs/16/sql-truncate.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline audit must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, lifecycle, or cross-factor combinations only after the baseline passes.
  - Derived extensions must not count toward required declared factor or column-type coverage.
  - Derived extensions must use only declared factors, declared values, and recorded derivation reasons.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: truncate targets table-backed relation objects; the baseline declares each object kind that can be created,
      modified, read, emptied, or removed by this statement.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    negative_relation_kinds:
    - plain_view
    - foreign_table
    - sequence
    decision_reason: truncate operates on table relations rather than arbitrary relation objects. Relation coverage is explicit
      so invalid non-table relation kinds remain negative controls.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: truncate behavior depends on table form, including permanent, temporary, unlogged, partitioned, and inherited
      table variants where the statement reference declares those states.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: conditional
    require_each_type_success_or_failure: false
    decision_reason: TRUNCATE removes stored rows and may reset identity sequences, but it does not inspect or coerce ordinary
      column values. Column-type coverage is conditional on a typed table manifest, with identity/sequence behavior covered
      by the identity_option and temporary-table factors rather than by exhaustive type branching.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - truncate_table
      - truncate_table_only
      - truncate_table_restart_identity
      - truncate_table_continue_identity
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - table_exists
      - table_does_not_exist
      - empty_table
      - non_empty_table
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    only_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - only
      - without_only
      coverage_requirement: all_values
    identity_option:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - restart_identity
      - continue_identity
      - none
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - cascade
      - restrict
      - none
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - schema_qualified
      - non_existent
      coverage_requirement: all_values
    multi_table:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - single
      - multiple
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - owner
      - superuser
      - truncate_privilege
      - insufficient_privilege
      coverage_requirement: all_values
    fk_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - no_fk_references
      - referenced_by_other_tables
      coverage_requirement: all_values
    non_existent_table:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - truncate_non_existent_table
      coverage_requirement: all_values
    fk_references_without_cascade:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - has_fk_ref_no_cascade
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - non_owner_truncate
      - no_truncate_privilege
      coverage_requirement: all_values
    temporary_table_truncation:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - temporary_table
      - temp_table_with_sequences
      coverage_requirement: all_values
    partitioned_table_behavior:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - partitioned_table_only
      - partitioned_table_with_descendants
      - single_partition
      coverage_requirement: all_values
    verification:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - select_count_zero
      - pg_class_relpages
      - sequence_reset_check
      - error_assertion
      coverage_requirement: all_values
    cleanup:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - drop_objects
      - restart_identity_resets_sequences
      - rollback
      - reinsert_data
      coverage_requirement: all_values
dynamic_inputs:
  table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/table_manifest.json
    required_fields:
    - table_name
    - relation_kind
    - table_kind
    - columns
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  row_state_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/row_state_manifest.json
    required_fields:
    - table_name
    - row_count
    - identity_sequences
    - fk_dependencies
combination_groups:
- id: truncate_declared_factor_baseline
  title: Declared factor baseline with all required statement-reference values
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: truncate_table
    object_state: table_exists
    expected_status: success
    only_clause: only
    identity_option: restart_identity
    cascade_restrict: cascade
    table_name_shape: simple
    multi_table: single
    privilege_level: owner
    fk_dependency: no_fk_references
    non_existent_table: none
    fk_references_without_cascade: none
    insufficient_privilege: none
    temporary_table_truncation: none
    partitioned_table_behavior: none
    verification: select_count_zero
    cleanup: drop_objects
  expansion:
    statement_branch:
      mode: explicit
      values:
      - truncate_table
      - truncate_table_only
      - truncate_table_restart_identity
      - truncate_table_continue_identity
    object_state:
      mode: explicit
      values:
      - table_exists
      - table_does_not_exist
      - empty_table
      - non_empty_table
    only_clause:
      mode: explicit
      values:
      - only
      - without_only
    identity_option:
      mode: explicit
      values:
      - restart_identity
      - continue_identity
      - none
    cascade_restrict:
      mode: explicit
      values:
      - cascade
      - restrict
      - none
    table_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - schema_qualified
      - non_existent
    multi_table:
      mode: explicit
      values:
      - single
      - multiple
    privilege_level:
      mode: explicit
      values:
      - owner
      - superuser
      - truncate_privilege
      - insufficient_privilege
    fk_dependency:
      mode: explicit
      values:
      - no_fk_references
      - referenced_by_other_tables
    non_existent_table:
      mode: explicit
      values:
      - none
      - truncate_non_existent_table
    fk_references_without_cascade:
      mode: explicit
      values:
      - none
      - has_fk_ref_no_cascade
    insufficient_privilege:
      mode: explicit
      values:
      - none
      - non_owner_truncate
      - no_truncate_privilege
    temporary_table_truncation:
      mode: explicit
      values:
      - none
      - temporary_table
      - temp_table_with_sequences
    partitioned_table_behavior:
      mode: explicit
      values:
      - none
      - partitioned_table_only
      - partitioned_table_with_descendants
      - single_partition
    verification:
      mode: explicit
      values:
      - select_count_zero
      - pg_class_relpages
      - sequence_reset_check
      - error_assertion
    cleanup:
      mode: explicit
      values:
      - drop_objects
      - restart_identity_resets_sequences
      - rollback
      - reinsert_data
    table_kinds:
      mode: explicit
      source: coverage_scope.table_coverage.required_table_kinds
    typed_table_manifests:
      mode: conditional
      source: coverage_scope.column_type_coverage.required_type_set
  compatibility:
    resolver: declared_matrix
    success_when:
    - binding is syntactically valid and prerequisite objects satisfy the selected factor values
    failure_when:
    - condition: binding selects a declared negative object state, dependency state, privilege state, or invalid syntax/input
        value
      reason: table_missing
    default_failure_reason: table_missing
  sql_shape:
    template: TRUNCATE TABLE {only_clause} {table_name} {identity_option} {cascade_restrict};
  verification:
    required: true
    mode: catalog_or_effect_query
    sql: SELECT relname, relkind FROM pg_class WHERE relname = '{table_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
- id: truncate_failure_attribution_baseline
  title: Declared failure attribution baseline
  lifecycle_role: negative_control
  expected_status_policy: fixed
  default_expected_status: failure
  expected_failure_reasons:
  - table_missing
  - fk_reference_requires_cascade_or_joint_truncate
  - insufficient_truncate_privilege
  factors:
    statement_branch: truncate_table
    object_state: table_does_not_exist
    expected_status: failure
    only_clause: only
    identity_option: restart_identity
    cascade_restrict: cascade
    table_name_shape: simple
    multi_table: single
    privilege_level: owner
    fk_dependency: no_fk_references
    non_existent_table: none
    fk_references_without_cascade: none
    insufficient_privilege: none
    temporary_table_truncation: none
    partitioned_table_behavior: none
    verification: select_count_zero
    cleanup: drop_objects
  expansion:
    expected_status:
      mode: explicit
      values:
      - failure
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: table_missing
      reason: table_missing
    - condition: fk_reference_requires_cascade_or_joint_truncate
      reason: fk_reference_requires_cascade_or_joint_truncate
    - condition: insufficient_truncate_privilege
      reason: insufficient_truncate_privilege
    default_failure_reason: table_missing
  sql_shape:
    template: TRUNCATE TABLE {only_clause} {table_name} {identity_option} {cascade_restrict};
  verification:
    required: true
    mode: expected_error_or_notice
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
