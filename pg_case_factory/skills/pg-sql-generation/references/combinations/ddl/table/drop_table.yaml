schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_table
  name: DROP TABLE
  category: ddl
  domain: table
  source_reference: references/statements/ddl/table/drop_table.md
  aliases:
  - drop_table
  - DROP TABLE
  - droptable
  - drop table
  official_source: https://www.postgresql.org/docs/16/sql-droptable.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline audit must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, lifecycle, or cross-factor combinations only after the baseline passes.
  - Derived extensions must not count toward required declared factor or column-type coverage.
  - Derived extensions must use only declared factors, declared values, and recorded derivation reasons.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: drop_table targets table-backed relation objects; the baseline declares each object kind that can be
      created, modified, read, emptied, or removed by this statement.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    negative_relation_kinds:
    - plain_view
    - foreign_table
    - sequence
    decision_reason: drop_table operates on table relations rather than arbitrary relation objects. Relation coverage is explicit
      so invalid non-table relation kinds remain negative controls.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: drop_table behavior depends on table form, including permanent, temporary, unlogged, partitioned, and
      inherited table variants where the statement reference declares those states.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: conditional
    require_each_type_success_or_failure: false
    decision_reason: DROP TABLE removes relation metadata and stored columns as part of the table object, but PostgreSQL does
      not branch DROP behavior by column data type. The baseline therefore uses typed table manifests to prove typed-column
      presence while required behavior coverage is driven by object state, dependencies, CASCADE/RESTRICT, and privilege factors.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_table
      - branch_drop_table_if_exists
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists_permanent
      - not_exists
      - exists_temporary
      - exists_unlogged
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - absent
      - present
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - none
      - cascade
      - restrict
      coverage_requirement: all_values
    table_type_permanence:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - permanent
      - temporary
      - unlogged
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - schema_qualified
      - non_existent
      - reserved_word
      coverage_requirement: all_values
    multi_table_drop:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - single_table
      - multi_table
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - owner
      - superuser
      - schema_owner
      - non_owner
      coverage_requirement: all_values
    dependency_state:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - no_dependents
      - has_views
      - has_fk_references
      - has_triggers
      - has_indexes
      - has_policies
      - has_rules
      coverage_requirement: all_values
    error_boundary:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - non_existent_without_if_exists
      - dependent_objects_without_cascade
      - insufficient_privilege
      - drop_table_in_use
      - self_referential_fk
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - pg_class_query
      - error_assertion
      - notice_assertion
      - effect_query
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - cascade_cleanup
      - manual_cleanup
      - rollback
      coverage_requirement: all_values
dynamic_inputs:
  table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/table_manifest.json
    required_fields:
    - table_name
    - relation_kind
    - table_kind
    - columns
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/dependency_manifest.json
    required_fields:
    - table_name
    - dependency_state
    - dependent_objects
combination_groups:
- id: drop_table_declared_factor_baseline
  title: Declared factor baseline with all required statement-reference values
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_drop_table
    object_state: exists_permanent
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: none
    table_type_permanence: permanent
    table_name_shape: simple
    multi_table_drop: single_table
    privilege_level: owner
    dependency_state: no_dependents
    error_boundary: none
    verification_mode: pg_class_query
    cleanup_mode: cascade_cleanup
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_table
      - branch_drop_table_if_exists
    object_state:
      mode: explicit
      values:
      - exists_permanent
      - not_exists
      - exists_temporary
      - exists_unlogged
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    cascade_restrict:
      mode: explicit
      values:
      - none
      - cascade
      - restrict
    table_type_permanence:
      mode: explicit
      values:
      - permanent
      - temporary
      - unlogged
    table_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - schema_qualified
      - non_existent
      - reserved_word
    multi_table_drop:
      mode: explicit
      values:
      - single_table
      - multi_table
    privilege_level:
      mode: explicit
      values:
      - owner
      - superuser
      - schema_owner
      - non_owner
    dependency_state:
      mode: explicit
      values:
      - no_dependents
      - has_views
      - has_fk_references
      - has_triggers
      - has_indexes
      - has_policies
      - has_rules
    error_boundary:
      mode: explicit
      values:
      - none
      - non_existent_without_if_exists
      - dependent_objects_without_cascade
      - insufficient_privilege
      - drop_table_in_use
      - self_referential_fk
    verification_mode:
      mode: explicit
      values:
      - pg_class_query
      - error_assertion
      - notice_assertion
      - effect_query
    cleanup_mode:
      mode: explicit
      values:
      - cascade_cleanup
      - manual_cleanup
      - rollback
    table_kinds:
      mode: explicit
      source: coverage_scope.table_coverage.required_table_kinds
    typed_table_manifests:
      mode: conditional
      source: coverage_scope.column_type_coverage.required_type_set
  compatibility:
    resolver: declared_matrix
    success_when:
    - binding is syntactically valid and prerequisite objects satisfy the selected factor values
    failure_when:
    - condition: binding selects a declared negative object state, dependency state, privilege state, or invalid syntax/input
        value
      reason: table_missing_without_if_exists
    default_failure_reason: table_missing_without_if_exists
  sql_shape:
    template: DROP TABLE {if_exists_clause} {table_name} {cascade_restrict};
  verification:
    required: true
    mode: catalog_or_effect_query
    sql: SELECT relname, relkind FROM pg_class WHERE relname = '{table_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
- id: drop_table_failure_attribution_baseline
  title: Declared failure attribution baseline
  lifecycle_role: negative_control
  expected_status_policy: fixed
  default_expected_status: failure
  expected_failure_reasons:
  - table_missing_without_if_exists
  - dependent_objects_block_restrict
  - insufficient_drop_privilege
  factors:
    statement_branch: branch_drop_table
    object_state: not_exists
    expected_status: failure
    if_exists_clause: absent
    cascade_restrict: none
    table_type_permanence: permanent
    table_name_shape: simple
    multi_table_drop: single_table
    privilege_level: owner
    dependency_state: no_dependents
    error_boundary: none
    verification_mode: pg_class_query
    cleanup_mode: cascade_cleanup
  expansion:
    expected_status:
      mode: explicit
      values:
      - failure
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: table_missing_without_if_exists
      reason: table_missing_without_if_exists
    - condition: dependent_objects_block_restrict
      reason: dependent_objects_block_restrict
    - condition: insufficient_drop_privilege
      reason: insufficient_drop_privilege
    default_failure_reason: table_missing_without_if_exists
  sql_shape:
    template: DROP TABLE {if_exists_clause} {table_name} {cascade_restrict};
  verification:
    required: true
    mode: expected_error_or_notice
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
