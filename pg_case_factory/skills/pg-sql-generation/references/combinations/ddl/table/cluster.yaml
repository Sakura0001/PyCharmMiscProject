schema_version: 1
kind: statement_combination_matrix
statement:
  key: cluster
  name: CLUSTER
  category: ddl
  domain: table
  source_reference: references/statements/ddl/table/cluster.md
  aliases:
  - CLUSTER
  - CLUSTER VERBOSE
  official_source: https://www.postgresql.org/docs/16/sql-cluster.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline audit must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, lifecycle, or cross-factor combinations only after the baseline passes.
  - Derived extensions must not count toward required declared factor or column-type coverage.
  - Derived extensions must use only declared factors, declared values, and recorded derivation reasons.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    decision_reason: cluster targets table-backed relation objects; the baseline declares each object kind that can be created,
      modified, read, emptied, or removed by this statement.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    negative_relation_kinds:
    - plain_view
    - foreign_table
    - sequence
    decision_reason: cluster operates on table relations rather than arbitrary relation objects. Relation coverage is explicit
      so invalid non-table relation kinds remain negative controls.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: cluster behavior depends on table form, including permanent, temporary, unlogged, partitioned, and inherited
      table variants where the statement reference declares those states.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: conditional
    require_each_type_success_or_failure: false
    decision_reason: CLUSTER rewrites table storage according to an existing index and does not declare, coerce, or validate
      column values itself. Column-type coverage is conditional on the prerequisite valid index and table manifest; method/type
      operator-class coverage belongs to CREATE INDEX, while this matrix covers CLUSTER index dependency behavior.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - cluster_table_using_index
      - cluster_table_recluster
      - cluster_verbose_table_using_index
      - cluster_verbose_table_recluster
      - cluster_paren_option_table_using_index
      - cluster_paren_option_table_recluster
      - cluster_all
      - cluster_verbose_all
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - table_exists_index_exists
      - table_exists_index_does_not_exist
      - table_does_not_exist
      - table_exists_clustered_index_recorded
      - table_exists_no_clustered_index_recorded
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    using_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - using_index
      - without_using
      coverage_requirement: all_values
    verbose_option:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - no_verbose
      - verbose_keyword
      - paren_verbose_true
      - paren_verbose_false
      coverage_requirement: all_values
    cluster_all:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - single_table
      - all_tables
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - schema_qualified
      - non_existent
      coverage_requirement: all_values
    index_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - non_existent
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - owner
      - superuser
      - insufficient_privilege
      coverage_requirement: all_values
    index_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - index_exists_on_table
      - index_not_on_table
      - no_clustered_index_recorded
      coverage_requirement: all_values
    partitioned_table:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - none
      - partitioned_table_with_partitioned_index
      - partitioned_table_without_index_specified
      coverage_requirement: all_values
    nonexistent_table:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - cluster_nonexistent_table
      coverage_requirement: all_values
    nonexistent_index:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - cluster_with_nonexistent_index
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - non_owner_cluster
      coverage_requirement: all_values
    index_not_on_table:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - index_belongs_to_different_table
      coverage_requirement: all_values
    transaction_block_restriction:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - cluster_all_inside_transaction_block
      coverage_requirement: all_values
    verification:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - pg_class_relclustered
      - physical_ordering_check
      - pg_stat_progress_cluster
      - error_assertion
      coverage_requirement: all_values
    cleanup:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - drop_objects
      - none
      coverage_requirement: all_values
dynamic_inputs:
  table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/table_manifest.json
    required_fields:
    - table_name
    - relation_kind
    - table_kind
    - columns
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  index_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/index_manifest.json
    required_fields:
    - index_name
    - table_name
    - valid
    - belongs_to_table
combination_groups:
- id: cluster_declared_factor_baseline
  title: Declared factor baseline with all required statement-reference values
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: cluster_table_using_index
    object_state: table_exists_index_exists
    expected_status: success
    using_clause: using_index
    verbose_option: no_verbose
    cluster_all: single_table
    table_name_shape: simple
    index_name_shape: simple
    privilege_level: owner
    index_dependency: index_exists_on_table
    partitioned_table: none
    nonexistent_table: none
    nonexistent_index: none
    insufficient_privilege: none
    index_not_on_table: none
    transaction_block_restriction: none
    verification: pg_class_relclustered
    cleanup: drop_objects
  expansion:
    statement_branch:
      mode: explicit
      values:
      - cluster_table_using_index
      - cluster_table_recluster
      - cluster_verbose_table_using_index
      - cluster_verbose_table_recluster
      - cluster_paren_option_table_using_index
      - cluster_paren_option_table_recluster
      - cluster_all
      - cluster_verbose_all
    object_state:
      mode: explicit
      values:
      - table_exists_index_exists
      - table_exists_index_does_not_exist
      - table_does_not_exist
      - table_exists_clustered_index_recorded
      - table_exists_no_clustered_index_recorded
    using_clause:
      mode: explicit
      values:
      - using_index
      - without_using
    verbose_option:
      mode: explicit
      values:
      - no_verbose
      - verbose_keyword
      - paren_verbose_true
      - paren_verbose_false
    cluster_all:
      mode: explicit
      values:
      - single_table
      - all_tables
    table_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - schema_qualified
      - non_existent
    index_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - non_existent
    privilege_level:
      mode: explicit
      values:
      - owner
      - superuser
      - insufficient_privilege
    index_dependency:
      mode: explicit
      values:
      - index_exists_on_table
      - index_not_on_table
      - no_clustered_index_recorded
    partitioned_table:
      mode: explicit
      values:
      - none
      - partitioned_table_with_partitioned_index
      - partitioned_table_without_index_specified
    nonexistent_table:
      mode: explicit
      values:
      - none
      - cluster_nonexistent_table
    nonexistent_index:
      mode: explicit
      values:
      - none
      - cluster_with_nonexistent_index
    insufficient_privilege:
      mode: explicit
      values:
      - none
      - non_owner_cluster
    index_not_on_table:
      mode: explicit
      values:
      - none
      - index_belongs_to_different_table
    transaction_block_restriction:
      mode: explicit
      values:
      - none
      - cluster_all_inside_transaction_block
    verification:
      mode: explicit
      values:
      - pg_class_relclustered
      - physical_ordering_check
      - pg_stat_progress_cluster
      - error_assertion
    cleanup:
      mode: explicit
      values:
      - drop_objects
      - none
    relation_kinds:
      mode: explicit
      source: coverage_scope.target_relation_coverage.required_relation_kinds
    index_manifest_states:
      mode: explicit
      values:
      - valid_index_on_table
      - missing_index
      - index_on_different_table
      - previously_clustered_index
  compatibility:
    resolver: declared_matrix
    success_when:
    - binding is syntactically valid and prerequisite objects satisfy the selected factor values
    failure_when:
    - condition: binding selects a declared negative object state, dependency state, privilege state, or invalid syntax/input
        value
      reason: cluster_target_or_index_missing
    default_failure_reason: cluster_target_or_index_missing
  sql_shape:
    template: CLUSTER {verbose_option} {table_name} {using_clause};
  verification:
    required: true
    mode: catalog_or_effect_query
    sql: SELECT relname, relkind FROM pg_class WHERE relname = '{table_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
- id: cluster_failure_attribution_baseline
  title: Declared failure attribution baseline
  lifecycle_role: negative_control
  expected_status_policy: fixed
  default_expected_status: failure
  expected_failure_reasons:
  - cluster_target_or_index_missing
  - cluster_index_not_on_table
  - cluster_all_transaction_block_forbidden
  - insufficient_privilege
  factors:
    statement_branch: cluster_table_using_index
    object_state: table_does_not_exist
    expected_status: failure
    using_clause: using_index
    verbose_option: no_verbose
    cluster_all: single_table
    table_name_shape: simple
    index_name_shape: simple
    privilege_level: owner
    index_dependency: index_exists_on_table
    partitioned_table: none
    nonexistent_table: none
    nonexistent_index: none
    insufficient_privilege: none
    index_not_on_table: none
    transaction_block_restriction: none
    verification: pg_class_relclustered
    cleanup: drop_objects
  expansion:
    expected_status:
      mode: explicit
      values:
      - failure
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: cluster_target_or_index_missing
      reason: cluster_target_or_index_missing
    - condition: cluster_index_not_on_table
      reason: cluster_index_not_on_table
    - condition: cluster_all_transaction_block_forbidden
      reason: cluster_all_transaction_block_forbidden
    - condition: insufficient_privilege
      reason: insufficient_privilege
    default_failure_reason: cluster_target_or_index_missing
  sql_shape:
    template: CLUSTER {verbose_option} {table_name} {using_clause};
  verification:
    required: true
    mode: expected_error_or_notice
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
