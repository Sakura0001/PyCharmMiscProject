      - table_02_simplified_types
      - table_03_partition_parent
      - table_04_unlogged
      coverage_requirement: all_values
    dependency_state:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - views_dependent
      - FK_dependent
      - indexes_dependent
      - triggers_dependent
      - policies_dependent
      - no_dependencies
      coverage_requirement: all_values
    schema_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
