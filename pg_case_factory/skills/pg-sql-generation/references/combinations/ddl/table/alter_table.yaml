      - quoted
      - reserved_word
      - duplicate
      coverage_requirement: all_values
    data_type:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - smallint
      - integer
      - bigint
      - real
      - double_precision
      - numeric
      - money
      - character_varying
      - character
      - text
      - bytea
      - date
      - time
