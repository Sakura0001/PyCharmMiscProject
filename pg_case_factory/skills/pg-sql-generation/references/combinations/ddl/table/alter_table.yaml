      - quoted
      - reserved_word
      - nonexistent
      coverage_requirement: all_values
    constraint_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - nonexistent
      coverage_requirement: all_values
    new_name_shape:
