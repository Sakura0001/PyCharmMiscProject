schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_table
  name: ALTER TABLE
  category: ddl
  domain: table
  source_reference: references/statements/ddl/table/alter_table.md
  aliases:
  - ALTER TABLE
  - alter table
  - alter_table
  official_source: https://www.postgresql.org/docs/16/sql-altertable.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline audit must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, lifecycle, or cross-factor combinations only after the baseline passes.
  - Derived extensions must not count toward required declared factor or column-type coverage.
  - Derived extensions must use only declared factors, declared values, and recorded derivation reasons.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: alter_table targets table-backed relation objects; the baseline declares each object kind that can be
      created, modified, read, emptied, or removed by this statement.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    negative_relation_kinds:
    - plain_view
    - foreign_table
    - sequence
    decision_reason: alter_table operates on table relations rather than arbitrary relation objects. Relation coverage is
      explicit so invalid non-table relation kinds remain negative controls.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: alter_table behavior depends on table form, including permanent, temporary, unlogged, partitioned, and
      inherited table variants where the statement reference declares those states.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: conditional
    require_each_type_success_or_failure: true
    decision_reason: ALTER TABLE changes column definitions for ADD COLUMN and ALTER COLUMN TYPE, and several other subcommands
      reference existing column types indirectly. The baseline covers every declared data_type and conversion value from the
      statement reference, while column-type expansion is conditional on subcommands that actually bind data_type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_1_action
      - branch_2_rename_column
      - branch_3_rename_constraint
      - branch_4_rename_table
      - branch_5_set_schema
      - branch_6_set_tablespace_batch
      - branch_7_attach_partition
      - branch_8_detach_partition
      coverage_requirement: all_values
    subcommand_category:
      tier: T1
      coverage_role: main_axis
      required_values:
      - add_column
      - drop_column
      - alter_column_type
      - alter_column_set_default
      - alter_column_drop_default
      - alter_column_set_drop_not_null
      - alter_column_drop_expression
      - alter_column_add_generated_identity
      - alter_column_set_generated_restart
      - alter_column_drop_identity
      - alter_column_set_statistics
      - alter_column_set_attribute_option
      - alter_column_reset_attribute_option
      - alter_column_set_storage
      - alter_column_set_compression
      - add_table_constraint
      - add_table_constraint_using_index
      - alter_constraint
      - validate_constraint
      - drop_constraint
      - disable_trigger
      - enable_trigger
      - enable_replica_trigger
      - enable_always_trigger
      - disable_rule
      - enable_rule
      - enable_replica_rule
      - enable_always_rule
      - disable_row_level_security
      - enable_row_level_security
      - force_row_level_security
      - no_force_row_level_security
      - cluster_on
      - set_without_cluster
      - set_without_oids
      - set_access_method
      - set_tablespace
      - set_logged_unlogged
      - set_storage_parameter
      - reset_storage_parameter
      - inherit
      - no_inherit
      - of_type
      - not_of
      - owner_to
      - replica_identity
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists_normal
      - exists_partitioned
      - exists_temporary
      - exists_unlogged
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - present
      - absent
      coverage_requirement: all_values
    if_not_exists_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - present
      - absent
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - CASCADE
      - RESTRICT
      - absent
      coverage_requirement: all_values
    only_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - present
      - absent
      coverage_requirement: all_values
    privilege_level:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - superuser
      - table_owner
      - non_owner_with_privilege
      - non_owner_no_privilege
      coverage_requirement: all_values
    column_type_conversion:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - compatible_no_using
      - compatible_with_collation
      - incompatible_with_using
      - incompatible_no_using_error
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - reserved_word
      - schema_qualified
      - nonexistent
      coverage_requirement: all_values
    column_name_shape:
