schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_table
  name: CREATE TABLE
  category: ddl
  domain: table
  source_reference: references/statements/ddl/table/create_table.md
  aliases:
  - CREATE TABLE
  - create table
  - create_table
  official_source: https://www.postgresql.org/docs/16/sql-createtable.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline audit must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, lifecycle, or cross-factor combinations only after the baseline passes.
  - Derived extensions must not count toward required declared factor or column-type coverage.
  - Derived extensions must use only declared factors, declared values, and recorded derivation reasons.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_child_table
    decision_reason: create_table targets table-backed relation objects; the baseline declares each object kind that can be
      created, modified, read, emptied, or removed by this statement.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    negative_relation_kinds:
    - plain_view
    - foreign_table
    - sequence
    - materialized_view
    decision_reason: create_table operates on table relations rather than arbitrary relation objects. Relation coverage is
      explicit so invalid non-table relation kinds remain negative controls.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: create_table behavior depends on table form, including permanent, temporary, unlogged, partitioned, and
      inherited table variants where the statement reference declares those states.
  column_type_coverage:
    required: true
    coverage_mode: exhaustive
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: exhaustive
    require_each_type_success_or_failure: true
    decision_reason: CREATE TABLE is the primary DDL statement that declares table columns. The baseline expands the declared
      data_type factor and requires every PostgreSQL 16 table-column type from the shared type catalog to resolve to a success
      or declared failure binding.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_1
      - branch_2
      - branch_3
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: rotate_attach
      required_values:
      - not_exists
      - already_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    table_type:
      tier: T2
      coverage_role: main_axis
      required_values:
      - permanent
      - temporary_global
      - temporary_local
      - temp_short
      - unlogged
      coverage_requirement: all_values
    if_not_exists_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - present
      - absent
      coverage_requirement: all_values
    column_definition_count:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - single_column
      - multiple_columns
      coverage_requirement: all_values
    constraint_type:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - PRIMARY_KEY
      - UNIQUE
      - CHECK
      - FOREIGN_KEY
      - EXCLUDE
      - NOT_NULL
      - null
      - DEFAULT
      - GENERATED_ALWAYS_STORED
      - GENERATED_IDENTITY
      coverage_requirement: all_values
    partition_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - RANGE
      - LIST
      - HASH
      - not_partitioned
      coverage_requirement: all_values
    inheritance_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - INHERITS
      - no_inheritance
      coverage_requirement: all_values
    like_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - LIKE_with_options
      - LIKE_no_options
      - no_LIKE
      coverage_requirement: all_values
    on_commit_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - PRESERVE_ROWS
      - DELETE_ROWS
      - DROP
      - absent
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - reserved_word
      - schema_qualified
      - duplicate
      coverage_requirement: all_values
    column_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - reserved_word
      - duplicate_in_table
      coverage_requirement: all_values
    data_type:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - smallint
      - integer
      - bigint
      - smallserial
      - serial
      - bigserial
      - real
      - double_precision
      - numeric
      - decimal
      - money
      - character_varying
      - character
      - text
      - bytea
      - date
      - time
      - time_with_time_zone
      - timestamp
      - timestamp_with_time_zone
      - interval
      - boolean
      - point
      - line
      - lseg
      - box
      - path
      - polygon
      - circle
      - cidr
      - inet
      - macaddr
      - macaddr8
      - bit
      - bit_varying
      - tsvector
      - tsquery
      - uuid
      - xml
      - json
      - jsonb
      - integer_array
      - text_array
      - varchar_array
      - numeric_array
      - timestamp_array
      - jsonb_array
      - int4range
      - int8range
      - numrange
      - tsrange
      - tstzrange
      - daterange
      - composite_type
      - enum_type
      - oid
      - regclass
      - regtype
      - regproc
      - regnamespace
      - regrole
      - pg_lsn
      - name
      - tid
      - xid
      - xid8
      - cid
      - aclitem
      - pg_snapshot
      coverage_requirement: all_values
    default_value_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - with_DEFAULT_literal
      - with_DEFAULT_expression
      - without_DEFAULT
      coverage_requirement: all_values
    collation_clause:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - with_COLLATION
      - without_COLLATION
      coverage_requirement: all_values
    generated_clause:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - GENERATED_ALWAYS_AS_STORED
      - GENERATED_ALWAYS_AS_IDENTITY
      - GENERATED_BY_DEFAULT_AS_IDENTITY
