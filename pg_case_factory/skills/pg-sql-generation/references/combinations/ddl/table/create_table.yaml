      coverage_requirement: all_values
    base_table_template_coverage:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - table_01_comprehensive_types
      - table_02_simplified_types
      - table_03_partition_parent
      - table_04_typed_table
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - superuser
      - table_owner
      - non_owner_with_create
      - non_owner_no_privilege
      coverage_requirement: all_values
    schema_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - schema_exists
      - schema_not_exists
      - pg_catalog_reserved
      - information_schema_reserved
      coverage_requirement: all_values
    tablespace_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - default_tablespace
      - specified_tablespace_exists
      - specified_tablespace_not_exists
      coverage_requirement: all_values
    role_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - owner_role_exists
      - owner_role_not_exists
      coverage_requirement: all_values
    type_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - composite_type_exists
      - composite_type_not_exists
      coverage_requirement: all_values
    parent_table_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - parent_table_exists
      - parent_table_not_exists
      - parent_table_not_partitioned
      coverage_requirement: all_values
    referenced_table_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - referenced_table_exists
      - referenced_table_not_exists
      coverage_requirement: all_values
    duplicate_table_name:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - with_IF_NOT_EXISTS_noop
      - without_IF_NOT_EXISTS_error
      coverage_requirement: all_values
    duplicate_column_name:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - same_column_name_in_table
      coverage_requirement: all_values
    invalid_data_type:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - unknown_type_name
      - wrong_array_syntax
      coverage_requirement: all_values
    constraint_violation_in_definition:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - FK_references_nonexistent_table
      - CHECK_expression_invalid
      - PK_with_nullable_column
      coverage_requirement: all_values
    schema_permission_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - no_create_privilege_in_schema
      coverage_requirement: all_values
    reserved_schema_name:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - pg_catalog
      - information_schema
      coverage_requirement: all_values
    max_column_limit:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - approaching_1600
      - at_1600
      - over_1600
      coverage_requirement: all_values
    identifier_length_exceeded:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - over_63_chars
      coverage_requirement: all_values
    temporary_table_scope_conflict:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - temp_table_same_name_permanent
      coverage_requirement: all_values
    partition_bound_invalid:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - bound_out_of_range
      - bound_type_mismatch
      coverage_requirement: all_values
    on_commit_with_non_temporary:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - on_commit_on_permanent_table
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - pg_class_catalog_query
      - information_schema_tables
      - information_schema_columns
      - SELECT_count
      - pg_attribute_query
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - DROP_TABLE
      - DROP_TABLE_IF_EXISTS
      - DROP_TABLE_CASCADE
      - DROP_TABLE_CASCADE_RESTRICT
      coverage_requirement: all_values
dynamic_inputs:
  table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/table_manifest.json
    required_fields:
    - table_name
    - relation_kind
    - table_kind
    - columns
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  column_definition_manifest:
    required: true
    source: type_catalog.types
    required_fields:
    - column_name
    - type_key
    - declaration_sql
    - requires_setup
