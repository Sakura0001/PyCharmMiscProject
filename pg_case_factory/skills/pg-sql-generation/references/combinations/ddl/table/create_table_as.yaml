schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_table_as
  name: CREATE TABLE AS
  category: ddl
  domain: table
  source_reference: references/statements/ddl/table/create_table_as.md
  aliases:
  - CREATE TABLE AS
  - create table as
  - create_table_as
  - CTAS
  - ctas
  official_source: https://www.postgresql.org/docs/16/sql-createtableas.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline audit must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, lifecycle, or cross-factor combinations only after the baseline passes.
  - Derived extensions must not count toward required declared factor or column-type coverage.
  - Derived extensions must use only declared factors, declared values, and recorded derivation reasons.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    decision_reason: create_table_as targets table-backed relation objects; the baseline declares each object kind that can
      be created, modified, read, emptied, or removed by this statement.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    negative_relation_kinds:
    - plain_view
    - foreign_table
    - sequence
    - materialized_view
    decision_reason: create_table_as operates on table relations rather than arbitrary relation objects. Relation coverage
      is explicit so invalid non-table relation kinds remain negative controls.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    decision_reason: create_table_as behavior depends on table form, including permanent, temporary, unlogged, partitioned,
      and inherited table variants where the statement reference declares those states.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: conditional
    require_each_type_success_or_failure: true
    decision_reason: CREATE TABLE AS creates columns by deriving names and types from the source query. It has no explicit
      data_type factor, so column-type coverage is conditional on query shapes that emit representative or source-table-derived
      PG16 column types.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_regular
      - branch_regular_if_not_exists
      - branch_temporary
      - branch_temp
      - branch_temporary_if_not_exists
      - branch_unlogged
      - branch_unlogged_if_not_exists
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: rotate_attach
      required_values:
      - not_exists
      - already_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    table_type:
      tier: T2
      coverage_role: main_axis
      required_values:
      - permanent
      - temporary_global
      - temporary_local
      - temp_short
      - unlogged
      coverage_requirement: all_values
    if_not_exists_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - present
      - absent
      coverage_requirement: all_values
    with_data:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - WITH_DATA
      - WITH_NO_DATA
      - absent_default
      coverage_requirement: all_values
    column_names:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - explicit_list
      - inherit_from_query
      coverage_requirement: all_values
    on_commit_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - PRESERVE_ROWS
      - DELETE_ROWS
      - DROP
      - absent
      coverage_requirement: all_values
    with_storage_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - with_storage
      - without_storage
      - without_oids
      coverage_requirement: all_values
    tablespace_clause:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - specified
      - default
      coverage_requirement: all_values
    table_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - reserved_word
      - schema_qualified
      - duplicate
      coverage_requirement: all_values
    query_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple_select
      - table_command
      - values_command
      - execute_prepared
      - aggregate_query
      - join_query
      - union_query
      - subquery
      coverage_requirement: all_values
    column_name_list_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - matching_query_columns
      - fewer_than_query_columns
      - more_than_query_columns
      - absent
      coverage_requirement: all_values
    column_type_derivation:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - derived_from_select_expr
      - derived_from_table_command
      - derived_from_values
      - derived_from_execute
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - superuser
      - schema_owner_with_create
      - non_owner_no_privilege
      coverage_requirement: all_values
    source_table_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - source_table_exists
      - source_table_not_exists
      coverage_requirement: all_values
    schema_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - schema_exists
      - schema_not_exists
      - pg_catalog_reserved
      coverage_requirement: all_values
    tablespace_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - default_tablespace
      - specified_tablespace_exists
      - specified_tablespace_not_exists
      coverage_requirement: all_values
    duplicate_table_name:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - with_IF_NOT_EXISTS_noop
      - without_IF_NOT_EXISTS_error
      coverage_requirement: all_values
    query_error:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - invalid_sql_syntax
      - references_nonexistent_table
      - aggregate_mismatch
      coverage_requirement: all_values
    privilege_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - no_create_in_schema
      coverage_requirement: all_values
    column_name_mismatch:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - fewer_names_extra_columns_kept
      - more_names_error
      coverage_requirement: all_values
    on_commit_with_non_temporary:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - on_commit_on_permanent_table
      coverage_requirement: all_values
    empty_query_result:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - with_data_empty_table
      - with_no_data_structure_only
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - pg_class_catalog_query
      - information_schema_tables
      - information_schema_columns
      - SELECT_count
      - SELECT_star_structure
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - DROP_TABLE
      - DROP_TABLE_IF_EXISTS
      - DROP_TABLE_CASCADE
      coverage_requirement: all_values
dynamic_inputs:
  table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/table_manifest.json
    required_fields:
    - table_name
    - relation_kind
    - table_kind
    - columns
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  source_query_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/source_query_manifest.json
    required_fields:
    - query_shape
    - output_columns
    - output_column_types
combination_groups:
- id: create_table_as_declared_factor_baseline
  title: Declared factor baseline with all required statement-reference values
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_regular
    object_state: not_exists
    expected_status: success
    table_type: permanent
    if_not_exists_clause: present
    with_data: WITH_DATA
    column_names: explicit_list
    on_commit_clause: PRESERVE_ROWS
    with_storage_clause: with_storage
    tablespace_clause: specified
    table_name_shape: simple
    query_shape: simple_select
    column_name_list_shape: matching_query_columns
    column_type_derivation: derived_from_select_expr
    privilege_level: superuser
    source_table_dependency: source_table_exists
    schema_dependency: schema_exists
    tablespace_dependency: default_tablespace
    duplicate_table_name: with_IF_NOT_EXISTS_noop
    query_error: invalid_sql_syntax
    privilege_insufficient: no_create_in_schema
    column_name_mismatch: fewer_names_extra_columns_kept
    on_commit_with_non_temporary: on_commit_on_permanent_table
    empty_query_result: with_data_empty_table
    verification_mode: pg_class_catalog_query
    cleanup_mode: DROP_TABLE
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_regular
      - branch_regular_if_not_exists
      - branch_temporary
      - branch_temp
      - branch_temporary_if_not_exists
      - branch_unlogged
      - branch_unlogged_if_not_exists
    object_state:
      mode: explicit
      values:
      - not_exists
      - already_exists
    table_type:
      mode: explicit
      values:
      - permanent
      - temporary_global
      - temporary_local
      - temp_short
      - unlogged
    if_not_exists_clause:
      mode: explicit
      values:
      - present
      - absent
    with_data:
      mode: explicit
      values:
      - WITH_DATA
      - WITH_NO_DATA
      - absent_default
    column_names:
      mode: explicit
      values:
      - explicit_list
      - inherit_from_query
    on_commit_clause:
      mode: explicit
      values:
      - PRESERVE_ROWS
      - DELETE_ROWS
      - DROP
      - absent
    with_storage_clause:
      mode: explicit
      values:
      - with_storage
      - without_storage
      - without_oids
    tablespace_clause:
      mode: explicit
      values:
      - specified
      - default
    table_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - reserved_word
      - schema_qualified
      - duplicate
    query_shape:
      mode: explicit
      values:
      - simple_select
      - table_command
      - values_command
      - execute_prepared
      - aggregate_query
      - join_query
      - union_query
      - subquery
    column_name_list_shape:
      mode: explicit
      values:
      - matching_query_columns
      - fewer_than_query_columns
      - more_than_query_columns
      - absent
    column_type_derivation:
      mode: explicit
      values:
      - derived_from_select_expr
      - derived_from_table_command
      - derived_from_values
      - derived_from_execute
    privilege_level:
      mode: explicit
      values:
      - superuser
      - schema_owner_with_create
      - non_owner_no_privilege
    source_table_dependency:
      mode: explicit
      values:
      - source_table_exists
      - source_table_not_exists
    schema_dependency:
      mode: explicit
      values:
      - schema_exists
      - schema_not_exists
      - pg_catalog_reserved
    tablespace_dependency:
      mode: explicit
      values:
      - default_tablespace
      - specified_tablespace_exists
      - specified_tablespace_not_exists
    duplicate_table_name:
      mode: explicit
      values:
      - with_IF_NOT_EXISTS_noop
      - without_IF_NOT_EXISTS_error
    query_error:
      mode: explicit
      values:
      - invalid_sql_syntax
      - references_nonexistent_table
      - aggregate_mismatch
    privilege_insufficient:
      mode: explicit
      values:
      - no_create_in_schema
    column_name_mismatch:
      mode: explicit
      values:
      - fewer_names_extra_columns_kept
      - more_names_error
    on_commit_with_non_temporary:
      mode: explicit
      values:
      - on_commit_on_permanent_table
    empty_query_result:
      mode: explicit
      values:
      - with_data_empty_table
      - with_no_data_structure_only
    verification_mode:
      mode: explicit
      values:
      - pg_class_catalog_query
      - information_schema_tables
      - information_schema_columns
      - SELECT_count
      - SELECT_star_structure
    cleanup_mode:
      mode: explicit
      values:
      - DROP_TABLE
      - DROP_TABLE_IF_EXISTS
      - DROP_TABLE_CASCADE
    query_output_column_types:
      mode: conditional
      source: coverage_scope.column_type_coverage.required_type_set
    table_kinds:
      mode: explicit
      source: coverage_scope.table_coverage.required_table_kinds
  compatibility:
    resolver: declared_matrix
    success_when:
    - binding is syntactically valid and prerequisite objects satisfy the selected factor values
    failure_when:
    - condition: binding selects a declared negative object state, dependency state, privilege state, or invalid syntax/input
        value
      reason: duplicate_table_without_if_not_exists
    default_failure_reason: duplicate_table_without_if_not_exists
  sql_shape:
    template: CREATE {table_type} TABLE {if_not_exists_clause} {table_name} {column_name_list} AS {query_shape} {with_data};
  verification:
    required: true
    mode: catalog_or_effect_query
    sql: SELECT relname, relkind FROM pg_class WHERE relname = '{table_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
- id: create_table_as_failure_attribution_baseline
  title: Declared failure attribution baseline
  lifecycle_role: negative_control
  expected_status_policy: fixed
  default_expected_status: failure
  expected_failure_reasons:
  - duplicate_table_without_if_not_exists
  - source_query_failed
  - column_name_count_mismatch
  - insufficient_create_privilege
  factors:
    statement_branch: branch_regular
    object_state: already_exists
    expected_status: failure
    table_type: permanent
    if_not_exists_clause: present
    with_data: WITH_DATA
    column_names: explicit_list
    on_commit_clause: PRESERVE_ROWS
    with_storage_clause: with_storage
    tablespace_clause: specified
    table_name_shape: simple
    query_shape: simple_select
    column_name_list_shape: matching_query_columns
    column_type_derivation: derived_from_select_expr
    privilege_level: superuser
    source_table_dependency: source_table_exists
    schema_dependency: schema_exists
    tablespace_dependency: default_tablespace
    duplicate_table_name: with_IF_NOT_EXISTS_noop
    query_error: invalid_sql_syntax
    privilege_insufficient: no_create_in_schema
    column_name_mismatch: fewer_names_extra_columns_kept
    on_commit_with_non_temporary: on_commit_on_permanent_table
    empty_query_result: with_data_empty_table
    verification_mode: pg_class_catalog_query
    cleanup_mode: DROP_TABLE
  expansion:
    expected_status:
      mode: explicit
      values:
      - failure
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: duplicate_table_without_if_not_exists
      reason: duplicate_table_without_if_not_exists
    - condition: source_query_failed
      reason: source_query_failed
    - condition: column_name_count_mismatch
      reason: column_name_count_mismatch
    - condition: insufficient_create_privilege
      reason: insufficient_create_privilege
    default_failure_reason: duplicate_table_without_if_not_exists
  sql_shape:
    template: CREATE {table_type} TABLE {if_not_exists_clause} {table_name} {column_name_list} AS {query_shape} {with_data};
  verification:
    required: true
    mode: expected_error_or_notice
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
