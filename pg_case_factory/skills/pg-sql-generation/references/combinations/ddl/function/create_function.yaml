schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_function
  name: CREATE FUNCTION
  category: ddl
  domain: function
  source_reference: references/statements/ddl/function/create_function.md
  official_source: https://www.postgresql.org/docs/16/sql-createfunction.html
  aliases:
  - CREATE FUNCTION
  - create function
  - create_function
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, dependency, environment, or cross-factor combinations after baseline audit
    passes.
  - Derived extensions must not be counted as satisfying required factor, object, routine-signature, relation, table, or column-type
    coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - function
    decision_reason: CREATE_FUNCTION directly targets a PostgreSQL function object. Baseline coverage is scoped to routine
      lifecycle state, signature resolution, language/body attributes, privileges, and dependency behavior.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: CREATE_FUNCTION does not target a pg_class table, index, view, sequence, or materialized-view relation;
      routine catalog dependencies are represented as object and signature factors.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE_FUNCTION operates on routine catalog objects and signatures rather than table variants. Required
      baseline coverage does not depend on regular, temporary, partitioned, inherited, or foreign table forms.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE_FUNCTION requires argument and return type coverage as routine signature/type coverage through
      factor_contract and dynamic_inputs. Those types identify or define routine signatures; they are not table column definitions,
      so shared table column_type_coverage is not applicable.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_1
      - branch_2
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - not_exists
      - already_exists_same_signature
      - already_exists_different_signature
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_declared_values
    or_replace_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id004
      - present
      - absent
      coverage_requirement: all_declared_values
    returns_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id005
      - RETURNS_rettype
      - RETURNS_TABLE
      - absent
      coverage_requirement: all_declared_values
    language_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id006
      - sql
      - plpgsql
      - c
      - internal
      - other
      coverage_requirement: all_declared_values
    volatility_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id007
      - IMMUTABLE
      - STABLE
      - VOLATILE
      - absent
      coverage_requirement: all_declared_values
    null_handling_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id008
      - CALLED_ON_NULL_INPUT
      - RETURNS_NULL_ON_NULL_INPUT
      - STRICT
      - absent
      coverage_requirement: all_declared_values
    security_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id009
      - SECURITY_INVOKER
      - SECURITY_DEFINER
      - absent
      coverage_requirement: all_declared_values
    parallel_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id010
      - UNSAFE
      - RESTRICTED
      - SAFE
      - absent
      coverage_requirement: all_declared_values
    leakproof_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id011
      - LEAKPROOF
      - NOT_LEAKPROOF
      - absent
      coverage_requirement: all_declared_values
    window_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id012
      - present
      - absent
      coverage_requirement: all_declared_values
    transform_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id013
      - present
      - absent
      coverage_requirement: all_declared_values
    sql_body_form:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id014
      - sql_body_inline
      - AS_definition
      - AS_obj_file_link_symbol
      coverage_requirement: all_declared_values
    function_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id015
      - simple
      - quoted
      - reserved_word
      - schema_qualified
      - duplicate
      coverage_requirement: all_declared_values
    argmode:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id016
      - IN
      - OUT
      - INOUT
      - VARIADIC
      - absent
      coverage_requirement: all_declared_values
    argname:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id017
      - with_argname
      - without_argname
      coverage_requirement: all_declared_values
    argtype:
      tier: T3
      coverage_role: routine_signature_type_axis
      required_values: &id018
      - smallint
      - integer
      - bigint
      - real
      - double_precision
      - numeric
      - character_varying
      - character
      - text
      - bytea
      - date
      - timestamp
      - timestamp_with_time_zone
      - interval
      - boolean
      - json
      - jsonb
      - uuid
      - integer_array
      - text_array
      - int4range
      - tsrange
      - composite_type
      - enum_type
      - oid
      - regclass
      coverage_requirement: all_declared_values
    rettype:
      tier: T3
      coverage_role: routine_signature_type_axis
      required_values: &id019
      - same_as_argtype
      - void
      - record
      - trigger
      - event_trigger
      coverage_requirement: all_declared_values
    default_expr_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id020
      - with_DEFAULT
      - with_equals
      - without_DEFAULT
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id021
      - superuser
      - function_owner
      - non_owner_with_create
      - non_owner_no_privilege
      coverage_requirement: all_declared_values
    schema_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id022
      - schema_exists
      - schema_not_exists
      - pg_catalog_reserved
      - information_schema_reserved
      coverage_requirement: all_declared_values
    role_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id023
      - owner_role_exists
      - owner_role_not_exists
      coverage_requirement: all_declared_values
    language_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id024
      - language_installed_sql
      - language_installed_plpgsql
      - language_not_installed
      coverage_requirement: all_declared_values
    extension_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id025
      - extension_exists
      - extension_not_exists
      coverage_requirement: all_declared_values
    duplicate_function_signature:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id026
      - with_OR_REPLACE_replace
      - with_OR_REPLACE_noop_signature_change
      - without_OR_REPLACE_error
      coverage_requirement: all_declared_values
    invalid_argtype:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id027
      - unknown_type_name
      coverage_requirement: all_declared_values
    invalid_rettype:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id028
      - unknown_type_name
      coverage_requirement: all_declared_values
    conflicting_attributes:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id029
      - WINDOW_with_RETURNS_TABLE
      - IMMUTABLE_with_SIDE_EFFECT
      coverage_requirement: all_declared_values
    permission_insufficient:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id030
      - no_create_privilege_in_schema
      - no_usage_privilege_on_language
      coverage_requirement: all_declared_values
    language_not_available:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id031
      - untrusted_language_requires_superuser
      coverage_requirement: all_declared_values
    identifier_length_exceeded:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id032
      - over_63_chars
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id033
      - pg_proc_catalog_query
      - information_schema_routines
      - SELECT_function_call
      - pg_get_functiondef
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id034
      - DROP_FUNCTION
      - DROP_FUNCTION_IF_EXISTS
      - DROP_FUNCTION_CASCADE
      coverage_requirement: all_declared_values
dynamic_inputs:
  routine_signature_type_manifest:
    required: true
    source: factor_contract.argtype, factor_contract.rettype, and combination_groups.expansion
    required_fields:
    - function_name
    - argument_modes
    - argument_names
    - argument_types
    - return_type
    - returns_table_columns
    - language
    - body_form
    - volatility
    - null_handling
    - security
    - expected_status
combination_groups:
- id: create_function_required_baseline_factor_space
  title: CREATE FUNCTION required baseline factor space
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - expected_statement_failure
  - routine_resolution_or_privilege_failure
  - invalid_signature_or_type_binding
  - dependency_or_environment_failure
  factors:
    statement_branch: branch_1
    object_state: not_exists
    expected_status: success
    or_replace_clause: present
    returns_clause: RETURNS_rettype
    language_clause: sql
    volatility_clause: IMMUTABLE
    null_handling_clause: CALLED_ON_NULL_INPUT
    security_clause: SECURITY_INVOKER
    parallel_clause: UNSAFE
    leakproof_clause: LEAKPROOF
    window_clause: present
    transform_clause: present
    sql_body_form: sql_body_inline
    function_name_shape: simple
    argmode: IN
    argname: with_argname
    argtype: smallint
    rettype: same_as_argtype
    default_expr_shape: with_DEFAULT
    privilege_level: superuser
    schema_dependency: schema_exists
    role_dependency: owner_role_exists
    language_dependency: language_installed_sql
    extension_dependency: extension_exists
    duplicate_function_signature: with_OR_REPLACE_replace
    invalid_argtype: unknown_type_name
    invalid_rettype: unknown_type_name
    conflicting_attributes: WINDOW_with_RETURNS_TABLE
    permission_insufficient: no_create_privilege_in_schema
    language_not_available: untrusted_language_requires_superuser
    identifier_length_exceeded: over_63_chars
    verification_mode: pg_proc_catalog_query
    cleanup_mode: DROP_FUNCTION
  expansion:
    statement_branch:
      mode: exhaustive
      values: *id001
    object_state:
      mode: exhaustive
      values: *id002
    expected_status:
      mode: exhaustive
      values: *id003
    or_replace_clause:
      mode: exhaustive
      values: *id004
    returns_clause:
      mode: exhaustive
      values: *id005
    language_clause:
      mode: exhaustive
      values: *id006
    volatility_clause:
      mode: exhaustive
      values: *id007
    null_handling_clause:
      mode: exhaustive
      values: *id008
    security_clause:
      mode: exhaustive
      values: *id009
    parallel_clause:
      mode: exhaustive
      values: *id010
    leakproof_clause:
      mode: exhaustive
      values: *id011
    window_clause:
      mode: exhaustive
      values: *id012
    transform_clause:
      mode: exhaustive
      values: *id013
    sql_body_form:
      mode: exhaustive
      values: *id014
    function_name_shape:
      mode: representative
      values: *id015
    argmode:
      mode: representative
      values: *id016
    argname:
      mode: representative
      values: *id017
    argtype:
      mode: exhaustive
      values: *id018
    rettype:
      mode: exhaustive
      values: *id019
    default_expr_shape:
      mode: representative
      values: *id020
    privilege_level:
      mode: representative
      values: *id021
    schema_dependency:
      mode: representative
      values: *id022
    role_dependency:
      mode: representative
      values: *id023
    language_dependency:
      mode: representative
      values: *id024
    extension_dependency:
      mode: representative
      values: *id025
    duplicate_function_signature:
      mode: representative
      values: *id026
    invalid_argtype:
      mode: representative
      values: *id027
    invalid_rettype:
      mode: representative
      values: *id028
    conflicting_attributes:
      mode: representative
      values: *id029
    permission_insufficient:
      mode: representative
      values: *id030
    language_not_available:
      mode: representative
      values: *id031
    identifier_length_exceeded:
      mode: representative
      values: *id032
    verification_mode:
      mode: representative
      values: *id033
    cleanup_mode:
      mode: representative
      values: *id034
  compatibility:
    resolver: create_function_factor_binding_resolver
    success_when:
    - expected_status=success and selected object, signature, privilege, and dependency bindings are valid
    - statement branch and routine kind support the selected type, language, body, or aggregate option binding
    failure_when:
    - condition: expected_status=failure or a declared negative boundary factor is selected
      reason: expected_statement_failure
    - condition: target routine object, signature, owner, schema, language, extension, support function, or privilege is missing
        or incompatible
      reason: routine_resolution_or_privilege_failure
    - condition: argument, return, aggregate signature, or support function type binding is invalid for the selected branch
      reason: invalid_signature_or_type_binding
    default_failure_reason: expected_statement_failure
  sql_shape:
    template: CREATE [OR REPLACE] FUNCTION {function_name}({argument_signature}) {returns_clause} LANGUAGE {language_clause}
      {routine_attributes} {routine_body};
  verification:
    required: true
    mode: catalog_query
    sql: SELECT oid FROM pg_proc WHERE proname = '{routine_name}'
  cleanup:
    required: true
    steps:
    - sql: DROP FUNCTION IF EXISTS {function_name}({argument_signature}) CASCADE
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
