schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_owned
  name: DROP OWNED
  category: ddl
  domain: ownership
  source_reference: references/statements/ddl/ownership/drop_owned.md
  official_source: https://www.postgresql.org/docs/16/sql-drop-owned.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - role
    decision_reason: ownership statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ownership statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ownership statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ownership statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_drop_owned_by
      - branch_drop_owned_by_cascade
      - branch_drop_owned_by_restrict
      coverage_requirement: all_values
    role_existence:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - role_exists
      - role_not_exists
      - role_is_current_user
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    cascade_restrict_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - no_clause_default_restrict
      - cascade
      - restrict
      coverage_requirement: all_values
    role_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - explicit_role_name
      - current_role_keyword
      - current_user_keyword
      - session_user_keyword
      coverage_requirement: all_values
    multi_role:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - single_role
      - multiple_roles
      coverage_requirement: all_values
    role_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - simple_name
      - quoted_name
      - reserved_word_name
      - case_sensitive_name
      - non_existing_name
      coverage_requirement: all_values
    executor_privilege:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id008
      - superuser
      - createrole_privilege
      - normal_user_no_privilege
      coverage_requirement: all_values
    owned_objects_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - owns_no_objects
      - owns_tables
      - owns_multiple_objects
      coverage_requirement: all_values
    nonexistent_role:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id010
      - role_does_not_exist
      coverage_requirement: all_values
    privilege_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - non_superuser_dropping_other_role_objects
      - no_createrole_privilege
      coverage_requirement: all_values
    dependent_objects:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - no_dependent_objects
      - has_dependent_objects_restrict_fails
      - has_dependent_objects_cascade_succeeds
      coverage_requirement: all_values
    cross_database_limitation:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id013
      - only_current_database_objects
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id014
      - pg_class_catalog_query
      - pg_roles_catalog_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id015
      - drop_owned_cascade
      - drop_role_cascade
      - reassign_owned_then_drop_role
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: drop_owned_declared_factor_baseline
  title: DROP OWNED declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - drop_owned_declared_failure
  factors:
    statement_branch: branch_drop_owned_by
    role_existence: role_exists
    expected_status: success
    cascade_restrict_clause: no_clause_default_restrict
    role_shape: explicit_role_name
    multi_role: single_role
    role_name_shape: simple_name
    executor_privilege: superuser
    owned_objects_state: owns_no_objects
    nonexistent_role: role_does_not_exist
    privilege_insufficient: non_superuser_dropping_other_role_objects
    dependent_objects: no_dependent_objects
    cross_database_limitation: only_current_database_objects
    verification_mode: pg_class_catalog_query
    cleanup_mode: drop_owned_cascade
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    role_existence:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    cascade_restrict_clause:
      mode: explicit
      values: *id004
    role_shape:
      mode: explicit
      values: *id005
    multi_role:
      mode: explicit
      values: *id006
    role_name_shape:
      mode: explicit
      values: *id007
    executor_privilege:
      mode: explicit
      values: *id008
    owned_objects_state:
      mode: explicit
      values: *id009
    nonexistent_role:
      mode: explicit
      values: *id010
    privilege_insufficient:
      mode: explicit
      values: *id011
    dependent_objects:
      mode: explicit
      values: *id012
    cross_database_limitation:
      mode: explicit
      values: *id013
    verification_mode:
      mode: explicit
      values: *id014
    cleanup_mode:
      mode: explicit
      values: *id015
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: drop_owned_declared_failure
    default_failure_reason: drop_owned_declared_failure
  sql_shape:
    template: DROP OWNED {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for drop_owned
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
