schema_version: 1
kind: statement_combination_matrix
statement:
  key: reassign_owned
  name: REASSIGN OWNED
  category: ddl
  domain: ownership
  source_reference: references/statements/ddl/ownership/reassign_owned.md
  official_source: https://www.postgresql.org/docs/16/sql-reassign-owned.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - role
    decision_reason: ownership statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ownership statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ownership statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ownership statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_reassign_owned
      coverage_requirement: all_values
    old_role_identity:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - role_exists
      - role_not_exists
      - role_is_current_user
      - role_is_superuser
      coverage_requirement: all_values
    new_role_identity:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - role_exists
      - role_not_exists
      - role_is_current_user
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id004
      - success
      - failure
      coverage_requirement: all_values
    old_role_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - explicit_role_name
      - current_role_keyword
      - current_user_keyword
      - session_user_keyword
      coverage_requirement: all_values
    new_role_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - explicit_role_name
      - current_role_keyword
      - current_user_keyword
      - session_user_keyword
      coverage_requirement: all_values
    multi_old_role:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - single_old_role
      - multiple_old_roles
      coverage_requirement: all_values
    role_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id008
      - simple_name
      - quoted_name
      - reserved_word_name
      - case_sensitive_name
      - non_existing_name
      coverage_requirement: all_values
    quoted_identifier:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id009
      - unquoted
      - double_quoted
      - mixed_case_quoted
      coverage_requirement: all_values
    executor_privilege:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id010
      - superuser
      - createrole_privilege
      - normal_user_no_privilege
      coverage_requirement: all_values
    owned_objects_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id011
      - owns_no_objects
      - owns_tables
      - owns_multiple_objects
      coverage_requirement: all_values
    nonexistent_old_role:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - old_role_does_not_exist
      coverage_requirement: all_values
    nonexistent_new_role:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id013
      - new_role_does_not_exist
      coverage_requirement: all_values
    privilege_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id014
      - non_superuser_reassigning_other_role
      - no_createrole_privilege
      coverage_requirement: all_values
    self_reassign:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id015
      - same_role_no_effect
      coverage_requirement: all_values
    cross_database_limitation:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id016
      - only_current_database_objects
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id017
      - pg_class_owner_query
      - pg_roles_catalog_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id018
      - drop_owned_then_drop_role
      - reassign_owned_then_drop_role
      - drop_role_cascade
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: reassign_owned_declared_factor_baseline
  title: REASSIGN OWNED declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - reassign_owned_declared_failure
  factors:
    statement_branch: branch_reassign_owned
    old_role_identity: role_exists
    new_role_identity: role_exists
    expected_status: success
    old_role_shape: explicit_role_name
    new_role_shape: explicit_role_name
    multi_old_role: single_old_role
    role_name_shape: simple_name
    quoted_identifier: unquoted
    executor_privilege: superuser
    owned_objects_state: owns_no_objects
    nonexistent_old_role: old_role_does_not_exist
    nonexistent_new_role: new_role_does_not_exist
    privilege_insufficient: non_superuser_reassigning_other_role
    self_reassign: same_role_no_effect
    cross_database_limitation: only_current_database_objects
    verification_mode: pg_class_owner_query
    cleanup_mode: drop_owned_then_drop_role
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    old_role_identity:
      mode: explicit
      values: *id002
    new_role_identity:
      mode: explicit
      values: *id003
    expected_status:
      mode: explicit
      values: *id004
    old_role_shape:
      mode: explicit
      values: *id005
    new_role_shape:
      mode: explicit
      values: *id006
    multi_old_role:
      mode: explicit
      values: *id007
    role_name_shape:
      mode: explicit
      values: *id008
    quoted_identifier:
      mode: explicit
      values: *id009
    executor_privilege:
      mode: explicit
      values: *id010
    owned_objects_state:
      mode: explicit
      values: *id011
    nonexistent_old_role:
      mode: explicit
      values: *id012
    nonexistent_new_role:
      mode: explicit
      values: *id013
    privilege_insufficient:
      mode: explicit
      values: *id014
    self_reassign:
      mode: explicit
      values: *id015
    cross_database_limitation:
      mode: explicit
      values: *id016
    verification_mode:
      mode: explicit
      values: *id017
    cleanup_mode:
      mode: explicit
      values: *id018
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: reassign_owned_declared_failure
    default_failure_reason: reassign_owned_declared_failure
  sql_shape:
    template: REASSIGN OWNED {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for reassign_owned
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
