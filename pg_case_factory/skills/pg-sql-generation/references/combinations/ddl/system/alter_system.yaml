schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_system
  name: ALTER SYSTEM
  category: ddl
  domain: system
  source_reference: references/statements/ddl/system/alter_system.md
  official_source: https://www.postgresql.org/docs/16/sql-altersystem.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - runtime_parameter
    decision_reason: system statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: system statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: system statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: system statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_set
      - branch_set_default
      - branch_reset
      - branch_reset_all
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - success
      - failure
      coverage_requirement: all_values
    configuration_parameter_type:
      tier: T2
      coverage_role: main_axis
      required_values: &id003
      - superuser_only_parameter
      - user_settable_parameter
      - postmaster_restart_required
      - sighup_reload_required
      - backend_session_parameter
      coverage_requirement: all_values
    set_value_behavior:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - single_value
      - multiple_values
      - set_to_default
      coverage_requirement: all_values
    reset_behavior:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - reset_specific_parameter
      - reset_all_parameters
      coverage_requirement: all_values
    parameter_effect_scope:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - requires_restart
      - requires_reload
      - immediate_effect
      coverage_requirement: all_values
    parameter_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - valid_parameter_name
      - custom_parameter_name_with_dot
      - nonexistent_parameter_name
      - quoted_parameter_name
      coverage_requirement: all_values
    value_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id008
      - valid_string_value
      - valid_integer_value
      - valid_boolean_value
      - multiple_comma_separated_values
      - default_keyword
      - invalid_value_type
      coverage_requirement: all_values
    executor_privilege:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - superuser
      - non_superuser
      coverage_requirement: all_values
    parameter_validity:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id010
      - valid_parameter_and_value
      - valid_parameter_invalid_value
      - nonexistent_parameter
      coverage_requirement: all_values
    privilege_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - non_superuser_using_alter_system
      coverage_requirement: all_values
    nonexistent_parameter:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - parameter_does_not_exist
      coverage_requirement: all_values
    invalid_parameter_value:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id013
      - wrong_type_value
      - out_of_range_value
      coverage_requirement: all_values
    superuser_only_parameter_by_non_superuser:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id014
      - cannot_set_superuser_only_parameter
      coverage_requirement: all_values
    restart_required_parameter:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id015
      - parameter_change_requires_restart
      - parameter_change_requires_reload
      coverage_requirement: all_values
    reset_nonexistent_parameter_entry:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id016
      - reset_parameter_not_in_auto_conf_no_op
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id017
      - pg_settings_query
      - pg_file_settings_query
      - show_command
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id018
      - alter_system_reset_parameter
      - alter_system_reset_all
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: alter_system_declared_factor_baseline
  title: ALTER SYSTEM declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - alter_system_declared_failure
  factors:
    statement_branch: branch_set
    expected_status: success
    configuration_parameter_type: superuser_only_parameter
    set_value_behavior: single_value
    reset_behavior: reset_specific_parameter
    parameter_effect_scope: requires_restart
    parameter_name_shape: valid_parameter_name
    value_shape: valid_string_value
    executor_privilege: superuser
    parameter_validity: valid_parameter_and_value
    privilege_insufficient: non_superuser_using_alter_system
    nonexistent_parameter: parameter_does_not_exist
    invalid_parameter_value: wrong_type_value
    superuser_only_parameter_by_non_superuser: cannot_set_superuser_only_parameter
    restart_required_parameter: parameter_change_requires_restart
    reset_nonexistent_parameter_entry: reset_parameter_not_in_auto_conf_no_op
    verification_mode: pg_settings_query
    cleanup_mode: alter_system_reset_parameter
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    expected_status:
      mode: explicit
      values: *id002
    configuration_parameter_type:
      mode: explicit
      values: *id003
    set_value_behavior:
      mode: explicit
      values: *id004
    reset_behavior:
      mode: explicit
      values: *id005
    parameter_effect_scope:
      mode: explicit
      values: *id006
    parameter_name_shape:
      mode: explicit
      values: *id007
    value_shape:
      mode: explicit
      values: *id008
    executor_privilege:
      mode: explicit
      values: *id009
    parameter_validity:
      mode: explicit
      values: *id010
    privilege_insufficient:
      mode: explicit
      values: *id011
    nonexistent_parameter:
      mode: explicit
      values: *id012
    invalid_parameter_value:
      mode: explicit
      values: *id013
    superuser_only_parameter_by_non_superuser:
      mode: explicit
      values: *id014
    restart_required_parameter:
      mode: explicit
      values: *id015
    reset_nonexistent_parameter_entry:
      mode: explicit
      values: *id016
    verification_mode:
      mode: explicit
      values: *id017
    cleanup_mode:
      mode: explicit
      values: *id018
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: alter_system_declared_failure
    default_failure_reason: alter_system_declared_failure
  sql_shape:
    template: ALTER SYSTEM {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for alter_system
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
