schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_operator_class
  name: ALTER OPERATOR CLASS
  category: ddl
  domain: operator_class
  source_reference: references/statements/ddl/operator_class/alter_operator_class.md
  official_source: https://www.postgresql.org/docs/16/sql-alteropclass.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - operator_class
    decision_reason: operator_class statements operate on PostgreSQL operator class objects; object coverage is explicit for
      create, alter, and drop paths.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: operator_class statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: operator_class statements define catalog objects and do not directly operate on table instances.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: operator_class statement syntax and validation do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_rename
      - branch_owner
      - branch_set_schema
      coverage_requirement: all_values
    target_object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - missing
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    alter_action_type:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - rename
      - owner_change
      - set_schema
      coverage_requirement: all_values
    new_owner_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - plain_role
      - current_role
      - current_user
      - session_user
      - missing_role
      coverage_requirement: all_values
    privilege_context:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - superuser
      - owner
      - non_owner
      - insufficient_privilege
      coverage_requirement: all_values
    name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      coverage_requirement: all_values
    index_method_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id008
      - btree
      - hash
      - gist
      - gin
      - spgist
      - brin
      coverage_requirement: all_values
    dependency_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - ready
      - missing_dependency
      coverage_requirement: all_values
    rename_conflict:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id010
      - new_name_available
      - new_name_conflict
      coverage_requirement: all_values
    schema_migration_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id011
      - target_schema_exists
      - target_schema_missing
      - target_schema_conflict
      coverage_requirement: all_values
    invalid_combination:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: all_values
    ownership_boundary:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id013
      - superuser
      - owner
      - non_owner
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id014
      - catalog_query
      - effect_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id015
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - schema_name
    - expected_status
  dependency_manifest:
    required: true
    source: statement_reference_dependencies
    required_fields:
    - dependency_name
    - dependency_kind
    - setup_sql
combination_groups:
- id: alter_operator_class_declared_factor_baseline
  title: ALTER OPERATOR CLASS declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - alter_operator_class_declared_failure
  factors:
    statement_branch: branch_rename
    target_object_state: exists
    expected_status: success
    alter_action_type: rename
    new_owner_shape: plain_role
    privilege_context: superuser
    name_shape: plain_identifier
    index_method_shape: btree
    dependency_state: ready
    rename_conflict: new_name_available
    schema_migration_state: target_schema_exists
    invalid_combination: none
    ownership_boundary: superuser
    verification_mode: catalog_query
    cleanup_mode: drop_objects
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    target_object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    alter_action_type:
      mode: explicit
      values: *id004
    new_owner_shape:
      mode: explicit
      values: *id005
    privilege_context:
      mode: explicit
      values: *id006
    name_shape:
      mode: explicit
      values: *id007
    index_method_shape:
      mode: explicit
      values: *id008
    dependency_state:
      mode: explicit
      values: *id009
    rename_conflict:
      mode: explicit
      values: *id010
    schema_migration_state:
      mode: explicit
      values: *id011
    invalid_combination:
      mode: explicit
      values: *id012
    ownership_boundary:
      mode: explicit
      values: *id013
    verification_mode:
      mode: explicit
      values: *id014
    cleanup_mode:
      mode: explicit
      values: *id015
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: alter_operator_class_declared_failure
    default_failure_reason: alter_operator_class_declared_failure
  sql_shape:
    template: ALTER OPERATOR CLASS {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for alter_operator_class
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
