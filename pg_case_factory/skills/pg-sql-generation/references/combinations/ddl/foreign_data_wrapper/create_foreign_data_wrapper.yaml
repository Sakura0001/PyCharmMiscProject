schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_foreign_data_wrapper
  name: CREATE FOREIGN DATA WRAPPER
  category: ddl
  domain: foreign_data_wrapper
  source_reference: references/statements/ddl/foreign_data_wrapper/create_foreign_data_wrapper.md
  official_source: https://www.postgresql.org/docs/16/sql-createforeigndatawrapper.html
  aliases:
  - CREATE FOREIGN DATA WRAPPER
  - create foreign data wrapper
  - create_foreign_data_wrapper
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use only declared factors and declared factor values.
  - Derived extensions must preserve success, failure, notice, and no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - foreign_data_wrapper
    decision_reason: CREATE FOREIGN DATA WRAPPER targets one foreign-data wrapper catalog object; handler, validator, option,
      privilege, and duplicate-name behavior are statement factors rather than relation coverage.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: CREATE FOREIGN DATA WRAPPER does not name or create a pg_class relation. Foreign tables are downstream
      dependents and are represented only by FDW behavior factors such as NO HANDLER access limits.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE FOREIGN DATA WRAPPER defines an access method wrapper, not a table. It can later support servers
      and foreign tables, but the statement itself has no table-kind branch.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE FOREIGN DATA WRAPPER never declares, rewrites, validates, or verifies table columns; SQL validity
      depends on FDW name, superuser privilege, handler and validator functions, and options.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_create_fdw
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - not_exists
      - already_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    handler_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - specified_handler_function
      - no_handler
      coverage_requirement: all_values
    validator_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - specified_validator_function
      - no_validator
      coverage_requirement: all_values
    options_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - single_option
      - multiple_options
      coverage_requirement: all_values
    handler_function_type:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - correct_fdw_handler
      - wrong_return_type
      coverage_requirement: all_values
    fdw_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - reserved_word_name
      - duplicate_name
      - nonexistent_name
      coverage_requirement: all_values
    handler_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - schema_qualified
      - nonexistent_function
      coverage_requirement: all_values
    validator_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - schema_qualified
      - nonexistent_function
      coverage_requirement: all_values
    option_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - valid_option
      - duplicate_option
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - superuser
      - non_superuser
      coverage_requirement: all_values
    handler_function_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - function_exists
      - function_not_exists
      coverage_requirement: all_values
    validator_function_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - function_exists
      - function_not_exists
      coverage_requirement: all_values
    handler_function_return_type:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - matches_fdw_handler
      - mismatches_fdw_handler
      coverage_requirement: all_values
    duplicate_fdw_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_values
    nonexistent_handler_function:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - function_exists
      - function_missing
      coverage_requirement: all_values
    nonexistent_validator_function:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - function_exists
      - function_missing
      coverage_requirement: all_values
    invalid_handler_return_type:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - correct_type
      - wrong_type
      coverage_requirement: all_values
    non_superuser_attempt:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - superuser_execution
      - non_superuser_execution
      coverage_requirement: all_values
    duplicate_option_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - unique_options
      - duplicate_options
      coverage_requirement: all_values
    no_handler_access_limit:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - with_handler_accessible
      - no_handler_not_accessible
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - pg_foreign_data_wrapper_catalog
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - drop_fdw
      - drop_handler_function
      - drop_validator_function
      - role_cleanup
      coverage_requirement: all_values
dynamic_inputs:
  fdw_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/fdw_manifest.json
    required_fields:
    - fdw_name
    - object_state
    - handler_clause
    - validator_clause
    - options_clause
  function_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/fdw_function_manifest.json
    required_fields:
    - handler_function
    - validator_function
    - return_type
    - exists_before_statement
  role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - execution_role
    - privilege_level
    - superuser_state
combination_groups:
- id: create_foreign_data_wrapper_required_factor_value_matrix
  title: CREATE FOREIGN DATA WRAPPER required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - duplicate_fdw_name
  - nonexistent_handler_function
  - nonexistent_validator_function
  - invalid_handler_return_type
  - non_superuser_attempt
  - duplicate_option_name
  - no_handler_access_limit
  factors:
    statement_branch: branch_create_fdw
    object_state: not_exists
    expected_status: success
    handler_clause: omitted
    validator_clause: omitted
    options_clause: omitted
    handler_function_type: correct_fdw_handler
    fdw_name_shape: simple_id
    handler_name_shape: simple_id
    validator_name_shape: simple_id
    option_name_shape: valid_option
    privilege_level: superuser
    handler_function_existence: function_exists
    validator_function_existence: function_exists
    handler_function_return_type: matches_fdw_handler
    duplicate_fdw_name: no_conflict
    nonexistent_handler_function: function_exists
    nonexistent_validator_function: function_exists
    invalid_handler_return_type: correct_type
    non_superuser_attempt: superuser_execution
    duplicate_option_name: unique_options
    no_handler_access_limit: with_handler_accessible
    verification_mode: pg_foreign_data_wrapper_catalog
    cleanup_mode: drop_fdw
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_create_fdw
    object_state:
      mode: explicit
      values:
      - not_exists
      - already_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    handler_clause:
      mode: explicit
      values:
      - omitted
      - specified_handler_function
      - no_handler
    validator_clause:
      mode: explicit
      values:
      - omitted
      - specified_validator_function
      - no_validator
    options_clause:
      mode: explicit
      values:
      - omitted
      - single_option
      - multiple_options
    handler_function_type:
      mode: explicit
      values:
      - correct_fdw_handler
      - wrong_return_type
    fdw_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - reserved_word_name
      - duplicate_name
      - nonexistent_name
    handler_name_shape:
      mode: explicit
      values:
      - simple_id
      - schema_qualified
      - nonexistent_function
    validator_name_shape:
      mode: explicit
      values:
      - simple_id
      - schema_qualified
      - nonexistent_function
    option_name_shape:
      mode: explicit
      values:
      - valid_option
      - duplicate_option
    privilege_level:
      mode: explicit
      values:
      - superuser
      - non_superuser
    handler_function_existence:
      mode: explicit
      values:
      - function_exists
      - function_not_exists
    validator_function_existence:
      mode: explicit
      values:
      - function_exists
      - function_not_exists
    handler_function_return_type:
      mode: explicit
      values:
      - matches_fdw_handler
      - mismatches_fdw_handler
    duplicate_fdw_name:
      mode: explicit
      values:
      - no_conflict
      - same_name_conflict
    nonexistent_handler_function:
      mode: explicit
      values:
      - function_exists
      - function_missing
    nonexistent_validator_function:
      mode: explicit
      values:
      - function_exists
      - function_missing
    invalid_handler_return_type:
      mode: explicit
      values:
      - correct_type
      - wrong_type
    non_superuser_attempt:
      mode: explicit
      values:
      - superuser_execution
      - non_superuser_execution
    duplicate_option_name:
      mode: explicit
      values:
      - unique_options
      - duplicate_options
    no_handler_access_limit:
      mode: explicit
      values:
      - with_handler_accessible
      - no_handler_not_accessible
    verification_mode:
      mode: explicit
      values:
      - pg_foreign_data_wrapper_catalog
      - error_assertion
    cleanup_mode:
      mode: explicit
      values:
      - drop_fdw
      - drop_handler_function
      - drop_validator_function
      - role_cleanup
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and all selected dependency, privilege, object-state, name-shape, and option factors are
      compatible
    - statement branch requirements match the selected clause and lifecycle setup manifests
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: target object, dependency, privilege, option, or name factor selects an invalid binding
      reason: statement_specific_failure
    - condition: duplicate_fdw_name selects an error, notice, no-op, or boundary value
      reason: duplicate_fdw_name
    - condition: nonexistent_handler_function selects an error, notice, no-op, or boundary value
      reason: nonexistent_handler_function
    - condition: nonexistent_validator_function selects an error, notice, no-op, or boundary value
      reason: nonexistent_validator_function
    - condition: invalid_handler_return_type selects an error, notice, no-op, or boundary value
      reason: invalid_handler_return_type
    - condition: non_superuser_attempt selects an error, notice, no-op, or boundary value
      reason: non_superuser_attempt
    - condition: duplicate_option_name selects an error, notice, no-op, or boundary value
      reason: duplicate_option_name
    - condition: no_handler_access_limit selects an error, notice, no-op, or boundary value
      reason: no_handler_access_limit
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: CREATE FOREIGN DATA WRAPPER {fdw_name} {handler_clause} {validator_clause} {options_clause};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT fdwname FROM pg_foreign_data_wrapper WHERE fdwname = '{fdw_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP FOREIGN DATA WRAPPER IF EXISTS {fdw_name} CASCADE;
    - sql: DROP FUNCTION IF EXISTS {handler_function}();
    - sql: DROP FUNCTION IF EXISTS {validator_function}(text[], oid);
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
