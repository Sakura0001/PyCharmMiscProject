schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_foreign_data_wrapper
  name: ALTER FOREIGN DATA WRAPPER
  category: ddl
  domain: foreign_data_wrapper
  source_reference: references/statements/ddl/foreign_data_wrapper/alter_foreign_data_wrapper.md
  official_source: https://www.postgresql.org/docs/16/sql-alterforeigndatawrapper.html
  aliases:
  - ALTER FOREIGN DATA WRAPPER
  - alter foreign data wrapper
  - alter_foreign_data_wrapper
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use only declared factors and declared factor values.
  - Derived extensions must preserve success, failure, notice, and no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - foreign_data_wrapper
    decision_reason: ALTER FOREIGN DATA WRAPPER targets an existing foreign-data wrapper and changes handler, validator, options,
      owner, or name metadata.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: ALTER FOREIGN DATA WRAPPER does not target pg_class relations. Any foreign table access effect from NO
      HANDLER is a downstream behavioral boundary, not relation-kind coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER FOREIGN DATA WRAPPER modifies wrapper metadata and ownership. It does not create, alter, scan,
      or drop any table definition directly.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER FOREIGN DATA WRAPPER has no SQL branch whose validity or verification depends on table column data
      types; coverage is driven by wrapper state, functions, options, owner, and superuser privilege.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_change_handler_validator_options
      - branch_owner
      - branch_rename
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    alter_action:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - change_handler_validator_options
      - owner
      - rename
      coverage_requirement: all_values
    handler_change:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - specified_new_handler
      - no_handler
      coverage_requirement: all_values
    validator_change:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - specified_new_validator
      - no_validator
      coverage_requirement: all_values
    options_operation:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - add_option
      - set_option
      - drop_option
      - combined_operations
      coverage_requirement: all_values
    owner_target:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - specified_new_owner
      - specified_current_role
      - specified_current_user
      - specified_session_user
      coverage_requirement: all_values
    fdw_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_values
    new_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - duplicate_name
      coverage_requirement: all_values
    owner_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_role
      coverage_requirement: all_values
    option_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - valid_option
      - invalid_option
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - superuser
      - non_superuser
      coverage_requirement: all_values
    handler_function_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - function_exists
      - function_not_exists
      coverage_requirement: all_values
    validator_function_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - function_exists
      - function_not_exists
      coverage_requirement: all_values
    preexisting_options_compatibility:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - compatible
      - potentially_incompatible
      coverage_requirement: all_values
    nonexistent_fdw:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - fdw_exists
      - fdw_missing
      coverage_requirement: all_values
    nonexistent_handler_function:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - function_exists
      - function_missing
      coverage_requirement: all_values
    nonexistent_validator_function:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - function_exists
      - function_missing
      coverage_requirement: all_values
    non_superuser_attempt:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - superuser_execution
      - non_superuser_execution
      coverage_requirement: all_values
    validator_switch_option_incompatibility:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_validator_switch
      - switch_with_incompatible_options
      coverage_requirement: all_values
    no_handler_access_limit:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - with_handler
      - no_handler
      coverage_requirement: all_values
    nonexistent_owner_role:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - role_exists_superuser
      - role_missing
      coverage_requirement: all_values
    duplicate_new_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - pg_foreign_data_wrapper_catalog
      - effect_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - revert_handler
      - revert_validator
      - revert_owner
      - revert_rename
      - drop_fdw
      coverage_requirement: all_values
dynamic_inputs:
  fdw_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/fdw_manifest.json
    required_fields:
    - fdw_name
    - object_state
    - current_owner
    - current_options
  function_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/fdw_function_manifest.json
    required_fields:
    - handler_function
    - validator_function
    - exists_before_statement
    - return_type
  role_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - execution_role
    - target_owner_role
    - superuser_state
combination_groups:
- id: alter_foreign_data_wrapper_required_factor_value_matrix
  title: ALTER FOREIGN DATA WRAPPER required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - nonexistent_fdw
  - nonexistent_handler_function
  - nonexistent_validator_function
  - non_superuser_attempt
  - validator_switch_option_incompatibility
  - no_handler_access_limit
  - nonexistent_owner_role
  - duplicate_new_name
  factors:
    statement_branch: branch_change_handler_validator_options
    object_state: exists
    expected_status: success
    alter_action: change_handler_validator_options
    handler_change: omitted
    validator_change: omitted
    options_operation: add_option
    owner_target: specified_new_owner
    fdw_name_shape: simple_id
    new_name_shape: simple_id
    owner_name_shape: simple_id
    option_name_shape: valid_option
    privilege_level: superuser
    handler_function_existence: function_exists
    validator_function_existence: function_exists
    preexisting_options_compatibility: compatible
    nonexistent_fdw: fdw_exists
    nonexistent_handler_function: function_exists
    nonexistent_validator_function: function_exists
    non_superuser_attempt: superuser_execution
    validator_switch_option_incompatibility: no_validator_switch
    no_handler_access_limit: with_handler
    nonexistent_owner_role: role_exists_superuser
    duplicate_new_name: no_conflict
    verification_mode: pg_foreign_data_wrapper_catalog
    cleanup_mode: revert_handler
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_change_handler_validator_options
      - branch_owner
      - branch_rename
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    alter_action:
      mode: explicit
      values:
      - change_handler_validator_options
      - owner
      - rename
    handler_change:
      mode: explicit
      values:
      - omitted
      - specified_new_handler
      - no_handler
    validator_change:
      mode: explicit
      values:
      - omitted
      - specified_new_validator
      - no_validator
    options_operation:
      mode: explicit
      values:
      - add_option
      - set_option
      - drop_option
      - combined_operations
    owner_target:
      mode: explicit
      values:
      - specified_new_owner
      - specified_current_role
      - specified_current_user
      - specified_session_user
    fdw_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - nonexistent_name
    new_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - duplicate_name
    owner_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - nonexistent_role
    option_name_shape:
      mode: explicit
      values:
      - valid_option
      - invalid_option
    privilege_level:
      mode: explicit
      values:
      - superuser
      - non_superuser
    handler_function_existence:
      mode: explicit
      values:
      - function_exists
      - function_not_exists
    validator_function_existence:
      mode: explicit
      values:
      - function_exists
      - function_not_exists
    preexisting_options_compatibility:
      mode: explicit
      values:
      - compatible
      - potentially_incompatible
    nonexistent_fdw:
      mode: explicit
      values:
      - fdw_exists
      - fdw_missing
    nonexistent_handler_function:
      mode: explicit
      values:
      - function_exists
      - function_missing
    nonexistent_validator_function:
      mode: explicit
      values:
      - function_exists
      - function_missing
    non_superuser_attempt:
      mode: explicit
      values:
      - superuser_execution
      - non_superuser_execution
    validator_switch_option_incompatibility:
      mode: explicit
      values:
      - no_validator_switch
      - switch_with_incompatible_options
    no_handler_access_limit:
      mode: explicit
      values:
      - with_handler
      - no_handler
    nonexistent_owner_role:
      mode: explicit
      values:
      - role_exists_superuser
      - role_missing
    duplicate_new_name:
      mode: explicit
      values:
      - no_conflict
      - same_name_conflict
    verification_mode:
      mode: explicit
      values:
      - pg_foreign_data_wrapper_catalog
      - effect_query
      - error_assertion
    cleanup_mode:
      mode: explicit
      values:
      - revert_handler
      - revert_validator
      - revert_owner
      - revert_rename
      - drop_fdw
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and all selected dependency, privilege, object-state, name-shape, and option factors are
      compatible
    - statement branch requirements match the selected clause and lifecycle setup manifests
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: target object, dependency, privilege, option, or name factor selects an invalid binding
      reason: statement_specific_failure
    - condition: nonexistent_fdw selects an error, notice, no-op, or boundary value
      reason: nonexistent_fdw
    - condition: nonexistent_handler_function selects an error, notice, no-op, or boundary value
      reason: nonexistent_handler_function
    - condition: nonexistent_validator_function selects an error, notice, no-op, or boundary value
      reason: nonexistent_validator_function
    - condition: non_superuser_attempt selects an error, notice, no-op, or boundary value
      reason: non_superuser_attempt
    - condition: validator_switch_option_incompatibility selects an error, notice, no-op, or boundary value
      reason: validator_switch_option_incompatibility
    - condition: no_handler_access_limit selects an error, notice, no-op, or boundary value
      reason: no_handler_access_limit
    - condition: nonexistent_owner_role selects an error, notice, no-op, or boundary value
      reason: nonexistent_owner_role
    - condition: duplicate_new_name selects an error, notice, no-op, or boundary value
      reason: duplicate_new_name
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: ALTER FOREIGN DATA WRAPPER {fdw_name} {alter_action_clause};
  verification:
    required: true
    mode: catalog_effect_or_error_assertion
    sql: SELECT fdwname, fdwhandler, fdwvalidator, fdwowner FROM pg_foreign_data_wrapper WHERE fdwname = '{fdw_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP FOREIGN DATA WRAPPER IF EXISTS {fdw_name} CASCADE;
    - sql: DROP FOREIGN DATA WRAPPER IF EXISTS {new_fdw_name} CASCADE;
    - sql: DROP FUNCTION IF EXISTS {handler_function}();
    - sql: DROP FUNCTION IF EXISTS {validator_function}(text[], oid);
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
