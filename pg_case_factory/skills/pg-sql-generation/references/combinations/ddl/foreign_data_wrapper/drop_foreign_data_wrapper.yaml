schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_foreign_data_wrapper
  name: DROP FOREIGN DATA WRAPPER
  category: ddl
  domain: foreign_data_wrapper
  source_reference: references/statements/ddl/foreign_data_wrapper/drop_foreign_data_wrapper.md
  official_source: https://www.postgresql.org/docs/16/sql-dropforeigndatawrapper.html
  aliases:
  - DROP FOREIGN DATA WRAPPER
  - drop foreign data wrapper
  - drop_foreign_data_wrapper
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use only declared factors and declared factor values.
  - Derived extensions must preserve success, failure, notice, and no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - foreign_data_wrapper
    - server
    - foreign_table
    decision_reason: DROP FOREIGN DATA WRAPPER targets the FDW and must account for dependent foreign servers and foreign
      tables through CASCADE or RESTRICT behavior.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: The direct target is a foreign-data wrapper catalog object, not a relation. Dependent foreign tables
      are dependency fixtures captured by declared dependency factors.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP FOREIGN DATA WRAPPER can cascade to foreign tables through server dependencies, but it does not
      branch by table kind or table definition; dependency factors cover that boundary.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP FOREIGN DATA WRAPPER removes wrapper and dependent server metadata. It never inspects or branches
      on foreign table column data types, even when CASCADE removes dependent tables.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_fdw
      - branch_drop_fdw_if_exists
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - absent
      - present
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - restrict_default
      - cascade
      coverage_requirement: all_values
    multi_fdw:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - single_fdw
      - multiple_fdws
      coverage_requirement: all_values
    dependent_objects:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - no_dependencies
      - server_dependencies
      - foreign_table_dependencies
      - both_dependencies
      coverage_requirement: all_values
    fdw_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - fdw_owner
      - non_owner
      - superuser
      coverage_requirement: all_values
    server_dependency_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_server_deps
      - has_server_deps
      coverage_requirement: all_values
    foreign_table_dependency_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_table_deps
      - has_table_deps
      coverage_requirement: all_values
    nonexistent_fdw:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - fdw_exists
      - fdw_missing_no_if_exists
      coverage_requirement: all_values
    dependent_with_restrict:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_deps_restrict
      - has_deps_restrict
      - has_deps_cascade
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - owner_execution
      - non_owner_execution
      - superuser_execution
      coverage_requirement: all_values
    if_exists_notice:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_notice
      - notice_no_op
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - pg_foreign_data_wrapper_catalog
      - error_assertion
      - notice_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - recreate_fdw
      - recreate_server
      - recreate_foreign_table
      coverage_requirement: all_values
dynamic_inputs:
  fdw_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/fdw_manifest.json
    required_fields:
    - fdw_name
    - object_state
    - owner_role
  dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/fdw_dependency_manifest.json
    required_fields:
    - server_dependency_state
    - foreign_table_dependency_state
    - dependent_objects
combination_groups:
- id: drop_foreign_data_wrapper_required_factor_value_matrix
  title: DROP FOREIGN DATA WRAPPER required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - nonexistent_fdw
  - dependent_with_restrict
  - insufficient_privilege
  - if_exists_notice
  factors:
    statement_branch: branch_drop_fdw
    object_state: exists
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: restrict_default
    multi_fdw: single_fdw
    dependent_objects: no_dependencies
    fdw_name_shape: simple_id
    privilege_level: fdw_owner
    server_dependency_state: no_server_deps
    foreign_table_dependency_state: no_table_deps
    nonexistent_fdw: fdw_exists
    dependent_with_restrict: no_deps_restrict
    insufficient_privilege: owner_execution
    if_exists_notice: no_notice
    verification_mode: pg_foreign_data_wrapper_catalog
    cleanup_mode: recreate_fdw
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_fdw
      - branch_drop_fdw_if_exists
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    cascade_restrict:
      mode: explicit
      values:
      - restrict_default
      - cascade
    multi_fdw:
      mode: explicit
      values:
      - single_fdw
      - multiple_fdws
    dependent_objects:
      mode: explicit
      values:
      - no_dependencies
      - server_dependencies
      - foreign_table_dependencies
      - both_dependencies
    fdw_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - nonexistent_name
    privilege_level:
      mode: explicit
      values:
      - fdw_owner
      - non_owner
      - superuser
    server_dependency_state:
      mode: explicit
      values:
      - no_server_deps
      - has_server_deps
    foreign_table_dependency_state:
      mode: explicit
      values:
      - no_table_deps
      - has_table_deps
    nonexistent_fdw:
      mode: explicit
      values:
      - fdw_exists
      - fdw_missing_no_if_exists
    dependent_with_restrict:
      mode: explicit
      values:
      - no_deps_restrict
      - has_deps_restrict
      - has_deps_cascade
    insufficient_privilege:
      mode: explicit
      values:
      - owner_execution
      - non_owner_execution
      - superuser_execution
    if_exists_notice:
      mode: explicit
      values:
      - no_notice
      - notice_no_op
    verification_mode:
      mode: explicit
      values:
      - pg_foreign_data_wrapper_catalog
      - error_assertion
      - notice_assertion
    cleanup_mode:
      mode: explicit
      values:
      - recreate_fdw
      - recreate_server
      - recreate_foreign_table
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and all selected dependency, privilege, object-state, name-shape, and option factors are
      compatible
    - statement branch requirements match the selected clause and lifecycle setup manifests
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: target object, dependency, privilege, option, or name factor selects an invalid binding
      reason: statement_specific_failure
    - condition: nonexistent_fdw selects an error, notice, no-op, or boundary value
      reason: nonexistent_fdw
    - condition: dependent_with_restrict selects an error, notice, no-op, or boundary value
      reason: dependent_with_restrict
    - condition: insufficient_privilege selects an error, notice, no-op, or boundary value
      reason: insufficient_privilege
    - condition: if_exists_notice selects an error, notice, no-op, or boundary value
      reason: if_exists_notice
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP FOREIGN DATA WRAPPER {if_exists_clause} {fdw_name_list} {cascade_restrict};
  verification:
    required: true
    mode: catalog_error_or_notice_assertion
    sql: SELECT fdwname FROM pg_foreign_data_wrapper WHERE fdwname = '{fdw_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP FOREIGN TABLE IF EXISTS {foreign_table_name} CASCADE;
    - sql: DROP SERVER IF EXISTS {server_name} CASCADE;
    - sql: DROP FOREIGN DATA WRAPPER IF EXISTS {fdw_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
