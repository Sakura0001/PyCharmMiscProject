schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_routine
  name: DROP ROUTINE
  category: ddl
  domain: routine
  source_reference: references/statements/ddl/routine/drop_routine.md
  official_source: https://www.postgresql.org/docs/16/sql-droproutine.html
  aliases:
  - drop_routine
  - DROP ROUTINE
  - drop_function
  - DROP FUNCTION
  - drop_procedure
  - DROP PROCEDURE
  - drop_aggregate
  - DROP AGGREGATE
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, dependency, environment, or cross-factor combinations after baseline audit
    passes.
  - Derived extensions must not be counted as satisfying required factor, object, routine-signature, relation, table, or column-type
    coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - routine
    - function
    - procedure
    - aggregate
    decision_reason: DROP_ROUTINE targets the PostgreSQL ROUTINE abstraction and can resolve functions, procedures, or aggregates.
      The baseline must explicitly cover the routine object family and the concrete routine kinds handled by the statement.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: DROP_ROUTINE does not target a pg_class table, index, view, sequence, or materialized-view relation;
      routine catalog dependencies are represented as object and signature factors.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_ROUTINE operates on routine catalog objects and signatures rather than table variants. Required
      baseline coverage does not depend on regular, temporary, partitioned, inherited, or foreign table forms.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_ROUTINE uses argument signatures only to resolve routine identity. These are routine signature/type
      bindings covered by target_object_coverage, dynamic_inputs, and factor_contract; they are not table column definitions
      and do not require pg16 column-type expansion.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_drop_routine
      - branch_drop_routine_if_exists
      - branch_drop_routine_cascade
      - branch_drop_routine_restrict
      coverage_requirement: all_declared_values
    routine_existence:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - routine_exists
      - routine_not_exists
      - routine_exists_as_function
      - routine_exists_as_procedure
      - routine_exists_as_aggregate
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id004
      - without_if_exists
      - with_if_exists
      coverage_requirement: all_declared_values
    cascade_restrict_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id005
      - no_clause_default_restrict
      - cascade
      - restrict
      coverage_requirement: all_declared_values
    routine_type:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id006
      - function
      - procedure
      - aggregate
      coverage_requirement: all_declared_values
    arg_signature_disambiguation:
      tier: T2
      coverage_role: routine_signature_type_axis
      required_values: &id007
      - no_args_no_ambiguity
      - single_arg_with_signature
      - overloaded_requires_signature
      - signature_mismatch
      coverage_requirement: all_declared_values
    privilege_context:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id008
      - superuser
      - owner_of_routine
      - non_owner_no_privilege
      coverage_requirement: all_declared_values
    multi_target:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id009
      - single_target
      - multi_target_all_exist
      - multi_target_some_not_exist
      coverage_requirement: all_declared_values
    routine_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id010
      - simple_name
      - schema_qualified_name
      - quoted_name
      - non_existing_name
      coverage_requirement: all_declared_values
    arg_signature_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id011
      - no_args
      - single_arg
      - multiple_args
      - with_argmode
      - with_argname
      - empty_arg_list
      coverage_requirement: all_declared_values
    executor_privilege:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id012
      - superuser
      - owner
      - non_owner_no_privilege
      coverage_requirement: all_declared_values
    dependent_objects:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id013
      - no_dependent_objects
      - has_dependent_trigger
      - has_dependent_view
      - has_dependent_routine
      coverage_requirement: all_declared_values
    nonexistent_routine:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id014
      - routine_does_not_exist
      coverage_requirement: all_declared_values
    privilege_insufficient:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id015
      - non_owner_dropping_routine
      coverage_requirement: all_declared_values
    dependent_object_conflict:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id016
      - restrict_with_dependent_fails
      - cascade_with_dependent_succeeds
      coverage_requirement: all_declared_values
    overloaded_routine_ambiguity:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id017
      - ambiguous_without_signature
      - resolved_with_signature
      coverage_requirement: all_declared_values
    wrong_argument_types:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id018
      - signature_does_not_match_any_routine
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id019
      - pg_proc_catalog
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id020
      - drop_routine
      - drop_function
      - drop_procedure
      - drop_aggregate
      - cascade_drop_with_dependents
      coverage_requirement: all_declared_values
dynamic_inputs:
  routine_resolution_manifest:
    required: true
    source: factor_contract.routine_type, factor_contract.arg_signature_disambiguation, and combination_groups.expansion
    required_fields:
    - routine_name
    - routine_type
    - argument_signature
    - if_exists_clause
    - cascade_restrict_clause
    - dependency_state
    - expected_status
combination_groups:
- id: drop_routine_required_baseline_factor_space
  title: DROP ROUTINE required baseline factor space
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - expected_statement_failure
  - routine_resolution_or_privilege_failure
  - invalid_signature_or_type_binding
  - dependency_or_environment_failure
  factors:
    statement_branch: branch_drop_routine
    routine_existence: routine_exists
    expected_status: success
    if_exists_clause: without_if_exists
    cascade_restrict_clause: no_clause_default_restrict
    routine_type: function
    arg_signature_disambiguation: no_args_no_ambiguity
    privilege_context: superuser
    multi_target: single_target
    routine_name_shape: simple_name
    arg_signature_shape: no_args
    executor_privilege: superuser
    dependent_objects: no_dependent_objects
    nonexistent_routine: routine_does_not_exist
    privilege_insufficient: non_owner_dropping_routine
    dependent_object_conflict: restrict_with_dependent_fails
    overloaded_routine_ambiguity: ambiguous_without_signature
    wrong_argument_types: signature_does_not_match_any_routine
    verification_mode: pg_proc_catalog
    cleanup_mode: drop_routine
  expansion:
    statement_branch:
      mode: exhaustive
      values: *id001
    routine_existence:
      mode: exhaustive
      values: *id002
    expected_status:
      mode: exhaustive
      values: *id003
    if_exists_clause:
      mode: exhaustive
      values: *id004
    cascade_restrict_clause:
      mode: exhaustive
      values: *id005
    routine_type:
      mode: exhaustive
      values: *id006
    arg_signature_disambiguation:
      mode: representative
      values: *id007
    privilege_context:
      mode: representative
      values: *id008
    multi_target:
      mode: representative
      values: *id009
    routine_name_shape:
      mode: representative
      values: *id010
    arg_signature_shape:
      mode: representative
      values: *id011
    executor_privilege:
      mode: representative
      values: *id012
    dependent_objects:
      mode: representative
      values: *id013
    nonexistent_routine:
      mode: representative
      values: *id014
    privilege_insufficient:
      mode: representative
      values: *id015
    dependent_object_conflict:
      mode: representative
      values: *id016
    overloaded_routine_ambiguity:
      mode: representative
      values: *id017
    wrong_argument_types:
      mode: representative
      values: *id018
    verification_mode:
      mode: representative
      values: *id019
    cleanup_mode:
      mode: representative
      values: *id020
  compatibility:
    resolver: drop_routine_factor_binding_resolver
    success_when:
    - expected_status=success and selected object, signature, privilege, and dependency bindings are valid
    - statement branch and routine kind support the selected type, language, body, or aggregate option binding
    failure_when:
    - condition: expected_status=failure or a declared negative boundary factor is selected
      reason: expected_statement_failure
    - condition: target routine object, signature, owner, schema, language, extension, support function, or privilege is missing
        or incompatible
      reason: routine_resolution_or_privilege_failure
    - condition: argument, return, aggregate signature, or support function type binding is invalid for the selected branch
      reason: invalid_signature_or_type_binding
    default_failure_reason: expected_statement_failure
  sql_shape:
    template: DROP ROUTINE [IF EXISTS] {routine_name}({argument_signature}) [CASCADE|RESTRICT];
  verification:
    required: true
    mode: catalog_query
    sql: SELECT oid FROM pg_proc WHERE proname = '{routine_name}'
  cleanup:
    required: true
    steps:
    - sql: DROP ROUTINE IF EXISTS {routine_name}({argument_signature}) CASCADE
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
