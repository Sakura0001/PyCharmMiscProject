schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_routine
  name: ALTER ROUTINE
  category: ddl
  domain: routine
  source_reference: references/statements/ddl/routine/alter_routine.md
  official_source: https://www.postgresql.org/docs/16/sql-alterroutine.html
  aliases:
  - alter_routine
  - ALTER ROUTINE
  - alter_function
  - ALTER FUNCTION
  - alter_procedure
  - ALTER PROCEDURE
  - alter_aggregate
  - ALTER AGGREGATE
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, dependency, environment, or cross-factor combinations after baseline audit
    passes.
  - Derived extensions must not be counted as satisfying required factor, object, routine-signature, relation, table, or column-type
    coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - routine
    - function
    - procedure
    - aggregate
    decision_reason: ALTER_ROUTINE targets the PostgreSQL ROUTINE abstraction and can resolve functions, procedures, or aggregates.
      The baseline must explicitly cover the routine object family and the concrete routine kinds handled by the statement.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: ALTER_ROUTINE does not target a pg_class table, index, view, sequence, or materialized-view relation;
      routine catalog dependencies are represented as object and signature factors.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER_ROUTINE operates on routine catalog objects and signatures rather than table variants. Required
      baseline coverage does not depend on regular, temporary, partitioned, inherited, or foreign table forms.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER_ROUTINE uses argument signatures only to resolve routine identity. These are routine signature/type
      bindings covered by target_object_coverage, dynamic_inputs, and factor_contract; they are not table column definitions
      and do not require pg16 column-type expansion.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_action
      - branch_rename
      - branch_owner_to
      - branch_set_schema
      - branch_depends_on_extension
      coverage_requirement: all_declared_values
    routine_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - exists
      - non_existent
      - exists_as_function
      - exists_as_procedure
      - exists_as_aggregate
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_declared_values
    action_option:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id004
      - immutable
      - stable
      - volatile
      - leakproof
      - not_leakproof
      - security_invoker
      - security_definer
      - parallel_unsafe
      - parallel_restricted
      - parallel_safe
      - cost
      - rows
      - set_config_parameter
      - set_config_from_current
      - reset_config_parameter
      - reset_all
      coverage_requirement: all_declared_values
    routine_type:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id005
      - function
      - procedure
      - aggregate
      coverage_requirement: all_declared_values
    restrict_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id006
      - omitted
      - restrict
      coverage_requirement: all_declared_values
    owner_to_shape:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id007
      - explicit_role_name
      - current_role_keyword
      - current_user_keyword
      - session_user_keyword
      coverage_requirement: all_declared_values
    schema_change:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id008
      - existing_schema
      - nonexistent_schema
      coverage_requirement: all_declared_values
    extension_dependency:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id009
      - depends_on_existing_extension
      - no_depends_removing_dependency
      - depends_on_nonexistent_extension
      coverage_requirement: all_declared_values
    routine_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id010
      - simple_name
      - schema_qualified_name
      - quoted_name
      - non_existent_name
      coverage_requirement: all_declared_values
    arg_signature:
      tier: T3
      coverage_role: routine_signature_type_axis
      required_values: &id011
      - no_args
      - single_arg
      - multiple_args
      - with_argmode
      - with_argname
      - mismatched_signature
      coverage_requirement: all_declared_values
    new_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id012
      - simple_name
      - quoted_name
      - existing_name_conflict
      coverage_requirement: all_declared_values
    new_schema_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id013
      - existing_schema
      - nonexistent_schema
      coverage_requirement: all_declared_values
    executor_privilege:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id014
      - superuser
      - owner_of_routine
      - non_owner_with_grant_option
      - non_owner_no_privilege
      coverage_requirement: all_declared_values
    extension_dependency_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id015
      - extension_exists
      - extension_not_exists
      coverage_requirement: all_declared_values
    nonexistent_routine:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id016
      - routine_does_not_exist
      coverage_requirement: all_declared_values
    privilege_insufficient:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id017
      - non_owner_altering_routine
      - non_superuser_setting_leakproof
      - non_superuser_setting_security_definer
      coverage_requirement: all_declared_values
    nonexistent_schema:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id018
      - schema_does_not_exist
      coverage_requirement: all_declared_values
    nonexistent_extension:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id019
      - extension_does_not_exist
      coverage_requirement: all_declared_values
    nonexistent_owner:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id020
      - owner_role_does_not_exist
      coverage_requirement: all_declared_values
    conflicting_routine_signature:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id021
      - wrong_argument_types
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id022
      - pg_proc_catalog
      - pg_aggregate_catalog
      - effect_query
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id023
      - drop_routine
      - drop_function
      - drop_procedure
      - drop_aggregate
      - reset_config_parameter
      coverage_requirement: all_declared_values
dynamic_inputs:
  routine_resolution_manifest:
    required: true
    source: factor_contract.routine_type, factor_contract.arg_signature, and combination_groups.expansion
    required_fields:
    - routine_name
    - routine_type
    - argument_signature
    - routine_state
    - alter_action
    - privilege_context
    - expected_status
combination_groups:
- id: alter_routine_required_baseline_factor_space
  title: ALTER ROUTINE required baseline factor space
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - expected_statement_failure
  - routine_resolution_or_privilege_failure
  - invalid_signature_or_type_binding
  - dependency_or_environment_failure
  factors:
    statement_branch: branch_action
    routine_state: exists
    expected_status: success
    action_option: immutable
    routine_type: function
    restrict_clause: omitted
    owner_to_shape: explicit_role_name
    schema_change: existing_schema
    extension_dependency: depends_on_existing_extension
    routine_name_shape: simple_name
    arg_signature: no_args
    new_name_shape: simple_name
    new_schema_shape: existing_schema
    executor_privilege: superuser
    extension_dependency_state: extension_exists
    nonexistent_routine: routine_does_not_exist
    privilege_insufficient: non_owner_altering_routine
    nonexistent_schema: schema_does_not_exist
    nonexistent_extension: extension_does_not_exist
    nonexistent_owner: owner_role_does_not_exist
    conflicting_routine_signature: wrong_argument_types
    verification_mode: pg_proc_catalog
    cleanup_mode: drop_routine
  expansion:
    statement_branch:
      mode: exhaustive
      values: *id001
    routine_state:
      mode: exhaustive
      values: *id002
    expected_status:
      mode: exhaustive
      values: *id003
    action_option:
      mode: representative
      values: *id004
    routine_type:
      mode: representative
      values: *id005
    restrict_clause:
      mode: representative
      values: *id006
    owner_to_shape:
      mode: representative
      values: *id007
    schema_change:
      mode: representative
      values: *id008
    extension_dependency:
      mode: representative
      values: *id009
    routine_name_shape:
      mode: representative
      values: *id010
    arg_signature:
      mode: representative
      values: *id011
    new_name_shape:
      mode: representative
      values: *id012
    new_schema_shape:
      mode: representative
      values: *id013
    executor_privilege:
      mode: representative
      values: *id014
    extension_dependency_state:
      mode: representative
      values: *id015
    nonexistent_routine:
      mode: representative
      values: *id016
    privilege_insufficient:
      mode: representative
      values: *id017
    nonexistent_schema:
      mode: representative
      values: *id018
    nonexistent_extension:
      mode: representative
      values: *id019
    nonexistent_owner:
      mode: representative
      values: *id020
    conflicting_routine_signature:
      mode: representative
      values: *id021
    verification_mode:
      mode: representative
      values: *id022
    cleanup_mode:
      mode: representative
      values: *id023
  compatibility:
    resolver: alter_routine_factor_binding_resolver
    success_when:
    - expected_status=success and selected object, signature, privilege, and dependency bindings are valid
    - statement branch and routine kind support the selected type, language, body, or aggregate option binding
    failure_when:
    - condition: expected_status=failure or a declared negative boundary factor is selected
      reason: expected_statement_failure
    - condition: target routine object, signature, owner, schema, language, extension, support function, or privilege is missing
        or incompatible
      reason: routine_resolution_or_privilege_failure
    - condition: argument, return, aggregate signature, or support function type binding is invalid for the selected branch
      reason: invalid_signature_or_type_binding
    default_failure_reason: expected_statement_failure
  sql_shape:
    template: ALTER ROUTINE {routine_name}({argument_signature}) {alter_routine_action};
  verification:
    required: true
    mode: catalog_query
    sql: SELECT oid FROM pg_proc WHERE proname = '{routine_name}'
  cleanup:
    required: true
    steps:
    - sql: DROP ROUTINE IF EXISTS {routine_name}({argument_signature}) CASCADE
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
