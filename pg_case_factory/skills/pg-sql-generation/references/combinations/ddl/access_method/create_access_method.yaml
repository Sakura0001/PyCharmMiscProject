schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_access_method
  name: CREATE ACCESS METHOD
  category: ddl
  domain: access_method
  source_reference: references/statements/ddl/access_method/create_access_method.md
  official_source: https://www.postgresql.org/docs/16/sql-createaccessmethod.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - access_method
    decision_reason: access_method statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: access_method statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: access_method statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: access_method statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_1
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - not_exists
      - already_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    access_method_type:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - INDEX
      - TABLE
      coverage_requirement: all_values
    handler_function_state:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - exists
      - not_exists
      - wrong_return_type
      coverage_requirement: all_values
    am_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id006
      - plain_identifier
      - quoted_identifier
      - reserved_word
      coverage_requirement: all_values
    handler_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - plain_identifier
      - quoted_identifier
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id008
      - superuser
      - non_superuser
      coverage_requirement: all_values
    handler_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - handler_exists_returns_internal
      - handler_exists_wrong_return_type
      - handler_not_exists
      coverage_requirement: all_values
    duplicate_am_name:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id010
      - with_existing_am
      - with_builtin_am
      coverage_requirement: all_values
    invalid_access_method_type:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - unknown_type_value
      coverage_requirement: all_values
    handler_wrong_return_type:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - returns_non_internal
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id013
      - non_superuser_create
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id014
      - pg_am_catalog_query
      - pg_am_actual_usage
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id015
      - DROP_ACCESS_METHOD
      - DROP_ACCESS_METHOD_IF_EXISTS
      - DROP_ACCESS_METHOD_CASCADE
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: create_access_method_declared_factor_baseline
  title: CREATE ACCESS METHOD declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - create_access_method_declared_failure
  factors:
    statement_branch: branch_1
    object_state: not_exists
    expected_status: success
    access_method_type: INDEX
    handler_function_state: exists
    am_name_shape: plain_identifier
    handler_name_shape: plain_identifier
    privilege_level: superuser
    handler_dependency: handler_exists_returns_internal
    duplicate_am_name: with_existing_am
    invalid_access_method_type: unknown_type_value
    handler_wrong_return_type: returns_non_internal
    insufficient_privilege: non_superuser_create
    verification_mode: pg_am_catalog_query
    cleanup_mode: DROP_ACCESS_METHOD
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    access_method_type:
      mode: explicit
      values: *id004
    handler_function_state:
      mode: explicit
      values: *id005
    am_name_shape:
      mode: explicit
      values: *id006
    handler_name_shape:
      mode: explicit
      values: *id007
    privilege_level:
      mode: explicit
      values: *id008
    handler_dependency:
      mode: explicit
      values: *id009
    duplicate_am_name:
      mode: explicit
      values: *id010
    invalid_access_method_type:
      mode: explicit
      values: *id011
    handler_wrong_return_type:
      mode: explicit
      values: *id012
    insufficient_privilege:
      mode: explicit
      values: *id013
    verification_mode:
      mode: explicit
      values: *id014
    cleanup_mode:
      mode: explicit
      values: *id015
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: create_access_method_declared_failure
    default_failure_reason: create_access_method_declared_failure
  sql_shape:
    template: CREATE ACCESS METHOD {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for create_access_method
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
