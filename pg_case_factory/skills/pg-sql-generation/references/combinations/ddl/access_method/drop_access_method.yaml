schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_access_method
  name: DROP ACCESS METHOD
  category: ddl
  domain: access_method
  source_reference: references/statements/ddl/access_method/drop_access_method.md
  official_source: https://www.postgresql.org/docs/16/sql-dropaccessmethod.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - access_method
    decision_reason: access_method statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: access_method statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: access_method statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: access_method statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_1
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - not_exists
      - already_exists
      - exists_with_dependencies
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - absent
      - present
      coverage_requirement: all_values
    cascade_restrict:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - RESTRICT_default
      - RESTRICT_explicit
      - CASCADE
      coverage_requirement: all_values
    dependency_state:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - no_dependencies
      - has_dependent_opclass
      - has_dependent_index
      coverage_requirement: all_values
    am_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - plain_identifier
      - quoted_identifier
      - schema_qualified
      - nonexistent_name
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id008
      - superuser
      - non_superuser
      coverage_requirement: all_values
    nonexistent_am:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id009
      - without_if_exists
      - with_if_exists
      coverage_requirement: all_values
    dependent_objects_exist:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id010
      - restrict_with_dependencies
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - non_superuser_drop
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id012
      - pg_am_catalog_query
      - pg_am_removed_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id013
      - DROP_ACCESS_METHOD_CASCADE
      - DROP_DEPENDENT_OBJECTS_FIRST
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: drop_access_method_declared_factor_baseline
  title: DROP ACCESS METHOD declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - drop_access_method_declared_failure
  factors:
    statement_branch: branch_1
    object_state: not_exists
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: RESTRICT_default
    dependency_state: no_dependencies
    am_name_shape: plain_identifier
    privilege_level: superuser
    nonexistent_am: without_if_exists
    dependent_objects_exist: restrict_with_dependencies
    insufficient_privilege: non_superuser_drop
    verification_mode: pg_am_catalog_query
    cleanup_mode: DROP_ACCESS_METHOD_CASCADE
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    if_exists_clause:
      mode: explicit
      values: *id004
    cascade_restrict:
      mode: explicit
      values: *id005
    dependency_state:
      mode: explicit
      values: *id006
    am_name_shape:
      mode: explicit
      values: *id007
    privilege_level:
      mode: explicit
      values: *id008
    nonexistent_am:
      mode: explicit
      values: *id009
    dependent_objects_exist:
      mode: explicit
      values: *id010
    insufficient_privilege:
      mode: explicit
      values: *id011
    verification_mode:
      mode: explicit
      values: *id012
    cleanup_mode:
      mode: explicit
      values: *id013
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: drop_access_method_declared_failure
    default_failure_reason: drop_access_method_declared_failure
  sql_shape:
    template: DROP ACCESS METHOD {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for drop_access_method
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
