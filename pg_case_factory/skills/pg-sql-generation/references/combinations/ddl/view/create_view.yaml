schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_view
  name: CREATE VIEW
  category: ddl
  domain: view
  source_reference: references/statements/ddl/view/create_view.md
  aliases:
  - create_view
  - CREATE VIEW
  - createview
  - create view
  official_source: https://www.postgresql.org/docs/16/sql-createview.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, performance, or cross-factor combinations.
  - Derived extensions must not be counted as satisfying required factor or column-type coverage.
  - Derived extensions must use declared factors, declared factor values, and declared manifests.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - plain_view
    decision_reason: >-
      CREATE VIEW defines plain view objects. Temporary views and recursive views
      are still plain view relations in catalog terms and are represented through
      statement factors.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - plain_view
    negative_relation_kinds:
    - regular_table
    - materialized_view
    - sequence
    decision_reason: >-
      The target relation created by this statement is a plain view. Base query
      inputs are handled by table and dependency coverage, not by target relation
      kinds.
  table_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - temporary_table
    decision_reason: >-
      CREATE VIEW query expressions can read base tables, temporary tables, and
      referenced views. The baseline uses representative regular and temporary
      table inputs because the statement creates a view definition rather than
      changing table storage behavior.
  column_type_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: representative_base_table_type_sets
    require_each_type_success_or_failure: false
    decision_reason: >-
      CREATE VIEW output column types are inferred from the query expression.
      Exhaustive coverage of every PG16 column type is not required for view
      definition semantics; the baseline covers representative integer, string,
      datetime, numeric, JSON, and boolean base-table categories declared by the
      statement reference, with post-audit extensions allowed for additional
      type stress.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_create_view
      - branch_create_or_replace_view
      - branch_create_temp_view
      - branch_create_recursive_view
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - not_exists
      - already_exists
      coverage_requirement: success_failure_pair
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    or_replace_clause:
      tier: T2
      coverage_role: main_axis
      required_values:
      - absent
      - present
      coverage_requirement: success_failure_pair
    temporary_clause:
      tier: T2
      coverage_role: main_axis
      required_values:
      - permanent
      - temp
      - temporary
      coverage_requirement: all_values
    recursive_clause:
      tier: T2
      coverage_role: main_axis
      required_values:
      - absent
      - present
      coverage_requirement: success_failure_pair
    with_options_clause:
      tier: T2
      coverage_role: main_axis
      required_values:
      - absent
      - security_barrier
      - security_invoker
      - check_option
      - multiple_options
      coverage_requirement: all_values
    check_option_clause:
      tier: T2
      coverage_role: main_axis
      required_values:
      - absent
      - cascaded
      - local
      coverage_requirement: all_values
    column_name_list:
      tier: T2
      coverage_role: main_axis
      required_values:
      - absent
      - present
      - required_for_recursive
      coverage_requirement: all_values
    view_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - reserved_word
      - schema_qualified
      - duplicate
      coverage_requirement: all_values
    column_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - simple
      - quoted
      - reserved_word
      coverage_requirement: all_values
    query_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - select_simple
      - select_with_where
      - select_with_join
      - select_with_aggregate
      - values_clause
      - select_with_expression
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - owner
      - superuser
      - non_owner_with_create
      - non_owner_no_privilege
      coverage_requirement: success_failure_pair
    dependency_state:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - base_table_exists
      - base_table_not_exists
      - referenced_view_exists
      - referenced_view_not_exists
      coverage_requirement: all_values
    base_table_coverage:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - representative_int_types
      - representative_string_types
      - representative_datetime_types
      - representative_numeric_types
      - representative_json_types
      - representative_boolean_types
      coverage_requirement: representative_type_categories
    error_boundary:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - duplicate_without_or_replace
      - or_replace_column_mismatch
      - recursive_without_column_list
      - check_option_on_recursive
      - base_table_not_exists
      - insufficient_privilege
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - pg_class_query
      - information_schema_views
      - select_from_view
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - drop_view_if_exists
      - drop_view_cascade
      - drop_base_table_cascade
      coverage_requirement: all_values
dynamic_inputs:
  table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/table_manifest.json
    required_fields:
    - table_name
    - relation_kind
    - columns
  query_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/view_query_manifest.json
    required_fields:
    - query_shape
    - output_columns
    - dependencies
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  view_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/view_manifest.json
    required_fields:
    - view_name
    - column_names
    - options
combination_groups:
- id: create_view_success_branches_and_query_shapes
  title: Successful CREATE VIEW branches with representative query and type coverage
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_create_view
    object_state: not_exists
    expected_status: success
    or_replace_clause: absent
    temporary_clause: permanent
    recursive_clause: absent
    with_options_clause: absent
    check_option_clause: absent
    column_name_list: absent
    view_name_shape: simple
    column_name_shape: simple
    query_shape: select_simple
    privilege_level: owner
    dependency_state: base_table_exists
    base_table_coverage: representative_int_types
    error_boundary: none
    verification_mode: pg_class_query
    cleanup_mode: drop_view_if_exists
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_create_view
      - branch_create_or_replace_view
      - branch_create_temp_view
      - branch_create_recursive_view
    or_replace_clause:
      mode: explicit
      values:
      - absent
      - present
    temporary_clause:
      mode: explicit
      values:
      - permanent
      - temp
      - temporary
    recursive_clause:
      mode: explicit
      values:
      - absent
      - present
    with_options_clause:
      mode: representative
      values:
      - absent
      - security_barrier
      - security_invoker
      - check_option
      - multiple_options
    check_option_clause:
      mode: representative
      values:
      - absent
      - cascaded
      - local
    column_name_list:
      mode: representative
      values:
      - absent
      - present
      - required_for_recursive
    view_name_shape:
      mode: representative
      values:
      - simple
      - quoted
      - reserved_word
      - schema_qualified
    column_name_shape:
      mode: representative
      values:
      - simple
      - quoted
      - reserved_word
    query_shape:
      mode: representative
      values:
      - select_simple
      - select_with_where
      - select_with_join
      - select_with_aggregate
      - values_clause
      - select_with_expression
    privilege_level:
      mode: representative
      values:
      - owner
      - superuser
      - non_owner_with_create
    dependency_state:
      mode: representative
      values:
      - base_table_exists
      - referenced_view_exists
    base_table_coverage:
      mode: representative
      values:
      - representative_int_types
      - representative_string_types
      - representative_datetime_types
      - representative_numeric_types
      - representative_json_types
      - representative_boolean_types
    verification_mode:
      mode: representative
      values:
      - pg_class_query
      - information_schema_views
      - select_from_view
    cleanup_mode:
      mode: representative
      values:
      - drop_view_if_exists
      - drop_view_cascade
      - drop_base_table_cascade
  compatibility:
    resolver: branch_aware_declared_matrix
    success_when:
    - object_state == not_exists
    - privilege_level in [owner, superuser, non_owner_with_create]
    - dependency_state in [base_table_exists, referenced_view_exists]
    - recursive_clause == absent or column_name_list == required_for_recursive
    - recursive_clause == absent or check_option_clause == absent
    failure_when:
    - condition: recursive_clause == present and column_name_list != required_for_recursive
      reason: recursive_view_requires_column_name_list
    - condition: recursive_clause == present and check_option_clause != absent
      reason: check_option_not_allowed_on_recursive_view
    default_failure_reason: create_view_binding_invalid
  sql_shape:
    template: CREATE {or_replace_clause} {temporary_clause} {recursive_clause} VIEW {view_name} {column_list_clause} {with_options_clause} AS {query_sql} {check_option_clause};
  verification:
    required: true
    mode: catalog_or_select_query
    sql: SELECT 1 FROM pg_class WHERE relname = '{view_name}' AND relkind = 'v';
  cleanup:
    required: true
    steps:
    - sql: DROP VIEW IF EXISTS {view_name} CASCADE;
    - sql: DROP TABLE IF EXISTS {base_table_name} CASCADE;
- id: create_view_collision_or_replace_and_dependency_failures
  title: Name collision, OR REPLACE mismatch, dependency, and privilege failures
  lifecycle_role: target_statement
  expected_status_policy: fixed
  default_expected_status: failure
  expected_failure_reasons:
  - duplicate_without_or_replace
  - or_replace_column_mismatch
  - base_table_not_exists
  - referenced_view_not_exists
  - insufficient_privilege
  factors:
    statement_branch: branch_create_or_replace_view
    object_state: already_exists
    expected_status: failure
    or_replace_clause: absent
    temporary_clause: permanent
    recursive_clause: absent
    with_options_clause: absent
    check_option_clause: absent
    column_name_list: present
    view_name_shape: duplicate
    column_name_shape: simple
    query_shape: select_simple
    privilege_level: non_owner_no_privilege
    dependency_state: base_table_not_exists
    base_table_coverage: representative_int_types
    error_boundary: duplicate_without_or_replace
    verification_mode: error_assertion
    cleanup_mode: drop_view_if_exists
  expansion:
    object_state:
      mode: explicit
      values:
      - not_exists
      - already_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    or_replace_clause:
      mode: explicit
      values:
      - absent
      - present
    view_name_shape:
      mode: explicit
      values:
      - duplicate
    dependency_state:
      mode: explicit
      values:
      - base_table_not_exists
      - referenced_view_not_exists
    privilege_level:
      mode: explicit
      values:
      - non_owner_no_privilege
    error_boundary:
      mode: explicit
      values:
      - duplicate_without_or_replace
      - or_replace_column_mismatch
      - base_table_not_exists
      - insufficient_privilege
  compatibility:
    resolver: declared_matrix
    success_when:
    - object_state == already_exists and or_replace_clause == present and replacement_columns_match == true
    failure_when:
    - condition: object_state == already_exists and or_replace_clause == absent
      reason: duplicate_without_or_replace
    - condition: object_state == already_exists and or_replace_clause == present and replacement_columns_match == false
      reason: or_replace_column_mismatch
    - condition: dependency_state in [base_table_not_exists, referenced_view_not_exists]
      reason: dependency_relation_missing
    - condition: privilege_level == non_owner_no_privilege
      reason: insufficient_privilege
    default_failure_reason: create_view_definition_invalid
  sql_shape:
    template: CREATE {or_replace_clause} VIEW {view_name} {column_list_clause} AS {query_sql};
  verification:
    required: true
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP VIEW IF EXISTS {view_name} CASCADE;
- id: create_view_recursive_check_option_failures
  title: Recursive column-list and CHECK OPTION incompatibility failures
  lifecycle_role: target_statement
  expected_status_policy: fixed
  default_expected_status: failure
  expected_failure_reasons:
  - recursive_view_requires_column_name_list
  - check_option_not_allowed_on_recursive_view
  factors:
    statement_branch: branch_create_recursive_view
    object_state: not_exists
    expected_status: failure
    or_replace_clause: absent
    temporary_clause: permanent
    recursive_clause: present
    with_options_clause: check_option
    check_option_clause: cascaded
    column_name_list: absent
    view_name_shape: simple
    column_name_shape: simple
    query_shape: select_with_expression
    privilege_level: owner
    dependency_state: base_table_exists
    base_table_coverage: representative_numeric_types
    error_boundary: recursive_without_column_list
    verification_mode: error_assertion
    cleanup_mode: drop_view_if_exists
  expansion:
    check_option_clause:
      mode: explicit
      values:
      - cascaded
      - local
    column_name_list:
      mode: explicit
      values:
      - absent
      - required_for_recursive
    error_boundary:
      mode: explicit
      values:
      - recursive_without_column_list
      - check_option_on_recursive
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: recursive_clause == present and column_name_list == absent
      reason: recursive_view_requires_column_name_list
    - condition: recursive_clause == present and check_option_clause in [cascaded, local]
      reason: check_option_not_allowed_on_recursive_view
    default_failure_reason: recursive_view_definition_invalid
  sql_shape:
    template: CREATE RECURSIVE VIEW {view_name} {column_list_clause} AS {recursive_query_sql} {check_option_clause};
  verification:
    required: true
    mode: error_assertion
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP VIEW IF EXISTS {view_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
