schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_user_mapping
  name: ALTER USER MAPPING
  category: ddl
  domain: user_mapping
  source_reference: references/statements/ddl/user_mapping/alter_user_mapping.md
  official_source: https://www.postgresql.org/docs/16/sql-alterusermapping.html
  aliases:
  - alter_user_mapping
  - ALTER USER MAPPING
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use only declared factors and declared factor values.
  - Derived extensions must preserve success, failure, notice, and no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - user_mapping
    - server
    decision_reason: ALTER USER MAPPING changes option state for an existing mapping tied to a foreign server.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: ALTER USER MAPPING targets mapping metadata and does not name or inspect any relation object.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER USER MAPPING modifies server connection options for a user mapping, not a table or foreign-table
      definition.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: ALTER USER MAPPING does not depend on table columns or data types; SQL validity is driven by mapping
      existence, server dependency, option action, privilege, and option validation factors.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_1
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    user_specification:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - named_user
      - user_keyword
      - current_role
      - current_user
      - session_user
      - public
      coverage_requirement: all_values
    option_action:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - add
      - set
      - drop
      - default_add
      coverage_requirement: all_values
    option_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - single_option_add
      - single_option_set
      - single_option_drop
      - multiple_options_mixed
      coverage_requirement: all_values
    mapping_existence:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - mapping_exists
      - mapping_not_exists
      coverage_requirement: all_values
    user_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_name
      - public_keyword
      coverage_requirement: all_values
    server_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - nonexistent_name
      coverage_requirement: all_values
    option_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - valid_option
      - invalid_option
      coverage_requirement: all_values
    option_value_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - valid_value
      - quoted_value
      - drop_no_value
      coverage_requirement: all_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - server_owner
      - user_with_usage
      - non_privileged
      coverage_requirement: all_values
    server_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - server_exists_and_valid
      - server_missing
      coverage_requirement: all_values
    nonexistent_mapping:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - mapping_exists
      - mapping_missing
      coverage_requirement: all_values
    nonexistent_server:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - server_exists
      - server_missing
      coverage_requirement: all_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - has_privilege
      - lacks_privilege
      coverage_requirement: all_values
    invalid_option:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - valid_option_and_value
      - invalid_option_name
      - invalid_option_value
      coverage_requirement: all_values
    duplicate_option_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - unique_options
      - duplicate_option
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - catalog_query_pg_user_mapping
      - option_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - revert_option
      - drop_user_mapping
      - drop_server
      coverage_requirement: all_values
dynamic_inputs:
  user_mapping_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/user_mapping_manifest.json
    required_fields:
    - user_specification
    - server_name
    - mapping_existence
    - current_options
  foreign_server_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/foreign_server_manifest.json
    required_fields:
    - server_name
    - server_dependency
    - privilege_level
combination_groups:
- id: alter_user_mapping_required_factor_value_matrix
  title: ALTER USER MAPPING required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - nonexistent_mapping
  - nonexistent_server
  - insufficient_privilege
  - invalid_option
  - duplicate_option_name
  factors:
    statement_branch: branch_1
    object_state: exists
    expected_status: success
    user_specification: named_user
    option_action: add
    option_clause: single_option_add
    mapping_existence: mapping_exists
    user_name_shape: simple_id
    server_name_shape: simple_id
    option_name_shape: valid_option
    option_value_shape: valid_value
    privilege_level: server_owner
    server_dependency: server_exists_and_valid
    nonexistent_mapping: mapping_exists
    nonexistent_server: server_exists
    insufficient_privilege: has_privilege
    invalid_option: valid_option_and_value
    duplicate_option_name: unique_options
    verification_mode: catalog_query_pg_user_mapping
    cleanup_mode: revert_option
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_1
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    user_specification:
      mode: explicit
      values:
      - named_user
      - user_keyword
      - current_role
      - current_user
      - session_user
      - public
    option_action:
      mode: explicit
      values:
      - add
      - set
      - drop
      - default_add
    option_clause:
      mode: explicit
      values:
      - single_option_add
      - single_option_set
      - single_option_drop
      - multiple_options_mixed
    mapping_existence:
      mode: explicit
      values:
      - mapping_exists
      - mapping_not_exists
    user_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - nonexistent_name
      - public_keyword
    server_name_shape:
      mode: explicit
      values:
      - simple_id
      - nonexistent_name
    option_name_shape:
      mode: explicit
      values:
      - valid_option
      - invalid_option
    option_value_shape:
      mode: explicit
      values:
      - valid_value
      - quoted_value
      - drop_no_value
    privilege_level:
      mode: explicit
      values:
      - server_owner
      - user_with_usage
      - non_privileged
    server_dependency:
      mode: explicit
      values:
      - server_exists_and_valid
      - server_missing
    nonexistent_mapping:
      mode: explicit
      values:
      - mapping_exists
      - mapping_missing
    nonexistent_server:
      mode: explicit
      values:
      - server_exists
      - server_missing
    insufficient_privilege:
      mode: explicit
      values:
      - has_privilege
      - lacks_privilege
    invalid_option:
      mode: explicit
      values:
      - valid_option_and_value
      - invalid_option_name
      - invalid_option_value
    duplicate_option_name:
      mode: explicit
      values:
      - unique_options
      - duplicate_option
    verification_mode:
      mode: explicit
      values:
      - catalog_query_pg_user_mapping
      - option_query
      - error_assertion
    cleanup_mode:
      mode: explicit
      values:
      - revert_option
      - drop_user_mapping
      - drop_server
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and all selected dependency, privilege, object-state, name-shape, and option factors are
      compatible
    - statement branch requirements match the selected clause and lifecycle setup manifests
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: target object, dependency, privilege, option, or name factor selects an invalid binding
      reason: statement_specific_failure
    - condition: nonexistent_mapping selects an error, notice, no-op, or boundary value
      reason: nonexistent_mapping
    - condition: nonexistent_server selects an error, notice, no-op, or boundary value
      reason: nonexistent_server
    - condition: insufficient_privilege selects an error, notice, no-op, or boundary value
      reason: insufficient_privilege
    - condition: invalid_option selects an error, notice, no-op, or boundary value
      reason: invalid_option
    - condition: duplicate_option_name selects an error, notice, no-op, or boundary value
      reason: duplicate_option_name
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: ALTER USER MAPPING FOR {user_specification} SERVER {server_name} OPTIONS ({option_actions});
  verification:
    required: true
    mode: catalog_effect_or_error_assertion
    sql: SELECT umuser, umserver, umoptions FROM pg_user_mapping WHERE umserver = '{server_oid}';
  cleanup:
    required: true
    steps:
    - sql: DROP USER MAPPING IF EXISTS FOR {user_specification} SERVER {server_name};
    - sql: DROP SERVER IF EXISTS {server_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
