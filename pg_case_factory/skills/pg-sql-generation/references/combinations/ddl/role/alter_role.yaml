- id: alter_role_core_syntax_and_state_baseline
  title: ALTER ROLE core syntax, target state, and primary option coverage
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_1_with_option
    role_state: exists
    expected_status: success
    attribute_option: superuser
    rename_behavior: rename_to_new_name
    config_parameter_behavior: set_value
    privilege_level: superuser
    role_name_shape: simple_name
    new_name_shape: simple_name
    config_parameter_shape: valid_parameter
    database_name_shape: existing_database
    table_column_index_involvement: not_involved
    privilege_requirement: superuser_required
    config_parameter_dependency: settable_by_any_role
    role_membership_dependency: admin_option_granted
    nonexistent_role: role_does_not_exist
    privilege_insufficient: ordinary_role_altering_other_role_attributes
    invalid_config_parameter: superuser_only_parameter_by_non_superuser
    rename_current_session_user: session_user_rename_blocked
    rename_clears_password: md5_password_cleared_on_rename
    password_security: plaintext_password_in_sql
    verification_mode: pg_roles_catalog
    cleanup_mode: reset_config_parameter
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_1_with_option
      - branch_2_rename
      - branch_3_set_value
      - branch_4_set_from_current
      - branch_5_reset_parameter
      - branch_6_reset_all
    role_state:
      mode: explicit
      values:
      - exists
      - non_existent
      - reserved_word_name
      - quoted_name
      - current_session_user
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    attribute_option:
      mode: explicit
      values:
      - superuser
      - nosuperuser
      - createdb
      - nocreatedb
      - createrole
      - nocreaterole
      - inherit
      - noinherit
      - login
      - nologin
      - replication
      - noreplication
      - bypassrls
      - nobypassrls
      - connection_limit
      - encrypted_password
      - password_null
      - valid_until
    rename_behavior:
      mode: explicit
      values:
      - rename_to_new_name
      - rename_reserved_word
      - rename_current_user_blocked
    config_parameter_behavior:
