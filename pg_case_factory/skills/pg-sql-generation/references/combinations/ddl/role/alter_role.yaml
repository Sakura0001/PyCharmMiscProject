      - reset_parameter
      - reset_all
      - all_roles
      - in_database_specific
    privilege_level:
      mode: explicit
      values:
      - superuser
      - createrole_with_admin_option
      - createrole_without_admin_option
      - ordinary_role_self
      - ordinary_role_other
  compatibility:
    resolver: declared_matrix
    success_when:
    - selected binding represents a documented success path for the role catalog object
    - executor privilege and referenced role prerequisites are satisfied
    failure_when:
    - condition: expected_status == failure
      reason: target_role_missing
    - condition: privilege or dependency factor selects an invalid prerequisite
      reason: declared_role_ddl_prerequisite_failure
    default_failure_reason: target_role_missing
  sql_shape:
    template: ALTER ROLE role_specification [ WITH ] option [ ... ] | ALTER ROLE name RENAME TO new_name | ALTER ROLE { role_specification
      | ALL } [ IN DATABASE database_name ] SET/RESET configuration_parameter
  verification:
    required: true
    mode: pg_roles_catalog
    sql: SELECT rolname FROM pg_roles WHERE rolname = '{role_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP ROLE IF EXISTS {target_role_name};
    - sql: DROP ROLE IF EXISTS {new_role_name};
