      - role_exists
      - role_not_exists
      - role_exists_as_superuser
      - role_exists_as_nonsuperuser
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - without_if_exists
      - with_if_exists
    privilege_context:
      mode: explicit
      values:
      - superuser
      - createrole_with_admin
      - createrole_without_admin
      - no_privilege
    multi_target:
      mode: explicit
      values:
      - single_target
      - multi_target_all_exist
      - multi_target_some_not_exist
  compatibility:
    resolver: declared_matrix
    success_when:
    - selected binding represents a documented success path for the role catalog object
    - executor privilege and referenced role prerequisites are satisfied
    failure_when:
    - condition: expected_status == failure
      reason: target_role_missing
    - condition: privilege or dependency factor selects an invalid prerequisite
      reason: declared_role_ddl_prerequisite_failure
    default_failure_reason: target_role_missing
  sql_shape:
    template: DROP ROLE [ IF EXISTS ] name [, ...]
  verification:
    required: true
    mode: catalog_query_pg_roles
    sql: SELECT rolname FROM pg_roles WHERE rolname = '{role_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP ROLE IF EXISTS {target_role_name};
