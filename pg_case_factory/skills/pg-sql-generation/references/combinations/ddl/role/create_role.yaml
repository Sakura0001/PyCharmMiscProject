  sql_shape:
    template: CREATE ROLE {role_name} [ [ WITH ] {options} ]
  verification:
    required: true
    mode: pg_roles_catalog_query
    sql: SELECT rolname FROM pg_roles WHERE rolname = '{role_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP ROLE IF EXISTS {target_role_name};
