      - nocreaterole
      - inherit
      - noinherit
      - login
      - nologin
      - replication
      - noreplication
      - bypassrls
      - nobypassrls
    password_clause:
      mode: explicit
      values:
      - omitted
      - encrypted_password
      - unencrypted_password
      - password_null
    connection_limit_clause:
      mode: explicit
      values:
      - omitted
