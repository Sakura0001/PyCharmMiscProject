schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_extension
  name: DROP EXTENSION
  category: ddl
  domain: extension
  source_reference: references/statements/ddl/extension/drop_extension.md
  official_source: https://www.postgresql.org/docs/16/sql-dropextension.html
  aliases:
  - DROP EXTENSION
  - drop extension
  - drop_extension
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, no-op, or notice attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - extension
    decision_reason: DROP_EXTENSION directly targets PostgreSQL extension objects and extension catalog metadata; baseline
      coverage is scoped to extension lifecycle state, member-object dependencies, privileges, and schema/version behavior.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: DROP_EXTENSION names an extension object rather than a pg_class relation. Member objects such as tables,
      functions, types, views, or sequences are dependency fixtures represented by declared extension factors, not required
      relation-kind coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_EXTENSION operates on extension installation, metadata, schema/version state, or extension membership.
      It does not directly create, alter, scan, or drop table definitions, so table-kind coverage is not a baseline axis.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_EXTENSION does not validate table-column data types. Any types installed or referenced through extension
      membership are extension member fixtures, not table column-type combinations controlled by the statement.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_extension
      - branch_drop_extension_if_exists
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - absent
      - present
      coverage_requirement: all_declared_values
    cascade_restrict:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - restrict_default
      - cascade
      coverage_requirement: all_declared_values
    multi_extension:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - single_extension
      - multiple_extensions
      coverage_requirement: all_declared_values
    dependent_objects:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - no_dependencies
      - member_objects_only
      - external_dependencies
      coverage_requirement: all_declared_values
    extension_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_name
      - duplicate_name
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - extension_owner
      - non_owner
      - superuser
      coverage_requirement: all_declared_values
    member_object_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - has_members
      - no_members
      coverage_requirement: all_declared_values
    external_dependency_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_external_deps
      - has_external_deps
      coverage_requirement: all_declared_values
    nonexistent_extension:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - extension_exists
      - extension_missing_no_if_exists
      coverage_requirement: all_declared_values
    dependent_with_restrict:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_deps_restrict
      - has_deps_restrict
      - has_deps_cascade
      coverage_requirement: all_declared_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - owner_execution
      - non_owner_execution
      - superuser_execution
      coverage_requirement: all_declared_values
    if_exists_notice:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_notice
      - notice_no_op
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - pg_extension_catalog_query
      - error_assertion
      - notice_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - drop_dependent_objects
      - recreate_extension
      - role_cleanup
      coverage_requirement: all_declared_values
dynamic_inputs:
  extension_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/extension_manifest.json
    required_fields:
    - extension_name
    - object_state
    - owner
    - available_versions
  extension_dependency_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/extension_dependency_manifest.json
    required_fields:
    - member_object_type
    - member_object_name
    - dependency_state
combination_groups:
- id: drop_extension_required_factor_value_matrix
  title: DROP EXTENSION required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - nonexistent_extension
  - dependent_with_restrict
  - insufficient_privilege
  - if_exists_notice
  factors:
    statement_branch: branch_drop_extension
    object_state: exists
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: restrict_default
    multi_extension: single_extension
    dependent_objects: no_dependencies
    extension_name_shape: simple_id
    privilege_level: extension_owner
    member_object_state: has_members
    external_dependency_state: no_external_deps
    nonexistent_extension: extension_exists
    dependent_with_restrict: no_deps_restrict
    insufficient_privilege: owner_execution
    if_exists_notice: no_notice
    verification_mode: pg_extension_catalog_query
    cleanup_mode: drop_dependent_objects
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_extension
      - branch_drop_extension_if_exists
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    cascade_restrict:
      mode: explicit
      values:
      - restrict_default
      - cascade
    multi_extension:
      mode: explicit
      values:
      - single_extension
      - multiple_extensions
    dependent_objects:
      mode: explicit
      values:
      - no_dependencies
      - member_objects_only
      - external_dependencies
    extension_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - nonexistent_name
      - duplicate_name
    privilege_level:
      mode: explicit
      values:
      - extension_owner
      - non_owner
      - superuser
    member_object_state:
      mode: explicit
      values:
      - has_members
      - no_members
    external_dependency_state:
      mode: explicit
      values:
      - no_external_deps
      - has_external_deps
    nonexistent_extension:
      mode: explicit
      values:
      - extension_exists
      - extension_missing_no_if_exists
    dependent_with_restrict:
      mode: explicit
      values:
      - no_deps_restrict
      - has_deps_restrict
      - has_deps_cascade
    insufficient_privilege:
      mode: explicit
      values:
      - owner_execution
      - non_owner_execution
      - superuser_execution
    if_exists_notice:
      mode: explicit
      values:
      - no_notice
      - notice_no_op
    verification_mode:
      mode: explicit
      values:
      - pg_extension_catalog_query
      - error_assertion
      - notice_assertion
    cleanup_mode:
      mode: explicit
      values:
      - drop_dependent_objects
      - recreate_extension
      - role_cleanup
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and the selected object, privilege, dependency, and syntax factors describe a legal statement
      execution path
    - notice or no-op paths are attributed by their declared factors and do not replace required success/failure coverage
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: declared object state, privilege, dependency, name-shape, validator, or numeric boundary factor selects an
        invalid prerequisite
      reason: declared_factor_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP EXTENSION [ IF EXISTS ] {extension_name} [, ...] [ CASCADE | RESTRICT ]
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT extname FROM pg_extension WHERE extname = '{extension_name}'
  cleanup:
    required: true
    steps:
    - sql: DROP EXTENSION IF EXISTS {extension_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
