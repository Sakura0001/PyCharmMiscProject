schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_text_search_template
  name: CREATE TEXT SEARCH TEMPLATE
  category: ddl
  domain: text_search_template
  source_reference: references/statements/ddl/text_search_template/create_text_search_template.md
  official_source: https://www.postgresql.org/docs/16/sql-createtstemplate.html
  aliases:
  - create_text_search_template
  - CREATE TEXT SEARCH TEMPLATE
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, dependency, privilege, naming, or cross-factor combinations after the baseline
    audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, no-op, or notice attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - text_search_template
    - function
    decision_reason: CREATE TEXT SEARCH TEMPLATE directly targets a text search template catalog object. Required baseline
      coverage is scoped to lexize/init function dependencies and superuser privilege behavior declared by the statement reference.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: CREATE TEXT SEARCH TEMPLATE names text search catalog objects, not pg_class relations. Tables, indexes,
      views, sequences, materialized views, and foreign tables are outside this statement target surface.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE TEXT SEARCH TEMPLATE does not directly create, alter, scan, validate, or drop table definitions.
      Any setup objects are text search catalog dependencies rather than table-kind coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: The statement manages template catalog metadata and template support functions. It does not operate on
      table columns or column type semantics, so PG16 table column_type_coverage is not applicable.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_without_init
      - branch_with_init
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - not_exists
      - exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_declared_values
    init_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id004
      - omitted
      - specified
      coverage_requirement: all_declared_values
    function_existence:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id005
      - all_functions_exist
      - some_functions_missing
      coverage_requirement: all_declared_values
    privilege_requirement:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id006
      - superuser
      - non_superuser
      coverage_requirement: all_declared_values
    template_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id007
      - simple_id
      - schema_qualified_id
      - quoted_id
      - reserved_word_as_name
      - duplicate_name
      - invalid_name
      coverage_requirement: all_declared_values
    function_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id008
      - simple_id
      - schema_qualified_id
      - nonexistent_name
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id009
      - superuser
      - non_superuser
      coverage_requirement: all_declared_values
    function_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id010
      - all_functions_valid
      - function_missing
      coverage_requirement: all_declared_values
    duplicate_template_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id011
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_declared_values
    nonexistent_function:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id012
      - function_exists
      - function_missing
      coverage_requirement: all_declared_values
    non_superuser_attempt:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id013
      - superuser_execution
      - non_superuser_execution
      coverage_requirement: all_declared_values
    missing_lexize_function:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id014
      - lexize_present
      - lexize_missing
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id015
      - catalog_query_pg_ts_template
      - error_assertion
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id016
      - drop_text_search_template
      - drop_function
      coverage_requirement: all_declared_values
dynamic_inputs:
  ts_template_object_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/create_text_search_template_object_manifest.json
    required_fields:
    - object_name
    - schema_name
    - object_state
    - owner_role
  ts_template_dependency_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/create_text_search_template_dependency_manifest.json
    required_fields:
    - dependency_objects
    - dependency_state
    - statement_branch
  ts_template_privilege_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/create_text_search_template_privilege_manifest.json
    required_fields:
    - execution_role
    - privilege_context
    - is_superuser
combination_groups:
- id: create_text_search_template_required_factor_value_matrix
  title: CREATE TEXT SEARCH TEMPLATE required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - statement_specific_failure
  - declared_factor_failure
  - duplicate_template_name
  - nonexistent_function
  - non_superuser_attempt
  - missing_lexize_function
  factors:
    statement_branch: branch_without_init
    object_state: not_exists
    expected_status: success
    init_clause: omitted
    function_existence: all_functions_exist
    privilege_requirement: superuser
    template_name_shape: simple_id
    function_name_shape: simple_id
    privilege_level: superuser
    function_dependency: all_functions_valid
    duplicate_template_name: no_conflict
    nonexistent_function: function_exists
    non_superuser_attempt: superuser_execution
    missing_lexize_function: lexize_present
    verification_mode: catalog_query_pg_ts_template
    cleanup_mode: drop_text_search_template
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_state:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    init_clause:
      mode: explicit
      values: *id004
    function_existence:
      mode: explicit
      values: *id005
    privilege_requirement:
      mode: explicit
      values: *id006
    template_name_shape:
      mode: explicit
      values: *id007
    function_name_shape:
      mode: explicit
      values: *id008
    privilege_level:
      mode: explicit
      values: *id009
    function_dependency:
      mode: explicit
      values: *id010
    duplicate_template_name:
      mode: explicit
      values: *id011
    nonexistent_function:
      mode: explicit
      values: *id012
    non_superuser_attempt:
      mode: explicit
      values: *id013
    missing_lexize_function:
      mode: explicit
      values: *id014
    verification_mode:
      mode: explicit
      values: *id015
    cleanup_mode:
      mode: explicit
      values: *id016
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and selected text_search_template object, dependency, privilege, and syntax factors describe
      a legal CREATE TEXT SEARCH TEMPLATE path
    - notice and no-op paths are represented by declared IF EXISTS or branch factors and do not replace required success/failure
      coverage
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: declared object state, dependency, privilege, name-shape, duplicate, missing-object, or schema boundary factor
        selects an invalid prerequisite
      reason: declared_factor_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: CREATE TEXT SEARCH TEMPLATE {template_name} ( LEXIZE = {lexize_function} [, INIT = {init_function} ] )
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT tmplname FROM pg_ts_template WHERE tmplname = '{template_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP TEXT SEARCH TEMPLATE IF EXISTS {template_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
