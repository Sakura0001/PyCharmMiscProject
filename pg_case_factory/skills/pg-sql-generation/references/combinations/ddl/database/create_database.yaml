schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_database
  name: CREATE DATABASE
  category: ddl
  domain: database
  source_reference: references/statements/ddl/database/create_database.md
  official_source: https://www.postgresql.org/docs/16/sql-createdatabase.html
  aliases:
  - create_database
  - CREATE DATABASE
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, or no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - database
    decision_reason: CREATE_DATABASE targets PostgreSQL database cluster objects. Required coverage is the database object
      state and statement-specific database lifecycle behavior, not relation or table variants.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: CREATE_DATABASE does not name a table, index, view, sequence, or other pg_class relation as its target.
      Database-level storage or connection side effects are represented by database factors instead of relation-kind coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE_DATABASE operates on a database object and its metadata, options, ownership, connection state,
      or storage location. It does not directly create, alter, scan, or drop individual table definitions, so table-kind coverage
      is not a required baseline axis.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE_DATABASE has no SQL validity, result, cleanup, or verification rule that depends on table column
      data types; database-level behavior is governed by object state, privileges, options, connections, and environment factors.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_create_database
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - not_exists
      - exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    owner_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - current_user
      - specified_other_role
      coverage_requirement: all_values
    template_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted_default_template1
      - template0
      - custom_template
      coverage_requirement: all_values
    encoding_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - UTF8
      - LATIN1
      - SQL_ASCII
      coverage_requirement: all_values
    locale_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - C_locale
      - POSIX_locale
      - specific_locale
      coverage_requirement: all_values
    strategy_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted_default_wal_log
      - WAL_LOG
      - FILE_COPY
      coverage_requirement: all_values
    privilege_level:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - superuser
      - createdb_role
      - non_createdb_role
      coverage_requirement: all_values
    database_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - reserved_word_as_name
      - duplicate_name
      coverage_requirement: all_values
    owner_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - nonexistent_role
      coverage_requirement: all_values
    tablespace_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - default_tablespace
      - existing_tablespace
      - nonexistent_tablespace
      coverage_requirement: all_values
    template_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - template_exists_no_connections
      - template_exists_with_connections
      - template_not_exists
      coverage_requirement: all_values
    encoding_locale_compatibility:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - compatible
      - incompatible
      coverage_requirement: all_values
    role_set_role_ability:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - can_set_role
      - cannot_set_role
      coverage_requirement: all_values
    tablespace_existence:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - tablespace_exists
      - tablespace_not_exists
      coverage_requirement: all_values
    duplicate_database_name:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_conflict
      - same_name_conflict
      coverage_requirement: all_values
    privilege_denied:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - has_createdb
      - lacks_createdb
      coverage_requirement: all_values
    cannot_set_role_to_owner:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - can_set_role
      - cannot_set_role
      coverage_requirement: all_values
    template_has_connections:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_other_connections
      - has_other_connections
      coverage_requirement: all_values
    encoding_locale_incompatible:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - compatible
      - incompatible
      coverage_requirement: all_values
    encoding_template_mismatch:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - matches_template
      - mismatches_template_not_template0
      coverage_requirement: all_values
    nonexistent_template:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - template_exists
      - template_not_exists
      coverage_requirement: all_values
    nonexistent_tablespace:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - tablespace_exists
      - tablespace_not_exists
      coverage_requirement: all_values
    inside_transaction_block:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - outside_transaction
      - inside_transaction
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - catalog_query_pg_database
      - connect_to_new_database
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - drop_database
      - force_drop_database
      coverage_requirement: all_values
dynamic_inputs:
  database_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/database_manifest.json
    required_fields:
    - database_name
    - object_state
    - owner
    - exists_before_statement
  role_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - role_name
    - privilege_context
    - can_set_role
  database_environment_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/database_environment_manifest.json
    required_fields:
    - connection_state
    - template_state
    - tablespace_state
    - transaction_context
