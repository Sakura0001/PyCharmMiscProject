  expected_failure_reasons:
  - database_not_exists
  - privilege_denied
  - rename_current_database
  - rename_target_conflict
  - owner_not_exist
  - tablespace_not_exist
  - tablespace_has_connections
  - cannot_set_role
  - lacks_createdb_privilege
  - set_tablespace_in_transaction
  - config_parameter_superuser_only
  factors:
    statement_branch: branch_with_options
    object_state: exists
    expected_status: success
    privilege_level: superuser
    with_option_type: allow_connections_true
    new_owner_target: existing_role
    rename_conflict: new_name_unique
    config_parameter_type: common_parameter
