    owner_not_exist: role_exists
    tablespace_not_exist: tablespace_exists
    tablespace_has_connections: no_connections
    privilege_denied: owner_or_superuser_success
    cannot_set_role: can_set_role
    lacks_createdb_privilege: has_createdb
    set_tablespace_in_transaction: outside_transaction
    config_parameter_superuser_only: superuser_setting_superuser_param
    verification_mode: catalog_query_pg_database
    cleanup_mode: drop_database
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_with_options
      - branch_rename
      - branch_owner
      - branch_set_tablespace
      - branch_refresh_collation_version
      - branch_set_parameter
      - branch_set_from_current
      - branch_reset_parameter
      - branch_reset_all
    object_state:
      mode: explicit
