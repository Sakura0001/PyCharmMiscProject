schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_database
  name: DROP DATABASE
  category: ddl
  domain: database
  source_reference: references/statements/ddl/database/drop_database.md
  official_source: https://www.postgresql.org/docs/16/sql-dropdatabase.html
  aliases:
  - drop_database
  - DROP DATABASE
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, or no-op attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - database
    decision_reason: DROP_DATABASE targets PostgreSQL database cluster objects. Required coverage is the database object state
      and statement-specific database lifecycle behavior, not relation or table variants.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: DROP_DATABASE does not name a table, index, view, sequence, or other pg_class relation as its target.
      Database-level storage or connection side effects are represented by database factors instead of relation-kind coverage.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_DATABASE operates on a database object and its metadata, options, ownership, connection state, or
      storage location. It does not directly create, alter, scan, or drop individual table definitions, so table-kind coverage
      is not a required baseline axis.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_DATABASE has no SQL validity, result, cleanup, or verification rule that depends on table column
      data types; database-level behavior is governed by object state, privileges, options, connections, and environment factors.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_database
      coverage_requirement: all_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists
      - not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - specified_if_exists
      coverage_requirement: all_values
    force_option:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - omitted
      - specified_force
      coverage_requirement: all_values
    privilege_level:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - superuser
      - database_owner
      - non_owner
      coverage_requirement: all_values
    connection_state:
      tier: T2
      coverage_role: branch_local_axis
      required_values:
      - no_other_connections
      - has_other_connections
      - connected_to_target_database
      coverage_requirement: all_values
    database_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple_id
      - quoted_id
      - nonexistent_name
      coverage_requirement: all_values
    active_connections:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_active_connections
      - has_terminable_connections
      - has_unterminable_connections
      coverage_requirement: all_values
    prepared_transactions:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_prepared_transactions
      - has_prepared_transactions
      coverage_requirement: all_values
    replication_slots:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_active_slots
      - has_active_slots
      coverage_requirement: all_values
    subscriptions:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_subscriptions
      - has_subscriptions
      coverage_requirement: all_values
    database_not_exist_no_if_exists:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - database_exists
      - database_not_exists_no_if_exists
      coverage_requirement: all_values
    privilege_denied:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - owner_success
      - non_owner_failure
      - superuser_success
      coverage_requirement: all_values
    connected_to_target_database:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - connected_to_different_database
      - connected_to_target_database
      coverage_requirement: all_values
    active_connections_without_force:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - no_connections_or_force_used
      - connections_without_force
      coverage_requirement: all_values
    force_with_unterminable_connections:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - all_connections_terminable
      - unterminable_connections_remain
      coverage_requirement: all_values
    inside_transaction_block:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - outside_transaction
      - inside_transaction
      coverage_requirement: all_values
    drop_current_database:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - different_database
      - current_database
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values:
      - catalog_query_pg_database_absence
      - error_assertion
      - notice_assertion_if_exists
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values:
      - force_drop_database
      - drop_database_simple
      coverage_requirement: all_values
dynamic_inputs:
  database_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/database_manifest.json
    required_fields:
    - database_name
    - object_state
    - owner
    - exists_before_statement
  role_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/role_manifest.json
    required_fields:
    - role_name
    - privilege_context
    - can_set_role
  database_environment_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/database_environment_manifest.json
    required_fields:
    - connection_state
    - template_state
    - tablespace_state
    - transaction_context
combination_groups:
- id: drop_database_required_factor_value_matrix
  title: DROP DATABASE required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - database_not_exist_no_if_exists
  - privilege_denied
  - connected_to_target_database
  - active_connections_without_force
  - force_with_unterminable_connections
  - inside_transaction_block
  - drop_current_database
  factors:
    statement_branch: branch_drop_database
    object_state: exists
    expected_status: success
    if_exists_clause: omitted
    force_option: omitted
    privilege_level: superuser
    connection_state: no_other_connections
    database_name_shape: simple_id
    active_connections: no_active_connections
    prepared_transactions: no_prepared_transactions
    replication_slots: no_active_slots
    subscriptions: no_subscriptions
    database_not_exist_no_if_exists: database_exists
    privilege_denied: owner_success
    connected_to_target_database: connected_to_different_database
    active_connections_without_force: no_connections_or_force_used
    force_with_unterminable_connections: all_connections_terminable
    inside_transaction_block: outside_transaction
    drop_current_database: different_database
    verification_mode: catalog_query_pg_database_absence
    cleanup_mode: force_drop_database
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_database
    object_state:
      mode: explicit
      values:
      - exists
      - not_exists
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - omitted
      - specified_if_exists
    force_option:
      mode: explicit
      values:
      - omitted
      - specified_force
    privilege_level:
      mode: explicit
      values:
      - superuser
      - database_owner
      - non_owner
    connection_state:
      mode: explicit
      values:
      - no_other_connections
      - has_other_connections
      - connected_to_target_database
    database_name_shape:
      mode: explicit
      values:
      - simple_id
      - quoted_id
      - nonexistent_name
    active_connections:
      mode: explicit
      values:
      - no_active_connections
      - has_terminable_connections
      - has_unterminable_connections
    prepared_transactions:
      mode: explicit
      values:
      - no_prepared_transactions
      - has_prepared_transactions
    replication_slots:
      mode: explicit
      values:
      - no_active_slots
      - has_active_slots
    subscriptions:
      mode: explicit
      values:
      - no_subscriptions
      - has_subscriptions
    database_not_exist_no_if_exists:
      mode: explicit
      values:
      - database_exists
      - database_not_exists_no_if_exists
    privilege_denied:
      mode: explicit
      values:
      - owner_success
      - non_owner_failure
      - superuser_success
    connected_to_target_database:
      mode: explicit
      values:
      - connected_to_different_database
      - connected_to_target_database
    active_connections_without_force:
      mode: explicit
      values:
      - no_connections_or_force_used
      - connections_without_force
    force_with_unterminable_connections:
      mode: explicit
      values:
      - all_connections_terminable
      - unterminable_connections_remain
    inside_transaction_block:
      mode: explicit
      values:
      - outside_transaction
      - inside_transaction
    drop_current_database:
      mode: explicit
      values:
      - different_database
      - current_database
    verification_mode:
      mode: explicit
      values:
      - catalog_query_pg_database_absence
      - error_assertion
      - notice_assertion_if_exists
    cleanup_mode:
      mode: explicit
      values:
      - force_drop_database
      - drop_database_simple
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and object_state not in [not_exists, absent, already_exists, reserved_name_conflict]
    - statement-specific dependencies, privileges, names, and environment factors are compatible with the selected branch
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: object_state in [not_exists, absent] without IF EXISTS-style tolerance
      reason: target_object_missing
    - condition: privilege or role ability factor selects an insufficient-permission value
      reason: privilege_denied
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP DATABASE {if_exists_clause} {database_name} {force_clause};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT datname FROM pg_database WHERE datname = '{database_name}';
  cleanup:
    required: true
    steps:
    - sql: DROP DATABASE IF EXISTS {database_name};
