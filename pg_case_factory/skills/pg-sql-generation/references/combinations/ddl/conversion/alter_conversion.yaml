schema_version: 1
kind: statement_combination_matrix
statement:
  key: alter_conversion
  name: ALTER CONVERSION
  category: ddl
  domain: conversion
  source_reference: references/statements/ddl/conversion/alter_conversion.md
  official_source: https://www.postgresql.org/docs/16/sql-alterconversion.html
  aliases:
  - ALTER CONVERSION
  - alter_conversion
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not satisfy required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds: [conversion]
    decision_reason: >
      ALTER CONVERSION directly changes conversion metadata through rename, owner, or schema movement. Required object
      coverage is scoped to conversion existence, default status, conflicts, owner membership, and schema privileges.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: >
      ALTER CONVERSION does not operate on pg_class relations. Its dependency surface is catalog metadata and roles/schemas,
      not relation kinds.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: >
      ALTER CONVERSION does not directly operate on tables, columns, predicates, or table dependencies. Table-kind coverage is
      therefore not a required baseline axis.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: >
      ALTER CONVERSION changes conversion object metadata and does not depend on table column types. Encoding and default
      conversion status are represented by statement factors where applicable.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: [branch_rename, branch_owner, branch_set_schema]
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: [exists, not_exists]
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: status_axis
      required_values: [success, failure]
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T2
      coverage_role: privilege_axis
      required_values: [superuser, conversion_owner, non_owner]
      coverage_requirement: all_declared_values
    new_owner_target:
      tier: T2
      coverage_role: branch_target_axis
      required_values: [existing_role, nonexistent_role, CURRENT_ROLE, CURRENT_USER, SESSION_USER]
      coverage_requirement: all_declared_values
    rename_conflict:
      tier: T2
      coverage_role: branch_target_axis
      required_values: [new_name_unique, new_name_exists_in_schema]
      coverage_requirement: all_declared_values
    schema_conflict:
      tier: T2
      coverage_role: branch_target_axis
      required_values: [target_schema_exists_no_conflict, target_schema_exists_with_conflict, target_schema_not_exists]
      coverage_requirement: all_declared_values
    conversion_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [simple_id, quoted_id, schema_qualified, nonexistent_name]
      coverage_requirement: all_declared_values
    new_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [simple_id, quoted_id, reserved_word_as_name]
      coverage_requirement: all_declared_values
    new_schema_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [simple_id, nonexistent_schema_name]
      coverage_requirement: all_declared_values
    new_owner_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: [simple_id, quoted_id, special_token]
      coverage_requirement: all_declared_values
    schema_privilege:
      tier: T4
      coverage_role: privilege_axis
      required_values: [has_create_privilege, lacks_create_privilege]
      coverage_requirement: all_declared_values
    owner_membership:
      tier: T4
      coverage_role: privilege_axis
      required_values: [can_set_role, cannot_set_role]
      coverage_requirement: all_declared_values
    conversion_default_status:
      tier: T4
      coverage_role: dependency_axis
      required_values: [is_default_conversion, is_not_default_conversion]
      coverage_requirement: all_declared_values
    conversion_not_exist:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [conversion_exists, conversion_not_exists]
      coverage_requirement: all_declared_values
    rename_target_conflict:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [no_conflict, name_already_exists]
      coverage_requirement: all_declared_values
    owner_not_exist:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [role_exists, role_not_exists]
      coverage_requirement: all_declared_values
    schema_not_exist:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [schema_exists, schema_not_exists]
      coverage_requirement: all_declared_values
    schema_name_conflict:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [no_conflict, same_name_in_target_schema]
      coverage_requirement: all_declared_values
    privilege_denied:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [owner_success, non_owner_failure, superuser_success]
      coverage_requirement: all_declared_values
    no_create_privilege_on_target_schema:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [has_create_privilege, lacks_create_privilege]
      coverage_requirement: all_declared_values
    cannot_set_role_to_new_owner:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: [can_set_role, cannot_set_role]
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_axis
      required_values: [catalog_query_pg_conversion, catalog_query_pg_namespace, error_assertion]
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: cleanup_axis
      required_values: [drop_conversion, drop_schema, drop_role, cascade_cleanup]
      coverage_requirement: all_declared_values
dynamic_inputs: {}
combination_groups:
- id: alter_conversion_required_factor_value_matrix
  title: ALTER CONVERSION required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - missing_conversion
  - rename_target_conflict
  - invalid_owner_target
  - invalid_schema_target
  - insufficient_conversion_privilege
  factors:
    statement_branch: branch_rename
    object_state: exists
    expected_status: success
    privilege_level: conversion_owner
    new_owner_target: existing_role
    rename_conflict: new_name_unique
    schema_conflict: target_schema_exists_no_conflict
    conversion_name_shape: simple_id
    new_name_shape: simple_id
    new_schema_shape: simple_id
    new_owner_shape: simple_id
    schema_privilege: has_create_privilege
    owner_membership: can_set_role
    conversion_default_status: is_not_default_conversion
    conversion_not_exist: conversion_exists
    rename_target_conflict: no_conflict
    owner_not_exist: role_exists
    schema_not_exist: schema_exists
    schema_name_conflict: no_conflict
    privilege_denied: owner_success
    no_create_privilege_on_target_schema: has_create_privilege
    cannot_set_role_to_new_owner: can_set_role
    verification_mode: catalog_query_pg_conversion
    cleanup_mode: drop_conversion
  expansion:
    statement_branch:
      mode: explicit
      values: [branch_rename, branch_owner, branch_set_schema]
    object_state:
      mode: explicit
      values: [exists, not_exists]
    expected_status:
      mode: explicit
      values: [success, failure]
    privilege_level:
      mode: explicit
      values: [superuser, conversion_owner, non_owner]
    new_owner_target:
      mode: explicit
      values: [existing_role, nonexistent_role, CURRENT_ROLE, CURRENT_USER, SESSION_USER]
    rename_conflict:
      mode: explicit
      values: [new_name_unique, new_name_exists_in_schema]
    schema_conflict:
      mode: explicit
      values: [target_schema_exists_no_conflict, target_schema_exists_with_conflict, target_schema_not_exists]
    conversion_name_shape:
      mode: explicit
      values: [simple_id, quoted_id, schema_qualified, nonexistent_name]
    new_name_shape:
      mode: explicit
      values: [simple_id, quoted_id, reserved_word_as_name]
    new_schema_shape:
      mode: explicit
      values: [simple_id, nonexistent_schema_name]
    new_owner_shape:
      mode: explicit
      values: [simple_id, quoted_id, special_token]
    schema_privilege:
      mode: explicit
      values: [has_create_privilege, lacks_create_privilege]
    owner_membership:
      mode: explicit
      values: [can_set_role, cannot_set_role]
    conversion_default_status:
      mode: explicit
      values: [is_default_conversion, is_not_default_conversion]
    conversion_not_exist:
      mode: explicit
      values: [conversion_exists, conversion_not_exists]
    rename_target_conflict:
      mode: explicit
      values: [no_conflict, name_already_exists]
    owner_not_exist:
      mode: explicit
      values: [role_exists, role_not_exists]
    schema_not_exist:
      mode: explicit
      values: [schema_exists, schema_not_exists]
    schema_name_conflict:
      mode: explicit
      values: [no_conflict, same_name_in_target_schema]
    privilege_denied:
      mode: explicit
      values: [owner_success, non_owner_failure, superuser_success]
    no_create_privilege_on_target_schema:
      mode: explicit
      values: [has_create_privilege, lacks_create_privilege]
    cannot_set_role_to_new_owner:
      mode: explicit
      values: [can_set_role, cannot_set_role]
    verification_mode:
      mode: explicit
      values: [catalog_query_pg_conversion, catalog_query_pg_namespace, error_assertion]
    cleanup_mode:
      mode: explicit
      values: [drop_conversion, drop_schema, drop_role, cascade_cleanup]
  compatibility:
    resolver: alter_conversion_factor_binding
    success_when:
    - Conversion exists and branch-specific target name, owner, schema, membership, and privilege requirements are satisfied.
    - DEFAULT conversion status remains a metadata fixture and does not by itself block rename, owner, or schema changes.
    failure_when:
    - condition: object_state not_exists or conversion_not_exist conversion_not_exists
      reason: missing_conversion
    - condition: statement_branch branch_rename with rename_conflict new_name_exists_in_schema or rename_target_conflict name_already_exists
      reason: rename_target_conflict
    - condition: statement_branch branch_owner with owner_not_exist role_not_exists or cannot_set_role_to_new_owner cannot_set_role
      reason: invalid_owner_target
    - condition: statement_branch branch_set_schema with schema_not_exist schema_not_exists or schema_name_conflict same_name_in_target_schema
      reason: invalid_schema_target
    - condition: privilege_level non_owner or schema_privilege lacks_create_privilege or privilege_denied non_owner_failure
      reason: insufficient_conversion_privilege
    default_failure_reason: alter_conversion_invalid_state
  sql_shape:
    template: "ALTER CONVERSION {conversion_name} {alter_action} {alter_target}"
  verification:
    required: true
    mode: pg_conversion_catalog_check
    sql: "SELECT conname, connamespace FROM pg_conversion WHERE conname = '{conversion_name}'"
  cleanup:
    required: true
    steps:
    - sql: "DROP CONVERSION IF EXISTS {conversion_name} CASCADE"
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
