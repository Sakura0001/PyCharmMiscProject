schema_version: 1
kind: statement_combination_matrix
statement:
  key: security_label
  name: SECURITY LABEL
  category: ddl
  domain: security_label
  source_reference: references/statements/ddl/security_label/security_label.md
  official_source: https://www.postgresql.org/docs/16/sql-security-label.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - security_label
    decision_reason: security_label statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: security_label statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: security_label statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: security_label statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_on_table
      - branch_on_column
      - branch_on_aggregate
      - branch_on_database
      - branch_on_domain
      - branch_on_event_trigger
      - branch_on_foreign_table
      - branch_on_function
      - branch_on_large_object
      - branch_on_materialized_view
      - branch_on_language
      - branch_on_procedure
      - branch_on_publication
      - branch_on_role
      - branch_on_routine
      - branch_on_schema
      - branch_on_sequence
      - branch_on_subscription
      - branch_on_tablespace
      - branch_on_type
      - branch_on_view
      coverage_requirement: all_values
    object_existence:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - object_exists
      - object_not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    object_type:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - table
      - column
      - aggregate
      - database
      - domain
      - event_trigger
      - foreign_table
      - function
      - large_object
      - materialized_view
      - language
      - procedure
      - publication
      - role
      - routine
      - schema
      - sequence
      - subscription
      - tablespace
      - type
      - view
      coverage_requirement: all_values
    for_provider_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - omitted_default_provider
      - explicit_provider
      coverage_requirement: all_values
    label_value:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - string_literal
      - null_removes_label
      coverage_requirement: all_values
    aggregate_signature:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - star_wildcard
      - single_arg_type
      - multiple_arg_types
      - with_order_by
      coverage_requirement: all_values
    routine_signature:
      tier: T2
      coverage_role: main_axis
      required_values: &id008
      - no_args
      - single_arg
      - multiple_args
      coverage_requirement: all_values
    object_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id009
      - simple_name
      - schema_qualified_name
      - quoted_name
      - non_existing_name
      coverage_requirement: all_values
    provider_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id010
      - registered_provider
      - unregistered_provider
      coverage_requirement: all_values
    column_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id011
      - simple_name
      - quoted_name
      - nonexistent_column
      coverage_requirement: all_values
    label_string_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id012
      - valid_label
      - empty_string
      - special_characters_label
      coverage_requirement: all_values
    executor_privilege:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id013
      - superuser
      - non_superuser_no_provider_privilege
      coverage_requirement: all_values
    provider_registration:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id014
      - provider_registered
      - provider_not_registered
      coverage_requirement: all_values
    prerequisite_object:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id015
      - object_exists
      - object_not_exists
      coverage_requirement: all_values
    nonexistent_object:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id016
      - target_object_does_not_exist
      coverage_requirement: all_values
    privilege_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id017
      - non_superuser_without_provider_privilege
      coverage_requirement: all_values
    unregistered_provider:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id018
      - provider_not_registered_failure
      coverage_requirement: all_values
    invalid_label_for_provider:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id019
      - provider_rejects_label
      coverage_requirement: all_values
    duplicate_label_same_provider:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id020
      - replaces_existing_label
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id021
      - pg_seclabel_catalog_query
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id022
      - security_label_is_null
      - drop_object
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: security_label_declared_factor_baseline
  title: SECURITY LABEL declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - security_label_declared_failure
  factors:
    statement_branch: branch_on_table
    object_existence: object_exists
    expected_status: success
    object_type: table
    for_provider_clause: omitted_default_provider
    label_value: string_literal
    aggregate_signature: star_wildcard
    routine_signature: no_args
    object_name_shape: simple_name
    provider_name_shape: registered_provider
    column_name_shape: simple_name
    label_string_shape: valid_label
    executor_privilege: superuser
    provider_registration: provider_registered
    prerequisite_object: object_exists
    nonexistent_object: target_object_does_not_exist
    privilege_insufficient: non_superuser_without_provider_privilege
    unregistered_provider: provider_not_registered_failure
    invalid_label_for_provider: provider_rejects_label
    duplicate_label_same_provider: replaces_existing_label
    verification_mode: pg_seclabel_catalog_query
    cleanup_mode: security_label_is_null
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    object_existence:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    object_type:
      mode: explicit
      values: *id004
    for_provider_clause:
      mode: explicit
      values: *id005
    label_value:
      mode: explicit
      values: *id006
    aggregate_signature:
      mode: explicit
      values: *id007
    routine_signature:
      mode: explicit
      values: *id008
    object_name_shape:
      mode: explicit
      values: *id009
    provider_name_shape:
      mode: explicit
      values: *id010
    column_name_shape:
      mode: explicit
      values: *id011
    label_string_shape:
      mode: explicit
      values: *id012
    executor_privilege:
      mode: explicit
      values: *id013
    provider_registration:
      mode: explicit
      values: *id014
    prerequisite_object:
      mode: explicit
      values: *id015
    nonexistent_object:
      mode: explicit
      values: *id016
    privilege_insufficient:
      mode: explicit
      values: *id017
    unregistered_provider:
      mode: explicit
      values: *id018
    invalid_label_for_provider:
      mode: explicit
      values: *id019
    duplicate_label_same_provider:
      mode: explicit
      values: *id020
    verification_mode:
      mode: explicit
      values: *id021
    cleanup_mode:
      mode: explicit
      values: *id022
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: security_label_declared_failure
    default_failure_reason: security_label_declared_failure
  sql_shape:
    template: SECURITY LABEL {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for security_label
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
