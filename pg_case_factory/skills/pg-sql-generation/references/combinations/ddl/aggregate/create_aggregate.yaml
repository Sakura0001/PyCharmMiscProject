schema_version: 1
kind: statement_combination_matrix
statement:
  key: create_aggregate
  name: CREATE AGGREGATE
  category: ddl
  domain: aggregate
  source_reference: references/statements/ddl/aggregate/create_aggregate.md
  official_source: https://www.postgresql.org/docs/16/sql-createaggregate.html
  aliases:
  - CREATE AGGREGATE
  - create aggregate
  - create_aggregate
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, dependency, environment, or cross-factor combinations after baseline audit
    passes.
  - Derived extensions must not be counted as satisfying required factor, object, routine-signature, relation, table, or column-type
    coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success or failure attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - aggregate
    decision_reason: CREATE_AGGREGATE directly targets PostgreSQL aggregate routine objects and aggregate catalog metadata.
      Baseline coverage is scoped to aggregate signatures, forms, support-function dependencies, privileges, and lifecycle
      state.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    decision_reason: CREATE_AGGREGATE does not target a pg_class table, index, view, sequence, or materialized-view relation;
      routine catalog dependencies are represented as object and signature factors.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE_AGGREGATE operates on routine catalog objects and signatures rather than table variants. Required
      baseline coverage does not depend on regular, temporary, partitioned, inherited, or foreign table forms.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: CREATE_AGGREGATE uses aggregate input or state types as routine signature/type coverage. The statement
      does not create, alter, scan, or validate table columns, so pg16 table column_type_coverage is not applicable.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_regular
      - branch_ordered_set
      - branch_old_syntax
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - not_exists
      - already_exists
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_declared_values
    aggregate_form:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id004
      - single_arg
      - multi_arg
      - zero_arg
      - ordered_set
      - old_syntax
      coverage_requirement: all_declared_values
    or_replace_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id005
      - absent
      - present_replace_existing
      - present_replace_with_constraint_violation
      coverage_requirement: all_declared_values
    parallel_option:
      tier: T2
      coverage_role: behavior_axis
      required_values: &id006
      - UNSAFE_default
      - SAFE
      - RESTRICTED
      coverage_requirement: all_declared_values
    arg_data_type:
      tier: T2
      coverage_role: routine_signature_type_axis
      required_values: &id007
      - integer
      - bigint
      - numeric
      - float8
      - text
      - boolean
      - date
      - timestamp
      - anyelement
      - internal
      coverage_requirement: all_declared_values
    aggregate_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id008
      - plain_identifier
      - quoted_identifier
      - schema_qualified
      - reserved_word
      coverage_requirement: all_declared_values
    argmode_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id009
      - IN_default
      - IN_explicit
      - VARIADIC
      coverage_requirement: all_declared_values
    argname_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id010
      - absent
      - plain
      - quoted
      coverage_requirement: all_declared_values
    sfunc_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values: &id011
      - plain
      - schema_qualified
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id012
      - aggregate_owner
      - non_owner
      coverage_requirement: all_declared_values
    support_function_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id013
      - sfunc_exists
      - sfunc_not_exists
      - sfunc_wrong_signature
      coverage_requirement: all_declared_values
    combinefunc_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id014
      - exists
      - not_exists
      coverage_requirement: all_declared_values
    finalfunc_dependency:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values: &id015
      - exists
      - not_exists
      - wrong_return_type
      coverage_requirement: all_declared_values
    duplicate_aggregate:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id016
      - same_name_same_signature
      - same_name_different_signature
      coverage_requirement: all_declared_values
    sfunc_signature_mismatch:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id017
      - wrong_input_types
      - wrong_return_type
      coverage_requirement: all_declared_values
    or_replace_constraint_violation:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id018
      - changed_arg_types
      - changed_return_type
      - changed_kind
      coverage_requirement: all_declared_values
    invalid_ordered_set_variadic:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id019
      - non_variadic_any
      coverage_requirement: all_declared_values
    missing_required_sfunc:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id020
      - sfunc_not_found
      coverage_requirement: all_declared_values
    insufficient_privilege:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values: &id021
      - non_owner_create
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id022
      - pg_aggregate_catalog_query
      - pg_proc_query
      - actual_execution
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values: &id023
      - DROP_AGGREGATE
      - DROP_AGGREGATE_IF_EXISTS
      - DROP_AGGREGATE_CASCADE
      coverage_requirement: all_declared_values
dynamic_inputs:
  aggregate_signature_type_manifest:
    required: true
    source: factor_contract.arg_data_type, factor_contract.aggregate_form, and combination_groups.expansion
    required_fields:
    - aggregate_name
    - aggregate_signature
    - argument_types
    - aggregate_form
    - transition_function
    - final_function
    - expected_status
combination_groups:
- id: create_aggregate_required_baseline_factor_space
  title: CREATE AGGREGATE required baseline factor space
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - expected_statement_failure
  - routine_resolution_or_privilege_failure
  - invalid_signature_or_type_binding
  - dependency_or_environment_failure
  factors:
    statement_branch: branch_regular
    object_state: not_exists
    expected_status: success
    aggregate_form: single_arg
    or_replace_clause: absent
    parallel_option: UNSAFE_default
    arg_data_type: integer
    aggregate_name_shape: plain_identifier
    argmode_shape: IN_default
    argname_shape: absent
    sfunc_name_shape: plain
    privilege_level: aggregate_owner
    support_function_dependency: sfunc_exists
    combinefunc_dependency: exists
    finalfunc_dependency: exists
    duplicate_aggregate: same_name_same_signature
    sfunc_signature_mismatch: wrong_input_types
    or_replace_constraint_violation: changed_arg_types
    invalid_ordered_set_variadic: non_variadic_any
    missing_required_sfunc: sfunc_not_found
    insufficient_privilege: non_owner_create
    verification_mode: pg_aggregate_catalog_query
    cleanup_mode: DROP_AGGREGATE
  expansion:
    statement_branch:
      mode: exhaustive
      values: *id001
    object_state:
      mode: exhaustive
      values: *id002
    expected_status:
      mode: exhaustive
      values: *id003
    aggregate_form:
      mode: exhaustive
      values: *id004
    or_replace_clause:
      mode: exhaustive
      values: *id005
    parallel_option:
      mode: representative
      values: *id006
    arg_data_type:
      mode: exhaustive
      values: *id007
    aggregate_name_shape:
      mode: representative
      values: *id008
    argmode_shape:
      mode: representative
      values: *id009
    argname_shape:
      mode: representative
      values: *id010
    sfunc_name_shape:
      mode: representative
      values: *id011
    privilege_level:
      mode: representative
      values: *id012
    support_function_dependency:
      mode: representative
      values: *id013
    combinefunc_dependency:
      mode: representative
      values: *id014
    finalfunc_dependency:
      mode: representative
      values: *id015
    duplicate_aggregate:
      mode: representative
      values: *id016
    sfunc_signature_mismatch:
      mode: representative
      values: *id017
    or_replace_constraint_violation:
      mode: representative
      values: *id018
    invalid_ordered_set_variadic:
      mode: representative
      values: *id019
    missing_required_sfunc:
      mode: representative
      values: *id020
    insufficient_privilege:
      mode: representative
      values: *id021
    verification_mode:
      mode: representative
      values: *id022
    cleanup_mode:
      mode: representative
      values: *id023
  compatibility:
    resolver: create_aggregate_factor_binding_resolver
    success_when:
    - expected_status=success and selected object, signature, privilege, and dependency bindings are valid
    - statement branch and routine kind support the selected type, language, body, or aggregate option binding
    failure_when:
    - condition: expected_status=failure or a declared negative boundary factor is selected
      reason: expected_statement_failure
    - condition: target routine object, signature, owner, schema, language, extension, support function, or privilege is missing
        or incompatible
      reason: routine_resolution_or_privilege_failure
    - condition: argument, return, aggregate signature, or support function type binding is invalid for the selected branch
      reason: invalid_signature_or_type_binding
    default_failure_reason: expected_statement_failure
  sql_shape:
    template: CREATE [OR REPLACE] AGGREGATE {aggregate_name}({aggregate_signature}) ({aggregate_options});
  verification:
    required: true
    mode: catalog_query
    sql: SELECT p.oid FROM pg_proc p JOIN pg_aggregate a ON a.aggfnoid = p.oid WHERE p.proname = '{aggregate_name}'
  cleanup:
    required: true
    steps:
    - sql: DROP AGGREGATE IF EXISTS {aggregate_name}({aggregate_signature}) CASCADE
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
