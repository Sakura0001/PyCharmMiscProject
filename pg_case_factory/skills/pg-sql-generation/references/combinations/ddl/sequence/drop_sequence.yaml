schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_sequence
  name: DROP SEQUENCE
  category: ddl
  domain: sequence
  source_reference: references/statements/ddl/sequence/drop_sequence.md
  official_source: https://www.postgresql.org/docs/16/sql-dropsequence.html
  aliases:
  - DROP SEQUENCE
  - drop sequence
  - drop_sequence
  - dropsequence
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, environment, or cross-factor combinations after the baseline audit passes.
  - Derived extensions must not be counted as satisfying required factor, object, relation, table, or column-type coverage.
  - Derived extensions must use declared factors and declared factor values.
  - Derived extensions must preserve success, failure, no-op, or notice attribution.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - sequence
    decision_reason: DROP_SEQUENCE directly targets PostgreSQL sequence generator objects and must cover sequence existence,
      permanence, ownership, parameter, and dependency states.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - sequence
    decision_reason: DROP_SEQUENCE targets sequences, which are pg_class relation objects with relkind S. Relation coverage
      is therefore the sequence relation kind only, not tables, views, or indexes.
  table_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    decision_reason: DROP_SEQUENCE can depend on table-column ownership or identity/serial/default-expression dependencies
      when CASCADE or RESTRICT behavior is tested; table coverage is conditional on dependency_state rather than an exhaustive
      table-kind matrix.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: DROP_SEQUENCE uses sequence data types and numeric parameters such as AS smallint/integer/bigint, INCREMENT,
      MINVALUE, MAXVALUE, START, CACHE, and CYCLE. These are sequence-definition factors, not PG16 table column-type coverage
      from the shared type catalog.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_drop_sequence
      - branch_drop_sequence_if_exists
      coverage_requirement: all_declared_values
    object_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - exists_permanent
      - not_exists
      - exists_temporary
      - exists_unlogged
      coverage_requirement: all_declared_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_declared_values
    if_exists_clause:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - absent
      - present
      coverage_requirement: all_declared_values
    cascade_restrict:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - none
      - cascade
      - restrict
      coverage_requirement: all_declared_values
    multi_sequence_drop:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - single_sequence
      - multi_sequence
      coverage_requirement: all_declared_values
    sequence_type_permanence:
      tier: T2
      coverage_role: behavior_axis
      required_values:
      - permanent
      - temporary
      - unlogged
      coverage_requirement: all_declared_values
    sequence_name_shape:
      tier: T3
      coverage_role: input_shape_axis
      required_values:
      - simple
      - quoted
      - schema_qualified
      - reserved_word
      - non_existent
      coverage_requirement: all_declared_values
    privilege_level:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - owner
      - superuser
      - non_owner
      coverage_requirement: all_declared_values
    dependency_state:
      tier: T4
      coverage_role: dependency_or_environment_axis
      required_values:
      - no_dependents
      - used_by_identity_column
      - used_by_serial_column
      - owned_by_table_column
      - used_by_default_expression
      coverage_requirement: all_declared_values
    error_boundary:
      tier: T5
      coverage_role: negative_boundary_axis
      required_values:
      - none
      - non_existent_without_if_exists
      - dependent_objects_without_cascade
      - insufficient_privilege
      coverage_requirement: all_declared_values
    verification_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - pg_class_query
      - error_assertion
      - notice_assertion
      - effect_query
      coverage_requirement: all_declared_values
    cleanup_mode:
      tier: T6
      coverage_role: verification_cleanup_axis
      required_values:
      - no_cleanup_needed
      - cascade_cleanup
      - manual_cleanup
      - rollback
      coverage_requirement: all_declared_values
dynamic_inputs:
  sequence_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/sequence_manifest.json
    required_fields:
    - sequence_name
    - object_state
    - sequence_type
    - owner
    - schema_name
  sequence_parameter_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/sequence_parameter_manifest.json
    required_fields:
    - as_data_type
    - increment
    - minvalue
    - maxvalue
    - start_value
    - cache_value
    - cycle
  owned_by_dependency_manifest:
    required: false
    path_pattern: artifacts/intermediates/<task_slug>/owned_by_dependency_manifest.json
    required_fields:
    - table_name
    - column_name
    - same_owner
    - same_schema
combination_groups:
- id: drop_sequence_required_factor_value_matrix
  title: DROP SEQUENCE required factor value baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - error_boundary
  factors:
    statement_branch: branch_drop_sequence
    object_state: not_exists
    expected_status: success
    if_exists_clause: absent
    cascade_restrict: none
    multi_sequence_drop: single_sequence
    sequence_type_permanence: permanent
    sequence_name_shape: simple
    privilege_level: owner
    dependency_state: no_dependents
    error_boundary: none
    verification_mode: pg_class_query
    cleanup_mode: no_cleanup_needed
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_drop_sequence
      - branch_drop_sequence_if_exists
    object_state:
      mode: explicit
      values:
      - exists_permanent
      - not_exists
      - exists_temporary
      - exists_unlogged
    expected_status:
      mode: explicit
      values:
      - success
      - failure
    if_exists_clause:
      mode: explicit
      values:
      - absent
      - present
    cascade_restrict:
      mode: explicit
      values:
      - none
      - cascade
      - restrict
    multi_sequence_drop:
      mode: explicit
      values:
      - single_sequence
      - multi_sequence
    sequence_type_permanence:
      mode: explicit
      values:
      - permanent
      - temporary
      - unlogged
    sequence_name_shape:
      mode: explicit
      values:
      - simple
      - quoted
      - schema_qualified
      - reserved_word
      - non_existent
    privilege_level:
      mode: explicit
      values:
      - owner
      - superuser
      - non_owner
    dependency_state:
      mode: explicit
      values:
      - no_dependents
      - used_by_identity_column
      - used_by_serial_column
      - owned_by_table_column
      - used_by_default_expression
    error_boundary:
      mode: explicit
      values:
      - none
      - non_existent_without_if_exists
      - dependent_objects_without_cascade
      - insufficient_privilege
    verification_mode:
      mode: explicit
      values:
      - pg_class_query
      - error_assertion
      - notice_assertion
      - effect_query
    cleanup_mode:
      mode: explicit
      values:
      - no_cleanup_needed
      - cascade_cleanup
      - manual_cleanup
      - rollback
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success and the selected object, privilege, dependency, and syntax factors describe a legal statement
      execution path
    - notice or no-op paths are attributed by their declared factors and do not replace required success/failure coverage
    failure_when:
    - condition: expected_status == failure
      reason: statement_specific_failure
    - condition: declared object state, privilege, dependency, name-shape, validator, or numeric boundary factor selects an
        invalid prerequisite
      reason: declared_factor_failure
    default_failure_reason: statement_specific_failure
  sql_shape:
    template: DROP SEQUENCE [ IF EXISTS ] {sequence_name} [, ...] [ CASCADE | RESTRICT ]
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT count(*) FROM pg_class WHERE relname = '{sequence_name}' AND relkind = 'S'
  cleanup:
    required: true
    steps:
    - sql: DROP SEQUENCE IF EXISTS {sequence_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
