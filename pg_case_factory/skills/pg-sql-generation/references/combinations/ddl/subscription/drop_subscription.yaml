schema_version: 1
kind: statement_combination_matrix
statement:
  key: drop_subscription
  name: DROP SUBSCRIPTION
  category: ddl
  domain: subscription
  source_reference: references/statements/ddl/subscription/drop_subscription.md
  official_source: https://www.postgresql.org/docs/16/sql-dropsubscription.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - subscription
    decision_reason: subscription statement coverage is tracked by explicit PostgreSQL object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: subscription statements do not target relation objects directly.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: subscription statements do not directly depend on table instance coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: subscription statements do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_drop_subscription
      - branch_drop_subscription_if_exists
      - branch_drop_subscription_cascade
      - branch_drop_subscription_restrict
      coverage_requirement: all_values
    subscription_existence:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - subscription_exists
      - subscription_not_exists
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - success
      - failure
      coverage_requirement: all_values
    if_exists_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - without_if_exists
      - with_if_exists
      coverage_requirement: all_values
    cascade_restrict_clause:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - no_clause_default_restrict
      - cascade
      - restrict
      coverage_requirement: all_values
    privilege_context:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - superuser
      - non_superuser_no_privilege
      coverage_requirement: all_values
    replication_slot_state:
      tier: T2
      coverage_role: main_axis
      required_values: &id007
      - has_replication_slot
      - no_replication_slot
      coverage_requirement: all_values
    subscription_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id008
      - simple_name
      - quoted_name
      - reserved_word_name
      - non_existing_name
      coverage_requirement: all_values
    executor_privilege:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - superuser
      - non_superuser
      coverage_requirement: all_values
    replication_slot_dependency:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id010
      - slot_exists
      - slot_not_exists
      - slot_on_remote_only
      coverage_requirement: all_values
    nonexistent_subscription:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - subscription_does_not_exist
      coverage_requirement: all_values
    privilege_insufficient:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - non_superuser_dropping_subscription
      coverage_requirement: all_values
    replication_slot_conflict:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id013
      - restrict_with_slot_fails
      - cascade_with_slot_succeeds
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id014
      - pg_subscription_catalog
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id015
      - drop_subscription_cascade
      coverage_requirement: all_values
dynamic_inputs:
  object_manifest:
    required: true
    source: lifecycle_plan
    required_fields:
    - object_name
    - object_kind
    - expected_status
combination_groups:
- id: drop_subscription_declared_factor_baseline
  title: DROP SUBSCRIPTION declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - drop_subscription_declared_failure
  factors:
    statement_branch: branch_drop_subscription
    subscription_existence: subscription_exists
    expected_status: success
    if_exists_clause: without_if_exists
    cascade_restrict_clause: no_clause_default_restrict
    privilege_context: superuser
    replication_slot_state: has_replication_slot
    subscription_name_shape: simple_name
    executor_privilege: superuser
    replication_slot_dependency: slot_exists
    nonexistent_subscription: subscription_does_not_exist
    privilege_insufficient: non_superuser_dropping_subscription
    replication_slot_conflict: restrict_with_slot_fails
    verification_mode: pg_subscription_catalog
    cleanup_mode: drop_subscription_cascade
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    subscription_existence:
      mode: explicit
      values: *id002
    expected_status:
      mode: explicit
      values: *id003
    if_exists_clause:
      mode: explicit
      values: *id004
    cascade_restrict_clause:
      mode: explicit
      values: *id005
    privilege_context:
      mode: explicit
      values: *id006
    replication_slot_state:
      mode: explicit
      values: *id007
    subscription_name_shape:
      mode: explicit
      values: *id008
    executor_privilege:
      mode: explicit
      values: *id009
    replication_slot_dependency:
      mode: explicit
      values: *id010
    nonexistent_subscription:
      mode: explicit
      values: *id011
    privilege_insufficient:
      mode: explicit
      values: *id012
    replication_slot_conflict:
      mode: explicit
      values: *id013
    verification_mode:
      mode: explicit
      values: *id014
    cleanup_mode:
      mode: explicit
      values: *id015
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: drop_subscription_declared_failure
    default_failure_reason: drop_subscription_declared_failure
  sql_shape:
    template: DROP SUBSCRIPTION {object_name};
  verification:
    required: true
    mode: catalog_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for drop_subscription
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
