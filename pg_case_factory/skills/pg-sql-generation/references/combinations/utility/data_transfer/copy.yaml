schema_version: 1
kind: statement_combination_matrix
statement:
  key: copy
  name: COPY
  category: utility
  domain: data_transfer
  source_reference: references/statements/utility/data_transfer/copy.md
  aliases:
  - COPY
  - copy
  official_source: https://www.postgresql.org/docs/16/sql-copy.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required baseline audit must pass before any derived extension is emitted.
  - Derived extensions may add stress, boundary, lifecycle, filesystem, PROGRAM, or format combinations only after the
    baseline passes.
  - Derived extensions must not count toward required declared factor, table, or column-type coverage.
  - Derived extensions must use only declared factors, declared values, and recorded derivation reasons.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    - copy_stream
    decision_reason: COPY operates between table-backed relations or query output and a copy stream. The baseline treats the
      stream endpoint as the utility object and keeps unsupported database-wide or wrong-object targets as declared failure
      bindings rather than broad object coverage.
  target_relation_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    negative_relation_kinds:
    - plain_view
    - materialized_view
    - sequence
    - index
    decision_reason: COPY table branches require table-backed relation targets, while COPY TO query output is covered through
      the input_output_shape factor. Non-table relation names are negative controls through wrong_object_type and
      object_type_mismatch.
  table_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    - unlogged_table
    - temporary_table
    - partitioned_table_parent
    - partitioned_table_leaf
    - inherited_parent_table
    - inherited_child_table
    decision_reason: COPY FROM and COPY TO depend on table form, especially temporary, unlogged, partitioned, and inherited
      tables. Index maintenance is not a required standalone axis for COPY; it is recorded in the dynamic table manifest
      because COPY writes rows through normal table storage and index maintenance follows the target table definition.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: conditional
    require_each_type_success_or_failure: true
    decision_reason: COPY column behavior is driven by the target column list, payload format, and PostgreSQL type input or
      output functions. The baseline requires typed manifests for all PG16 column types, with constraints, triggers, and
      transaction-only COPY FREEZE rules handled through dynamic interaction inputs instead of unsupported coverage-scope
      keys.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values:
      - branch_1
      - branch_2
      coverage_requirement: all_values
    target_state:
      tier: T1
      coverage_role: main_axis
      required_values:
      - target_exists
      - target_missing
      - database_wide
      - wrong_object_type
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values:
      - success
      - failure
      coverage_requirement: all_values
    option_shape:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - minimal
      - verbose_or_format
      - boolean_options
      - resource_options
      coverage_requirement: all_values
    execution_mode:
      tier: T2
      coverage_role: rotate_attach
      required_values:
      - metadata_only
      - executes_statement
      - locks_or_rewrites
      - server_side_io
      coverage_requirement: all_values
    target_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - all_or_database_wide
      coverage_requirement: all_values
    input_output_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values:
      - none
      - table_columns
      - query_source
      - stdin_stdout
      - server_file_or_program
      coverage_requirement: all_values
    environment_context:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - normal_session
      - transaction_block
      - outside_transaction_required
      - external_resource_required
      coverage_requirement: all_values
    privilege_context:
      tier: T4
      coverage_role: rotate_attach
      required_values:
      - owner
      - granted_role
      - insufficient_privilege
      coverage_requirement: all_values
    invalid_combination:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: all_values
    resource_boundary:
      tier: T5
      coverage_role: rotate_attach
      required_values:
      - small_relation
      - empty_relation
      - locked_relation
      - missing_file_or_library
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - catalog_query
      - effect_query
      - returned_rows
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values:
      - rollback
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  table_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/table_manifest.json
    required_fields:
    - table_name
    - relation_kind
    - table_kind
    - columns
    - indexes
    - constraints
    - triggers
    - partitioning
    - inheritance
  type_catalog:
    required: true
    path: references/common/pg16_type_catalog.md
    required_fields:
    - type_key
    - type_category
    - declaration_sql
    - sample_values
  copy_payload_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/copy_payload_manifest.json
    required_fields:
    - statement_branch
    - endpoint_kind
    - data_format
    - column_list
    - rows
    - null_string
    - default_string
    - header_mode
    - encoding
  interaction_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/copy_interaction_manifest.json
    required_fields:
    - index_interaction_coverage
    - constraint_interaction_coverage
    - trigger_interaction_coverage
    - transaction_interaction_coverage
    - decision_reason
  endpoint_manifest:
    required: true
    path_pattern: artifacts/intermediates/<task_slug>/copy_endpoint_manifest.json
    required_fields:
    - endpoint_kind
    - client_or_server_side
    - filename
    - program
    - privilege_requirement
combination_groups:
- id: copy_declared_factor_baseline
  title: Declared factor baseline with all required COPY statement-reference values
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  factors:
    statement_branch: branch_1
    target_state: target_exists
    expected_status: success
    option_shape: minimal
    execution_mode: executes_statement
    target_name_shape: plain_identifier
    input_output_shape: stdin_stdout
    environment_context: normal_session
    privilege_context: owner
    invalid_combination: none
    resource_boundary: small_relation
    verification_mode: effect_query
    cleanup_mode: drop_objects
  expansion:
    statement_branch:
      mode: explicit
      values:
      - branch_1
      - branch_2
    target_state:
      mode: explicit
      values:
      - target_exists
      - target_missing
      - database_wide
      - wrong_object_type
    option_shape:
      mode: explicit
      values:
      - minimal
      - verbose_or_format
      - boolean_options
      - resource_options
    execution_mode:
      mode: explicit
      values:
      - metadata_only
      - executes_statement
      - locks_or_rewrites
      - server_side_io
    target_name_shape:
      mode: explicit
      values:
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - all_or_database_wide
    input_output_shape:
      mode: explicit
      values:
      - none
      - table_columns
      - query_source
      - stdin_stdout
      - server_file_or_program
    environment_context:
      mode: explicit
      values:
      - normal_session
      - transaction_block
      - outside_transaction_required
      - external_resource_required
    privilege_context:
      mode: explicit
      values:
      - owner
      - granted_role
      - insufficient_privilege
    invalid_combination:
      mode: explicit
      values:
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
    resource_boundary:
      mode: explicit
      values:
      - small_relation
      - empty_relation
      - locked_relation
      - missing_file_or_library
    verification_mode:
      mode: explicit
      values:
      - catalog_query
      - effect_query
      - returned_rows
      - error_assertion
    cleanup_mode:
      mode: explicit
      values:
      - rollback
      - drop_objects
      - reset_state
    table_kinds:
      mode: explicit
      source: coverage_scope.table_coverage.required_table_kinds
    copy_column_types:
      mode: conditional
      source: coverage_scope.column_type_coverage.required_type_set
    copy_payload_formats:
      mode: explicit
      values:
      - text
      - csv
      - binary
    copy_interactions:
      mode: conditional
      source: dynamic_inputs.interaction_manifest
  compatibility:
    resolver: declared_matrix
    success_when:
    - binding uses COPY FROM STDIN, COPY TO STDOUT, or COPY TO query output with a permitted endpoint and valid table or
      query prerequisites
    - selected table kind, column type, payload format, constraints, triggers, and transaction context resolve to a legal
      PostgreSQL 16 COPY operation
    failure_when:
    - condition: target relation is missing
      reason: target_missing
    - condition: selected target_state is wrong_object_type or invalid_combination is object_type_mismatch
      reason: wrong_object_type
    - condition: selected target_state or target_name_shape represents database-wide COPY
      reason: unsupported_database_wide_target
    - condition: server-side filename or PROGRAM endpoint lacks required server file or program privilege
      reason: server_side_io_privilege_required
    - condition: selected COPY option shape is syntactically valid but incompatible with the branch or data format
      reason: invalid_copy_option
    - condition: COPY FROM payload cannot be parsed or cast to the selected target column type
      reason: data_format_or_type_input_error
    - condition: COPY FROM payload violates a target table constraint
      reason: constraint_violation
    - condition: COPY FROM row trigger raises an error or changes the expected row effect
      reason: trigger_error
    - condition: COPY FREEZE or transaction-sensitive binding does not satisfy the required transaction state
      reason: transaction_context_invalid
    - condition: selected resource boundary requires an unavailable file, program, library, or lock
      reason: resource_boundary_unavailable
    default_failure_reason: invalid_copy_binding
  sql_shape:
    template: COPY {copy_subject} {column_list} {copy_direction_and_endpoint} WITH ({copy_options}) {where_clause};
  verification:
    required: true
    mode: effect_or_returned_rows_query
    sql: SELECT count(*) FROM {table_name};
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
- id: copy_failure_attribution_baseline
  title: Declared COPY failure attribution baseline
  lifecycle_role: negative_control
  expected_status_policy: fixed
  default_expected_status: failure
  expected_failure_reasons:
  - target_missing
  - wrong_object_type
  - unsupported_database_wide_target
  - server_side_io_privilege_required
  - invalid_copy_option
  - data_format_or_type_input_error
  - constraint_violation
  - trigger_error
  - transaction_context_invalid
  - resource_boundary_unavailable
  - insufficient_privilege
  - invalid_copy_binding
  factors:
    statement_branch: branch_1
    target_state: target_missing
    expected_status: failure
    option_shape: resource_options
    execution_mode: server_side_io
    target_name_shape: plain_identifier
    input_output_shape: server_file_or_program
    environment_context: external_resource_required
    privilege_context: insufficient_privilege
    invalid_combination: syntax_valid_semantic_error
    resource_boundary: missing_file_or_library
    verification_mode: error_assertion
    cleanup_mode: rollback
  expansion:
    expected_status:
      mode: explicit
      values:
      - failure
  compatibility:
    resolver: declared_matrix
    success_when: []
    failure_when:
    - condition: target relation is missing
      reason: target_missing
    - condition: target relation is a view, sequence, index, or other unsupported object kind
      reason: wrong_object_type
    - condition: COPY is bound as a database-wide operation
      reason: unsupported_database_wide_target
    - condition: server-side filename or PROGRAM endpoint lacks required server file or program privilege
      reason: server_side_io_privilege_required
    - condition: COPY option is incompatible with the selected branch or data format
      reason: invalid_copy_option
    - condition: payload format, encoding, delimiter, null/default marker, header, or column type input fails
      reason: data_format_or_type_input_error
    - condition: target table constraint rejects a COPY FROM row
      reason: constraint_violation
    - condition: target table trigger raises an exception or changes the expected effect
      reason: trigger_error
    - condition: COPY FREEZE or transaction-sensitive binding violates transaction prerequisites
      reason: transaction_context_invalid
    - condition: file, program, library, or lock boundary is unavailable
      reason: resource_boundary_unavailable
    - condition: selected role lacks table COPY, SELECT, INSERT, or endpoint privileges
      reason: insufficient_privilege
    default_failure_reason: invalid_copy_binding
  sql_shape:
    template: COPY {copy_subject} {column_list} {copy_direction_and_endpoint} WITH ({copy_options}) {where_clause};
  verification:
    required: true
    mode: expected_error_or_notice
    sql: null
  cleanup:
    required: true
    steps:
    - sql: DROP TABLE IF EXISTS {table_name} CASCADE;
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
