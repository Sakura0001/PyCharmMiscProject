schema_version: 1
kind: statement_combination_matrix
statement:
  key: checkpoint
  name: CHECKPOINT
  category: utility
  domain: checkpoint
  source_reference: references/statements/utility/checkpoint/checkpoint.md
  official_source: https://www.postgresql.org/docs/16/sql-checkpoint.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - checkpoint
    decision_reason: utility/checkpoint statement coverage is tracked by its explicit runtime or catalog object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: utility/checkpoint statements do not require relation-kind coverage for baseline validity.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: utility/checkpoint statements do not directly depend on table object coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: utility/checkpoint baseline semantics do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_1
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - success
      - failure
      coverage_requirement: all_values
    target_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - target_exists
      - target_missing
      - database_wide
      - wrong_object_type
      coverage_requirement: all_values
    option_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - minimal
      - verbose_or_format
      - boolean_options
      - resource_options
      coverage_requirement: all_values
    execution_mode:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - metadata_only
      - executes_statement
      - locks_or_rewrites
      - server_side_io
      coverage_requirement: all_values
    target_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id006
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - all_or_database_wide
      coverage_requirement: all_values
    input_output_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - none
      - table_columns
      - query_source
      - stdin_stdout
      - server_file_or_program
      coverage_requirement: all_values
    environment_context:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id008
      - normal_session
      - transaction_block
      - outside_transaction_required
      - external_resource_required
      coverage_requirement: all_values
    privilege_context:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - owner
      - granted_role
      - insufficient_privilege
      coverage_requirement: all_values
    invalid_combination:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id010
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: all_values
    resource_boundary:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - small_relation
      - empty_relation
      - locked_relation
      - missing_file_or_library
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id012
      - catalog_query
      - effect_query
      - returned_rows
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id013
      - rollback
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  execution_context:
    required: true
    source: lifecycle_plan
    required_fields:
    - session_state
    - transaction_state
    - expected_status
combination_groups:
- id: checkpoint_declared_factor_baseline
  title: CHECKPOINT declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - checkpoint_declared_failure
  factors:
    statement_branch: branch_1
    expected_status: success
    target_state: target_exists
    option_shape: minimal
    execution_mode: metadata_only
    target_name_shape: plain_identifier
    input_output_shape: none
    environment_context: normal_session
    privilege_context: owner
    invalid_combination: none
    resource_boundary: small_relation
    verification_mode: catalog_query
    cleanup_mode: rollback
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    expected_status:
      mode: explicit
      values: *id002
    target_state:
      mode: explicit
      values: *id003
    option_shape:
      mode: explicit
      values: *id004
    execution_mode:
      mode: explicit
      values: *id005
    target_name_shape:
      mode: explicit
      values: *id006
    input_output_shape:
      mode: explicit
      values: *id007
    environment_context:
      mode: explicit
      values: *id008
    privilege_context:
      mode: explicit
      values: *id009
    invalid_combination:
      mode: explicit
      values: *id010
    resource_boundary:
      mode: explicit
      values: *id011
    verification_mode:
      mode: explicit
      values: *id012
    cleanup_mode:
      mode: explicit
      values: *id013
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: checkpoint_declared_failure
    default_failure_reason: checkpoint_declared_failure
  sql_shape:
    template: CHECKPOINT {target_name};
  verification:
    required: true
    mode: state_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for checkpoint
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
