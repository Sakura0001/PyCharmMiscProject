schema_version: 1
kind: statement_combination_matrix
statement:
  key: revoke
  name: REVOKE
  category: dcl
  domain: privilege
  source_reference: references/statements/dcl/privilege/revoke.md
  official_source: https://www.postgresql.org/docs/16/sql-revoke.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - privilege
    decision_reason: dcl/privilege statement coverage is tracked by its explicit runtime or catalog object kind.
  target_relation_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_relation_kinds:
    - regular_table
    decision_reason: dcl/privilege statements can operate against table-backed targets in representative workflows.
  table_coverage:
    required: true
    coverage_mode: representative
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_table_kinds:
    - regular_table
    decision_reason: dcl/privilege behavior is validated against representative table objects when applicable.
  column_type_coverage:
    required: true
    coverage_mode: conditional
    inventory_source: references/common/pg16_type_catalog.md
    required_type_set: all_pg16_column_types
    expansion_mode: statement_specific_column_reference
    require_each_type_success_or_failure: true
    decision_reason: dcl/privilege can reference table columns in representative branches; column type coverage is conditional
      rather than exhaustive.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_1
      - branch_2
      - branch_3
      - branch_4
      - branch_5
      - branch_6
      - branch_7
      - branch_8
      - branch_9
      - branch_10
      - branch_11
      - branch_12
      - branch_13
      - branch_14
      - branch_15
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - success
      - failure
      coverage_requirement: all_values
    privilege_scope:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - table_privilege
      - column_privilege
      - schema_database_tablespace
      - routine_language_type_fdw_server
      - role_membership
      - parameter_privilege
      coverage_requirement: all_values
    grantee_shape:
      tier: T1
      coverage_role: main_axis
      required_values: &id004
      - role_name
      - public
      - current_role
      - current_user
      - session_user
      coverage_requirement: all_values
    grant_option_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - absent
      - grant_option
      - admin_option
      - inherit_or_set_option
      coverage_requirement: all_values
    grantor_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id006
      - implicit_owner
      - granted_by_owner
      - granted_by_non_owner
      coverage_requirement: all_values
    object_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - plain_identifier
      - schema_qualified
      - all_objects_in_schema
      - missing_object
      coverage_requirement: all_values
    role_name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id008
      - plain_role
      - quoted_role
      - missing_role
      coverage_requirement: all_values
    dependency_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - ready
      - missing_dependency
      coverage_requirement: all_values
    privilege_context:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id010
      - owner
      - granted_role
      - insufficient_privilege
      coverage_requirement: all_values
    invalid_combination:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: all_values
    ownership_boundary:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id012
      - owner
      - member_role
      - non_owner
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id013
      - catalog_query
      - effect_query
      - returned_rows
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id014
      - rollback
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  execution_context:
    required: true
    source: lifecycle_plan
    required_fields:
    - session_state
    - transaction_state
    - expected_status
combination_groups:
- id: revoke_declared_factor_baseline
  title: REVOKE declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - revoke_declared_failure
  factors:
    statement_branch: branch_1
    expected_status: success
    privilege_scope: table_privilege
    grantee_shape: role_name
    grant_option_shape: absent
    grantor_shape: implicit_owner
    object_name_shape: plain_identifier
    role_name_shape: plain_role
    dependency_state: ready
    privilege_context: owner
    invalid_combination: none
    ownership_boundary: owner
    verification_mode: catalog_query
    cleanup_mode: rollback
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    expected_status:
      mode: explicit
      values: *id002
    privilege_scope:
      mode: explicit
      values: *id003
    grantee_shape:
      mode: explicit
      values: *id004
    grant_option_shape:
      mode: explicit
      values: *id005
    grantor_shape:
      mode: explicit
      values: *id006
    object_name_shape:
      mode: explicit
      values: *id007
    role_name_shape:
      mode: explicit
      values: *id008
    dependency_state:
      mode: explicit
      values: *id009
    privilege_context:
      mode: explicit
      values: *id010
    invalid_combination:
      mode: explicit
      values: *id011
    ownership_boundary:
      mode: explicit
      values: *id012
    verification_mode:
      mode: explicit
      values: *id013
    cleanup_mode:
      mode: explicit
      values: *id014
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: revoke_declared_failure
    default_failure_reason: revoke_declared_failure
  sql_shape:
    template: REVOKE {target_name};
  verification:
    required: true
    mode: state_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for revoke
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
