schema_version: 1
kind: statement_combination_matrix
statement:
  key: set
  name: SET
  category: session
  domain: runtime_parameter
  source_reference: references/statements/session/runtime_parameter/set.md
  official_source: https://www.postgresql.org/docs/16/sql-set.html
execution_contract:
  required_matrix_is_baseline: true
  no_inference_before_required_coverage_passes: true
  runner_must_complete_required_matrix_first: true
  allow_post_coverage_extension_inference: true
  extension_combinations_must_be_marked: true
  extension_combinations_must_record_derivation: true
  extension_combinations_must_not_replace_required_coverage: true
  success_and_failure_both_allowed: true
  all_success_and_failure_reasons_must_be_declared: true
  required_coverage_sql_templates_must_come_from_combination_groups: true
  extension_sql_templates_must_be_recorded_in_artifacts: true
post_coverage_extension_policy:
  enabled: true
  allowed_after_audit_verdict: required_coverage_passed
  output_location: artifacts/intermediates/<task_slug>/derived_extension_combinations.yaml
  required_fields:
  - id
  - title
  - derived_from_combination_group
  - derivation_reason
  - factors
  - expected_status_policy
  - compatibility
  - sql_shape
  - verification
  - cleanup
  guardrails:
  - Required matrix coverage must pass before any derived extension is emitted.
  - Derived extensions must not be counted as satisfying required factor or coverage scope requirements.
coverage_scope:
  target_object_coverage:
    required: true
    coverage_mode: explicit
    inventory_source: references/combinations/_shared/coverage_inventory.yaml
    required_object_kinds:
    - runtime_parameter
    decision_reason: session/runtime_parameter statement coverage is tracked by its explicit runtime or catalog object kind.
  target_relation_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: session/runtime_parameter statements do not require relation-kind coverage for baseline validity.
  table_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: session/runtime_parameter statements do not directly depend on table object coverage.
  column_type_coverage:
    required: false
    coverage_mode: not_applicable
    decision_reason: session/runtime_parameter baseline semantics do not vary by table column data type.
factor_contract:
  source_reference_must_define_all_factors: true
  matrix_must_cover_required_factor_values: true
  factors:
    statement_branch:
      tier: T1
      coverage_role: main_axis
      required_values: &id001
      - branch_1
      coverage_requirement: all_values
    expected_status:
      tier: T1
      coverage_role: main_axis
      required_values: &id002
      - success
      - failure
      coverage_requirement: all_values
    session_state:
      tier: T1
      coverage_role: main_axis
      required_values: &id003
      - default_state
      - modified_state
      - missing_channel_or_role
      - restored_state
      coverage_requirement: all_values
    scope_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id004
      - session
      - local
      - all
      - default_or_reset
      coverage_requirement: all_values
    value_shape:
      tier: T2
      coverage_role: main_axis
      required_values: &id005
      - valid_value
      - default_value
      - invalid_value
      - list_or_identifier_value
      coverage_requirement: all_values
    name_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id006
      - plain_identifier
      - schema_qualified
      - quoted_identifier
      - alias_used
      coverage_requirement: all_values
    payload_shape:
      tier: T3
      coverage_role: rotate_attach
      required_values: &id007
      - absent
      - short_text
      - boundary_length
      - invalid_payload
      coverage_requirement: all_values
    dependency_state:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id008
      - ready
      - missing_dependency
      coverage_requirement: all_values
    privilege_context:
      tier: T4
      coverage_role: rotate_attach
      required_values: &id009
      - owner
      - granted_role
      - insufficient_privilege
      coverage_requirement: all_values
    invalid_combination:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id010
      - none
      - syntax_valid_semantic_error
      - object_type_mismatch
      coverage_requirement: all_values
    transaction_visibility:
      tier: T5
      coverage_role: rotate_attach
      required_values: &id011
      - outside_transaction
      - inside_committed_transaction
      - inside_rolled_back_transaction
      coverage_requirement: all_values
    verification_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id012
      - catalog_query
      - effect_query
      - returned_rows
      - error_assertion
      coverage_requirement: all_values
    cleanup_mode:
      tier: T6
      coverage_role: rotate_attach
      required_values: &id013
      - rollback
      - drop_objects
      - reset_state
      coverage_requirement: all_values
dynamic_inputs:
  execution_context:
    required: true
    source: lifecycle_plan
    required_fields:
    - session_state
    - transaction_state
    - expected_status
combination_groups:
- id: set_declared_factor_baseline
  title: SET declared factor baseline
  lifecycle_role: target_statement
  expected_status_policy: per_factor_binding
  default_expected_status: success
  expected_failure_reasons:
  - set_declared_failure
  factors:
    statement_branch: branch_1
    expected_status: success
    session_state: default_state
    scope_shape: session
    value_shape: valid_value
    name_shape: plain_identifier
    payload_shape: absent
    dependency_state: ready
    privilege_context: owner
    invalid_combination: none
    transaction_visibility: outside_transaction
    verification_mode: catalog_query
    cleanup_mode: rollback
  expansion:
    statement_branch:
      mode: explicit
      values: *id001
    expected_status:
      mode: explicit
      values: *id002
    session_state:
      mode: explicit
      values: *id003
    scope_shape:
      mode: explicit
      values: *id004
    value_shape:
      mode: explicit
      values: *id005
    name_shape:
      mode: explicit
      values: *id006
    payload_shape:
      mode: explicit
      values: *id007
    dependency_state:
      mode: explicit
      values: *id008
    privilege_context:
      mode: explicit
      values: *id009
    invalid_combination:
      mode: explicit
      values: *id010
    transaction_visibility:
      mode: explicit
      values: *id011
    verification_mode:
      mode: explicit
      values: *id012
    cleanup_mode:
      mode: explicit
      values: *id013
  compatibility:
    resolver: declared_matrix
    success_when:
    - expected_status == success
    failure_when:
    - condition: expected_status == failure
      reason: set_declared_failure
    default_failure_reason: set_declared_failure
  sql_shape:
    template: SET {target_name};
  verification:
    required: true
    mode: state_or_error_assertion
    sql: SELECT 1;
  cleanup:
    required: true
    steps:
    - sql: -- cleanup for set
audit_rules:
  require_all_required_top_level_keys: true
  require_declared_coverage_scope: true
  require_declared_factor_values: true
  require_expected_failure_reasons: true
  require_post_coverage_extension_policy: true
  forbid_extension_before_required_coverage_passes: true
  forbid_extension_counting_toward_required_coverage: true
