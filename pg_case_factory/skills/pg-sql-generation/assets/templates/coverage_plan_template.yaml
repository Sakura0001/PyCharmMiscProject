# Copy to work/<run-id>/coverage_plan.yaml and adapt it to the feature document.
# Validate and reconcile it before `run init`; that command creates the immutable
# artifacts/runs/<run-id>/plans snapshot, which must never be hand-edited.
# Every canonical inventory snapshot is complete and pinned;
# feature-local axes are finite semantic classes, never representative samples.
# The four mandatory scopes are object, relation, table, and column_type; table
# uses five axes and column_type uses seven complementary inventories. All 12
# risk decisions are mandatory. This exact example expands to 3,175 obligations:
# 2,787 success, 153 expected_failure, 235 justified_na, and 0 missing.
