test_points:
  - id: TP-OBJECT-LIFECYCLE
    title: Lifecycle or catalog observability for every PostgreSQL 18.4 ObjectType
    requirement_ids: [REQ-003]
    core_axes: [object_type]
    dependencies: []
    execution_rules:
      - when:
          object_type: [access_method, amop, amproc, event_trigger, opclass, opfamily, parameter_acl, tablespace, tsparser, tstemplate]
        execution_profile: external_isolated
        execution_harness: external-superuser-object-lifecycle
      - when: {object_type: [database, role]}
        execution_profile: external_isolated
        execution_harness: external-cluster-role-db-admin
      - when: {object_type: [extension, language, transform]}
        execution_profile: external_isolated
        execution_harness: external-extension-object-lifecycle
      - when: {object_type: subscription}
        execution_profile: external_isolated
        execution_harness: external-logical-replication
      - when: {object_type: [fdw, foreign_server, foreign_table, user_mapping]}
        execution_profile: external_isolated
        execution_harness: external-postgres-fdw
    default_outcome: success
    description: Direct SQL objects use their documented lifecycle. Internal/subobject ObjectType members such as amop, amproc, attribute, column, default, defacl, domconstraint, publication_namespace, publication_rel, and tabconstraint are exercised through their owning SQL DDL plus catalog/object-address observability; the generator must not invent nonexistent standalone CREATE/DROP syntax.
  - id: TP-RELKIND-OBSERVABILITY
    title: Every exact PostgreSQL 18.4 relkind
    requirement_ids: [REQ-003]
    core_axes: [relkind]
    dependencies: []
    execution_rules:
      - when: {relkind: foreign_table}
        execution_profile: external_isolated
        execution_harness: external-postgres-fdw
    default_outcome: success
    description: relation, index, sequence, view, matview, foreign_table, and partitioned_table use their owning SQL lifecycle. toastvalue, composite_type, and partitioned_index are materialized indirectly by a parent table/type/index operation and verified through catalog and user-visible SQL behavior rather than fictional direct relkind DDL.
  - id: TP-TABLE-SHAPES
    title: Orthogonal table storage shapes
    requirement_ids: [REQ-003, REQ-004]
    core_axes: [relpersistence, partition_role, partition_strategy, inheritance_role, table_access_method_selection]
    dependencies: []
    classification_rules:
      - when:
          partition_role: non_partitioned
          partition_strategy: [range, list, hash]
        outcome: justified_na
        reason: A non-partitioned relation has no range, list, or hash partition strategy in PostgreSQL 18.4.
      - when:
          partition_role: [partitioned_parent, partition_leaf]
          partition_strategy: none
        outcome: justified_na
        reason: A partitioned parent or leaf must belong to a range, list, or hash partition hierarchy.
      - when:
          relpersistence: unlogged
          partition_role: partitioned_parent
          partition_strategy: [range, list, hash]
        outcome: expected_failure
        reason: PostgreSQL 18 disallows UNLOGGED on the storage-less partitioned parent; SQLSTATE and complete diagnostics must match upstream 18.4.
      - when:
          relpersistence: unlogged
          partition_role: partition_leaf
          partition_strategy: [range, list, hash]
        outcome: success
        reason: A leaf partition has physical storage and may be unlogged in PostgreSQL 18.4; do not incorrectly apply the partitioned-parent prohibition to it.
    execution_rules:
      - when: {table_access_method_selection: extension_provided}
        execution_profile: external_isolated
        execution_harness: external-extension-table-am
    default_outcome: success
    description: extension_provided is executable work gated by external-extension-table-am; absence of that harness must block the job instead of converting obligations to N/A.
  - id: TP-COLUMN-DATA-PROFILE
    title: Every executable core column profile and storage data class
    requirement_ids: [REQ-001, REQ-005]
    core_axes: [column_type, data_profile]
    dependencies: [TP-TABLE-SHAPES]
    classification_rules:
      - when:
          column_type: [smallint, integer, bigint, smallserial, serial, bigserial, real, double_precision, float, money, timestamp, timestamp_with_time_zone, date, time, time_with_time_zone, interval, boolean, enum_type, point, line, lseg, box, circle, cidr, inet, macaddr, macaddr8, tsquery, uuid, int4range, int8range, tsrange, tstzrange, daterange, oid, regclass, regcollation, regconfig, regdictionary, regnamespace, regoper, regoperator, regproc, regprocedure, regrole, regtype, xid, xid8, cid, tid, pg_lsn, name]
          data_profile: wide_toast
        outcome: justified_na
        reason: This fixed-width, bounded, or plain-storage profile cannot produce a valid value that crosses the TOAST threshold; all TOAST-capable physical families are exercised by the three TP-TOAST matrices.
    default_outcome: success
  - id: TP-CONCRETE-BUILTIN-TYPE
    title: Every explicit non-pseudo PostgreSQL 18.4 catalog type
    requirement_ids: [REQ-001]
    core_axes: [concrete_builtin_type]
    dependencies: [TP-TABLE-SHAPES]
    default_outcome: success
  - id: TP-AUTO-ARRAY-TYPE
    title: Every PostgreSQL 18.4 automatically generated array family
    requirement_ids: [REQ-001, REQ-005]
    core_axes: [auto_array_element_type]
    dependencies: [TP-CONCRETE-BUILTIN-TYPE]
    default_outcome: success
  - id: TP-PSEUDO-TYPE-REJECTION
    title: Every pseudo-type rejected as a table column with exact parity
    requirement_ids: [REQ-003]
    core_axes: [pseudo_type]
    dependencies: [TP-TABLE-SHAPES]
    default_outcome: expected_failure
    default_reason: PostgreSQL 18.4 pseudo-types are not legal table-column storage types; SQLSTATE and complete diagnostics must match.
  - id: TP-DECLARATION-ALIAS
    title: Every maintained SQL type declaration alias
    requirement_ids: [REQ-003]
    core_axes: [declaration_alias]
    dependencies: [TP-COLUMN-DATA-PROFILE]
    default_outcome: success
  - id: TP-TYPMOD-BOUNDARY
    title: Every maintained valid and invalid typmod boundary
    requirement_ids: [REQ-003]
    core_axes: [typmod_declaration]
    dependencies: [TP-DECLARATION-ALIAS]
    classification_rules:
      - when:
          typmod_declaration: [NUMERIC(0), NUMERIC(1001), "NUMERIC(10,-1001)", "NUMERIC(10,1001)", VARCHAR(0), VARCHAR(10485761), CHARACTER(0), CHARACTER(10485761), BIT(0), BIT(83886081), BIT VARYING(0), BIT VARYING(83886081), FLOAT(0), FLOAT(54), TIME(7), TIMESTAMP(7), INTERVAL(7)]
        outcome: expected_failure
        reason: PostgreSQL 18.4 must reject the invalid typmod boundary and return an identical diagnostic.
    default_outcome: success
  - id: TP-USER-DEFINED-ARCHETYPE
    title: Every PostgreSQL user-defined type construction family
    requirement_ids: [REQ-003]
    core_axes: [user_defined_archetype]
    dependencies: [TP-TABLE-SHAPES]
    execution_rules:
      - when: {user_defined_archetype: base_type}
        execution_profile: external_isolated
        execution_harness: external-base-type-binary-io
    default_outcome: success
    description: base_type is executable work gated by external-base-type-binary-io; a missing trusted binary-I/O harness blocks the job and is never counted as N/A.
  - id: TP-OPERATION-LIFECYCLE
    title: Every storage operation and transaction lifecycle class
    requirement_ids: [REQ-001, REQ-002, REQ-003]
    core_axes: [operation, transaction_context]
    dependencies: [TP-COLUMN-DATA-PROFILE, TP-AUTO-ARRAY-TYPE, TP-PSEUDO-TYPE-REJECTION, TP-TYPMOD-BOUNDARY, TP-USER-DEFINED-ARCHETYPE]
    classification_rules:
      - when:
          operation: vacuum
          transaction_context: [explicit_commit, explicit_rollback, savepoint_release, savepoint_rollback, prepared_commit, prepared_rollback]
        outcome: expected_failure
        reason: PostgreSQL 18.4 VACUUM cannot execute inside any explicit transaction block; SQLSTATE and complete diagnostics must match.
    execution_rules:
      - when: {operation: copy_from}
        execution_profile: external_isolated
        execution_harness: external-copy-ingest
    default_outcome: success
    description: Every COPY FROM obligation uses the protocol-aware external-copy-ingest harness and one manifest-bound SQL file containing its non-empty inline payload plus standalone `\.` terminator because the basic SQL-file runner rejects COPY data mode; COPY TO remains basic and must render a deterministic COPY (SELECT ...) TO STDOUT form.
  - id: TP-INDEX-CONSTRAINT-TRIGGER
    title: Index, constraint, and trigger interactions across column profiles
    requirement_ids: [REQ-001]
    core_axes: [index_constraint_trigger_interaction, column_type]
    dependencies: [TP-COLUMN-DATA-PROFILE]
    default_outcome: success
  - id: TP-PRIVILEGE
    title: Privilege, warning, and skip parity for every operation class
    requirement_ids: [REQ-003]
    core_axes: [privilege_context, operation]
    dependencies: [TP-OPERATION-LIFECYCLE]
    classification_rules:
      - when:
          privilege_context: insufficient_privilege
          operation: [create, insert, select, update, delete, copy_from, copy_to, alter, truncate, cluster, reindex, drop]
        outcome: expected_failure
        reason: PostgreSQL 18.4 must reject the operation and the complete error transcript must match.
      - when: {privilege_context: insufficient_privilege, operation: vacuum}
        outcome: success
        reason: VACUUM skips tables lacking MAINTAIN privilege and emits the upstream warning instead of raising a blanket permission error; warning text and unchanged data must match.
      - when: {privilege_context: insufficient_privilege, operation: analyze}
        outcome: success
        reason: ANALYZE skips tables lacking MAINTAIN privilege and emits the upstream warning instead of raising a blanket permission error; warning text and unchanged statistics must match.
    execution_rules:
      - when: {operation: copy_from}
        execution_profile: external_isolated
        execution_harness: external-copy-ingest
    default_outcome: success
    description: COPY FROM privilege outcomes are still executable protocol cases and stay on external-copy-ingest with the payload inline in the exact manifest SQL even when PostgreSQL is expected to reject access; COPY TO uses deterministic STDOUT on the basic route.
  - id: TP-READ-PATH-TOPOLOGY
    title: Forced read and scan paths across executable table topologies
    requirement_ids: [REQ-001]
    core_axes: [read_path, table_topology_class]
    dependencies: [TP-OPERATION-LIFECYCLE]
    classification_rules:
      - when:
          read_path: partition_pruning
          table_topology_class: [ordinary, inheritance_parent, inheritance_child]
        outcome: justified_na
        reason: Declarative partition pruning has no semantic target on ordinary or inheritance-only topologies; range, list, and hash parent/leaf forms remain executable.
    default_outcome: success
  - id: TP-ISOLATION-SNAPSHOT
    title: MVCC visibility at every isolation level and snapshot boundary
    requirement_ids: [REQ-001, REQ-002, REQ-006]
    core_axes: [isolation_level, snapshot_timing]
    dependencies: [TP-OPERATION-LIFECYCLE]
    default_execution_profile: external_isolated
    default_execution_harness: external-multisession
    default_outcome: success
  - id: TP-TABLE-TOPOLOGY-OPERATION
    title: Every storage operation across executable ordinary, inheritance, and partition topologies
    requirement_ids: [REQ-001, REQ-003]
    core_axes: [table_topology_class, operation]
    dependencies: [TP-OPERATION-LIFECYCLE, TP-TABLE-SHAPES]
    execution_rules:
      - when: {operation: copy_from}
        execution_profile: external_isolated
        execution_harness: external-copy-ingest
    default_outcome: success
    description: COPY FROM uses a non-empty payload embedded in the manifest-bound exact SQL program through external-copy-ingest for every topology; no second payload file or out-of-band stdin exists. COPY TO remains on the basic route and uses COPY (SELECT ...) TO STDOUT where a direct relation form is unsupported, so the point tests the logical operation without manufacturing false failures.
  - id: TP-COPY-PG18-OPTIONS
    title: Every PostgreSQL 18.4 COPY wildcard, error-action, reject-limit, and diagnostic-verbosity semantic
    requirement_ids: [REQ-003, REQ-008]
    core_axes: [copy_pg18_option_case]
    dependencies: [TP-TABLE-TOPOLOGY-OPERATION]
    classification_rules:
      - when:
          copy_pg18_option_case:
            - from_on_error_stop
            - from_reject_limit_exceeded
            - from_reject_limit_zero
            - from_reject_limit_negative
            - from_reject_limit_overflow
            - from_reject_limit_without_ignore
            - from_on_error_ignore_binary
            - from_force_quote_invalid_direction
            - to_on_error_invalid_direction
            - to_force_not_null_invalid_direction
            - to_force_null_invalid_direction
            - from_force_not_null_text_invalid_format
            - from_force_null_text_invalid_format
            - to_force_quote_text_invalid_format
        outcome: expected_failure
        reason: The case deliberately crosses a documented PostgreSQL 18.4 COPY option direction, format, dependency, conversion-error, or positive-bigint boundary; SQLSTATE, complete diagnostics, atomic row effect, and command tag must match upstream.
    execution_rules:
      - when:
          copy_pg18_option_case:
            - from_force_not_null_columns
            - from_force_not_null_all
            - from_force_null_columns
            - from_force_null_all
            - from_on_error_stop
            - from_on_error_ignore_unlimited
            - from_reject_limit_within
            - from_reject_limit_max_bigint
            - from_reject_limit_exceeded
            - from_reject_limit_zero
            - from_reject_limit_negative
            - from_reject_limit_overflow
            - from_reject_limit_without_ignore
            - from_log_verbosity_default
            - from_log_verbosity_verbose
            - from_log_verbosity_silent
            - from_log_verbosity_without_ignore
            - from_on_error_ignore_binary
            - from_force_quote_invalid_direction
            - from_force_not_null_text_invalid_format
            - from_force_null_text_invalid_format
        execution_profile: external_isolated
        execution_harness: external-copy-ingest
    default_outcome: success
    description: >-
      Each FROM case is one independent frontend COPY operation with an immutable payload and therefore blocks on external-copy-ingest readiness instead of becoming N/A. ON_ERROR stop receives a conversion-invalid row and must abort; ignore/unlimited and LOG_VERBOSITY default/verbose/silent receive the same mixed-validity CSV rows so accepted rows and NOTICE behavior can be compared. Because PostgreSQL 18.4 documents LOG_VERBOSITY as merely currently used with ON_ERROR ignore, rather than requiring it, the without-ignore FROM case and verbose COPY TO case are successful accepted/no-extra-message oracles. REJECT_LIMIT covers equal-to-limit success, limit crossing, the positive-bigint maximum, zero, negative, bigint overflow, and missing-ON_ERROR dependency; FORCE_NOT_NULL/FORCE_NULL cover column-list and wildcard selectors plus non-CSV rejection. The seven TO cases are safe basic SQL-file obligations using COPY (SELECT ...) TO STDOUT and cover FORCE_QUOTE list/wildcard success, ON_ERROR/FORCE_NOT_NULL/FORCE_NULL wrong-direction rejection, LOG_VERBOSITY accepted no-op, and FORCE_QUOTE non-CSV rejection. The full legacy endpoint/format/options product remains assigned to the COPY statement matrix job.
  - id: TP-PARTITION-DML
    title: Routing, pruning, row movement, delete, and truncate across every partition strategy and role
    requirement_ids: [REQ-001]
    core_axes: [partition_topology_class, partition_dml_operation]
    dependencies: [TP-TABLE-TOPOLOGY-OPERATION]
    default_outcome: success
  - id: TP-FOREIGN-STORAGE-INTEGRATION
    title: Standalone and partitioned postgres_fdw storage paths across all supported operations
    requirement_ids: [REQ-001, REQ-003, REQ-007]
    core_axes: [foreign_topology_class, foreign_operation]
    dependencies: [TP-PARTITION-DML, TP-READ-PATH-TOPOLOGY]
    default_execution_profile: external_isolated
    default_execution_harness: external-postgres-fdw
    default_outcome: success
    description: Requires equivalent postgres_fdw loopback fixtures on both endpoints. Missing FDW/server/user-mapping capability blocks this job through external-postgres-fdw harness evidence.
  - id: TP-TOAST-STORAGE-SIZE
    title: Every TOAST-capable physical family across storage strategies and threshold boundaries
    requirement_ids: [REQ-005]
    core_axes: [toastable_column_family, toast_storage_strategy, toast_size_class]
    dependencies: [TP-COLUMN-DATA-PROFILE]
    classification_rules:
      - when: {toast_storage_strategy: plain, toast_size_class: multi_chunk_value}
        outcome: expected_failure
        reason: PLAIN forbids compression and out-of-line storage, so a value exceeding the heap tuple limit must fail with the same SQLSTATE and diagnostic as upstream PostgreSQL 18.4.
    default_outcome: success
  - id: TP-TOAST-STORAGE-COMPRESSION
    title: PGLZ and LZ4 behavior under every TOAST storage strategy
    requirement_ids: [REQ-005]
    core_axes: [toastable_column_family, toast_storage_strategy, toast_compression]
    dependencies: [TP-TOAST-STORAGE-SIZE]
    execution_rules:
      - when: {toast_compression: lz4}
        execution_profile: external_isolated
        execution_harness: external-toast-lz4
    default_outcome: success
    description: Both endpoints must provide LZ4. PLAIN and EXTERNAL still execute and prove that the configured compression method is not applied when the storage strategy forbids compression.
  - id: TP-TOAST-STORAGE-MUTATION
    title: Insert, expansion, shrink, and delete transitions under every TOAST storage strategy
    requirement_ids: [REQ-005]
    core_axes: [toastable_column_family, toast_storage_strategy, toast_mutation]
    dependencies: [TP-TOAST-STORAGE-SIZE]
    default_outcome: success
    description: Values are above toast_tuple_target but below the heap tuple limit, allowing PLAIN to remain a valid inline oracle while MAIN, EXTERNAL, and EXTENDED exercise their physical policies.
  - id: TP-CONCURRENCY-SCHEDULE
    title: Deterministic multi-session interleavings across isolation levels and write operations
    requirement_ids: [REQ-002, REQ-006]
    core_axes: [concurrency_schedule, isolation_level, concurrent_operation]
    dependencies: [TP-ISOLATION-SNAPSHOT, TP-TABLE-TOPOLOGY-OPERATION]
    default_execution_profile: external_isolated
    default_execution_harness: external-multisession
    classification_rules:
      - when: {concurrency_schedule: deadlock_cycle}
        outcome: expected_failure
        reason: The controlled two-object lock cycle must abort one participant with SQLSTATE 40P01 and an identical complete transcript.
      - when: {concurrency_schedule: write_skew_serialization_conflict, isolation_level: serializable}
        outcome: expected_failure
        reason: The controlled write-skew schedule must abort one SERIALIZABLE transaction with SQLSTATE 40001 and an identical complete transcript.
    default_outcome: success
  - id: TP-RESTART-RECOVERY
    title: Persistence semantics across clean restart, checkpoint, and crash recovery
    requirement_ids: [REQ-004]
    core_axes: [relpersistence, restart_recovery_context]
    dependencies: [TP-OPERATION-LIFECYCLE]
    default_execution_profile: external_isolated
    default_execution_harness: external-restart-recovery
    default_outcome: success
    description: permanent rows persist, unlogged rows follow upstream crash-truncation semantics, and temporary relations follow session-lifetime semantics; all are positive differential oracles.
  - id: TP-WAL-CRASH-PERSISTENCE
    title: WAL flush, checkpoint, redo, and post-recovery boundaries for every persistence class
    requirement_ids: [REQ-004]
    core_axes: [relpersistence, wal_crash_phase]
    dependencies: [TP-RESTART-RECOVERY]
    default_execution_profile: external_isolated
    default_execution_harness: external-fault-injection
    default_outcome: success
    description: Requires deterministic external fault injection. Missing crash hooks or LSN control blocks execution instead of reclassifying obligations as N/A.
metadata:
  compatibility_target: postgresql-18.4
  coverage_rule: required=success+expected_failure+justified_na
  sampling_allowed: false
  note: Column completeness includes all seven canonical inventories. Fixed-width or bounded profiles are explicitly N/A only for impossible TOAST-wide values; privileged objects, extension files, logical replication, extension AM, base types, postgres_fdw, LZ4, multisession, and crash cases remain executable obligations whose jobs block until their named harness exists.
