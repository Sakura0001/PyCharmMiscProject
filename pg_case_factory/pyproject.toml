[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-case-factory"
version = "0.2.0"
description = "Plan, generate, and differentially verify PostgreSQL 18.4 SQL test cases."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "yuyu" }]
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
pg-case = "pg_case_factory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
