[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-case-factory"
version = "0.3.0"
description = "Generate exhaustive, sharded PostgreSQL 18.4 regress SQL packages from feature documents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "yuyu" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2",
  "rfc8785>=0.1.4,<1",
]

[project.scripts]
pg-case = "pg_case_factory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pg_case_factory.coverage_v2.schemas" = ["*.json"]
